function doImport(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    if(typeof XLSX==='undefined'){importError('The Excel reader library did not load, so no file can be opened. Check your internet connection and reload this page.');return;}
    let wb;
    try{wb=XLSX.read(e.target.result,{type:'binary'});}
    catch(ex){importError('That file could not be read as an Excel workbook. Export again from Cienapps as .xlsx and retry.',String(ex.message||ex));return;}
    const sh=wb.Sheets[wb.SheetNames[0]];
    if(!sh){importError('That workbook contains no sheets.');return;}
    const aoa=XLSX.utils.sheet_to_json(sh,{header:1,blankrows:false}).filter(r=>r&&r.some(c=>c!==''&&c!=null));
    if(aoa.length<2){importError('That sheet has no data rows.');return;}
    const h=findHeaderRow(aoa);
    if(h>-1){
      const map=mapFromHeader(aoa[h]);
      const missing=IMP_FIELDS.filter(f=>f.req&&map[f.k]<0);
      if(missing.length){PEND={rows:aoa.slice(h+1),map:map};renderMapping('Header row found, but no column for: '+missing.map(f=>f.label).join(', ')+'. Confirm the mapping below.');return;}
      runImport(objsFrom(aoa.slice(h+1),map));
    } else {
      const rows=aoa;
      PEND={rows:rows,map:guessCols(rows)};
      renderMapping('This export has no header row, so the columns were matched by their contents. Check the mapping below, then import.');
    }
  };
  reader.readAsBinaryString(file);
}

function renderMapping(note){
  const rows=PEND.rows,map=PEND.map;
  const n=rows.reduce((a,r)=>Math.max(a,r.length),0);
  const isDt=x=>(x instanceof Date)||(typeof x==='number'&&x>35000&&x<80000);
  const sample=i=>{
    const v=rows.map(r=>r[i]).filter(x=>x!==''&&x!=null);
    if(!v.length)return '(empty)';
    // Show date columns as readable dates, not raw Excel serial numbers
    if(v.filter(isDt).length/v.length>=0.9){
      const d=v[0] instanceof Date?v[0]:new Date(Math.round((v[0]-25569)*86400*1000));
      return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
    }
    return String(v[0]).substring(0,24);
  };
  const opts=sel=>{let s=`<option value="-1"${sel<0?' selected':''}>— not used —</option>`;for(let i=0;i<n;i++)s+=`<option value="${i}"${sel===i?' selected':''}>Col ${colLtr(i)} · ${sample(i).replace(/"/g,'')}</option>`;return s;};
  document.getElementById('iprev').innerHTML=`<div style="margin-top:14px">
    <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:10px 13px;font-size:12px;color:#92400e;margin-bottom:12px;line-height:1.5">${note}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px">
      ${IMP_FIELDS.map(f=>`<div>
        <label style="display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:3px">${f.label}${f.req?' <span style="color:#dc2626">*</span>':''}</label>
        <select data-mf="${f.k}" style="width:100%;padding:5px 6px;font-size:12px;border:1px solid var(--b2);border-radius:4px;background:#fff">${opts(map[f.k])}</select>
      </div>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--t3);margin:10px 0 12px">${rows.length} data rows detected. Fields marked * are required.</div>
    <button class="btn btn-g" id="mapgo">Import ${rows.length} rows →</button>
    <button class="btn" id="mapcancel" style="margin-left:8px">Cancel</button>
  </div>`;
  document.getElementById('mapcancel').onclick=()=>{PEND=null;document.getElementById('iprev').innerHTML='';};
  document.getElementById('mapgo').onclick=()=>{
    const m={};
    document.querySelectorAll('[data-mf]').forEach(s=>{m[s.getAttribute('data-mf')]=parseInt(s.value,10);});
    const missing=IMP_FIELDS.filter(f=>f.req&&m[f.k]<0);
    if(missing.length){toast('Choose a column for: '+missing.map(f=>f.label).join(', '));return;}
    runImport(objsFrom(PEND.rows,m));
    PEND=null;
  };
}

function runImport(rows){
    let added=0,updated=0,skipped=0,noWo=0,shipped=0,shippedRemoved=0;
    const prev=[];
    const newOrders=[];

    rows.forEach(row=>{
      const wo=String(row.wo==null?'':row.wo).trim();
      if(!wo||wo==='NaT'||wo==='nan'||wo==='undefined'){noWo++;return;}
      // Floor & Unit — from their own columns, else parsed out of the Reference (order-seq-floor-unit)
      const refStr=String(row.ref==null?'':row.ref).trim();
      let flr=String(row.floor==null?'':row.floor).trim();
      let unt=String(row.unit==null?'':row.unit).trim();
      if((!flr||!unt)&&refStr.split('-').length>=4){
        const ps=refStr.split('-');
        if(!flr)flr=ps[2];
        if(!unt)unt=ps.slice(3).join('-');
      }
      const rawHours=parseFloat(row.hours||0)||0;
      const rowVal=parseFloat(row.value||0)||0;
      const exOrd=DB.orders.find(o=>o.wo===wo);
      // Hours rules: 'Assembly complete' means the assembly work is already done — 0h on the board;
      // WO-S, WO-BI, WO-PF prefixes and zero value all get 1h
      const effStep=String(row.step==null?'':row.step).trim()||(exOrd&&exOrd.step)||'';
      // 'Job shipped' orders are ignored: never added, and removed from the board if still on it
      if(/job\s*shipped/i.test(effStep)){
        shipped++;
        if(exOrd){
          DB.orders=DB.orders.filter(o=>o.wo!==wo);
          delete orig[wo];delete origStep[wo];
          shippedRemoved++;
          prev.push({wo,status:'shipped — removed',title:exOrd.title,hours:exOrd.hours,dueDate:exOrd.dueDate,pw:''});
        }
        return;
      }
      let hours, hoursEstimated;
      // Assembly complete or palleted (also matches palletised/palletized) = assembly work done, 0h
      if(/assembly\s*complete/i.test(effStep)||/pallet/i.test(effStep)){
        hours=0; hoursEstimated=false;
      } else if(wo.startsWith('WO-S-')||wo.startsWith('WO-BI-')||wo.startsWith('WO-PF-')||rowVal===0){
        hours=1; hoursEstimated=false;
      } else if(rawHours>0){
        hours=rawHours; hoursEstimated=false;
      } else {
        hours=estimateHours(rowVal); hoursEstimated=true;
      }
      let dueDate='';
      const rd=row.dueDate;
      if(rd){try{
        if(typeof rd==='number'){
          // Excel serial date
          const d=new Date(Math.round((rd-25569)*86400*1000));
          dueDate=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
        } else if(rd instanceof Date){
          // XLSX Date object — use UTC to avoid timezone shift
          dueDate=rd.getUTCFullYear()+'-'+String(rd.getUTCMonth()+1).padStart(2,'0')+'-'+String(rd.getUTCDate()).padStart(2,'0');
        } else if(typeof rd==='string'&&rd.match(/^\d{4}-\d{2}-\d{2}/)){
          // Already a YYYY-MM-DD string
          dueDate=rd.substring(0,10);
        } else {
          // Try parsing as date using UTC
          const parsed=new Date(rd);
          if(!isNaN(parsed))dueDate=parsed.getUTCFullYear()+'-'+String(parsed.getUTCMonth()+1).padStart(2,'0')+'-'+String(parsed.getUTCDate()).padStart(2,'0');
        }
      }catch(ex){}}
      // Skip if WO already exists (prevent duplicates)
      const ex=exOrd;
      if(ex){
        const newStep=String(row.step==null?ex.step:row.step);
        const dateChanged=ex.dueDate!==dueDate;
        const hoursChanged=ex.hours!==hours;
        const stepChanged=(ex.step||'')!==newStep;
        if(dateChanged||hoursChanged||stepChanged){
          if(dateChanged&&!ex.origDueDate)ex.origDueDate=ex.dueDate;
          const oldDue=ex.dueDate, oldStep=ex.step;
          ex.hours=hours;ex.hoursEstimated=hoursEstimated;ex.dueDate=dueDate;ex.step=newStep;
          const newTitle=String(row.title||row.ref||'').trim();
          if(newTitle&&newTitle!==ex.title)ex.title=newTitle;
          if(flr)ex.floor=flr;if(unt)ex.unit=unt;
          const what=[];
          if(dateChanged)what.push('date: '+oldDue+' → '+dueDate);
          if(stepChanged)what.push('step: '+(oldStep||'(none)').replace(/^\d+\.\s*/,'')+' → '+newStep.replace(/^\d+\.\s*/,''));
          if(hoursChanged&&!dateChanged&&!stepChanged)what.push('hours');
          updated++;prev.push({wo,status:dateChanged?'date changed':(stepChanged?'step changed':'updated'),what:what.join(' · '),title:ex.title,hours,dueDate,pw:ex.plannedWeek});
        } else {
          // no change, but still backfill floor/unit on older orders that pre-date these fields
          if(flr&&!ex.floor)ex.floor=flr;if(unt&&!ex.unit)ex.unit=unt;
          skipped++;
        }
      } else {
        const newO={wo,ref:refStr,floor:flr,unit:unt,title:String(row.title||row.ref||wo).trim(),customer:String(row.customer==null?'':row.customer),hours,hoursEstimated,dueDate,origDueDate:dueDate,step:String(row.step==null?'':row.step),salesRep:String(row.salesRep==null?'':row.salesRep),orderNo:String(row.orderNo==null?'':row.orderNo),value:rowVal,plannedWeek:'',notes:'',colour:''};
        newOrders.push(newO);
        if(orig[wo]===undefined)orig[wo]='';if(origStep[wo]===undefined)origStep[wo]=newO.step;
        added++;
      }
    });

    if(added+updated+skipped+shipped===0){
      importError('None of the '+rows.length+' rows had a usable WO number, so nothing was imported.','Check that the WO number column is mapped to the column holding values like WO-2604-7.');
      return;
    }

    // Auto-schedule new orders
    autoSchedule(newOrders);
    newOrders.forEach(o=>{
      DB.orders.push(o);
      orig[o.wo]=o.plannedWeek||'';origStep[o.wo]=o.step||''; // set baseline AFTER auto-schedule so auto-assignments don't show as changes
      prev.push({wo:o.wo,status:'new',title:o.title,hours:o.hours,dueDate:o.dueDate,pw:o.plannedWeek});
    });

    sched();
    document.getElementById('iprev').innerHTML=`<div style="margin-top:14px">
      <div style="font-size:13px;font-weight:600;color:var(--green);margin-bottom:10px">
        ✓ Import complete: ${added} added · ${updated} updated · ${skipped} unchanged${shipped?` · ${shipped} shipped (ignored${shippedRemoved?`, ${shippedRemoved} removed from board`:''})`:''}${noWo?` · ${noWo} skipped (no WO number)`:''}
      </div>
      <div style="font-size:12px;color:var(--t3);margin-bottom:8px">New orders auto-scheduled based on due date and available capacity.</div>
      ${prev.slice(0,15).map(p=>`<div class="preview-row">
        <span style="font-family:monospace;color:var(--t2);width:130px;flex-shrink:0">${p.wo}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.title}</span>
        <span style="color:var(--t3);width:40px;text-align:right">${p.hours}h</span>
        <span style="color:var(--t3);font-size:11px;width:100px;text-align:right">${p.pw?wkLbl(p.pw):'—'}</span>
        <span style="padding:1px 7px;border-radius:3px;font-size:11px;white-space:nowrap;background:${p.status==='new'?'var(--gl)':p.status==='step changed'?'var(--bl)':'var(--al)'};color:${p.status==='new'?'var(--green)':p.status==='step changed'?'var(--blue)':'var(--amber)'};">${p.status}</span>
      </div>
      ${p.what?`<div style="font-size:11px;color:var(--t3);padding:0 10px 4px 90px">${p.what}</div>`:''}`).join('')}
      ${prev.length>15?`<div style="font-size:12px;color:var(--t3);padding:6px 10px">...and ${prev.length-15} more</div>`:''}
      <button class="btn btn-g" style="margin-top:14px" onclick="showTab('b')">Go to Capacity Board →</button>
    </div>`;
    toast(`${added} added (auto-scheduled), ${updated} updated`);
}

function renderExport(app){
  const chg=changes();
  const weeks=get8Wks();
  app.innerHTML=`<div class="pg">
  <div class="exp-panel">
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">Changes This Session</div>
    <p style="font-size:12px;color:var(--t3);margin-bottom:14px">Work orders where the planned week or step has been changed. Export this to update Cienapps.</p>
    ${!chg.length?`<div class="empty">No changes yet. Go to the Capacity Board and assign or move work orders between weeks.</div>`:`
    <div class="wo-table-wrap" style="margin-bottom:14px">
      <table class="wo-table">
        <thead><tr><th>WO #</th><th>Title</th><th>Customer</th><th style="text-align:right">Hrs</th><th style="text-align:right">Value</th><th>Week Was</th><th>Week Now</th><th>Step Was</th><th>Step Now</th><th>Orig Due</th><th>New Due</th><th>Notes</th></tr></thead>
        <tbody>${chg.map(o=>`<tr>
          <td><span class="wo-num">${o.wo}</span></td>
          <td>${o.title}</td><td style="color:var(--t2)">${o.customer}</td>
          <td style="text-align:right"><input type="number" step="0.5" min="0" style="width:52px;text-align:right;border:1px solid ${o.hoursEstimated?'#f59e0b':'var(--b2)'};border-radius:4px;padding:2px 4px;font-size:12px;font-weight:600;background:${o.hoursEstimated?'#fffbeb':'#fff'}" title="${o.hoursEstimated?'Estimated from value — verify':'Actual hours from Cienapps'}" data-hi="${o.wo}" value="${o.hours}"></td>
          <td style="text-align:right;font-size:12px">€${Math.round(o.value||0).toLocaleString()}</td>
          <td style="color:var(--t3)">${wkLbl(orig[o.wo])||'Unscheduled'}</td>
          <td style="font-weight:600;color:${(orig[o.wo]||'')!==(o.plannedWeek||'')?'var(--blue)':'var(--t3)'}">${wkLbl(o.plannedWeek)||'Unscheduled'}</td>
          <td style="font-size:11px;color:var(--t3)">${(origStep[o.wo]||'—').replace(/^\d+\.\s*/,'')}</td>
          <td style="font-size:11px;font-weight:600;color:${(origStep[o.wo]||'')!==(o.step||'')?'var(--green)':'var(--t3)'}">${(o.step||'—').replace(/^\d+\.\s*/,'')}</td>
          <td style="font-size:12px;color:var(--t3)">${o.origDueDate&&o.origDueDate!==o.dueDate?fmt(o.origDueDate)+' Wk'+wkNum(new Date(o.origDueDate)):fmt(o.dueDate)+' Wk'+wkNum(new Date(o.dueDate))}</td>
          <td style="font-size:12px">${fmt(o.dueDate)} Wk${wkNum(new Date(o.dueDate))}</td>
          <td style="color:var(--t3);font-size:12px">${o.notes||'—'}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-g" id="btn-xchg">Download Changes Excel</button>
      <button class="btn btn-s" id="btn-mark">Mark as applied (reset tracker)</button>
    </div>`}
  </div>
  <div class="exp-panel">
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">Full Schedule Export</div>
    <p style="font-size:12px;color:var(--t3);margin-bottom:12px">All work orders with current planned weeks and 8-week summary.</p>
    <button class="btn btn-s" id="btn-xfull">Download Full Schedule Excel</button>
  </div>
  </div>`;
  document.getElementById('btn-xchg')?.addEventListener('click',()=>{
    const wb=XLSX.utils.book_new();
    const rows=[['WO #','Title','Customer','Hours','Week Was','Week Now','Step Was','Step Now','Week Start','Due Date','Notes'],
      ...chg.map(o=>[o.wo,o.title,o.customer,o.hours,wkLbl(orig[o.wo])||'Unscheduled',wkLbl(o.plannedWeek)||'Unscheduled',origStep[o.wo]||'',o.step||'',o.plannedWeek||'',o.dueDate||'',o.notes||''])];
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:16},{wch:35},{wch:28},{wch:7},{wch:16},{wch:16},{wch:20},{wch:20},{wch:13},{wch:12},{wch:30}];
    XLSX.utils.book_append_sheet(wb,ws,'Changes');
    XLSX.writeFile(wb,'WPF_Changes_'+new Date().toISOString().split('T')[0]+'.xlsx');
    toast('Changes exported ✓');
  });
  document.getElementById('btn-mark')?.addEventListener('click',()=>{DB.orders.forEach(o=>{orig[o.wo]=o.plannedWeek||'';origStep[o.wo]=o.step||'';});toast('Change tracker reset');render();});
  document.getElementById('btn-xfull')?.addEventListener('click',()=>{
    const weeks=get8Wks();
    const wb=XLSX.utils.book_new();
    const sorted=[...DB.orders].sort((a,b)=>{if(!a.plannedWeek&&b.plannedWeek)return 1;if(a.plannedWeek&&!b.plannedWeek)return-1;return(a.plannedWeek||'').localeCompare(b.plannedWeek||'');});
    const rows=[['WO #','Title','Customer','Hours','Planned Week','Week Start','Due Date','Step','Sales Rep','Notes'],
      ...sorted.map(o=>[o.wo,o.title,o.customer,o.hours,wkLbl(o.plannedWeek)||'Unscheduled',o.plannedWeek||'',o.dueDate||'',o.step.replace(/^\d\.\s*/,''),o.salesRep||'',o.notes||''])];
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:16},{wch:35},{wch:28},{wch:7},{wch:16},{wch:13},{wch:12},{wch:20},{wch:16},{wch:30}];
    XLSX.utils.book_append_sheet(wb,ws,'Full Schedule');
    const srows=[['Week','Start Date','Orders','Hours','Capacity','% Used','Status'],...weeks.map(wk=>{const h=wkHrs(wk),cnt=wkCnt(wk),pct=Math.round(h/WCAP*100);return[wkLbl(wk),wk,cnt,h,WCAP,pct+'%',pct>=100?'OVER':pct>=80?'NEAR OK':'OK'];})];
    const ws2=XLSX.utils.aoa_to_sheet(srows);ws2['!cols']=[{wch:16},{wch:13},{wch:8},{wch:8},{wch:10},{wch:8},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws2,'Week Summary');
    XLSX.writeFile(wb,'WPF_Schedule_'+new Date().toISOString().split('T')[0]+'.xlsx');
    toast('Full schedule exported ✓');
  });
}

['b','d','i','x','s'].forEach(t=>{document.getElementById('t-'+t).onclick=()=>showTab(t);});
loadDB().then(()=>render());
</script>
</body>
