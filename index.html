   1. identical lines (kind, part, L, W, qty, material, edging) keep their id and status — a note-only change keeps the tick
      but is flagged. Between identical twins, a ticked one is kept first (so a tick is never thrown away for an untouched twin).
   2. leftovers with the same kind, part and section pair in order: CHANGED (reset to todo).
   3. only in the new version: ADDED (new id after the highest one ever used).
   4. only in the old version: REMOVED — never deleted; kept aside if already cut / got out.
   Returns the lines for save_list_revision (reset:true where the content changed) plus the ids in each group. */
function diffLines(old,nw,opt){

  const N=v=>{const s=String(v==null?'':v).trim().replace(/\s*mm$/i,'');if(s==='')return'';const n=Number(s);return isNaN(n)?s.toLowerCase().replace(/\s+/g,' '):String(n);};

  const pk=x=>[T(x.kind),T(x.part),T(x.section)].join('|');
  const isDone=x=>x.status==='cut'||x.status==='got-out';

    if(c.length){match[i]=c[0];used.add(c[0].id);return true;}return false;};
  // 0. a line that names its own id (the editor knows which row is which) pairs with exactly that line — twins can't swap
  //    ... but only while it is still the same kind of part: a cut "Side" overtyped into "Shelf" is a removed Side + a new Shelf (so the saw is told to keep the Side aside)

  const num=v=>{const s=String(v==null?'':v).trim().replace(/\s*mm$/i,'');return s===''||isNaN(+s)?null:+s;}; // "720mm" = 720

  const out={lines:[],changed:[],added:[],removed:[],keepAside:[],noteOnly:[]};
  nw.forEach((x,i)=>{

function parseListWorkbook(data){
  const wb=XLSX.read(data,{type:'array',cellDates:true});
  const out={project:'',sheets:{}},entries=[];
  wb.SheetNames.forEach(sn=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    const rows=[];let proj='',sdate='';
    aoa.forEach((r,i)=>{
      const A=r[0]!=null?String(r[0]).trim():'';
      const qv=r[1]!=null&&String(r[1]).trim()!==''?parseFloat(r[1]):NaN;
      const qs=r[1]!=null?String(r[1]).trim():'';
      const qty=typeof r[1]==='number'||/^\d+(\.\d+)?(\s*(off|pcs?|no\.?))?$/i.test(qs)?qv:qs; // "2x2", "4+2" kept as typed — flagged "check quantity", never guessed
      const L=r[2]!=null?parseFloat(r[2]):NaN,W=r[3]!=null?parseFloat(r[3]):NaN;
      const mat=r[4]!=null?String(r[4]).trim():'',note=r[5]!=null&&!(r[5] instanceof Date)?String(r[5]).trim():'';
      if(!A&&isNaN(qv)&&!mat)return;
      if(i===0&&A&&isNaN(qv)){ // project header row: name in A, date in F
        proj=A;const d=r[5];
        if(d instanceof Date)sdate=d.toISOString().slice(0,10);
        else if(typeof d==='string'&&/\d{4}-\d{2}-\d{2}/.test(d))sdate=d.slice(0,10);
        return;
      }
      if(!isNaN(qv)){
        if(!isNaN(L)||!isNaN(W))rows.push({k:'saw',item:A,qty,L:isNaN(L)?'':L,W:isNaN(W)?'':W,mat,note});
        else rows.push({k:'fit',item:A||mat,qty,mat,note});
      }else if(!isNaN(L)&&!isNaN(W)&&(A||mat)){ // size but no quantity: still a part — kept as a line (flagged), not turned into a heading
        rows.push({k:'saw',item:A,qty:'',L,W,mat,note});
      }else if(A||mat){
        if(/^item\s*$/i.test(A)&&r[1]!=null&&/qty/i.test(String(r[1])))return; // the template's column-header row is labels, not data
        rows.push({k:'hdr',item:A,note:mat||note});
      }
    });
    if(rows.some(x=>x.k!=='hdr')){
      out.sheets[sn]=rows;
      entries.push({sheet:sn,sdate,saw:rows.filter(x=>x.k==='saw').length,fit:rows.filter(x=>x.k==='fit').length});
      if(proj&&!out.project)out.project=proj; // project name only from sheets that actually hold items (never a READ ME / cover sheet)
    }
  });
  return{wb:out,entries};
}

/* ---------- Sheets needed: board count per material for a cut-by date range (pure — reusable by a forklift view) ---------- */
const SHEET_M2=5.75,SHEET_WASTE=0.10; // one full board = 5.75 m²; +10% for offcuts and kerf

const IE_BANK_HOLS=['2026-01-01','2026-02-02','2026-03-17','2026-04-06','2026-05-04','2026-06-01','2026-08-03','2026-10-26','2026-12-25','2026-12-28',
  '2027-01-01','2027-02-01','2027-03-17','2027-03-29','2027-05-03','2027-06-07','2027-08-02','2027-10-25','2027-12-27','2027-12-28',
  '2028-01-01','2028-02-07','2028-03-17','2028-04-17','2028-05-01','2028-06-05','2028-08-07','2028-10-30','2028-12-25','2028-12-26'];
function bankHolsStale(t){const last=IE_BANK_HOLS.reduce((a,d)=>d>a?d:a,'').slice(0,4);return (t||todayLocal())>=last+'-12-01'?last:'';} // from 1 Dec of the last year listed

// Last cut-by date that is today's work: a cut-by on a weekend / bank holiday is done the working day before it.
// ONE rule for the Saw/Stores queue, "Print today" and the sheets panel.
function cutTodayEnd(t){t=t||todayLocal();return addDayISO(nextWorkDay(t),-1);}

// opt.cutSince (YYYY-MM-DD): lines/lists finished before that day are left out; lines cut on or after it still count.
// Lines waiting on material are left out. Dims are mm. Returns {mats:[{mat,m2,sheets,lines,check}],noSize,noQty,lines,sheets}.
/* One key per board name for grouping: same letters (é typed either way), any case, any run of spaces/NBSP = same board */
/* Board sizes: 2440, "2440MM", "2440 mm", "2440.0" and "2,440" are the same size (Garry, 3 Nov 2026). Anything else keeps matKey. */

function houseLabels(lsArr){

  // Every list's real name is reserved first, so a list really called "House 1 (2)" keeps that name and the repeat becomes "House 1 (3)".
  // Names that only differ by spaces or capitals ("House 1", "House 1 ", "house 1") look the same on a chip, so they count
  // as repeats too; a list with no name shows "(no name)".
  const tx=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
  const projs=new Set(lsArr.map(l=>matKey(tx(l.project))));
  const hbase=l=>{const n=tx(l.name)||'(no name)',p=tx(l.project);return projs.size>1&&p?p+' — '+n:n;};
  const lbl=new Map(),real=new Set(lsArr.map(l=>matKey(hbase(l)))),taken=new Set();
  lsArr.forEach(l=>{if(lbl.has(l.id))return;const b=hbase(l);if(!taken.has(matKey(b))){taken.add(matKey(b));lbl.set(l.id,b);}});

/* ---------- Stores dockets (SUPABASE_CHANGES.md 2026-11-04 "Stores dockets") ----------
   A docket = a batch of stores / bought-in items sent to a project's site (e.g. 20 taps held back in stores), numbered
   D26-0001… The two docket tables are written ONLY by the database functions make_docket / docket_delivered / docket_cancel,
   which hold the rules: part quantities (10 of 20), never more than the line's quantity, two PCs can't send the same items,
   one number per docket. With the lists switch OFF only free-typed items go on a docket (old lists have no permanent line
   ids). Dockets are read when a docket screen is opened — never polled, and never at start-up. */
const DK={};
const dkNum=q=>{const s=String(q==null?'':q).trim();return /^\d+(\.\d+)?$/.test(s)?+s:null;};
const dkQ=n=>n==null?'':String(+(+n).toFixed(3));
function dkErr(e){const m=String((e&&e.message)||e||'');
  if(/\b404\b|42P01|PGRST20[25]|does not exist|Could not find the (function|table)/.test(m))return 'The docket tables aren\'t set up in the database yet — the "Stores dockets" SQL in SUPABASE_CHANGES.md has to be run first.';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return 'No connection to the database — try again when the signal is back.';
  return m;}
// WO | Floor | Unit | Title of a list's work orders (Floor and Unit kept apart, Garry 4 Nov). Floor and Unit are listed
// one per WO in the same order as the WOs (never de-duplicated, "—" for a blank one), so each stays paired with its WO.
function dkWoInfo(wos){wos=wos||[];const os=wos.map(w=>DB.orders.find(o=>o.wo===w)||null),t=v=>String(v==null?'':v).trim();
  const p=f=>{const a=os.map(o=>o?t(f(o)):'');return a.some(Boolean)?a.map(v=>v||'—').join(', '):'';};
  return{wo:wos.join(', '),floor:p(fuF),unit:p(fuU),title:[...new Set(os.filter(Boolean).map(o=>t(o.title)).filter(Boolean))].join(', ')};}
async function dkRpc(fn,args){
  try{return await lsRpc(fn,args);}
  catch(e){if(e.status==null&&!/switched off/.test(String(e.message)))e.lost=true;throw e;} // no reply: it may have landed
}
// Make one docket. docket: {project_id|project_name, customer, site_address, delivery_instructions, cid}; items: [{line_id, qty, wo, floor, unit, title}] or
// free-typed [{item, qty, wo, floor, unit, title, spec}]. Reply {ok, id, docket_no} or {ok:false, refused:[{line_id, why, left, dockets}]}.
async function dkMake(docket,items,by){return dkRpc('make_docket',{p_docket:docket,p_items:items,p_by:by});}
async function dkDelivered(id,recBy,recAt,sig,by){return dkRpc('docket_delivered',{p_id:id,p_received_by:recBy,p_received_at:recAt||null,p_signature_name:sig||null,p_by:by});}

async function dkCancel(id,why,by,left){if(left!==true&&left!==false)throw new Error('say whether the items left stores');return dkRpc('docket_cancel',{p_id:id,p_why:why,p_by:by,p_left:left});}

// Dockets (newest first) + their items. q: extra PostgREST filters, e.g. '&made_at=gte.…'
async function dkLoad(q){
  const ds=await lsGet('stores_dockets?select=*'+(q||'')+'&order=made_at.desc,id');
  const its=ds.length?await lsGetIn('stores_docket_items','docket_id',ds.map(d=>d.id)):[];
  const by=new Map(ds.map(d=>[d.id,[]]));its.forEach(i=>{const a=by.get(i.docket_id);if(a)a.push(i);});
  by.forEach(a=>a.sort((x,y)=>(x.seq||0)-(y.seq||0)||(+x.id)-(+y.id)));
  return ds.map(d=>({...d,items:by.get(d.id)||[]}));
}
// Sent so far per line (live dockets only): {line_id: {n: qty sent, k: items, dk: [docket numbers]}}
async function dkSentFor(lineIds){
  const its=lineIds.length?(await lsGetIn('stores_docket_items','line_id',lineIds)).filter(i=>i.active):[];
  const dks=its.length?await lsGetIn('stores_dockets','id',[...new Set(its.map(i=>i.docket_id))]):[];
  const no=new Map(dks.map(d=>[d.id,d.docket_no])),m={};
  its.forEach(i=>{const s=m[i.line_id]||(m[i.line_id]={n:0,k:0,dk:[]});s.n+=i.qty==null?0:+i.qty;s.k++;const d=no.get(i.docket_id);if(d&&!s.dk.includes(d))s.dk.push(d);});
  return m;
}

/* (Manager, 4 Nov) Before the "Stores dockets" SQL is run, the Send to site / Dockets / Items sent buttons are hidden quietly
   instead of giving a technical message. ONE probe per page load, cached: tables there = show; "not found" = hidden for
   this session; no reply (offline) = show (the dialogs say "no connection") and ask again a minute later. */
const DKP={st:'',busy:false,retry:0};
function dkVis(){return DKP.st==='ok'||(DKP.st==='net');}
function dkProbe(){
  if(DKP.busy||DKP.st==='ok'||DKP.st==='missing'||(DKP.st==='net'&&Date.now()<DKP.retry))return;DKP.busy=true;
  lsGet1('stores_dockets?select=id&limit=1').then(()=>{DKP.st='ok';},e=>{const m=String((e&&e.message)||e||'');
    if(/\b404\b|42P01|PGRST20[25]|does not exist|Could not find the (function|table)/.test(m))DKP.st='missing';else{DKP.st='net';DKP.retry=Date.now()+60000;}})
   .then(()=>{DKP.busy=false;dkShow();});
}
function dkShow(){const v=dkVis();document.querySelectorAll('.dk-gate').forEach(b=>{b.hidden=!v;});dkProbe();}
function dkProjLines(pid){
  const out=[];
  [...LST.l.values()].filter(r=>r.project_id===pid&&!r.archived&&!r.is_template)
    .sort((a,b)=>String(a.name).localeCompare(String(b.name))||String(a.id).localeCompare(String(b.id))).forEach(r=>{
    const l=lsList(r.id);if(!l)return;const info=dkWoInfo(l.wos);
    lsLinesOf(r.id).forEach(x=>{if(!['fit','buy'].includes(x.kind)||x.removed_rev!=null)return;const st=lnSt(x);if(['na','got-out','cut'].includes(st))return;out.push({x,l,st,info});});
  });
  return out;
}
function dkProjChoices(){ // V2: the projects; switch OFF: the customers on the planner (a docket keeps the name as typed)
  if(V2())return lsProjects().map(p=>({id:p.id,name:p.name,customer:p.customer||'',site:p.site_address||''}));
  return [...new Set(DB.orders.map(o=>String(o.customer||'').trim()).filter(Boolean))].sort().map(n=>({id:'',name:n,customer:n,site:''}));
}
function dkWosFor(pr){ // work orders offered for a typed item
  if(!pr)return[];
  const ws=V2()?[...new Set([...LST.l.values()].filter(r=>r.project_id===pr.id&&!r.archived&&!r.is_template).flatMap(r=>r.wos||[]))]
    :DB.orders.filter(o=>String(o.customer||'').trim()===pr.name).map(o=>o.wo);
  return ws.sort();
}

        <td class="dk-q" data-l="Send">${wait?'<span class="dk-wt">⏸ Waiting — release first</span>':tot==null?`<b>${E(x.qty||'—')}</b> <span style="font-size:11px;color:var(--t3)">(whole line)</span>`:`<input inputmode="decimal" data-dkq="${E(x.id)}" value="${E(on?S.sel.get(x.id):dkQ(lf))}" aria-label="How many to send">`}</td>

      <label class="dk-f" for="dk-proj">Project</label><select id="dk-proj" class="dk-in"><option value="">— pick the project —</option>${ch.map(p=>`<option value="${E(v2?p.id:p.name)}"${pr&&(v2?p.id===pr.id:p.name===pr.name)?' selected':''}>${E(p.name)}${p.customer&&p.customer!==p.name?' — '+E(p.customer):''}</option>`).join('')}</select>

          render();return;}

/* ---------- Driver phone view: check jobs onto the van, group ALL DELIVERED, photo proof ---------- */
// Cutting/fittings readiness for one WO, from its tagged lists: is the material cut, are the fittings out?
function woListStat(wo){ // per side: 'none' (not applicable) | 'unset' (no rows, not confirmed) | 'hold' | 'open' | 'done'
  const ls2=lists().filter(l=>(l.wos||[]).includes(wo)),po=ls2.length?null:findDel(wo);
  if(!ls2.length&&!phHas(po))return null;
  const r=woReady(wo);
  const when=m=>{if(po)return(phDone(po,m)||{}).at||'';let t='';ls2.forEach(l=>{const d=listDone(l.id)[m];if(d&&d.at>t)t=d.at;});return t;};
  const m=x=>x==='na'?'none':x;
  return{saw:m(r.saw),fit:m(r.fit),sawAt:when('saw'),fitAt:when('fit'),lvl:r.lvl,why:r.why};
}
function sideChipHTML(mode,st,at,big){
  const fs=big?' style="font-size:13px"':'';
  if(st==='none')return'';
  if(st==='done')return`<span class="ls-ok"${fs}>${mode==='saw'?'🪚 CUT ✓':'🧰 PICKED ✓'}${at?' '+hhmm(at):''}</span>`;
  if(st==='hold')return`<span class="ls-hold"${fs}>${mode==='saw'?'🪚 ⏸ WAITING ON MATERIAL':'🧰 ⏸ WAITING ON STOCK'}</span>`;
  if(st==='unset')return`<span class="ls-hold"${fs}>${mode==='saw'?'🪚 no saw rows — confirm "no cutting"':'🧰 no fittings listed — confirm "no fittings"'}</span>`;
  return`<span class="ls-no"${fs}>${mode==='saw'?'🪚 NOT CUT':'🧰 NOT PICKED'}</span>`;
}
function listStatHTML(wo){
  const s=woListStat(wo);
  if(!s)return`<div class="drv-ls"><span class="ls-none">📋 no cutting list linked</span></div>`;
  return`<div class="drv-ls">${sideChipHTML('saw',s.saw,s.sawAt)} ${sideChipHTML('fit',s.fit,s.fitAt)}</div>`;
}
/* Scheduling check: the moment a job is put on the delivery board, show where its cutting
   and fittings lists stand — and whether a list still needs to be issued at all. */
function showReadiness(wos,ctx,always){
  const items=wos.map(w=>{const o=DB.orders.find(x=>x.wo===w)||findDel(w);return o?{o,s:woListStat(w)}:null;}).filter(Boolean);

  const chip=(ok,txtOk,txtNo)=>ok?`<span class="ls-ok" style="font-size:13px">${txtOk}</span>`:`<span class="ls-no" style="font-size:13px">${txtNo}</span>`;
  const rowH=i=>{

      <b style="font-family:monospace;color:#14335c">${escA(o.wo)}</b>

  ov.innerHTML=`<div class="pod-in" style="min-width:min(620px,94vw)">
    <div style="font-weight:800;color:#14335c;font-size:16px;margin-bottom:2px">📋 Cutting &amp; fittings check — ${escA(ctx)}</div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:8px">Everything must be cut and picked <b>the day before delivery</b>. <b style="color:#0d6e46">Green</b> = ready · <b style="color:#8a5a00">amber</b> = part ready or waiting on material · <b style="color:#b42318">red</b> = nothing done or no list.</div>
    ${items.map(rowH).join('')}
    <div style="margin-top:12px;text-align:right"><button class="wl-btn" id="pod-x" style="padding:10px 22px;font-size:14px">OK — understood</button></div></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov||e.target.id==='pod-x')ov.remove();};
}

function shrinkImage(file){return new Promise((res,rej)=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{
    const mx=1400,sc=Math.min(1,mx/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('compress failed')),'image/jpeg',.72);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
  img.src=url;
});}
async function addPodPhotos(files,pk){
  if(!files||!files.length)return;
  drvUploading=true;render();
  try{
    DB.pod=DB.pod||{};DB.pod[pk]=DB.pod[pk]||{photos:[]};
    for(const f of files){
      const blob=await shrinkImage(f);
      const path=pk.replace(/[^A-Za-z0-9-]/g,'-')+'/'+Date.now()+'-'+Math.floor(Math.random()*1e4)+'.jpg';
      const r=await fetch(SUPA_STORE+'/object/pod/'+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
      if(!r.ok)throw new Error('HTTP '+r.status);
      DB.pod[pk].photos.push(SUPA_STORE+'/object/public/pod/'+path);
    }
    sched();toast('Photo saved ✓');
  }catch(e){
    toast('Photo upload failed ('+e.message+') — tell the office; the photo bucket may not be set up yet.');
  }
  drvUploading=false;render();
}

  };

  const pp=document.getElementById('btn-delprint');if(pp)pp.onclick=printPoster;
  const rsh=document.getElementById('btn-runsheets');if(rsh)rsh.onclick=printRunSheets;
  const ab=document.getElementById('btn-delarch');if(ab)ab.onclick=openDelArchive;
  const dt8=document.getElementById('btn-deltag');
  if(dt8)dt8.onclick=()=>{
    const from=prompt('Only tick jobs due on or after this date (older assembled/palleted jobs are already delivered):',DELV_CATCHUP_FROM);
    if(from===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(from.trim())){toast('Type the date as YYYY-MM-DD, e.g. 2026-11-01');return;}
    const js=DB.orders.filter(o=>delvCatchUpOk(o,from.trim()));if(!js.length){toast('Nothing to tag');render();return;}
    const older=DB.orders.filter(delvAutoOk).length-js.length;
    if(!confirm('Tick '+js.length+' job'+(js.length===1?'':'s')+' at 7 ASSEMBLY COMPLETE / 8 PALLETED, due from '+fmt(from.trim())+', for delivery?'+(older?'\n\n'+older+' older job'+(older===1?'':'s')+' at 7/8 are left alone (already delivered).':'')+'\n\nThey go into the pool (no van or day). Jobs already on the board, shipped, or untagged by hand are left as they are.'))return;
    officeWho(by=>{let n=0;DB.orders.filter(o=>delvCatchUpOk(o,from.trim())).forEach(o=>{if(delvAuto(o,by,'Tagged for delivery — already at '+o.step+' (one-off catch-up)'))n++;});

  };
  const rs=document.getElementById('btn-delreset');
  if(rs)rs.onclick=async()=>{
    if(!confirm('Clear the whole delivery plan ('+tagged.length+' jobs)? A safety backup of the whole plan is saved to the database first, and the week is ARCHIVED (📚 Past weeks keeps every job, timestamp, name and note), then the board starts fresh for the next production meeting.'))return;
    if(!await backupFirst('Clear Week'))return;
    // Archive the week before anything is cleared — starting fresh must never lose information
    const snap=tagged.filter(o=>o.delVeh||o.delDay||o.delv||o.manual);
    if(snap.length){
      DB.delArchive=DB.delArchive||{};
      const key=new Date().toISOString().slice(0,10)+'.'+Date.now().toString(36);
      DB.delArchive[key]={at:new Date().toISOString(),notes:{...(DB.delNotes||{})},pod:{...(DB.pod||{})},
        jobs:snap.map(o=>({wo:o.wo,t:o.title||'',c:o.customer||'',f:o.floor||'',u:o.unit||'',v:o.delVeh||'',d:o.delDay||'',val:Math.round(o.value||0),lAt:o.delLoadedAt||'',dAt:o.delDispAt||'',vAt:o.delDelivAt||'',lBy:o.ldBy||'',vBy:o.delivBy||'',mv:(o.delMoves||[]).map(m=>({at:m.at,by:m.by,why:m.why,from:m.from,to:m.to})),fd:o.delFirst||'',mw:o.missWhy||null}))};
      const ks=Object.keys(DB.delArchive).sort();
      while(ks.length>26)delete DB.delArchive[ks.shift()]; // keep half a year of history
      DB.pod={}; // the week's proof photos move into the archive with it — a fresh board shows no stale 📷
    }
    DB.orders.forEach(o=>{const wasDeliv=!!(o.delDelivAt||o.delDone);delete o.delv;delete o.delVeh;delete o.delDay;delete o.delLoadedAt;delete o.delDispAt;delete o.delDelivAt;delete o.ldBy;delete o.delivBy;delete o.delMoves;delete o.delFirst;delete o.missWhy;delete o.delPlacedBy;delete o.delPlacedAt;if(wasDeliv)o.delDone=true;else delete o.delDone;});
    DB.delx=[];DB.delNotes={};delSel.clear();
    sched();render();toast('Week archived to 📚 Past weeks — board cleared for next week');
  };
}

/* 📚 Past weeks: every cleared delivery week is archived — view it read-only or export it.
   This is the answer to "clearing each week will lose information": it can't, it's archived. */
function openDelArchive(detailKey){
  const ar=DB.delArchive||{};
  const keys=Object.keys(ar).sort().reverse();
  const ov=document.createElement('div');ov.className='pod-ovl';
  const sum=k=>{const a=ar[k];return{n:a.jobs.length,val:a.jobs.reduce((s,j)=>s+(+j.val||0),0),dlv:a.jobs.filter(j=>j.vAt).length};};
  const stamp=t=>t?new Date(t).toLocaleDateString('en-IE',{day:'numeric',month:'short'})+' '+hhmm(t):'';
  let detail='';
  if(detailKey&&ar[detailKey]){
    const a=ar[detailKey];
    const rows=[...a.jobs].sort((x,y)=>DEL_DAYS.indexOf(x.d)-DEL_DAYS.indexOf(y.d)||String(x.v).localeCompare(String(y.v))||woCmp({wo:x.wo},{wo:y.wo}));
    detail=`<div style="margin-top:14px;border-top:2px solid var(--border);padding-top:10px">
      <div style="font-weight:700;color:#14335c;margin-bottom:6px">Week archived ${new Date(a.at).toLocaleDateString('en-IE')} — ${a.jobs.length} jobs</div>
      <table class="lst-tbl"><thead><tr><th>Day</th><th>Vehicle</th><th>WO #</th><th>Floor</th><th>Unit</th><th>Title</th><th>Customer</th><th>€</th><th>Loaded</th><th>Dispatched</th><th>Delivered</th></tr></thead><tbody>
      ${rows.map(j=>`<tr><td>${escA(j.d)||'—'}</td><td>${escA(vehLbl(j.v)||j.v)||'—'}</td><td style="font-family:monospace;font-weight:700">${escA(j.wo)}</td><td>${escA(fuF(j))}</td><td>${escA(fuU(j))}</td><td>${escA(j.t)}</td><td>${escA(j.c)}</td><td>${j.val?j.val.toLocaleString():''}</td>
        <td>${stamp(j.lAt)}${j.lBy?' · '+escA(j.lBy):''}</td><td>${stamp(j.dAt)}</td><td style="color:#0d6e46;font-weight:700">${stamp(j.vAt)}${j.vBy?' · '+escA(j.vBy):''}</td></tr>`).join('')}
      ${Object.keys(a.notes||{}).filter(d=>(a.notes[d]||'').trim()).map(d=>`<tr><td style="font-weight:700">${escA(d)}</td><td colspan="10" style="font-style:italic;color:var(--t2)">Note: ${escA(a.notes[d])}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  ov.innerHTML=`<div class="pod-in" style="min-width:min(1050px,95vw)">
    <div style="font-weight:800;color:#14335c;font-size:17px;margin-bottom:4px">📚 Past delivery weeks</div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:10px">Every time the board is cleared, the week is stored here first — jobs, vans, days, who loaded, who delivered, when, and the day notes. Last 26 weeks kept.</div>
    ${keys.length?`<table class="lst-tbl"><thead><tr><th>Archived</th><th>Jobs</th><th>Delivered</th><th>Value</th><th></th></tr></thead><tbody>
      ${keys.map(k=>{const s=sum(k);return `<tr${k===detailKey?' style="background:#eaf2ff"':''}><td style="font-weight:700">${new Date(ar[k].at).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short',year:'numeric'})} ${hhmm(ar[k].at)}</td><td>${s.n}</td><td>${s.dlv}/${s.n}</td><td>€${Math.round(s.val).toLocaleString()}</td>
        <td style="white-space:nowrap"><button class="btn btn-s" data-arcv="${escA(k)}" style="padding:2px 8px;font-size:11px">${k===detailKey?'Viewing':'View'}</button> <button class="btn btn-s" data-arcx="${escA(k)}" style="padding:2px 8px;font-size:11px">⬇ Export</button></td></tr>`;}).join('')}
      </tbody></table>`:'<p style="font-size:13px;color:var(--t3)">No archived weeks yet — the first Clear Week will create one.</p>'}
    ${detail}
    <div style="margin-top:12px;text-align:right"><button class="btn btn-s" id="pod-x">Close</button></div></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov||e.target.id==='pod-x')ov.remove();};

/* Overflow pagination: a page only ever holds WHOLE vehicle rows. If a category page
   overflows, whole vehicles (last first, e.g. Crafter) move to a continuation page —
   one vehicle's deliveries are never split across pages and no job is ever clipped.
   If a single vehicle alone still overflows its page, the cards step down in size instead. */
function paginate(){
  var list=[].slice.call(document.querySelectorAll('.sheet'));
  for(var si=0;si<list.length;si++){
    var sh=list[si],grid=sh.querySelector('.pgrid'),guard=0;
    while(grid.scrollHeight>grid.clientHeight+2&&guard++<60){
      var rows=sh.querySelectorAll('.vrow');
      if(rows.length<=1){
        var lvl=+(sh.getAttribute('data-c')||0);
        if(lvl>=3)break;
        lvl++;sh.setAttribute('data-c',lvl);sh.className='sheet c'+lvl;
        continue;
      }
      var next=list[si+1];
      var cont=(next&&next.getAttribute('data-cont')===sh.getAttribute('data-cat'))?next:null;
      if(!cont){
        cont=document.createElement('div');

function autoSchedule(newOrders){
  const weeks=get8Wks();
  const currentWeek=weeks[0];
  const wkLoad={};
  // Jobs due after the 8-week window stay unscheduled — they are planned when their week comes into view
  const endD=new Date(weeks[weeks.length-1]+'T00:00:00Z');endD.setUTCDate(endD.getUTCDate()+7);
  const windowEnd=wkKey(endD);
  DB.orders.forEach(o=>{if(o.plannedWeek)wkLoad[o.plannedWeek]=(wkLoad[o.plannedWeek]||0)+(+o.hours||0);});
  newOrders.forEach(o=>{if(o.plannedWeek)wkLoad[o.plannedWeek]=(wkLoad[o.plannedWeek]||0)+(+o.hours||0);});
  newOrders.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  newOrders.forEach(o=>{
    if(o.plannedWeek)return;
    let assigned=null;
    if(!o.dueDate){
      assigned=currentWeek;
    } else {
      const due=o.dueDate;
      if(due<currentWeek){
        // Overdue — put in current week
        assigned=currentWeek;
      } else if(due>=windowEnd){
        assigned=''; // beyond the 8 weeks — unscheduled
      } else {
        // Match to the exact week the due date falls in
        for(let i=0;i<weeks.length;i++){
          const wkStart=weeks[i];
          const wkEnd=i<weeks.length-1?weeks[i+1]:null;
          if(due>=wkStart&&(!wkEnd||due<wkEnd)){assigned=wkStart;break;}
        }
        if(!assigned)assigned=weeks[weeks.length-1];
      }
    }
    o.plannedWeek=assigned;
    if(assigned)wkLoad[assigned]=(wkLoad[assigned]||0)+(+o.hours||0);
  });
}

   woKey: the matching key for a WO — text, trimmed, upper case (1234 = "1234", "wo-1" = "WO-1").
   parseNum: "€12,500.00" → 12500 · blank → null (not supplied) · unreadable → NaN.
   parseDateIE: Irish day/month/year → 'YYYY-MM-DD' (UTC, no time-zone shift) · blank → '' · unreadable or impossible → null.
   parseHours: "8h" → {h:8} · blank → null · ≤0 or >500 → {bad:true} (bad data; hours get estimated instead). */
// A totals / count line, not a job: the WO cell says total / count / sum anywhere ("Grand Total: 1 orders", "Count: 245"),
// or has no WO-shaped token — letters/digits joined by _ or - with a digit in it (WO-2604-7, 2557_01) — and isn't a
// plain number either (1234). So "245 jobs" and "Total" are skipped; they are listed under Skipped in the preview.
function isTotalsWo(w){
  const s=String(w==null?'':w).trim();
  if(/total|count|sum/i.test(s))return true;
  if(/^\d+(\.0+)?$/.test(s))return false;
  return !s.split(/\s+/).some(t=>/\d/.test(t)&&/^[A-Za-z0-9]+([_-][A-Za-z0-9]+)+$/.test(t));

function woKey(w){return String(w==null?'':w).trim().toUpperCase();}
// Tidy a WO cell before matching: no-break spaces, spaces around - _ / collapsed ("WO - 2604 - 1" → "WO-2604-1"),
// a space before a single suffix letter dropped ("2557_01 A" → "2557_01A").
function woNorm(w){return String(w==null?'':w).replace(/[\u00a0\u202f\u2009]/g,' ').trim().replace(/\s*([-_\/])\s*/g,'$1').replace(/(\d)\s+([A-Za-z])$/,'$1$2');}

/* parseNum: Irish "€12,500.00" = 12500 and European "€12.500,00" = 12500 · "12,5" / "8,5" (decimal comma) = 12.5 / 8.5 ·
   "1,000 EUR" = 1000 · "(1,200)" = -1200 · one dot is always a decimal point ("12.500" = 12.5) · blank → null · unreadable → NaN */
function parseNum(v){
  if(blankCell(v))return null;
  if(typeof v==='number')return isFinite(v)?v:NaN;
  let s=String(v).replace(/[€$£\s\u00a0\u202f\u2009]/g,'').replace(/^eur|eur$/i,'');
  let neg=false;const pm=s.match(/^\((.*)\)$/);if(pm){neg=true;s=pm[1];}
  const sg=s.match(/^[-+]/);if(sg){if(sg[0]==='-')neg=!neg;s=s.slice(1);}
  const hasC=s.indexOf(',')>-1,hasD=s.indexOf('.')>-1;
  if(hasC&&hasD){ // the last one is the decimal mark
    if(s.lastIndexOf(',')>s.lastIndexOf('.')){if(!/^\d{1,3}(\.\d{3})*,\d+$/.test(s))return NaN;s=s.replace(/\./g,'').replace(',','.');}
    else{if(!/^\d{1,3}(,\d{3})*\.\d+$/.test(s))return NaN;s=s.replace(/,/g,'');}
  }else if(hasC){
    if(/^\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,''); // 12,500 · 1,000,000
    else if(/^\d+,\d{1,2}$/.test(s))s=s.replace(',','.'); // 12,5 · 8,50
    else return NaN;
  }else if(/^\d{1,3}(\.\d{3}){2,}$/.test(s))s=s.replace(/\./g,''); // 1.000.000

  }
  const s=String(v).trim().toLowerCase().replace(/(\d)(st|nd|rd|th)\b/g,'$1')
    .replace(/^(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s+/,'') // "Thu 05/11/2026"
    .replace(/(\d)[\st]+\d{1,2}:\d{2}(:\d{2}(\.\d+)?)?\s*(am|pm|z)?$/,'$1'); // a time after the date ("05/11/2026 00:00")
  let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[t\s].*)?$/)))return ymd(m[1],m[2],m[3]); // ISO
  if((m=s.match(/^(\d{1,2})[\/\-.\s]+(\d{1,2})[\/\-.\s]+(\d{2}|\d{4})$/)))return ymd(m[3],m[2],m[1]); // d/m/y — never m/d
  if((m=s.match(/^(\d{1,2})[\/\-.\s]+([a-z]{3,9})\.?[\/\-.,\s]+(\d{2}|\d{4})$/))){const mo=MONTHS[m[2].slice(0,4)]||MONTHS[m[2].slice(0,3)];return mo?ymd(m[3],mo,m[1]):null;} // 4 Oct 2026
  if((m=s.match(/^([a-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{2}|\d{4})$/))){const mo=MONTHS[m[1].slice(0,4)]||MONTHS[m[1].slice(0,3)];return mo?ymd(m[3],mo,m[2]):null;} // Oct 4, 2026
  if(/^\d+(\.\d+)?$/.test(s))return parseDateIE(parseFloat(s)); // serial stored as text
  return null;
}
/* normaliseRow: one raw import row → a tidy record. r.has[field] is set only for cells that were actually filled in,
   so a blank cell means "not supplied" and can never wipe what the planner already holds. Returns {skip} for
   rows with no WO number or totals lines. A future Cienapps API feed builds records in this same shape. */
function normaliseRow(row){
  const wo=woNorm(row.wo);
  if(!wo||/^(nat|nan|undefined|null)$/i.test(wo))return{skip:'noWo'};
  if(isTotalsWo(wo))return{skip:'totals'};
  const r={wo,key:woKey(wo),has:{},flags:[]};
  const txt=k=>{const v=row[k];if(blankCell(v))return;r[k]=String(v).trim();r.has[k]=1;};
  ['title','customer','step','ref','orderNo','salesRep','floor','unit'].forEach(txt);
  // Floor & Unit — from their own columns, else out of the Reference (order-seq-floor-unit)
  if((!r.has.floor||!r.has.unit)&&r.ref&&r.ref.split('-').length>=4){
    const ps=r.ref.split('-');
    if(!r.has.floor&&ps[2].trim()){r.floor=ps[2].trim();r.has.floor=1;}
    if(!r.has.unit&&ps.slice(3).join('-').trim()){r.unit=ps.slice(3).join('-').trim();r.has.unit=1;}
  }
  const v=parseNum(row.value);
  if(v!==null){if(isNaN(v))r.flags.push('value "'+String(row.value).slice(0,20)+'" unreadable — value not changed');else{r.value=v;r.has.value=1;if(v<0)r.flags.push('credit? value is negative (€'+v+') — kept as is');}}
  const sh=parseNum(row.sheets);
  if(sh!==null){if(isNaN(sh)||sh<0)r.flags.push('sheets "'+String(row.sheets).slice(0,20)+'" unreadable');else{r.sheets=sh;r.has.sheets=1;}}
  const h=parseHours(row.hours);
  if(h){if(h.bad){r.hoursBad=true;r.flags.push('hours "'+h.raw.slice(0,20)+'" ignored (bad data) — estimated instead');}else{r.hours=h.h;r.has.hours=1;}}
  const d=parseDateIE(row.dueDate);
  if(d===null){r.dueBad=true;r.flags.push('due date "'+String(row.dueDate).slice(0,20)+'" unreadable — existing date kept');}
  else if(d){r.dueDate=d;r.has.dueDate=1;}
  return r;
}
// "+A" / "+A+C" badge for a WO with A/C lines folded into it (letters from o.adds)
function addBadge(o){const ks=Object.keys((o&&o.adds)||{});if(!ks.length)return'';const ls=ks.map(k=>(acBase(k)||{}).letter||'?');return`<span class="fu-badge" style="background:#f6f2fd;border-color:#c9b6f0;color:#5b3fa8;margin-left:4px" title="Additions folded in: ${escA(ks.join(', '))}">+${escA(ls.join('+'))}</span>`;}
// A/C suffix: one letter A–F straight after the number, with or without a dash (2557_01A, WO-2604-7-C) → base WO key, or null.
// Other letters (R etc.) are NOT additions — those lines stay their own job and are flagged "suffix?".
function acBase(key){const m=String(key).match(/^(.*\d)-?([A-F])$/);return m?{base:m[1],letter:m[2]}:null;}
function oddSuffix(key){const m=String(key).match(/^(.*\d)-?([G-Z])$/);return m?{base:m[1],letter:m[2]}:null;}
/* combineRows: same WO twice in the file → one record (filled cells win, earliest due date, flagged).
   A/C lines fold into their base WO (base in the file, or on the board via `board`, a Map woKey → order):
   their value/hours go into base.adds and the line is listed as an Addition. A line whose base can't be found,
   or that is already on the board as its own job, stays as its own job. */
function combineRows(recs,board){
  board=board||new Map();
  const by=new Map(),out=[];
  const DUPK=['value','step','dueDate'],dv=(r,k)=>r.has[k]?[r.line,r[k]]:null;
  recs.forEach(r=>{
    const e=by.get(r.key);
    if(!e){by.set(r.key,r);out.push(r);return;}
    if(!e.dupv){e.dupv={};DUPK.forEach(k=>{e.dupv[k]=[dv(e,k)].filter(Boolean);});e.dupLines=[e.line];}
    DUPK.forEach(k=>{const x=dv(r,k);if(x)e.dupv[k].push(x);});e.dupLines.push(r.line);
    Object.keys(r.has).forEach(k=>{
      if(k==='dueDate'){if(!e.has.dueDate||r.dueDate<e.dueDate){e.dueDate=r.dueDate;e.has.dueDate=1;}return;}
      if(!e.has[k]){e[k]=r[k];e.has[k]=1;}
    });
    r.flags.forEach(f=>{if(!e.flags.includes(f))e.flags.push(f);});
    if(r.hoursBad&&!e.has.hours)e.hoursBad=true;
    e.dup=(e.dup||1)+1;
  });
  // Which line's value / step / due date was used, and the alternatives (shown in the preview)
  out.forEach(e=>{if(!e.dup)return;
    const L=x=>'line '+x,f={value:v=>'€'+Math.round(v).toLocaleString(),step:v=>'"'+v+'"',dueDate:v=>v};
    const parts=DUPK.map(k=>{const xs=e.dupv[k]||[];if(!xs.length)return'';const used=xs.find(x=>String(x[1])===String(e[k]))||xs[0];
      const others=xs.filter(x=>String(x[1])!==String(used[1]));
      return (k==='dueDate'?'due date':k)+' '+f[k](used[1])+' used ('+L(used[0])+(k==='dueDate'?', earliest':'')+')'+(others.length?' — also '+others.map(x=>f[k](x[1])+' ('+L(x[0])+')').join(', '):'');}).filter(Boolean);
    e.dupInfo={lines:e.dupLines,parts};
    e.flags.unshift('duplicate in file ('+e.dup+' lines: '+e.dupLines.join(', ')+') — combined into one'+(parts.length?': '+parts.join(' · '):''));});
  const keep=[],folds=[],synth=new Map();
  out.forEach(r=>{
    const ac=acBase(r.key);
    if(!ac||board.has(r.key)){
      const od=!ac&&!board.has(r.key)&&oddSuffix(r.key);
      if(od&&(by.has(od.base)||board.has(od.base)))r.flags.push('suffix? — letter '+od.letter+' is not an addition letter (A–F); kept as its own job, not folded into '+od.base);
      keep.push(r);return;}
    let base=by.get(ac.base); // a base key always ends in a digit, so it is never itself an A/C line
    if(!base&&!board.has(ac.base)){r.flags.push('base '+ac.base+' not found — kept as its own job');keep.push(r);return;}
    if(!base){ // base only on the board: a record that carries just the addition
      base=synth.get(ac.base);
      if(!base){const o=board.get(ac.base);base={wo:o.wo,key:ac.base,has:{},flags:[],synth:true};synth.set(ac.base,base);keep.push(base);}
    }
    // an addition due earlier than its base brings the base's due date forward
    if(r.has.dueDate){const cur=base.has.dueDate?base.dueDate:(base.synth?(board.get(ac.base).dueDate||''):'');
      if(!cur||r.dueDate<cur){base.dueDate=r.dueDate;base.has.dueDate=1;base.flags.push('due date brought forward to '+r.dueDate+' by addition '+r.wo+(cur?' (was '+cur+')':''));}}
    base.adds=base.adds||{};
    base.adds[r.key]={value:r.has.value?r.value:0,...(r.has.hours?{hours:r.hours}:{}),title:r.title||''};
    folds.push({wo:r.wo,base:base.wo,letter:ac.letter,value:r.has.value?r.value:0,hours:r.has.hours?r.hours:null,title:r.title||'',step:r.step||''});
  });
  return{recs:keep,folds};
}
function parseHours(v){
  if(blankCell(v))return null;
  const n=typeof v==='number'?v:parseNum(String(v).replace(/\s*(h|hr|hrs|hours?)\s*$/i,''));
  if(n===null)return null;
  if(!isFinite(n)||n<=0||n>500)return{bad:true,raw:String(v)};
  return{h:Math.round(n*100)/100};
}

// Find a real header row anywhere in the sheet (Cienapps title blocks can push it past row 12). Returns row index or -1.
function findHeaderRow(aoa){
  for(let r=0;r<aoa.length;r++){
    const cells=(aoa[r]||[]).map(nrmH);
    let hits=0,hasWo=false;
    IMP_FIELDS.forEach(f=>{
      if(cells.some(c=>c&&f.al.indexOf(c)>-1)){hits++;if(f.k==='wo')hasWo=true;}
    });
    if(hasWo&&hits>=3)return r;
  }
  return -1;
}
function mapFromHeader(hdrCells){
  const m={};
  IMP_FIELDS.forEach(f=>{
    m[f.k]=-1;
    for(let p=0;p<f.al.length&&m[f.k]<0;p++){
      const idx=hdrCells.findIndex(c=>nrmH(c)===f.al[p]);
      if(idx>-1&&Object.keys(m).every(k=>k===f.k||m[k]!==idx))m[f.k]=idx;
    }
  });
  // Sheets: any other header containing "sheet" or "board" (Cienapps wording varies)
  if(m.sheets<0){const idx=hdrCells.findIndex((c,i)=>/sheet|board/.test(nrmH(c))&&Object.keys(m).every(k=>m[k]!==i));if(idx>-1)m.sheets=idx;}
  return m;
}

// No header row — infer each column from its contents.
function guessCols(rows){
  const n=rows.reduce((a,r)=>Math.max(a,r.length),0);
  const col=i=>rows.map(r=>r[i]).filter(v=>v!==''&&v!=null);
  const used={};
  const take=i=>{if(i>-1)used[i]=1;return i;};
  const free=i=>!used[i];
  const m={};
  const byTest=t=>{let best=-1,bs=0.5;for(let i=0;i<n;i++){if(!free(i))continue;const v=col(i);if(v.length<3)continue;const s=v.filter(t).length/v.length;if(s>bs){bs=s;best=i;}}return best;};
  m.wo=take(byTest(v=>/^wo[-\s_]/i.test(String(v))));
  m.step=take(byTest(v=>/^\s*\d+\s*\./.test(String(v))));
  // Due date: date-like column, well filled, latest-skewed (creation dates sit in the past).
  const isDt=v=>(v instanceof Date)||(typeof v==='number'&&v>35000&&v<80000);
  const ser=v=>v instanceof Date?(v.getTime()/86400000)+25569:v;
  let bd=-1,bmed=-1;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i);
    if(!v.length||v.filter(isDt).length/v.length<0.9)continue;
    if(v.length/rows.length<0.8)continue;
    const s=v.map(ser).sort((a,b)=>a-b);
    const med=s[Math.floor(s.length/2)];
    if(med>bmed){bmed=med;bd=i;}
  }
  m.dueDate=take(bd);
  // Order #: numeric column whose value appears inside the WO number (WO-2604-7 -> 2604).
  if(m.wo>-1){
    let bo=-1,bs=0.6;
    for(let i=0;i<n;i++){
      if(!free(i))continue;
      const v=rows.map(r=>[r[m.wo],r[i]]).filter(p=>p[0]!=null&&p[1]!=null&&p[1]!=='');
      if(v.length<3)continue;
      const s=v.filter(p=>String(p[0]).indexOf(String(p[1]))>-1).length/v.length;
      if(s>bs){bs=s;bo=i;}
    }
    m.orderNo=take(bo);
    // Reference: text column that also embeds the order number but is near-unique.
    let br=-1,bsr=0.6;
    for(let i=0;i<n;i++){
      if(!free(i))continue;
      const v=col(i);
      if(v.length<3||new Set(v.map(String)).size/v.length<0.9)continue;
      const pr=rows.map(r=>[r[m.orderNo],r[i]]).filter(p=>p[0]!=null&&p[1]!=null&&p[1]!=='');
      if(!pr.length)continue;
      const s=pr.filter(p=>String(p[1]).indexOf(String(p[0]))===0).length/pr.length;
      if(s>bsr){bsr=s;br=i;}
    }
    m.ref=take(br);
  } else {m.orderNo=-1;m.ref=-1;}
  // Floor & Unit: the Reference encodes them as segments 3 and 4 (e.g. 2604-7-0-22 = order-seq-floor-unit),
  // so find the columns whose values match those segments.
  m.floor=-1;m.unit=-1;
  if(m.ref>-1){
    const segs=rows.map(r=>String(r[m.ref]==null?'':r[m.ref]).split('-'));
    const s3=segs.map(s=>s.length>=4?String(s[2]):null);
    const s4=segs.map(s=>s.length>=4?s.slice(3).join('-'):null);
    const matchCol=target=>{
      let best=-1,bs=0.6;
      for(let i=0;i<n;i++){
        if(!free(i))continue;
        const pairs=rows.map((r,j)=>[target[j],r[i]]).filter(p=>p[0]!=null&&p[1]!=null&&p[1]!=='');
        if(pairs.length<3)continue;
        const s=pairs.filter(p=>String(p[1]).toUpperCase().trim()===String(p[0]).toUpperCase().trim()).length/pairs.length;
        if(s>bs){bs=s;best=i;}
      }
      return best;
    };
    m.floor=take(matchCol(s3));
    m.unit=take(matchCol(s4));
  }
  // Value: numeric, many distinct, decent magnitude — prefer the one with decimals.
  let bv=-1,bvs=-1;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i).filter(x=>typeof x==='number'||(typeof x==='string'&&x!==''&&!isNaN(Number(x)))).map(Number);
    if(v.length/Math.max(1,col(i).length)<0.9||v.length<3)continue;
    const d=new Set(v).size;
    if(d<10)continue;
    const s=d+(v.some(x=>x%1!==0)?1000:0);
    if(s>bvs){bvs=s;bv=i;}
  }
  m.value=take(bv);
  // Customer: text column with the longest average value (company names).
  let bc=-1,bl=6;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i).map(String);
    if(v.length<3||v.some(x=>x instanceof Date))continue;
    if(v.filter(x=>isNaN(Number(x))).length/v.length<0.9)continue;
    const d=new Set(v).size;
    if(d<3||d/v.length>0.9)continue;
    const avg=v.reduce((a,x)=>a+x.length,0)/v.length;
    if(avg>bl){bl=avg;bc=i;}
  }
  m.customer=take(bc);
  // Title: remaining text column with the most distinct values.
  let bt=-1,bts=2;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i).map(String);
    if(v.length<3)continue;
    if(v.filter(x=>isNaN(Number(x))).length/v.length<0.8)continue;
    const d=new Set(v).size;
    if(d>bts){bts=d;bt=i;}
  }
  m.title=take(bt);
  // Sales rep: remaining text column, few distinct, names with a space.
  let bp=-1;
  for(let i=0;i<n&&bp<0;i++){
    if(!free(i))continue;
    const v=col(i).map(String);
    if(v.length<3)continue;
    const d=new Set(v).size;
    if(d>=3&&d<=20&&v.filter(x=>/^[A-Za-z .'\-]+$/.test(x)&&x.indexOf(' ')>-1).length/v.length>0.8)bp=i;
  }
  m.salesRep=take(bp);
  if(m.hours===undefined)m.hours=-1;
  IMP_FIELDS.forEach(f=>{if(m[f.k]===undefined)m[f.k]=-1;});
  return m;
}

function objsFrom(rows,map){
  return rows.map(r=>{
    const o={};
    IMP_FIELDS.forEach(f=>{o[f.k]=map[f.k]>-1?r[map[f.k]]:undefined;});
    return o;
  });
}
function importError(msg,detail){
  const el=document.getElementById('iprev');
  if(el)el.innerHTML=`<div style="margin-top:14px;background:#fef2f2;border:1px solid #fca5a5;border-radius:6px;padding:12px 14px">
    <div style="font-size:13px;font-weight:600;color:#b91c1c;margin-bottom:4px">⚠ Import failed — nothing was changed</div>
    <div style="font-size:12px;color:#7f1d1d;line-height:1.5">${msg}</div>
    ${detail?`<div style="font-size:11px;color:#7f1d1d;margin-top:8px;font-family:monospace;opacity:.8">${detail}</div>`:''}
  </div>`;
  toast('Import failed — see details');
}

function doImport(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    if(typeof XLSX==='undefined'){importError('The Excel reader library did not load, so no file can be opened. Check your internet connection and reload this page.');return;}
    let wb;
    try{wb=XLSX.read(e.target.result,{type:'binary'});}
    catch(ex){importError('That file could not be read as an Excel workbook. Export again from Cienapps as .xlsx and retry.',String(ex.message||ex));return;}
    const sh=wb.Sheets[wb.SheetNames[0]];
    if(!sh){importError('That workbook contains no sheets.');return;}
    const aoa=XLSX.utils.sheet_to_json(sh,{header:1,blankrows:false}).filter(r=>r&&r.some(c=>c!==''&&c!=null));
    if(aoa.length<2){importError('That sheet has no data rows.');return;}
    const h=findHeaderRow(aoa);
    if(h>-1){
      const map=mapFromHeader(aoa[h]);
      const missing=IMP_FIELDS.filter(f=>f.req&&map[f.k]<0);
      if(missing.length){PEND={rows:aoa.slice(h+1),map:map};renderMapping('Header row found, but no column for: '+missing.map(f=>f.label).join(', ')+'. Confirm the mapping below.');return;}
      runImport(objsFrom(aoa.slice(h+1),map));
    } else {
      const rows=aoa;
      PEND={rows:rows,map:guessCols(rows)};
      renderMapping('This export has no header row, so the columns were matched by their contents. Check the mapping below, then import.');
    }
  };
  reader.readAsBinaryString(file);
}

function renderMapping(note){
  const rows=PEND.rows,map=PEND.map;
  const n=rows.reduce((a,r)=>Math.max(a,r.length),0);
  const isDt=x=>(x instanceof Date)||(typeof x==='number'&&x>35000&&x<80000);
  const sample=i=>{
    const v=rows.map(r=>r[i]).filter(x=>x!==''&&x!=null);
    if(!v.length)return '(empty)';
    // Show date columns as readable dates, not raw Excel serial numbers
    if(v.filter(isDt).length/v.length>=0.9){
      const d=v[0] instanceof Date?v[0]:new Date(Math.round((v[0]-25569)*86400*1000));
      return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
    }
    return String(v[0]).substring(0,24);
  };
  const opts=sel=>{let s=`<option value="-1"${sel<0?' selected':''}>— not used —</option>`;for(let i=0;i<n;i++)s+=`<option value="${i}"${sel===i?' selected':''}>Col ${colLtr(i)} · ${escA(sample(i))}</option>`;return s;};
  document.getElementById('iprev').innerHTML=`<div style="margin-top:14px">
    <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:10px 13px;font-size:12px;color:#92400e;margin-bottom:12px;line-height:1.5">${note}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px">
      ${IMP_FIELDS.map(f=>`<div>
        <label style="display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:3px">${f.label}${f.req?' <span style="color:#dc2626">*</span>':''}</label>
        <select data-mf="${f.k}" style="width:100%;padding:5px 6px;font-size:12px;border:1px solid var(--b2);border-radius:4px;background:#fff">${opts(map[f.k])}</select>
      </div>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--t3);margin:10px 0 12px">${rows.length} data rows detected. Fields marked * are required.</div>
    <button class="btn btn-g" id="mapgo">Import ${rows.length} rows →</button>
    <button class="btn" id="mapcancel" style="margin-left:8px">Cancel</button>
  </div>`;
  document.getElementById('mapcancel').onclick=()=>{PEND=null;document.getElementById('iprev').innerHTML='';};
  document.getElementById('mapgo').onclick=()=>{
    const m={};
    document.querySelectorAll('[data-mf]').forEach(s=>{m[s.getAttribute('data-mf')]=parseInt(s.value,10);});
    const missing=IMP_FIELDS.filter(f=>f.req&&m[f.k]<0);
    if(missing.length){toast('Choose a column for: '+missing.map(f=>f.label).join(', '));return;}
    runImport(objsFrom(PEND.rows,m));
    PEND=null;
  };
}

/* Two-phase import: ANALYZE builds a plan without touching the board; the office reviews
   exactly what will happen (new / updated / removed / warnings) and then APPLIES or cancels.
   Nothing changes — and nothing is saved — until Apply is clicked. */
let IMPPLAN=null;
function runImport(rows){
    const plan=analyzeImport(prepImport(rows),'file');
    if(!plan)return;
    IMPPLAN=plan;
    renderImportPreview(plan);
}
/* ---------- Stage 2 import pipeline ----------
   file → rows (doImport) → normaliseRow → combineRows → analyzeImport (plan, board untouched) → preview → applyImport.
   A Cienapps API feed later hands its records to prepImport/combineRows and the rest is the same. */
const isSnagWo=k=>woKey(k).indexOf('WO-S')===0; // snag WOs belong to the planner — imports never add, change or remove them
function boardMap(){const m=new Map();DB.orders.forEach(o=>{const k=woKey(o.wo);if(k&&!m.has(k))m.set(k,o);});return m;}
function prepImport(rows,board){
  const skip={noWo:0,totals:0,snag:0},recs=[],skipped=[];

      document.querySelectorAll('[data-rmv]').forEach(s=>{if(chg.has(woKey(s.dataset.rmv)))return;if(moves[s.dataset.rmv]&&[...s.options].some(o=>o.value===moves[s.dataset.rmv]))s.value=moves[s.dataset.rmv];});

      return;
    }
    // Same or fewer changes: each dropped one was either already applied by another PC, or edited there (the planner's edit wins)
    fresh.moves=moves;fresh.dueDec=dueDec;
    applyImport(fresh);IMPPLAN=null;
  };
}
// Apply's fresh load: wait for a save in flight, then reload. False = the database copy could not be fetched.
async function freshForImport(){
  for(let i=0;i<150&&SAVING;i++)await new Promise(r=>setTimeout(r,100));
  if(SAVING)return false;
  await loadDB();
  return !!DB.lastLoadOk;
}
function reanalyzeImport(p){
  const inp=p.input;if(!inp)return p; // a plan built without its input can't be re-run; applyImport still looks every job up again
  const f=analyzeImport(inp.raw?prepImport(inp.raw):inp,p.source);
  if(!f)return f;
  // A job that was on the planner when the preview was built but has been deleted on another PC since: skipped, never re-added
  const pp=p.pre||{},fp=f.pre||{},gone=Object.keys(pp).filter(k=>!(k in fp));
  if(gone.length){const g=new Set(gone);f.newOrders=f.newOrders.filter(o=>!g.has(woKey(o.wo)));f.counts.added=f.newOrders.length;}
  f.gone=[...new Set((p.gone||[]).concat(gone))];
  return f;
}
/* What the planner holds for a job, for every field an import can write or depends on (due date, step, hours and
   where they came from, week, delivery tag/van/day, shipped / on hold / installed / complete, the planner's overrides).
   Apply compares this between the preview and the latest database copy. */
const PRE_K=['dueDate','dueKeep','step','hours','plannedWeek','delv','delVeh','delDay','delLoadedAt','shippedAt','shipBack','cienHold','installedAt','completeAt','completeOverride','delvOverride'];
const PRE_L={dueDate:'due date',dueKeep:'due date',step:'step',hours:'hours',plannedWeek:'week',delv:'delivery tag',delVeh:'van',delDay:'delivery day',delLoadedAt:'loaded',shippedAt:'shipped',shipBack:'brought back',cienHold:'on hold',installedAt:'installed',completeAt:'complete',completeOverride:'complete undone',delvOverride:'untagged'};
function preOf(ex){return JSON.stringify(PRE_K.map(k=>ex[k]==null||ex[k]===''||ex[k]===false?null:ex[k]).concat(hSrc(ex)));}
function preWhat(a,b){
  try{const A=JSON.parse(a),B=JSON.parse(b),r=new Set();PRE_K.forEach((k,i)=>{if(JSON.stringify(A[i])!==JSON.stringify(B[i]))r.add(PRE_L[k]);});
    if(A[PRE_K.length]!==B[PRE_K.length])r.add('hours');return[...r].join(', ');}catch(e){return'';}
}
// Every change a plan would make, as key → plain-English label (what's compared between preview and Apply)
function planActs(p){
  const m=new Map(),v=x=>x===undefined||x===''?'(none)':String(x);
  (p.newOrders||[]).forEach(o=>m.set('new|'+woKey(o.wo)+'|'+JSON.stringify([o.value,o.hours,o.hoursSrc||'',o.dueDate,o.step,!!o.delv,!!o.cienHold,o.plannedWeek||'']),o.wo+': new job'));
  (p.updates||[]).forEach(u=>{const s=u.set||{};Object.keys(s).forEach(k=>{if(k==='hoursSrc'||k==='hoursEstimated')return;
    const val=k==='hours'?[s.hours,s.hoursSrc||'']:s[k];
    m.set('upd|'+u.key+'|'+k+'|'+JSON.stringify(val),u.wo+': '+k+' → '+v(s[k]));});});
  (p.shipped||[]).forEach(s=>m.set('ship|'+s.key+'|'+s.cs,s.wo+': to Shipped ('+s.cs+')'));
  (p.marks||[]).forEach(x=>m.set('mark|'+x.key+'|'+JSON.stringify([!!x.inst,!!x.done]),x.wo+': marked '+(x.done?'complete':'installed')+' ('+x.cs+')'));
  return m;
}
// Is a preview change no longer needed because the job already holds it (another PC applied the same import)?
function actDone(k,board){
  const p=k.split('|'),ex=board.get(p[1]);
  if(p[0]==='new')return !!ex;
  if(!ex)return false;
  if(p[0]==='ship')return !!ex.shippedAt;
  let v;try{v=JSON.parse(p.slice(p[0]==='upd'?3:2).join('|'));}catch(e){return false;}
  if(p[0]==='mark')return(!v[0]||!!ex.installedAt)&&(!v[1]||!!ex.completeAt);
  const f=p[2];
  if(f==='hours')return +ex.hours===+v[0]&&hSrc(ex)===v[1];
  if(f==='dueDate')return ex.dueDate===v||ex.dueKeep===v;
  if(f==='cienHold')return !!ex.cienHold===!!v;
  if(f==='delv')return !!ex.delv===!!v;
  return String(ex[f]==null?'':ex[f])===String(v==null?'':v);
}
/* Preview (a) vs the import worked out again on the latest data (b). The preview is shown again when
   - the import would now do something it didn't show (added), or
   - another PC changed a job (due date, step, hours, week, delivery, shipped/on hold…) that the import still
     writes to, or that has a "Move to" chosen (changed).
   Changes that dropped out are either already applied by another PC, or the other PC's edit wins (dropped). */
function planDiff(a,b,moves){
  const A=planActs(a),B=planActs(b),added=[],dropped=[],applied=[],changed=[],board=boardMap();
  B.forEach((l,k)=>{if(!A.has(k))added.push(l);});
  A.forEach((l,k)=>{if(B.has(k))return;if(actDone(k,board))applied.push(l);else if(board.has(k.split('|')[1]))dropped.push(l);});
  const pa=a.pre||{},pb=b.pre||{},inB=new Set([...B.keys()].map(k=>k.split('|')[1])),mv=new Set(Object.keys(moves||{}).map(woKey));
  Object.keys(pa).forEach(k=>{
    if(!(k in pb)||pa[k]===pb[k]||!(inB.has(k)||mv.has(k)))return;
    const ex=board.get(k);changed.push({key:k,l:(ex?ex.wo:k)+': changed on another PC ('+(preWhat(pa[k],pb[k])||'details')+')'});
  });
  return{added,dropped,applied,changed};
}
// Going on hold: off the Deliveries board — tag, van and day cleared, what it was is noted on the job (and its history).
// Coming back restores none of it. A job already loaded / on the road / delivered is left alone (it stays on
// Deliveries with an ON HOLD marker on its chip).
function holdUntag(ex){
  if(!ex.delv&&!ex.delVeh&&!ex.delDay)return;
  if(!delHidden(ex))return;
  const was=[ex.delVeh?vehLbl(ex.delVeh)||ex.delVeh:'',ex.delDay||''].filter(Boolean).join(' · ')||'tagged, no van/day';
  ex.holdDel=was;ex.delv=false;ex.delVeh='';ex.delDay='';
  logEdit(ex,'On hold in Cienapps — taken off Deliveries (was '+was+')','(import)');
}
function applyImport(plan){
    plan=plan||{};
    // Look every job up again NOW — another screen may have added, edited or deleted jobs since the preview was built.
    // No import ever removes a job (an old-style plan.removals list is ignored).
    const board=boardMap(),get=x=>board.get(x.key||woKey(x.wo));
    const dec=plan.dueDec||{},at=nowISO();
    (plan.updates||[]).forEach(u=>{
      const ex=get(u);if(!ex)return; // deleted on another screen meanwhile — nothing to update
      const s=u.set||{};
      Object.keys(s).forEach(k=>{if(k!=='dueDate')ex[k]=s[k];});
      if('cienHold' in s){if(s.cienHold){ex.holdAt=at;holdUntag(ex);}else{delete ex.cienHold;delete ex.holdAt;ex.holdBack=at;}}
      if('dueDate' in s){
        if(dec[u.wo]==='keep')ex.dueKeep=s.dueDate; // planner date kept; this Cienapps date won't be asked about again
        else{if(!ex.origDueDate)ex.origDueDate=ex.dueDate||'';ex.dueDate=s.dueDate;delete ex.dueKeep;}
      }
      if('step' in s)origStep[ex.wo]=s.step; // the step came FROM Cienapps — nothing to send back
      if(u.what)logEdit(ex,'Cienapps import: '+u.what+('dueDate' in s?(u.what?' · ':'')+'due '+(dec[u.wo]==='keep'?'kept '+(ex.dueDate||'—'):'→ '+s.dueDate):''),'(import)');
    });
    (plan.fills||[]).forEach(f=>{const ex=get(f);if(!ex)return;Object.keys(f.set).forEach(k=>{if(f.set[k]===undefined)delete ex[k];else ex[k]=f.set[k];});});
    (plan.synced||[]).forEach(s=>{const ex=get(s);if(ex&&String(ex.step||'').trim()===s.step)origStep[ex.wo]=ex.step;});
    // week moves chosen on the Differs rows (these DO show in Export Changes, as they should)
    if(plan.moves)Object.keys(plan.moves).forEach(wo=>{const ex=board.get(woKey(wo));if(ex)ex.plannedWeek=plan.moves[wo];});
    // shipped / invoiced → Shipped tab (first time seen)
    let nShip=0;
    (plan.shipped||[]).forEach(s=>{const ex=get(s);if(!ex||ex.shippedAt)return;ex.shippedAt=at;ex.shippedStep=s.cs;delete ex.shipBack;nShip++;logEdit(ex,'Moved to Shipped — Cienapps: '+s.cs,'(import)');});
    (plan.marks||[]).forEach(m=>{const ex=get(m);if(!ex||!ex.shippedAt)return;
      if(m.inst&&!ex.installedAt){ex.installedAt=at;logEdit(ex,'Installed — Cienapps: '+m.cs,'(import)');}
      if(m.done&&!ex.completeAt){ex.completeAt=at;ex.completeBy='Cienapps';logEdit(ex,'Installation complete — Cienapps: '+m.cs,'(import)');}});
    // new orders — skip any that another screen added meanwhile, then schedule to their due-date week
    const fresh=(plan.newOrders||[]).filter(o=>!board.has(woKey(o.wo)));
    const noAuto=new Set(plan.unsched||[]); // on hold / unreadable due date: left unscheduled
    autoSchedule(fresh.filter(o=>!noAuto.has(woKey(o.wo)))); // (autoSchedule sorts its list; the jobs keep the file's order on the board data)
    fresh.forEach(o=>{
      if(o.cienHold)o.holdAt=at;
      DB.orders.push(o);board.set(woKey(o.wo),o);
      orig[o.wo]=o.plannedWeek||'';origStep[o.wo]=o.step||''; // baseline AFTER auto-schedule so auto-assignments don't show as changes
    });
    // o.procAt: the day the planner first saw the job at 5. WORK ORDER PROCESSED or later — its cutting list is due a set
    // number of working days after it. Jobs already past step 5 the first time this runs get today's date.
    // Lists switch OFF: never stamped (the saved jobs stay exactly as the go-live version writes them).
    if(V2())lsStampProc();
    cleanGroups();
    sched();
    const c=plan.counts||{},el=document.getElementById('iprev');
    if(el)el.innerHTML=`<div style="margin-top:14px">
      <div style="font-size:13px;font-weight:600;color:var(--green);margin-bottom:10px">✓ Import applied: ${fresh.length} added · ${(plan.updates||[]).length} updated · ${c.skipped||0} unchanged · ${nShip} moved to 📦 Shipped · nothing removed</div>
      ${plan.applied&&plan.applied.length?`<div style="font-size:12px;color:var(--t2);margin-bottom:10px">${plan.applied.length} change${plan.applied.length!==1?'s':''} already applied by another PC: ${escA(plan.applied.slice(0,10).join(' · '))}${plan.applied.length>10?' …':''}</div>`:''}
      ${plan.dropped&&plan.dropped.length?`<div style="font-size:12px;color:#8a6d00;margin-bottom:10px">${plan.dropped.length} change${plan.dropped.length!==1?'s':''} from the preview not made — edited on another PC meanwhile (the planner's edit wins): ${escA(plan.dropped.slice(0,10).join(' · '))}${plan.dropped.length>10?' …':''}</div>`:''}
      ${plan.gone&&plan.gone.length?`<div style="font-size:12px;color:#8a6d00;margin-bottom:10px">Skipped — deleted on another PC while the preview was open (not re-added): ${escA(plan.gone.slice(0,20).join(', '))}${plan.gone.length>20?' …':''}</div>`:''}
      <button class="btn btn-g" onclick="showTab('b')">Go to Capacity Board →</button>
      ${nShip?`<button class="btn btn-s" style="margin-left:8px" onclick="showTab('h')">Open Shipped →</button>`:''}
      ${V2()?'<div style="margin-top:14px">'+listsToIssueHTML()+'</div>':''}
    </div>`;
    if(el&&V2()){LTI.afterImp=true;ltiBind();}
    toast(`Import applied — ${fresh.length} added, ${(plan.updates||[]).length} updated${nShip?', '+nShip+' to Shipped':''}`);
}

/* ---------- Delivery moves: first placement is stamped; every later move needs a name AND a reason ---------- */
function slotLbl(v,d){return d?((vehLbl(v)||v)+' '+d):'the pool';}
function placeJobs(moved,veh,day){
  moved=moved.filter(Boolean);
  if(!moved.length)return;
  const changing=moved.filter(o=>(o.delVeh||'')!==veh||(o.delDay||'')!==day);
  if(!changing.length){delSel.clear();render();return;}
  const reMoves=changing.filter(o=>o.delDay);
  const apply=(by,why)=>{
    const at=nowISO(),to=day?veh+'|'+day:'';
    changing.map(o=>findDel(o.wo)).filter(Boolean).forEach(o=>{
      if(o.delDay){
        (o.delMoves=o.delMoves||[]).push({at,by,why,from:o.delVeh+'|'+o.delDay,to});
        logEdit(o,'Delivery moved '+slotLbl(o.delVeh,o.delDay)+' → '+slotLbl(veh,day),by,why);
      }else if(day){
        if(!o.delFirst)o.delFirst=to;
        o.delPlacedBy=by;o.delPlacedAt=at;
        logEdit(o,'Delivery planned for '+slotLbl(veh,day),by);
      }
      o.delVeh=veh;o.delDay=day;
    });
    delSel.clear();sched();render();
    if(day)showReadiness(changing.map(o=>o.wo),'scheduled to '+slotLbl(veh,day));
    else toast(changing.length+' job'+(changing.length!==1?'s':'')+' returned to the pool');
  };
  officeWho(by=>{
    if(!reMoves.length){apply(by,'');return;}
    pickReason('Why is '+(reMoves.length===1?reMoves[0].wo:reMoves.length+' jobs')+' moving?',
      `Moving to <b>${escA(slotLbl(veh,day))}</b>${reMoves.length===1?' from <b>'+escA(slotLbl(reMoves[0].delVeh,reMoves[0].delDay))+'</b>':''}. Every move is recorded with your name (${escA(by)}) and shows on the management scorecard.`,
      why=>apply(by,why),()=>render());
  },()=>render());
}

/* ---------- Readiness: one colour per job, from its cutting/fittings lists ---------- */
function rowKey(r){if(V2()&&r&&r.id)return r.id;return[r.k,String(r.item||'').trim(),r.L,r.W,String(r.mat||'').trim(),String(r.note||'').trim()].join('|').toLowerCase();}
function holdsOf(id){if(V2())return lsView(id).holds;return (DB.listHold||{})[id]||{};}
/* Per-row tick-off at the bench: each item is ticked as it's cut/picked and struck through; the house signs off when the last row goes. */
function rowTicks(id){if(V2())return lsView(id).ticks;return (DB.listRow||{})[id]||{};}
function rowTicked(id,k){const t=rowTicks(id)[k];return !!t;}
function setRowTick(l,k,mode,by,on){
  if(V2()){lqLine(k,on?(mode==='saw'?'cut':'got-out'):'todo',by);return;} // the database applies "done wins" (a tick also ends a wait)
  DB.listRow=DB.listRow||{};const t=DB.listRow[l.id]=DB.listRow[l.id]||{};
  const had=!!t[k];
  if(on)t[k]={m:mode,at:nowISO(),by:by||''};else delete t[k];
  if(!Object.keys(t).length)delete DB.listRow[l.id];
  // got out = no longer waiting; a hold left under a tick (two screens) is superseded — unticking must not bring it back
  if(on||had){if(dropHold(l,k))holdLog(on?(mode==='saw'?'cut':'picked'):'na-cleared',l,1,mode,by);}
}
// Removes one line's hold. The per-list map is never deleted, even when empty — the two-screen merge then works line by
// line (a removed line stays removed); a deleted map would be "removed here, changed there" and the stale copy would win.
function dropHold(l,k,by){if(V2()){const x=holdsOf(l.id)[k];if(!(x&&x.st==='hold'))return false;lqLine(k,'todo',by);return true;}const h=holdsOf(l.id);if(!(h[k]&&h[k].st==='hold'))return false;delete h[k];return true;}
/* A row is waiting only while it is held AND not ticked. Two screens can leave a row both ticked (got out) and
   held (N/A) after a merge — got-out wins, so that row counts as done. Applied when reading; saved data untouched. */
function heldRow(l,k){const h=holdsOf(l.id)[k];return !!(h&&h.st==='hold'&&!rowTicked(l.id,k));}
function clearRowTicks(l,mode,by){if(V2()){Object.keys(rowTicks(l.id)).forEach(k=>{if(rowTicks(l.id)[k].m===mode)lqLine(k,'todo',by);});return;}const t=rowTicks(l.id);let n=0;Object.keys(t).forEach(k=>{if(t[k].m===mode){delete t[k];if(dropHold(l,k))n++;}});if(DB.listRow&&DB.listRow[l.id]&&!Object.keys(t).length)delete DB.listRow[l.id];
  if(n)holdLog('na-cleared',l,n,mode,by); // N/A left under a tick by another screen — superseded, not brought back
}
function tickableRows(l,mode){ // rows the bench can tick right now: not held; only released rows when the rest was already signed off
  const h=holdsOf(l.id),relOnly=!!listDone(l.id)[mode]&&relOpen(l,mode);
  return listRows(l).filter(r=>r.k===mode).filter(r=>{const x=h[rowKey(r)];if(heldRow(l,rowKey(r)))return false;return !relOnly||(x&&x.st==='rel');});
}
/* Released rows still to do on a signed-off list. A released row that is already ticked is finished work — a stale
   "Release" from an out-of-date screen can merge in after the list was cut; it must not reopen the list. */
function relOpen(l,mode){return listHoldRows(l,mode,'rel').some(x=>!rowTicked(l.id,x.k));}
function listHoldRows(l,mode,st){return Object.entries(holdsOf(l.id)).filter(([k,v])=>v.m===mode&&(!st||v.st===st)&&!(v.st==='hold'&&rowTicked(l.id,k))).map(([k,v])=>({k,...v}));}
function sideState(l,mode){ // 'na' | 'unset' | 'hold' | 'open' | 'done'
  const n=mode==='saw'?(l.saw||0):(l.fit||0);
  if(!n)return (mode==='saw'?l.noCut:l.noFit)?'na':'unset';
  if(listHoldRows(l,mode,'hold').length)return'hold';
  if(listDone(l.id)[mode]&&!relOpen(l,mode))return'done';
  return'open';
}
const SIDE_WHY={saw:{open:'Not cut yet',hold:'Saw waiting on material',unset:'No saw rows — tick "no cutting" if none are needed'},
                fit:{open:'Fittings not picked',hold:'Fittings waiting on stock',unset:'No fittings listed — tick "no fittings" if none are needed'}};
function woReady(wo){
  const ls2=lists().filter(l=>(l.wos||[]).includes(wo));
  if(!ls2.length){const o=findDel(wo);
    if(phHas(o)){const s={saw:phDone(o,'saw')?'done':'open',fit:phDone(o,'fit')?'done':'open'},nd=['saw','fit'].filter(m=>s[m]==='done').length; // photo list: one tick per side
      return{lvl:nd===2?'green':nd?'amber':'red',why:['saw','fit'].filter(m=>s[m]!=='done').map(m=>SIDE_WHY[m].open+' (photo list)'),saw:s.saw,fit:s.fit,photo:true};}
    return{lvl:'red',why:['No cutting list issued'],saw:'nolist',fit:'nolist'};}
  const agg=mode=>{
    const st=ls2.map(l=>sideState(l,mode));
    const real=st.filter(s=>s==='done'||s==='open'||s==='hold');
    if(real.length)return real.includes('hold')?'hold':real.includes('open')?'open':'done';
    return st.includes('na')?'na':'unset';
  };
  const s={saw:agg('saw'),fit:agg('fit')};
  const app=['saw','fit'].filter(m=>s[m]!=='na');
  let lvl='green';
  if(app.length&&!app.every(m=>s[m]==='done'))lvl=app.some(m=>s[m]==='done'||s[m]==='hold')?'amber':'red';
  const why=app.filter(m=>s[m]!=='done').map(m=>SIDE_WHY[m][s[m]]);
  return{lvl,why,saw:s.saw,fit:s.fit};
}
const RDY_LBL={green:'READY',amber:'PART READY',red:'NOT READY'};

/* ---------- Waiting on material: per-row holds, released by Saw, Stores, Office or Production ---------- */
function allHolds(modes,st){
  const out=[];
  lists().forEach(l=>Object.entries(holdsOf(l.id)).forEach(([k,v])=>{if(modes.includes(v.m)&&(!st||v.st===st)&&!(v.st==='hold'&&rowTicked(l.id,k)))out.push({l,k,v});}));
  return out;
}
function holdRows(l,keys,mode,by){
  if(V2()){listRows(l).forEach(r=>{const k=rowKey(r);if(r.k===mode&&keys.includes(k))lqLine(k,'waiting',by);});return;}
  DB.listHold=DB.listHold||{};const h=DB.listHold[l.id]=DB.listHold[l.id]||{};
  const at=nowISO();
  listRows(l).forEach(r=>{const k=rowKey(r);if(r.k===mode&&keys.includes(k))h[k]={m:mode,st:'hold',at,by,item:r.item||'',mat:r.mat||'',qty:r.qty,L:r.L||'',W:r.W||''};});
  holdLog('hold',l,keys.length,mode,by);
}
function releaseHolds(items,by){
  if(V2()){items.forEach(({l,k})=>{const h=holdsOf(l.id)[k];if(h&&h.st==='hold')lqLine(k,'release',by);});return;} // already cut: the database only clears the wait
  const at=nowISO();
  items.forEach(({l,k})=>{const h=holdsOf(l.id)[k];if(!(h&&h.st==='hold'))return;
    if(rowTicked(l.id,k)){dropHold(l,k);return;} // already cut/picked: releasing only clears the hold, never turns it back into work
    h.st='rel';h.relAt=at;h.relBy=by;});
  const byL={};items.forEach(i=>{byL[i.l.id]=(byL[i.l.id]||0)+1;});
  Object.keys(byL).forEach(id=>{const l=lists().find(x=>x.id===id);if(l)holdLog('release',l,byL[id],'',by);});
}
function clearReleased(lsArr,mode,by){ // released rows that have now been cut/picked leave the hold book
  if(V2())return; // V2: a cut/got-out line is no longer released work by itself
  lsArr.forEach(l=>{const h=holdsOf(l.id);let n=0;Object.keys(h).forEach(k=>{if(h[k].m===mode&&h[k].st==='rel'){delete h[k];n++;}});
    if(n)holdLog(mode==='saw'?'cut':'picked',l,n,mode,by);
    });
}
/* One-line park / un-park from the bench N/A box — thin wrappers over the same hold book and log */
function holdOne(l,k,mode,by){if(rowTicked(l.id,k))return false;holdRows(l,[k],mode,by);return true;}
function unholdOne(l,k,mode,by){
  if(!dropHold(l,k,by))return false;
  holdLog('unhold',l,1,mode,by);return true;
}
function holdLog(act,l,n,mode,by){
  if(V2())return; // V2: every change is in list_events, written by the database
  DB.holdLog=DB.holdLog||[];
  DB.holdLog.push({at:nowISO(),act,list:l.name,proj:l.project||'',n,m:mode,by:by||''});
  if(DB.holdLog.length>300)DB.holdLog=DB.holdLog.slice(-300);
}
function openHold(l,mode){
  const h=holdsOf(l.id);
  const rows=listRows(l).filter(r=>r.k===mode&&!(h[rowKey(r)]&&h[rowKey(r)].st==='hold')&&!rowTicked(l.id,rowKey(r))); // ticked = already got out
  if(!rows.length){toast('Nothing left to park — every row is already ticked or waiting');return;}

// the last cut-by day a paper sheet covers: today (+ the non-working days ahead), or the next N days
function wlPrintEnd(days){
  const today=todayLocal(),e=cutTodayEnd(today);
  const lim=new Date();lim.setDate(lim.getDate()+Math.max(0,days-1));
  const limISO=lim.getFullYear()+'-'+String(lim.getMonth()+1).padStart(2,'0')+'-'+String(lim.getDate()).padStart(2,'0');
  return days>1&&limISO>e?limISO:e;
}
function workListFor(mode,days){
  const end=wlPrintEnd(days);
  return workLists().filter(l=>(mode==='saw'?l.saw:l.fit)>0&&!(mode==='saw'&&lsWaitCheck(l))) // never an unchecked list on the saw's paper either
    .filter(l=>!listDone(l.id)[mode]||relOpen(l,mode))
    .filter(l=>{const d=listDeadline(l);return d&&d<=end;})
    .sort((a,b)=>(listDueKey(a)||'9999').localeCompare(listDueKey(b)||'9999'));
}

/* ---------- Delivery performance: moved, partial runs, never left, on-time — live week + archive ---------- */
function liveWeekJobs(){
  return delAll().filter(o=>o.delDay||o.delVeh).map(o=>({wo:o.wo,t:o.title||'',c:o.customer||'',v:o.delVeh||'',d:o.delDay||'',
    lAt:o.delLoadedAt||'',dAt:o.delDispAt||'',vAt:o.delDelivAt||(o.delDone?'x':''),mv:o.delMoves||[],fd:o.delFirst||'',mw:o.missWhy||null}));
}
function weekPerf(jobs,pastIx){
  const planned=jobs.filter(j=>j.d);
  const due=planned.filter(j=>DEL_DAYS.indexOf(j.d)<pastIx);
  const wd=t=>{if(!t||t==='x')return'';return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(t).getDay()];};
  const onTime=due.filter(j=>j.vAt&&!(j.mv||[]).length&&(j.vAt==='x'||wd(j.vAt)===j.d));
  const moved=jobs.filter(j=>(j.mv||[]).length);
  const runs={};due.forEach(j=>{const k=j.v+'|'+j.d;(runs[k]=runs[k]||[]).push(j);});
  const partial=Object.keys(runs).filter(k=>{const r=runs[k];return r.some(j=>j.vAt)&&r.some(j=>(j.dAt||j.lAt)&&!j.vAt);})
    .map(k=>{const r=runs[k];const[v,d]=k.split('|');return{v,d,made:r.filter(j=>j.vAt),missed:r.filter(j=>!j.vAt)};});
  const never=due.filter(j=>!j.lAt&&!j.dAt&&!j.vAt);
  const reasons={};
  jobs.forEach(j=>{(j.mv||[]).forEach(m=>{if(m.why){const w=m.why.replace(/^Other:.*/,'Other');reasons[w]=(reasons[w]||0)+1;}});if(j.mw&&j.mw.why){const w=j.mw.why.replace(/^Other:.*/,'Other');reasons[w]=(reasons[w]||0)+1;}});
  const top=Object.entries(reasons).sort((a,b)=>b[1]-a[1]);
  return{planned:planned.length,due:due.length,onTime:onTime.length,pct:due.length?Math.round(100*onTime.length/due.length):null,moved,partial,never,top};
}
function todayDayIx(){return (i=>i<0?6:i)(DEL_DAYS.indexOf(wdName(new Date())));}
function scorecardHTML(n){
  const rows=[{lbl:'This week (so far)',p:weekPerf(liveWeekJobs(),todayDayIx()),live:true}];
  const ar=DB.delArchive||{};
  Object.keys(ar).sort().reverse().slice(0,n||8).forEach(k=>{
    const a=ar[k];const d=new Date(a.at);
    rows.push({lbl:'Wk '+wkNum(new Date(d.getTime()-3*86400000))+' · cleared '+d.toLocaleDateString('en-IE',{day:'numeric',month:'short'}),p:weekPerf(a.jobs.map(j=>({...j,mv:j.mv||[],mw:j.mw||null})),7)});
  });
  const pc=p=>p.pct===null?'<span style="color:var(--t3)">—</span>':`<b style="color:${p.pct>=90?'#0d6e46':p.pct>=75?'#8a5a00':'#b42318'}">${p.pct}%</b> <span style="color:var(--t3);font-size:11px">${p.onTime}/${p.due}</span>`;
  return `<table class="lst-tbl sc-tbl"><thead><tr><th>Week</th><th>Planned</th><th>On time</th><th>Moved</th><th>Partial runs</th><th>Never left</th><th>Main reasons</th></tr></thead><tbody>
    ${rows.map(r=>`<tr${r.live?' style="background:#f4f8ff"':''}><td style="font-weight:700">${escA(r.lbl)}</td><td>${r.p.planned}</td><td>${pc(r.p)}</td><td>${r.p.moved.length||'—'}</td><td>${r.p.partial.length||'—'}</td><td>${r.p.never.length?`<b style="color:#b42318">${r.p.never.length}</b>`:'—'}</td><td style="font-size:12px">${r.p.top.slice(0,3).map(([w,c])=>escA(w)+' ×'+c).join(' · ')||'<span style="color:var(--t3)">—</span>'}</td></tr>`).join('')}
  </tbody></table>
  <div style="font-size:11px;color:var(--t3);margin-top:6px">On time = delivered on the day it was planned, without being moved. Only days already gone are counted. Weeks are stored when the board is cleared (📚 Past weeks); moves and reasons are recorded from 15 Oct 2026.</div>`;
}
