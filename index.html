/* ---------- Driver phone view: check jobs onto the van, group ALL DELIVERED, photo proof ---------- */
// Cutting/fittings readiness for one WO, from its tagged lists: is the material cut, are the fittings out?
function woListStat(wo){ // per side: 'none' (not applicable) | 'unset' (no rows, not confirmed) | 'hold' | 'open' | 'done'
  const ls2=lists().filter(l=>(l.wos||[]).includes(wo));
  if(!ls2.length)return null;
  const r=woReady(wo);
  const when=m=>{let t='';ls2.forEach(l=>{const d=listDone(l.id)[m];if(d&&d.at>t)t=d.at;});return t;};
  const m=x=>x==='na'?'none':x;
  return{saw:m(r.saw),fit:m(r.fit),sawAt:when('saw'),fitAt:when('fit'),lvl:r.lvl,why:r.why};
}
function sideChipHTML(mode,st,at,big){
  const fs=big?' style="font-size:13px"':'';
  if(st==='none')return'';
  if(st==='done')return`<span class="ls-ok"${fs}>${mode==='saw'?'🪚 CUT ✓':'🧰 PICKED ✓'}${at?' '+hhmm(at):''}</span>`;
  if(st==='hold')return`<span class="ls-hold"${fs}>${mode==='saw'?'🪚 ⏸ WAITING ON MATERIAL':'🧰 ⏸ WAITING ON STOCK'}</span>`;
  if(st==='unset')return`<span class="ls-hold"${fs}>${mode==='saw'?'🪚 no saw rows — confirm "no cutting"':'🧰 no fittings listed — confirm "no fittings"'}</span>`;
  return`<span class="ls-no"${fs}>${mode==='saw'?'🪚 NOT CUT':'🧰 NOT PICKED'}</span>`;
}
function listStatHTML(wo){
  const s=woListStat(wo);
  if(!s)return`<div class="drv-ls"><span class="ls-none">📋 no cutting list linked</span></div>`;
  return`<div class="drv-ls">${sideChipHTML('saw',s.saw,s.sawAt)} ${sideChipHTML('fit',s.fit,s.fitAt)}</div>`;
}
/* Scheduling check: the moment a job is put on the delivery board, show where its cutting
   and fittings lists stand — and whether a list still needs to be issued at all. */
function showReadiness(wos,ctx,always){
  const items=wos.map(w=>{const o=DB.orders.find(x=>x.wo===w)||findDel(w);return o?{o,s:woListStat(w)}:null;}).filter(Boolean);
  if(!items.length)return;
  const attention=items.filter(i=>!i.s||i.s.lvl!=='green');
  if(!attention.length&&!always){toast('✓ Cutting & fittings all ready for '+(items.length===1?items[0].o.wo:items.length+' jobs'));return;}
  const chip=(ok,txtOk,txtNo)=>ok?`<span class="ls-ok" style="font-size:13px">${txtOk}</span>`:`<span class="ls-no" style="font-size:13px">${txtNo}</span>`;
  const rowH=i=>{
    const o=i.o,s=i.s;
    return `<div style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);flex-wrap:wrap">
      <b style="font-family:monospace;color:#14335c">${escA(o.wo)}</b>
      <span style="flex:1;min-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escA(o.title||'')}</span>
      ${!s?`<span class="ls-no" style="font-size:13px">📋 NO LIST ISSUED — upload/attach one in 📋 Cutting Lists</span>`
        :`<span class="rdy-pill rdy-${s.lvl}">${RDY_LBL[s.lvl]}</span>${sideChipHTML('saw',s.saw,s.sawAt,true)}${sideChipHTML('fit',s.fit,s.fitAt,true)}`}
    </div>`;
  };
  const ov=document.createElement('div');ov.className='pod-ovl';
  ov.innerHTML=`<div class="pod-in" style="min-width:min(620px,94vw)">
    <div style="font-weight:800;color:#14335c;font-size:16px;margin-bottom:2px">📋 Cutting &amp; fittings check — ${escA(ctx)}</div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:8px">Everything must be cut and picked <b>the day before delivery</b>. <b style="color:#0d6e46">Green</b> = ready · <b style="color:#8a5a00">amber</b> = part ready or waiting on material · <b style="color:#b42318">red</b> = nothing done or no list.</div>
    ${items.map(rowH).join('')}
    <div style="margin-top:12px;text-align:right"><button class="wl-btn" id="pod-x" style="padding:10px 22px;font-size:14px">OK — understood</button></div></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov||e.target.id==='pod-x')ov.remove();};
}
let drvUploading=false;
function podKey(veh,day){return veh+'|'+day+'|'+wkKey(new Date());}
function renderDriver(app){
  const name=ls.get('wpfDrvName'),veh=ls.get('wpfDrvVeh')||'',day=ls.get('wpfDrvDay')||floorDays()[0];
  const jobs=veh?delAll().filter(o=>o.delVeh===veh&&o.delDay===day).sort(woCmp):[];
  const onVan=jobs.filter(o=>dStage(o)!=='').length;
  const delivd=jobs.filter(o=>dStage(o)==='deliv').length;
  const allDeliv=jobs.length>0&&delivd===jobs.length;
  const pk=podKey(veh,day);const pod=(DB.pod||{})[pk];
  app.innerHTML=`<div class="drv">
    ${DB.saveFailed?`<div style="background:#c0392b;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:800;margin-bottom:10px">⚠ NOT SAVED YET — no signal. Keep this page open; it retries automatically and will sync when you're back in coverage.</div>`:''}
    <div class="drv-set">
      <div><label>Driver name</label>${(ds=>ds.length?`<select id="drv-name-sel">
          <option value="">— who's driving? —</option>
          ${ds.map(s=>`<option${s.n===name?' selected':''}>${escA(s.n)}</option>`).join('')}
          <option value="__other"${name&&!ds.some(s=>s.n===name)?' selected':''}>Other…</option>
        </select><input id="drv-name" value="${escA(name)}" placeholder="Your name" style="margin-top:6px;${name&&!ds.some(s=>s.n===name)?'':'display:none'}">`
        :`<input id="drv-name" value="${escA(name)}" placeholder="Your name">`)(staffFor('driver'))}</div>
      <div><label>Vehicle</label><select id="drv-veh"><option value="">— pick van —</option>${DEL_VEH.map(v=>`<option value="${v.k}"${v.k===veh?' selected':''}>${v.n}</option>`).join('')}</select></div>
      <div><label>Day</label><select id="drv-day">${DEL_DAYS.map(d=>`<option${d===day?' selected':''}>${d}</option>`).join('')}</select></div>
    </div>
    ${!veh?`<div class="flr-none">Pick your van above to see your run</div>`:
      !jobs.length?`<div class="flr-none">No jobs planned for ${escA(vehLbl(veh))} on ${day}</div>`:`
      <div class="drv-stat"><span><b>${escA(vehLbl(veh))} — ${day}</b> · ${jobs.length} job${jobs.length!==1?'s':''}</span><span>${onVan}/${jobs.length} on van · ${delivd} delivered</span></div>
      ${jobs.map(o=>{const st=dStage(o);return`<div class="drv-job${st==='deliv'?' done':st==='disp'?' disp':st?' on':''}">
        <div class="drv-ji"><b>${escA(o.wo)}</b>${(o.floor||o.unit)?`<span class="drv-fu">${escA([o.floor,o.unit].filter(Boolean).join(' · '))}</span>`:''}
          <div class="drv-jt">${escA(o.title)||'—'}</div><div class="drv-jc">${escA(o.customer||'')}${st==='deliv'?' · ✓ delivered '+dStageTime(o)+(o.delivBy?' by '+escA(o.delivBy):''):st==='disp'?' · dispatched '+dStageTime(o):''}</div>${st==='deliv'?'':listStatHTML(o.wo)}</div>
        ${st==='deliv'?`<div style="font-size:28px;color:#0b7e44;flex-shrink:0">✓</div>`:`<div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
          <button class="drv-tick${st?' on':''}" data-dl="${escA(o.wo)}">${st?'ON VAN ✓':'ON VAN'}</button>
          ${st?`<button class="drv-tick" style="background:#0b7e44;border-color:#0b7e44;color:#fff" data-ddv="${escA(o.wo)}" title="Mark just this drop delivered">DELIVERED ✓</button>`:''}
        </div>`}
      </div>`;}).join('')}
      ${allDeliv?`<div class="drv-done-banner">✓ All delivered${pod&&pod.at?' — '+hhmm(pod.at):''}${pod&&pod.by?' by '+escA(pod.by):''}</div>`:
        `<button class="drv-big drv-deliv" id="drv-alldeliv">✓ ALL DELIVERED — run complete</button>
         <div style="font-size:11px;color:var(--t3);text-align:center;margin-top:6px">Tap when every drop on this run is made — the date, time and your name go on every job.</div>`}
      <div class="drv-pod">
        <h3>📷 Proof of delivery photos</h3>
        <button class="pbtn" id="drv-photo"${drvUploading?' disabled':''}>${drvUploading?'Uploading…':'📷 Add photo'}</button>
        <input type="file" id="drv-file" accept="image/*" capture="environment" multiple style="display:none">
        <div class="pthumbs">${pod&&(pod.photos||[]).length?pod.photos.map(u=>`<a href="${escA(u)}" target="_blank"><img src="${escA(u)}" alt="proof"></a>`).join(''):''}</div>
      </div>`}
  </div>`;
  const nm=document.getElementById('drv-name');if(nm)nm.oninput=()=>ls.set('wpfDrvName',nm.value.trim()); // save as typed — a re-render must never lose the name
  const nsel=document.getElementById('drv-name-sel');
  if(nsel)nsel.onchange=()=>{
    if(nsel.value==='__other'){const el=document.getElementById('drv-name');el.style.display='';el.value='';ls.set('wpfDrvName','');el.focus();}
    else{ls.set('wpfDrvName',nsel.value);render();}
  };
  const drvName=()=>{
    const sel=document.getElementById('drv-name-sel');
    if(sel&&sel.value&&sel.value!=='__other')return sel.value.trim();
    const el=document.getElementById('drv-name');return((el&&el.value)||ls.get('wpfDrvName')||'').trim();
  };
  const vs=document.getElementById('drv-veh');if(vs)vs.onchange=()=>{ls.set('wpfDrvVeh',vs.value);render();};
  const ds=document.getElementById('drv-day');if(ds)ds.onchange=()=>{ls.set('wpfDrvDay',ds.value);render();};
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{
    const o=findDel(b.dataset.dl);if(!o)return;

    else return; // dispatched/delivered can't be un-ticked from the van
    sched();render();
  });
  // Per-drop delivery: a driver with one locked site can still record the drops he DID make

function shrinkImage(file){return new Promise((res,rej)=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{
    const mx=1400,sc=Math.min(1,mx/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('compress failed')),'image/jpeg',.72);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
  img.src=url;
});}
async function addPodPhotos(files,pk){
  if(!files||!files.length)return;
  drvUploading=true;render();
  try{
    DB.pod=DB.pod||{};DB.pod[pk]=DB.pod[pk]||{photos:[]};
    for(const f of files){
      const blob=await shrinkImage(f);
      const path=pk.replace(/[^A-Za-z0-9-]/g,'-')+'/'+Date.now()+'-'+Math.floor(Math.random()*1e4)+'.jpg';
      const r=await fetch(SUPA_STORE+'/object/pod/'+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
      if(!r.ok)throw new Error('HTTP '+r.status);
      DB.pod[pk].photos.push(SUPA_STORE+'/object/public/pod/'+path);
    }
    sched();toast('Photo saved ✓');
  }catch(e){
    toast('Photo upload failed ('+e.message+') — tell the office; the photo bucket may not be set up yet.');
  }
  drvUploading=false;render();
}

    }
    DB.orders.forEach(o=>{const wasDeliv=!!(o.delDelivAt||o.delDone);delete o.delv;delete o.delVeh;delete o.delDay;delete o.delLoadedAt;delete o.delDispAt;delete o.delDelivAt;delete o.ldBy;delete o.delivBy;delete o.delMoves;delete o.delFirst;delete o.missWhy;delete o.delPlacedBy;delete o.delPlacedAt;if(wasDeliv)o.delDone=true;else delete o.delDone;});
    DB.delx=[];DB.delNotes={};delSel.clear();
    sched();render();toast('Week archived to 📚 Past weeks — board cleared for next week');
  };
}

/* Overflow pagination: a page only ever holds WHOLE vehicle rows. If a category page
   overflows, whole vehicles (last first, e.g. Crafter) move to a continuation page —
   one vehicle's deliveries are never split across pages and no job is ever clipped.
   If a single vehicle alone still overflows its page, the cards step down in size instead. */
function paginate(){
  var list=[].slice.call(document.querySelectorAll('.sheet'));
  for(var si=0;si<list.length;si++){
    var sh=list[si],grid=sh.querySelector('.pgrid'),guard=0;
    while(grid.scrollHeight>grid.clientHeight+2&&guard++<60){
      var rows=sh.querySelectorAll('.vrow');
      if(rows.length<=1){
        var lvl=+(sh.getAttribute('data-c')||0);
        if(lvl>=3)break;
        lvl++;sh.setAttribute('data-c',lvl);sh.className='sheet c'+lvl;
        continue;
      }
      var next=list[si+1];
      var cont=(next&&next.getAttribute('data-cont')===sh.getAttribute('data-cat'))?next:null;
      if(!cont){
        cont=document.createElement('div');
        cont.className='sheet';
        cont.setAttribute('data-cat',sh.getAttribute('data-cat'));
        cont.setAttribute('data-cont',sh.getAttribute('data-cat'));
        var h=sh.querySelector('.ph').cloneNode(true);
        var h1=h.querySelector('.h1');h1.textContent=h1.textContent.replace(' (cont.)','')+' (cont.)';
        var g=document.createElement('div');g.className='pgrid';
        g.appendChild(sh.querySelector('.dhead').cloneNode(true));
        cont.appendChild(h);cont.appendChild(g);
        cont.appendChild(sh.querySelector('.pf').cloneNode(true));
        sh.parentNode.insertBefore(cont,sh.nextSibling);
        list.splice(si+1,0,cont);
      }
      var cg=cont.querySelector('.pgrid');
      cg.insertBefore(rows[rows.length-1],cg.children[1]||null);
      var nr=sh.querySelector('.nrow');
      if(nr)cg.appendChild(nr);
    }
  }
  var all=document.querySelectorAll('.sheet');
  for(var i=0;i<all.length;i++){var f=all[i].querySelector('.pfn');if(f)f.textContent='Sheet '+(i+1)+' of '+all.length;}
}
/* Load the poster font WITHOUT blocking: if Google Fonts is slow or the office is
   offline, we still paginate and print (system font fallback) after 3s. */
(function(){
  var done=false;
  function go(){if(done)return;done=true;paginate();setTimeout(function(){window.print();},250);}
  var l=document.createElement('link');l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap';
  l.onload=function(){
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){setTimeout(go,120);});
    else setTimeout(go,400);
  };
  l.onerror=function(){go();};
  document.head.appendChild(l);
  setTimeout(go,3000);
})();
<\/script></body></html>`;

}

    <td class="step">${E((o.step||'—').replace(/^\d+\.\s*/,''))}</td></tr>`;

function autoSchedule(newOrders){
  const weeks=get8Wks();
  const currentWeek=weeks[0];
  const wkLoad={};
  // Jobs due after the 8-week window stay unscheduled — they are planned when their week comes into view
  const endD=new Date(weeks[weeks.length-1]+'T00:00:00Z');endD.setUTCDate(endD.getUTCDate()+7);
  const windowEnd=wkKey(endD);
  DB.orders.forEach(o=>{if(o.plannedWeek)wkLoad[o.plannedWeek]=(wkLoad[o.plannedWeek]||0)+(+o.hours||0);});
  newOrders.forEach(o=>{if(o.plannedWeek)wkLoad[o.plannedWeek]=(wkLoad[o.plannedWeek]||0)+(+o.hours||0);});
  newOrders.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  newOrders.forEach(o=>{
    if(o.plannedWeek)return;
    let assigned=null;
    if(!o.dueDate){
      assigned=currentWeek;
    } else {
      const due=o.dueDate;
      if(due<currentWeek){
        // Overdue — put in current week
        assigned=currentWeek;
      } else if(due>=windowEnd){
        assigned=''; // beyond the 8 weeks — unscheduled
      } else {
        // Match to the exact week the due date falls in
        for(let i=0;i<weeks.length;i++){
          const wkStart=weeks[i];
          const wkEnd=i<weeks.length-1?weeks[i+1]:null;
          if(due>=wkStart&&(!wkEnd||due<wkEnd)){assigned=wkStart;break;}
        }
        if(!assigned)assigned=weeks[weeks.length-1];
      }
    }
    o.plannedWeek=assigned;
    if(assigned)wkLoad[assigned]=(wkLoad[assigned]||0)+(+o.hours||0);
  });
}

/* ---------- Stage 2 import parsers: one place that reads Cienapps cells ----------
   woKey: the matching key for a WO — text, trimmed, upper case (1234 = "1234", "wo-1" = "WO-1").
   parseNum: "€12,500.00" → 12500 · blank → null (not supplied) · unreadable → NaN.
   parseDateIE: Irish day/month/year → 'YYYY-MM-DD' (UTC, no time-zone shift) · blank → '' · unreadable or impossible → null.
   parseHours: "8h" → {h:8} · blank → null · ≤0 or >500 → {bad:true} (bad data; hours get estimated instead). */
// A totals / subtotal line: the WO cell has no digits ("Total", "Grand total") or starts with "Total".
function isTotalsWo(w){const s=String(w==null?'':w).trim();return !/\d/.test(s)||/^(sub\s*-?\s*)?total/i.test(s);}
function woKey(w){return String(w==null?'':w).trim().toUpperCase();}
function blankCell(v){return v==null||(typeof v==='string'&&!v.trim());}
function parseNum(v){
  if(blankCell(v))return null;
  if(typeof v==='number')return isFinite(v)?v:NaN;
  const s=String(v).replace(/[€$£\s ]/g,'').replace(/,/g,'').replace(/^eur/i,'');
  if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return NaN;
  return parseFloat(s);
}
const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function ymd(y,m,d){ // a real calendar date, or null (31/02 is rejected)
  y=+y;m=+m;d=+d;if(y<100)y+=2000;
  if(!(y>=1900&&y<=2200&&m>=1&&m<=12&&d>=1&&d<=31))return null;
  const t=new Date(Date.UTC(y,m-1,d));
  if(t.getUTCFullYear()!==y||t.getUTCMonth()!==m-1||t.getUTCDate()!==d)return null;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function parseDateIE(v){
  if(blankCell(v))return '';
  if(v instanceof Date)return isNaN(v)?null:ymd(v.getUTCFullYear(),v.getUTCMonth()+1,v.getUTCDate());
  if(typeof v==='number'){ // Excel serial date
    if(!(v>20000&&v<120000))return null;
    const d=new Date(Math.round((v-25569)*86400000));
    return ymd(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());
  }
  const s=String(v).trim().toLowerCase().replace(/(\d)(st|nd|rd|th)\b/g,'$1');
  let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[t\s].*)?$/)))return ymd(m[1],m[2],m[3]); // ISO
  if((m=s.match(/^(\d{1,2})[\/\-.\s]+(\d{1,2})[\/\-.\s]+(\d{2}|\d{4})$/)))return ymd(m[3],m[2],m[1]); // d/m/y — never m/d
  if((m=s.match(/^(\d{1,2})[\/\-.\s]+([a-z]{3,9})\.?[\/\-.,\s]+(\d{2}|\d{4})$/))){const mo=MONTHS[m[2].slice(0,4)]||MONTHS[m[2].slice(0,3)];return mo?ymd(m[3],mo,m[1]):null;} // 4 Oct 2026
  if((m=s.match(/^([a-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{2}|\d{4})$/))){const mo=MONTHS[m[1].slice(0,4)]||MONTHS[m[1].slice(0,3)];return mo?ymd(m[3],mo,m[2]):null;} // Oct 4, 2026
  if(/^\d+(\.\d+)?$/.test(s))return parseDateIE(parseFloat(s)); // serial stored as text
  return null;
}
/* normaliseRow: one raw import row → a tidy record. r.has[field] is set only for cells that were actually filled in,
   so a blank cell means "not supplied" and can never wipe what the planner already holds. Returns {skip} for
   rows with no WO number or totals lines. A future Cienapps API feed builds records in this same shape. */
function normaliseRow(row){
  const wo=String(row.wo==null?'':row.wo).trim();
  if(!wo||/^(nat|nan|undefined|null)$/i.test(wo))return{skip:'noWo'};
  if(isTotalsWo(wo))return{skip:'totals'};
  const r={wo,key:woKey(wo),has:{},flags:[]};
  const txt=k=>{const v=row[k];if(blankCell(v))return;r[k]=String(v).trim();r.has[k]=1;};
  ['title','customer','step','ref','orderNo','salesRep','floor','unit'].forEach(txt);
  // Floor & Unit — from their own columns, else out of the Reference (order-seq-floor-unit)
  if((!r.has.floor||!r.has.unit)&&r.ref&&r.ref.split('-').length>=4){
    const ps=r.ref.split('-');
    if(!r.has.floor&&ps[2].trim()){r.floor=ps[2].trim();r.has.floor=1;}
    if(!r.has.unit&&ps.slice(3).join('-').trim()){r.unit=ps.slice(3).join('-').trim();r.has.unit=1;}
  }
  const v=parseNum(row.value);
  if(v!==null){if(isNaN(v))r.flags.push('value "'+String(row.value).slice(0,20)+'" unreadable — value not changed');else{r.value=v;r.has.value=1;}}
  const sh=parseNum(row.sheets);
  if(sh!==null){if(isNaN(sh)||sh<0)r.flags.push('sheets "'+String(row.sheets).slice(0,20)+'" unreadable');else{r.sheets=sh;r.has.sheets=1;}}
  const h=parseHours(row.hours);
  if(h){if(h.bad){r.hoursBad=true;r.flags.push('hours "'+h.raw.slice(0,20)+'" ignored (bad data) — estimated instead');}else{r.hours=h.h;r.has.hours=1;}}
  const d=parseDateIE(row.dueDate);
  if(d===null){r.dueBad=true;r.flags.push('due date "'+String(row.dueDate).slice(0,20)+'" unreadable — existing date kept');}
  else if(d){r.dueDate=d;r.has.dueDate=1;}
  return r;
}
// "+A" / "+A+C" badge for a WO with A/C lines folded into it (letters from o.adds)
function addBadge(o){const ks=Object.keys((o&&o.adds)||{});if(!ks.length)return'';const ls=ks.map(k=>(acBase(k)||{}).letter||'?');return`<span class="fu-badge" style="background:#f6f2fd;border-color:#c9b6f0;color:#5b3fa8;margin-left:4px" title="Additions folded in: ${escA(ks.join(', '))}">+${escA(ls.join('+'))}</span>`;}
// A/C suffix: one letter straight after the number, with or without a dash (2557_01A, WO-2604-7-C) → base WO key, or null
function acBase(key){const m=String(key).match(/^(.*\d)-?([A-Z])$/);return m?{base:m[1],letter:m[2]}:null;}
/* combineRows: same WO twice in the file → one record (filled cells win, earliest due date, flagged).
   A/C lines fold into their base WO (base in the file, or on the board via `board`, a Map woKey → order):
   their value/hours go into base.adds and the line is listed as an Addition. A line whose base can't be found,
   or that is already on the board as its own job, stays as its own job. */
function combineRows(recs,board){
  board=board||new Map();
  const by=new Map(),out=[];
  recs.forEach(r=>{
    const e=by.get(r.key);
    if(!e){by.set(r.key,r);out.push(r);return;}
    Object.keys(r.has).forEach(k=>{
      if(k==='dueDate'){if(!e.has.dueDate||r.dueDate<e.dueDate){e.dueDate=r.dueDate;e.has.dueDate=1;}return;}
      if(!e.has[k]){e[k]=r[k];e.has[k]=1;}
    });
    r.flags.forEach(f=>{if(!e.flags.includes(f))e.flags.push(f);});

    const ac=acBase(r.key);
    if(!ac||board.has(r.key)){keep.push(r);return;}
    let base=by.get(ac.base); // a base key always ends in a digit, so it is never itself an A/C line
    if(!base&&!board.has(ac.base)){r.flags.push('base '+ac.base+' not found — kept as its own job');keep.push(r);return;}
    if(!base){ // base only on the board: a record that carries just the addition
      base=synth.get(ac.base);
      if(!base){const o=board.get(ac.base);base={wo:o.wo,key:ac.base,has:{},flags:[],synth:true};synth.set(ac.base,base);keep.push(base);}
    }
    base.adds=base.adds||{};
    base.adds[r.key]={value:r.has.value?r.value:0,...(r.has.hours?{hours:r.hours}:{}),title:r.title||''};
    folds.push({wo:r.wo,base:base.wo,letter:ac.letter,value:r.has.value?r.value:0,hours:r.has.hours?r.hours:null,title:r.title||'',step:r.step||''});
  });

}
function parseHours(v){
  if(blankCell(v))return null;
  const n=typeof v==='number'?v:parseNum(String(v).replace(/\s*(h|hr|hrs|hours?)\s*$/i,''));
  if(n===null)return null;
  if(!isFinite(n)||n<=0||n>500)return{bad:true,raw:String(v)};
  return{h:Math.round(n*100)/100};
}

// Find a real header row anywhere in the sheet (Cienapps title blocks can push it past row 12). Returns row index or -1.
function findHeaderRow(aoa){
  for(let r=0;r<aoa.length;r++){
    const cells=(aoa[r]||[]).map(nrmH);
    let hits=0,hasWo=false;
    IMP_FIELDS.forEach(f=>{
      if(cells.some(c=>c&&f.al.indexOf(c)>-1)){hits++;if(f.k==='wo')hasWo=true;}
    });
    if(hasWo&&hits>=3)return r;
  }
  return -1;
}
function mapFromHeader(hdrCells){
  const m={};
  IMP_FIELDS.forEach(f=>{
    m[f.k]=-1;
    for(let p=0;p<f.al.length&&m[f.k]<0;p++){
      const idx=hdrCells.findIndex(c=>nrmH(c)===f.al[p]);
      if(idx>-1&&Object.keys(m).every(k=>k===f.k||m[k]!==idx))m[f.k]=idx;
    }
  });
  // Sheets: any other header containing "sheet" or "board" (Cienapps wording varies)
  if(m.sheets<0){const idx=hdrCells.findIndex((c,i)=>/sheet|board/.test(nrmH(c))&&Object.keys(m).every(k=>m[k]!==i));if(idx>-1)m.sheets=idx;}
  return m;
}

// No header row — infer each column from its contents.
function guessCols(rows){
  const n=rows.reduce((a,r)=>Math.max(a,r.length),0);
  const col=i=>rows.map(r=>r[i]).filter(v=>v!==''&&v!=null);
  const used={};
  const take=i=>{if(i>-1)used[i]=1;return i;};
  const free=i=>!used[i];
  const m={};
  const byTest=t=>{let best=-1,bs=0.5;for(let i=0;i<n;i++){if(!free(i))continue;const v=col(i);if(v.length<3)continue;const s=v.filter(t).length/v.length;if(s>bs){bs=s;best=i;}}return best;};
  m.wo=take(byTest(v=>/^wo[-\s_]/i.test(String(v))));
  m.step=take(byTest(v=>/^\s*\d+\s*\./.test(String(v))));
  // Due date: date-like column, well filled, latest-skewed (creation dates sit in the past).
  const isDt=v=>(v instanceof Date)||(typeof v==='number'&&v>35000&&v<80000);
  const ser=v=>v instanceof Date?(v.getTime()/86400000)+25569:v;
  let bd=-1,bmed=-1;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i);
    if(!v.length||v.filter(isDt).length/v.length<0.9)continue;
    if(v.length/rows.length<0.8)continue;
    const s=v.map(ser).sort((a,b)=>a-b);
    const med=s[Math.floor(s.length/2)];
    if(med>bmed){bmed=med;bd=i;}
  }
  m.dueDate=take(bd);
  // Order #: numeric column whose value appears inside the WO number (WO-2604-7 -> 2604).
  if(m.wo>-1){
    let bo=-1,bs=0.6;
    for(let i=0;i<n;i++){
      if(!free(i))continue;
      const v=rows.map(r=>[r[m.wo],r[i]]).filter(p=>p[0]!=null&&p[1]!=null&&p[1]!=='');
      if(v.length<3)continue;
      const s=v.filter(p=>String(p[0]).indexOf(String(p[1]))>-1).length/v.length;
      if(s>bs){bs=s;bo=i;}
    }
    m.orderNo=take(bo);
    // Reference: text column that also embeds the order number but is near-unique.
    let br=-1,bsr=0.6;
    for(let i=0;i<n;i++){
      if(!free(i))continue;
      const v=col(i);
      if(v.length<3||new Set(v.map(String)).size/v.length<0.9)continue;
      const pr=rows.map(r=>[r[m.orderNo],r[i]]).filter(p=>p[0]!=null&&p[1]!=null&&p[1]!=='');
      if(!pr.length)continue;
      const s=pr.filter(p=>String(p[1]).indexOf(String(p[0]))===0).length/pr.length;
      if(s>bsr){bsr=s;br=i;}
    }
    m.ref=take(br);
  } else {m.orderNo=-1;m.ref=-1;}
  // Floor & Unit: the Reference encodes them as segments 3 and 4 (e.g. 2604-7-0-22 = order-seq-floor-unit),
  // so find the columns whose values match those segments.
  m.floor=-1;m.unit=-1;
  if(m.ref>-1){
    const segs=rows.map(r=>String(r[m.ref]==null?'':r[m.ref]).split('-'));
    const s3=segs.map(s=>s.length>=4?String(s[2]):null);
    const s4=segs.map(s=>s.length>=4?s.slice(3).join('-'):null);
    const matchCol=target=>{
      let best=-1,bs=0.6;
      for(let i=0;i<n;i++){
        if(!free(i))continue;
        const pairs=rows.map((r,j)=>[target[j],r[i]]).filter(p=>p[0]!=null&&p[1]!=null&&p[1]!=='');
        if(pairs.length<3)continue;
        const s=pairs.filter(p=>String(p[1]).toUpperCase().trim()===String(p[0]).toUpperCase().trim()).length/pairs.length;
        if(s>bs){bs=s;best=i;}
      }
      return best;
    };
    m.floor=take(matchCol(s3));
    m.unit=take(matchCol(s4));
  }
  // Value: numeric, many distinct, decent magnitude — prefer the one with decimals.
  let bv=-1,bvs=-1;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i).filter(x=>typeof x==='number'||(typeof x==='string'&&x!==''&&!isNaN(Number(x)))).map(Number);
    if(v.length/Math.max(1,col(i).length)<0.9||v.length<3)continue;
    const d=new Set(v).size;
    if(d<10)continue;
    const s=d+(v.some(x=>x%1!==0)?1000:0);
    if(s>bvs){bvs=s;bv=i;}
  }
  m.value=take(bv);
  // Customer: text column with the longest average value (company names).
  let bc=-1,bl=6;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i).map(String);
    if(v.length<3||v.some(x=>x instanceof Date))continue;
    if(v.filter(x=>isNaN(Number(x))).length/v.length<0.9)continue;
    const d=new Set(v).size;
    if(d<3||d/v.length>0.9)continue;
    const avg=v.reduce((a,x)=>a+x.length,0)/v.length;
    if(avg>bl){bl=avg;bc=i;}
  }
  m.customer=take(bc);
  // Title: remaining text column with the most distinct values.
  let bt=-1,bts=2;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i).map(String);
    if(v.length<3)continue;
    if(v.filter(x=>isNaN(Number(x))).length/v.length<0.8)continue;
    const d=new Set(v).size;
    if(d>bts){bts=d;bt=i;}
  }
  m.title=take(bt);
  // Sales rep: remaining text column, few distinct, names with a space.
  let bp=-1;
  for(let i=0;i<n&&bp<0;i++){
    if(!free(i))continue;
    const v=col(i).map(String);
    if(v.length<3)continue;
    const d=new Set(v).size;
    if(d>=3&&d<=20&&v.filter(x=>/^[A-Za-z .'\-]+$/.test(x)&&x.indexOf(' ')>-1).length/v.length>0.8)bp=i;
  }
  m.salesRep=take(bp);
  if(m.hours===undefined)m.hours=-1;
  IMP_FIELDS.forEach(f=>{if(m[f.k]===undefined)m[f.k]=-1;});
  return m;
}

function objsFrom(rows,map){
  return rows.map(r=>{
    const o={};
    IMP_FIELDS.forEach(f=>{o[f.k]=map[f.k]>-1?r[map[f.k]]:undefined;});
    return o;
  });
}
function importError(msg,detail){
  const el=document.getElementById('iprev');
  if(el)el.innerHTML=`<div style="margin-top:14px;background:#fef2f2;border:1px solid #fca5a5;border-radius:6px;padding:12px 14px">
    <div style="font-size:13px;font-weight:600;color:#b91c1c;margin-bottom:4px">⚠ Import failed — nothing was changed</div>
    <div style="font-size:12px;color:#7f1d1d;line-height:1.5">${msg}</div>
    ${detail?`<div style="font-size:11px;color:#7f1d1d;margin-top:8px;font-family:monospace;opacity:.8">${detail}</div>`:''}
  </div>`;

function doImport(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    if(typeof XLSX==='undefined'){importError('The Excel reader library did not load, so no file can be opened. Check your internet connection and reload this page.');return;}
    let wb;
    try{wb=XLSX.read(e.target.result,{type:'binary'});}
    catch(ex){importError('That file could not be read as an Excel workbook. Export again from Cienapps as .xlsx and retry.',String(ex.message||ex));return;}
    const sh=wb.Sheets[wb.SheetNames[0]];
    if(!sh){importError('That workbook contains no sheets.');return;}
    const aoa=XLSX.utils.sheet_to_json(sh,{header:1,blankrows:false}).filter(r=>r&&r.some(c=>c!==''&&c!=null));
    if(aoa.length<2){importError('That sheet has no data rows.');return;}
    const h=findHeaderRow(aoa);
    if(h>-1){
      const map=mapFromHeader(aoa[h]);
      const missing=IMP_FIELDS.filter(f=>f.req&&map[f.k]<0);
      if(missing.length){PEND={rows:aoa.slice(h+1),map:map};renderMapping('Header row found, but no column for: '+missing.map(f=>f.label).join(', ')+'. Confirm the mapping below.');return;}
      runImport(objsFrom(aoa.slice(h+1),map));
    } else {
      const rows=aoa;
      PEND={rows:rows,map:guessCols(rows)};
      renderMapping('This export has no header row, so the columns were matched by their contents. Check the mapping below, then import.');
    }
  };
  reader.readAsBinaryString(file);
}

function renderMapping(note){
  const rows=PEND.rows,map=PEND.map;
  const n=rows.reduce((a,r)=>Math.max(a,r.length),0);
  const isDt=x=>(x instanceof Date)||(typeof x==='number'&&x>35000&&x<80000);
  const sample=i=>{
    const v=rows.map(r=>r[i]).filter(x=>x!==''&&x!=null);
    if(!v.length)return '(empty)';
    // Show date columns as readable dates, not raw Excel serial numbers
    if(v.filter(isDt).length/v.length>=0.9){
      const d=v[0] instanceof Date?v[0]:new Date(Math.round((v[0]-25569)*86400*1000));
      return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
    }
    return String(v[0]).substring(0,24);
  };
  const opts=sel=>{let s=`<option value="-1"${sel<0?' selected':''}>— not used —</option>`;for(let i=0;i<n;i++)s+=`<option value="${i}"${sel===i?' selected':''}>Col ${colLtr(i)} · ${escA(sample(i))}</option>`;return s;};
  document.getElementById('iprev').innerHTML=`<div style="margin-top:14px">
    <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:10px 13px;font-size:12px;color:#92400e;margin-bottom:12px;line-height:1.5">${note}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px">
      ${IMP_FIELDS.map(f=>`<div>
        <label style="display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:3px">${f.label}${f.req?' <span style="color:#dc2626">*</span>':''}</label>
        <select data-mf="${f.k}" style="width:100%;padding:5px 6px;font-size:12px;border:1px solid var(--b2);border-radius:4px;background:#fff">${opts(map[f.k])}</select>
      </div>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--t3);margin:10px 0 12px">${rows.length} data rows detected. Fields marked * are required.</div>
    <button class="btn btn-g" id="mapgo">Import ${rows.length} rows →</button>
    <button class="btn" id="mapcancel" style="margin-left:8px">Cancel</button>
  </div>`;
  document.getElementById('mapcancel').onclick=()=>{PEND=null;document.getElementById('iprev').innerHTML='';};
  document.getElementById('mapgo').onclick=()=>{
    const m={};
    document.querySelectorAll('[data-mf]').forEach(s=>{m[s.getAttribute('data-mf')]=parseInt(s.value,10);});
    const missing=IMP_FIELDS.filter(f=>f.req&&m[f.k]<0);
    if(missing.length){toast('Choose a column for: '+missing.map(f=>f.label).join(', '));return;}
    runImport(objsFrom(PEND.rows,m));
    PEND=null;
  };
}

/* Two-phase import: ANALYZE builds a plan without touching the board; the office reviews
   exactly what will happen (new / updated / removed / warnings) and then APPLIES or cancels.
   Nothing changes — and nothing is saved — until Apply is clicked. */
let IMPPLAN=null;
function runImport(rows){
    const plan=analyzeImport(prepImport(rows),'file');
    if(!plan)return;
    IMPPLAN=plan;
    renderImportPreview(plan);
}
/* ---------- Stage 2 import pipeline ----------
   file → rows (doImport) → normaliseRow → combineRows → analyzeImport (plan, board untouched) → preview → applyImport.
   A Cienapps API feed later hands its records to prepImport/combineRows and the rest is the same. */
const isSnagWo=k=>woKey(k).indexOf('WO-S')===0; // snag WOs belong to the planner — imports never add, change or remove them
function boardMap(){const m=new Map();DB.orders.forEach(o=>{const k=woKey(o.wo);if(k&&!m.has(k))m.set(k,o);});return m;}
function prepImport(rows,board){
  const skip={noWo:0,totals:0,snag:0},recs=[];
  (rows||[]).forEach(row=>{
    const r=normaliseRow(row||{});
    if(r.skip){skip[r.skip]++;return;}
    if(isSnagWo(r.key)){skip.snag++;return;}
    recs.push(r);
  });
  const c=combineRows(recs,board||boardMap());
  return{recs:c.recs,folds:c.folds,skip,rows:(rows||[]).length,raw:rows||[]};
}
// Hours source: 'hand' (set in the planner — imports never touch it), 'cien' (Cienapps Hours column), 'est' (estimated / rule).
// Jobs saved before Stage 2 have no hoursSrc: hoursEstimated:false counts as hand-set.
function hSrc(o){return o.hoursSrc||(o.hoursEstimated?'est':'hand');}
// Hours rules: assembly complete / palleted = 0h · WO-BI / WO-PF = 1h · Cienapps Hours column · no value = 1h · else estimate from value
function importHours(key,step,value,r){
  if(/assembly\s*complete/i.test(step)||/pallet/i.test(step))return{hours:0,hoursSrc:'est',hoursEstimated:false};
  if(key.indexOf('WO-BI-')===0||key.indexOf('WO-PF-')===0)return{hours:1,hoursSrc:'est',hoursEstimated:false};
  if(r&&r.has.hours)return{hours:r.hours,hoursSrc:'cien',hoursEstimated:false};
  if(!(+value>0))return{hours:1,hoursSrc:'est',hoursEstimated:false};
  return{hours:estimateHours(value),hoursSrc:'est',hoursEstimated:true};
}
/* Cienapps status ladder (exact list from Garry, 22 Oct 2026 — docs/ROADMAP.md):
   1.DRAWING · 2.NO SITE MEASURE DONE · 3. READY FOR UPLOAD · 4. READY FOR PRODUCTION · 5. WORK ORDER PROCESSED ·
   6. JOB CUT COMPLETE · 7. ASSEMBLY COMPLETE · 8. PALLETED · 9. JOB SHIPPED · 10. INSTALLED TO BE INVOICE ·
   11. COMPLETED AND INVOICED · 12. ON HOLD / DELETE
   Steps rank by the leading number (missing space after the dot, case and trailing spaces don't matter).
   Unnumbered wording falls back to the named ladder below, and is never read as shipped or on hold.
   stepCmp → >0 a is ahead, <0 behind, 0 same rank, null = can't tell. */
function stepNo(s){const m=String(s||'').match(/^\s*(\d{1,2})\s*(?:[.)\-:]|(?=\s)|$)/);return m?+m[1]:null;}
const stepNum=stepNo;
/* stepIsShipped — THE one rule for "Cienapps says this job has left the factory": step 9 JOB SHIPPED,
   10 INSTALLED TO BE INVOICE or 11 COMPLETED AND INVOICED (by number). Wording that mentions shipped/invoiced
   without one of those numbers ("Part shipped", "Ready to be shipped", "8. Job shipped") is flagged and goes
   to Differs — never off the board. Change only this function if the Cienapps list changes. */
function stepIsShipped(s){const n=stepNo(s);return n===9||n===10||n===11;}

function stepInstalled(s){const n=stepNo(s);return n===10||n===11;}

function stepForDelivery(s){const n=stepNo(s);return n===7||n===8||(n===null&&/^(assembly\s*complete|palleted)$/i.test(stepWords(s)));}
function stepShipWord(s){return !stepIsShipped(s)&&/ship|invoic|install/i.test(String(s||''));} // mentions it, but isn't a shipped step

  const t=stepWords(s).toLowerCase();
  if(/ship|invoic|install|hold|delete/.test(t))return null; // unnumbered shipped / on-hold wording — can't rank it
  if(/drawing/.test(t))return 1; // before "production": "Pre-production drawing" is drawing
  if(/site\s*measure/.test(t))return 2;if(/ready\s*for\s*upload/.test(t))return 3;if(/ready\s*for\s*production/.test(t))return 4;
  if(/production\s*complete/.test(t))return 8.5;
  if(/pallet/.test(t))return 8;if(/assembly\s*complete/.test(t))return 7;if(/assembl/.test(t))return 6.5;
  if(/cut/.test(t))return 6;if(/work\s*order\s*processed|production/.test(t))return 5;

function stepRank(s){const n=stepNo(s);return n!==null?n:stepLadder(s);}

  return ra-rb;

const addsSum=(a,k)=>Object.keys(a||{}).reduce((s,x)=>s+(+(a[x]||{})[k]||0),0);
/* analyzeImport: builds the plan WITHOUT touching the board. `input` is prepImport's output (or raw rows).
   Ownership: Cienapps sets value, customer, title, floor/unit and sheet count; the planner keeps planned week,
   ticks, holds and hand-set hours. Steps only ever move forward. No import removes a job. */
function analyzeImport(input,source){

    const newOrders=[],updates=[],fills=[],synced=[],autoTag=[],shipped=[],inTransit=[],dispGaps=[],flagged=[],stepDiffs=[],exCounts={},marks=[],unsched=[];
    let unchanged=0,excluded=0;
    const sh=s=>String(s||'—').replace(/^\d+\.\s*/,'');
    recs.forEach(r=>{
      const ex=board.get(r.key);
      const cs=r.has.step?r.step:'';
      const isShipC=stepIsShipped(cs),isHoldC=stepOnHold(cs),isDrawC=/drawing/i.test(cs),isWOD=r.key.indexOf('WO-D')>-1;
      const flags=r.flags.slice();
      if(stepShipWord(cs))flags.push('check: Cienapps step "'+cs+'" is not a shipped step (9, 10 or 11) — kept on the board');
      if(isHoldC)flags.push('on hold in Cienapps (12) — goes to the On hold section of the Shipped tab, off the board, until the step changes');
      // value: base line + its A/C additions (additions seen before are kept, so the value never drops)
      let value=r.has.value?r.value:undefined,adds=null;
      if(r.adds){

        else if(ex)value=(+ex.value||0)-prev+addsSum(adds,'value');
        else value=addsSum(adds,'value');
      }else if(ex&&ex.adds&&r.has.value)value=r.value+addsSum(ex.adds,'value');
      if(!ex){
        if(r.synth)return;
        const why=isWOD?'WO-D':isDrawC?'drawing':isShipC?(stepInvoiced(cs)?'invoiced':'shipped')+' (not on the board)':'';
        if(why){excluded++;exCounts[why]=(exCounts[why]||0)+1;return;}
        const val=value===undefined?0:value;
        let hr=importHours(r.key,cs,val,r);
        if(r.adds&&r.has.hours)hr={...hr,hours:Math.round((r.hours+addsSum(r.adds,'hours'))*100)/100};
        const o={wo:r.wo,ref:r.ref||'',floor:r.floor||'',unit:r.unit||'',title:r.title||r.ref||r.wo,customer:r.customer||'',
          hours:hr.hours,hoursEstimated:hr.hoursEstimated,hoursSrc:hr.hoursSrc,dueDate:r.dueDate||'',origDueDate:r.dueDate||'',step:cs,
          salesRep:r.salesRep||'',orderNo:r.orderNo||'',value:val,plannedWeek:'',notes:'',colour:''};
        if(cs)o.cienStep=cs;

        if(stepForDelivery(cs)){o.delv=true;autoTag.push(o.wo);} // 7 ASSEMBLY COMPLETE / 8 PALLETED → on the delivery board (no van/day)
        if(r.has.sheets)o.sheetsCien=r.sheets;
        if(adds)o.adds=adds;

        if(flags.length)flagged.push({wo:r.wo,title:o.title,why:flags.join(' · '),isNew:true});

      }
      // ---- existing job
      const set={},fill={},what=[];
      const ch=(k,v,label)=>{if(v===undefined)return;if(String(ex[k]==null?'':ex[k])!==String(v)){set[k]=v;if(label)what.push(label+': '+(ex[k]===undefined||ex[k]===''?'(none)':ex[k])+' → '+(v===''?'(none)':v));}};
      if(!r.synth){
        ch('title',r.has.title?r.title:undefined,'title');
        ch('customer',r.has.customer?r.customer:undefined,'customer');

        ch('unit',r.has.unit?r.unit:undefined,'unit');

// Apply's fresh load: wait for a save in flight, then reload. False = the database copy could not be fetched.
async function freshForImport(){

  if(SAVING)return false;

}
function reanalyzeImport(p){

// Every change a plan would make, as key → plain-English label (what's compared between preview and Apply)
function planActs(p){
  const m=new Map(),v=x=>x===undefined||x===''?'(none)':String(x);
  (p.newOrders||[]).forEach(o=>m.set('new|'+woKey(o.wo)+'|'+JSON.stringify([o.value,o.hours,o.dueDate,o.step,!!o.delv,o.plannedWeek||'']),o.wo+': new job'));
  (p.updates||[]).forEach(u=>Object.keys(u.set||{}).forEach(k=>{if(k==='hoursSrc'||k==='hoursEstimated')return;m.set('upd|'+u.key+'|'+k+'|'+JSON.stringify(u.set[k]),u.wo+': '+k+' → '+v(u.set[k]));}));
  (p.shipped||[]).forEach(s=>m.set('ship|'+s.key+'|'+s.cs,s.wo+': to Shipped ('+s.cs+')'));

function planDiff(a,b){
  const A=planActs(a),B=planActs(b),added=[],dropped=[];
  B.forEach((l,k)=>{if(!A.has(k))added.push(l);});
  A.forEach((l,k)=>{if(!B.has(k))dropped.push(l);});
  return{added,dropped};
}

    if(plan.moves)Object.keys(plan.moves).forEach(wo=>{const ex=board.get(woKey(wo));if(ex)ex.plannedWeek=plan.moves[wo];});

      if(m.done&&!ex.completeAt){ex.completeAt=at;ex.completeBy='Cienapps';logEdit(ex,'Installation complete — Cienapps: '+m.cs,'(import)');}});
    // new orders — skip any that another screen added meanwhile, then schedule to their due-date week
    const fresh=(plan.newOrders||[]).filter(o=>!board.has(woKey(o.wo)));
    const noAuto=new Set(plan.unsched||[]); // on hold / unreadable due date: left unscheduled
    autoSchedule(fresh.filter(o=>!noAuto.has(woKey(o.wo)))); // (autoSchedule sorts its list; the jobs keep the file's order on the board data)
    fresh.forEach(o=>{
      if(o.cienHold)o.holdAt=at;
      DB.orders.push(o);board.set(woKey(o.wo),o);
      orig[o.wo]=o.plannedWeek||'';origStep[o.wo]=o.step||''; // baseline AFTER auto-schedule so auto-assignments don't show as changes
    });
    cleanGroups();
    sched();
    const c=plan.counts||{},el=document.getElementById('iprev');
    if(el)el.innerHTML=`<div style="margin-top:14px">
      <div style="font-size:13px;font-weight:600;color:var(--green);margin-bottom:10px">✓ Import applied: ${fresh.length} added · ${(plan.updates||[]).length} updated · ${c.skipped||0} unchanged · ${nShip} moved to 📦 Shipped · nothing removed</div>

      <button class="btn btn-g" onclick="showTab('b')">Go to Capacity Board →</button>
      ${nShip?`<button class="btn btn-s" style="margin-left:8px" onclick="showTab('h')">Open Shipped →</button>`:''}
    </div>`;
    toast(`Import applied — ${fresh.length} added, ${(plan.updates||[]).length} updated${nShip?', '+nShip+' to Shipped':''}`);
}

  const reMoves=changing.filter(o=>o.delDay);
  const apply=(by,why)=>{
    const at=nowISO(),to=day?veh+'|'+day:'';
    changing.map(o=>findDel(o.wo)).filter(Boolean).forEach(o=>{
      if(o.delDay){
        (o.delMoves=o.delMoves||[]).push({at,by,why,from:o.delVeh+'|'+o.delDay,to});
        logEdit(o,'Delivery moved '+slotLbl(o.delVeh,o.delDay)+' → '+slotLbl(veh,day),by,why);

    else toast(changing.length+' job'+(changing.length!==1?'s':'')+' returned to the pool');
  };
  officeWho(by=>{

    pickReason('Why is '+(reMoves.length===1?reMoves[0].wo:reMoves.length+' jobs')+' moving?',

/* ---------- Readiness: one colour per job, from its cutting/fittings lists ---------- */
function rowKey(r){return[r.k,String(r.item||'').trim(),r.L,r.W,String(r.mat||'').trim(),String(r.note||'').trim()].join('|').toLowerCase();}
function holdsOf(id){return (DB.listHold||{})[id]||{};}
/* Per-row tick-off at the bench: each item is ticked as it's cut/picked and struck through; the house signs off when the last row goes. */
function rowTicks(id){return (DB.listRow||{})[id]||{};}
function rowTicked(id,k){const t=rowTicks(id)[k];return !!t;}
function setRowTick(l,k,mode,by,on){
  DB.listRow=DB.listRow||{};const t=DB.listRow[l.id]=DB.listRow[l.id]||{};
  const had=!!t[k];
  if(on)t[k]={m:mode,at:nowISO(),by:by||''};else delete t[k];
  if(!Object.keys(t).length)delete DB.listRow[l.id];
  // got out = no longer waiting; a hold left under a tick (two screens) is superseded — unticking must not bring it back
  if(on||had){if(dropHold(l,k))holdLog(on?(mode==='saw'?'cut':'picked'):'na-cleared',l,1,mode,by);}
}
// Removes one line's hold. The per-list map is never deleted, even when empty — the two-screen merge then works line by
// line (a removed line stays removed); a deleted map would be "removed here, changed there" and the stale copy would win.
function dropHold(l,k){const h=holdsOf(l.id);if(!(h[k]&&h[k].st==='hold'))return false;delete h[k];return true;}
/* A row is waiting only while it is held AND not ticked. Two screens can leave a row both ticked (got out) and
   held (N/A) after a merge — got-out wins, so that row counts as done. Applied when reading; saved data untouched. */
function heldRow(l,k){const h=holdsOf(l.id)[k];return !!(h&&h.st==='hold'&&!rowTicked(l.id,k));}
function clearRowTicks(l,mode,by){const t=rowTicks(l.id);let n=0;Object.keys(t).forEach(k=>{if(t[k].m===mode){delete t[k];if(dropHold(l,k))n++;}});if(DB.listRow&&DB.listRow[l.id]&&!Object.keys(t).length)delete DB.listRow[l.id];
  if(n)holdLog('na-cleared',l,n,mode,by); // N/A left under a tick by another screen — superseded, not brought back
}
function tickableRows(l,mode){ // rows the bench can tick right now: not held; only released rows when the rest was already signed off
  const h=holdsOf(l.id),relOnly=!!listDone(l.id)[mode]&&listHoldRows(l,mode,'rel').length>0;
  return listRows(l).filter(r=>r.k===mode).filter(r=>{const x=h[rowKey(r)];if(heldRow(l,rowKey(r)))return false;return !relOnly||(x&&x.st==='rel');});
}
function listHoldRows(l,mode,st){return Object.entries(holdsOf(l.id)).filter(([k,v])=>v.m===mode&&(!st||v.st===st)&&!(v.st==='hold'&&rowTicked(l.id,k))).map(([k,v])=>({k,...v}));}
function sideState(l,mode){ // 'na' | 'unset' | 'hold' | 'open' | 'done'
  const n=mode==='saw'?(l.saw||0):(l.fit||0);
  if(!n)return (mode==='saw'?l.noCut:l.noFit)?'na':'unset';
  if(listHoldRows(l,mode,'hold').length)return'hold';
  if(listDone(l.id)[mode]&&!listHoldRows(l,mode,'rel').length)return'done';
  return'open';
}
const SIDE_WHY={saw:{open:'Not cut yet',hold:'Saw waiting on material',unset:'No saw rows — tick "no cutting" if none are needed'},
                fit:{open:'Fittings not picked',hold:'Fittings waiting on stock',unset:'No fittings listed — tick "no fittings" if none are needed'}};
function woReady(wo){
  const ls2=lists().filter(l=>(l.wos||[]).includes(wo));
  if(!ls2.length)return{lvl:'red',why:['No cutting list issued'],saw:'nolist',fit:'nolist'};
  const agg=mode=>{
    const st=ls2.map(l=>sideState(l,mode));
    const real=st.filter(s=>s==='done'||s==='open'||s==='hold');
    if(real.length)return real.includes('hold')?'hold':real.includes('open')?'open':'done';
    return st.includes('na')?'na':'unset';
  };
  const s={saw:agg('saw'),fit:agg('fit')};
  const app=['saw','fit'].filter(m=>s[m]!=='na');
  let lvl='green';
  if(app.length&&!app.every(m=>s[m]==='done'))lvl=app.some(m=>s[m]==='done'||s[m]==='hold')?'amber':'red';
  const why=app.filter(m=>s[m]!=='done').map(m=>SIDE_WHY[m][s[m]]);
  return{lvl,why,saw:s.saw,fit:s.fit};
}
const RDY_LBL={green:'READY',amber:'PART READY',red:'NOT READY'};

/* ---------- Waiting on material: per-row holds, released by Saw, Stores, Office or Production ---------- */
function allHolds(modes,st){
  const out=[];
  lists().forEach(l=>Object.entries(holdsOf(l.id)).forEach(([k,v])=>{if(modes.includes(v.m)&&(!st||v.st===st)&&!(v.st==='hold'&&rowTicked(l.id,k)))out.push({l,k,v});}));
  return out;
}
function holdRows(l,keys,mode,by){
  DB.listHold=DB.listHold||{};const h=DB.listHold[l.id]=DB.listHold[l.id]||{};
  const at=nowISO();
  listRows(l).forEach(r=>{const k=rowKey(r);if(r.k===mode&&keys.includes(k))h[k]={m:mode,st:'hold',at,by,item:r.item||'',mat:r.mat||'',qty:r.qty,L:r.L||'',W:r.W||''};});
  holdLog('hold',l,keys.length,mode,by);
}
function releaseHolds(items,by){
  const at=nowISO();
  items.forEach(({l,k})=>{const h=holdsOf(l.id)[k];if(h&&h.st==='hold'){h.st='rel';h.relAt=at;h.relBy=by;}});
  const byL={};items.forEach(i=>{byL[i.l.id]=(byL[i.l.id]||0)+1;});
  Object.keys(byL).forEach(id=>{const l=lists().find(x=>x.id===id);if(l)holdLog('release',l,byL[id],'',by);});
}
function clearReleased(lsArr,mode,by){ // released rows that have now been cut/picked leave the hold book
  lsArr.forEach(l=>{const h=holdsOf(l.id);let n=0;Object.keys(h).forEach(k=>{if(h[k].m===mode&&h[k].st==='rel'){delete h[k];n++;}});
    if(n)holdLog(mode==='saw'?'cut':'picked',l,n,mode,by);
    });
}

function unholdOne(l,k,mode,by){

function holdLog(act,l,n,mode,by){

}

function bindHoldBook(modes,whoFn){

/* ---------- Deliberate re-cut / re-pick (office): the only way finished work goes back to a bench ---------- */
function sendBack(l,mode){
  officeWho(by=>{
    const why=prompt('Send "'+l.name+'" back to the '+(mode==='saw'?'saw for RE-CUTTING':'stores for RE-PICKING')+'.\n\nWhy? (e.g. drawing changed, damaged in transit)','');
    if(why===null)return;
    if(!why.trim()){toast('A reason is needed to send work back');return;}
    const was=listDone(l.id)[mode];
    if(DB.listDone&&DB.listDone[l.id])delete DB.listDone[l.id][mode];
    l.log=(l.log||[]);l.log.push({at:nowISO(),by,what:(mode==='saw'?'Sent back for re-cutting':'Sent back for re-picking')+(was?' (was done '+new Date(was.at).toLocaleDateString('en-IE')+(was.by?' by '+was.by:'')+')':''),why:why.trim()});
    sched();render();toast(l.name+' is back on the '+(mode==='saw'?'saw':'stores')+' queue');

/* ---------- Manual cutting lists: typed in the planner, same rails as an uploaded workbook ---------- */
function knownMaterials(){
  const s=new Set();
  Object.values(DB.listWBs||{}).forEach(wb=>Object.values(wb.sheets||{}).forEach(rows=>rows.forEach(r=>{if(r.k==='saw'&&r.mat)s.add(String(r.mat).trim());})));
  return[...s].sort();
}
function nextPNumber(){
  let num=Math.max(1000,...DB.orders.map(o=>{const m=String(o.wo).match(/^P-(\d+)$/);return m?+m[1]:0;}))+1;
  while(DB.orders.some(o=>o.wo==='P-'+num))num++;
  return'P-'+num;
}
function manualListValidate(d){ // pure — used by the editor and the tests
  const saw=d.rows.filter(r=>r.k==='saw'),fit=d.rows.filter(r=>r.k==='fit');
  if(d.noCut&&d.noFit)return'A list can\'t be both "no cutting" and "no fittings" — there would be nothing to make.';
  if(!saw.length&&!fit.length)return'Add at least one row.';
  if(d.noCut&&saw.length)return'"No cutting" is ticked but there are saw rows — untick it or delete the saw rows.';
  if(d.noFit&&fit.length)return'"No fittings" is ticked but there are fittings rows — untick it or delete the fittings rows.';
  for(const r of saw){if(!(+r.qty>0))return'Every saw row needs a quantity.';if(!(+r.L>0)&&!(+r.W>0))return'Every saw row needs a length or width ("'+(r.item||'unnamed')+'").';}
  for(const r of fit){if(!(+r.qty>0))return'Every fittings row needs a quantity.';if(!String(r.item||'').trim())return'Every fittings row needs an item name.';}
  if(!String(d.name||'').trim())return'Give the list a house / name.';
  if(!d.wo)return'Pick the work order (or create a new P-number).';
  return'';
}
function saveManualList(d,by,existing){ // pure-ish: writes DB, returns the list
  const rows=d.rows.map(r=>r.k==='saw'?{k:'saw',item:String(r.item||'').trim(),qty:+r.qty,L:+r.L>0?+r.L:'',W:+r.W>0?+r.W:'',mat:String(r.mat||'').trim(),note:String(r.note||'').trim()}
                                    :{k:'fit',item:String(r.item||'').trim(),qty:+r.qty,mat:String(r.mat||'').trim(),note:String(r.note||'').trim()});
  DB.listWBs=DB.listWBs||{};DB.lists=DB.lists||[];
  const name=String(d.name).trim(),proj=String(d.project||'').trim()||'Manual lists';
  let l=existing?lists().find(x=>x.id===existing.id):null;
  if(l){
    const wb=DB.listWBs[l.wb]||(DB.listWBs[l.wb]={project:proj,sheets:{},manual:true});
    const oldKeys=new Set(listRows(l).map(rowKey));
    if(l.sheet!==name)delete wb.sheets[l.sheet];
    wb.sheets[name]=rows;wb.project=proj;
    Object.assign(l,{sheet:name,name,project:proj,saw:rows.filter(r=>r.k==='saw').length,fit:rows.filter(r=>r.k==='fit').length,noCut:!!d.noCut,noFit:!!d.noFit,up:nowISO()});
    const was=(existing.wos||[])[0];
    l.wos=[d.wo,...(l.wos||[]).filter(w=>w!==d.wo&&w!==was)];
    // rows added to a side that was already signed off put that side back on the bench — and say so
    ['saw','fit'].forEach(m=>{
      const added=rows.filter(r=>r.k===m&&!oldKeys.has(rowKey(r)));
      if(added.length&&listDone(l.id)[m]){
        delete DB.listDone[l.id][m];
        (l.log=l.log||[]).push({at:nowISO(),by,what:(m==='saw'?'Back on the saw queue':'Back on the stores queue')+' — '+added.length+' row'+(added.length!==1?'s':'')+' added after it was signed off',why:'List edited'});
      }
    });
    // holds on rows that no longer exist are dropped
    const keys=new Set(rows.map(rowKey));const h=holdsOf(l.id);Object.keys(h).forEach(k=>{if(!keys.has(k))delete h[k];});
    (l.log=l.log||[]).push({at:nowISO(),by,what:'Manual list edited'});
  }else{
    const wbId=uid('MWB');
    DB.listWBs[wbId]={project:proj,sheets:{[name]:rows},manual:true};
    l={id:uid('L'),wb:wbId,sheet:name,name,project:proj,sdate:'',saw:rows.filter(r=>r.k==='saw').length,fit:rows.filter(r=>r.k==='fit').length,
       wos:[d.wo],up:nowISO(),manual:true,noCut:!!d.noCut,noFit:!!d.noFit,by,log:[{at:nowISO(),by,what:'Manual list created'}]};
    DB.lists.push(l);
  }
  return l;
}

/* ---------- Print fallback: today's Saw / Stores work on A4, tick box + initials per row ---------- */
function workListFor(mode,days){
  const today=todayLocal();
  const lim=new Date();lim.setDate(lim.getDate()+Math.max(0,days-1));
  const limISO=lim.getFullYear()+'-'+String(lim.getMonth()+1).padStart(2,'0')+'-'+String(lim.getDate()).padStart(2,'0');
  return lists().filter(l=>(mode==='saw'?l.saw:l.fit)>0)
    .filter(l=>!listDone(l.id)[mode]||listHoldRows(l,mode,'rel').length)
    .filter(l=>{const d=listDeadline(l),e=cutTodayEnd(today);return d&&d<=(days>1&&limISO>e?limISO:e);})
    .sort((a,b)=>(listDueKey(a)||'9999').localeCompare(listDueKey(b)||'9999'));
}
function printWorkList(mode,days){
  const ls2=workListFor(mode,days),saw=mode==='saw',E=escA;

  const block=l=>{
    const done=listDone(l.id)[mode],h=holdsOf(l.id);
    const relOnly=done&&listHoldRows(l,mode,'rel').length;

      <span class="dl">${listOverdue(l)?'OVERDUE · ':''}${saw?'CUT':'PICK'} BY ${E(fmt(listDeadline(l)))} · DELIVERS ${E(fmt(listDueKey(l)))}</span></div>
      <div class="wos">${(l.wos||[]).map(E).join(' · ')}${relOnly?' · <b>MATERIAL ARRIVED — these rows only</b>':''}</div>
      <table><thead><tr><th class="tk">✓</th><th>Item</th><th class="n">Qty</th>${saw?'<th class="n">Length</th><th class="n">Width</th><th>Material</th><th>Edging / note</th>':'<th>Spec</th><th>Note</th>'}<th class="in">Initials</th></tr></thead><tbody>
      ${rows.map(r=>{const held=heldRow(l,rowKey(r));return `<tr${held?' class="held"':''}><td class="tk">${held?'⏸':'☐'}</td><td>${held?'<b>WAITING ON MATERIAL</b> — ':''}${E(r.item||'')}</td><td class="n">${E(r.qty)}</td>${saw?`<td class="n">${E(r.L)}</td><td class="n">${E(r.W)}</td><td>${E(r.mat)}</td><td>${E(r.note)}</td>`:`<td>${E(r.mat)}</td><td>${E(r.note)}</td>`}<td class="in"></td></tr>`;}).join('')}
      </tbody></table>
      <div class="sig">${saw?'Cut complete':'Picked'} — signed: ______________________ &nbsp; time: ________</div></div>`;
  };
  const w=window.open('','_blank');
  if(!w){toast('Pop-up blocked — allow pop-ups for this site to print');return;}

  *{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;padding:8mm;color:#111;font-size:12px}

  .note{font-size:11px;color:#444;margin-bottom:8px}
  .blk{border:1.5px solid #333;border-radius:2mm;padding:3mm;margin-bottom:5mm;page-break-inside:avoid}
  .bh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.hs{font-size:20px;font-weight:800;color:#14335c}.dl{margin-left:auto;font-weight:800}
  .wos{font-family:monospace;font-size:10px;color:#555;margin:1mm 0 2mm}
  table{width:100%;border-collapse:collapse}th,td{border:1px solid #888;padding:4px 5px;text-align:left;vertical-align:top}th{background:#eef1f6;font-size:10px;text-transform:uppercase}
  .n{text-align:right;font-family:monospace;font-size:13px}.tk{width:9mm;text-align:center;font-size:16px}.in{width:18mm}
  tr.held td{background:#f3f3f3;color:#666}.sig{margin-top:3mm;font-size:12px}
  @media print{@page{size:A4 portrait;margin:8mm}body{padding:0}}
  </style></head><body><h1><span>${saw?'🪚 SAW — cutting sheet':'🧰 STORES — fittings sheet'}</span><span>${E(today)}</span></h1>
  <div class="note">Paper fallback — tick each row as you go and sign each house. Hand the sheet to the office so it can be entered in the planner. ${days>1?'Covers the next '+days+' days and anything overdue.':'Today\'s work and anything overdue.'}</div>
  ${ls2.map(block).join('')}<script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body></html>`);

/* ---------- Delivery performance: moved, partial runs, never left, on-time — live week + archive ---------- */
function liveWeekJobs(){
  return delAll().filter(o=>o.delDay||o.delVeh).map(o=>({wo:o.wo,t:o.title||'',c:o.customer||'',v:o.delVeh||'',d:o.delDay||'',
    lAt:o.delLoadedAt||'',dAt:o.delDispAt||'',vAt:o.delDelivAt||(o.delDone?'x':''),mv:o.delMoves||[],fd:o.delFirst||'',mw:o.missWhy||null}));
}
function weekPerf(jobs,pastIx){
  const planned=jobs.filter(j=>j.d);
  const due=planned.filter(j=>DEL_DAYS.indexOf(j.d)<pastIx);
  const wd=t=>{if(!t||t==='x')return'';return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(t).getDay()];};
  const onTime=due.filter(j=>j.vAt&&!(j.mv||[]).length&&(j.vAt==='x'||wd(j.vAt)===j.d));
  const moved=jobs.filter(j=>(j.mv||[]).length);
  const runs={};due.forEach(j=>{const k=j.v+'|'+j.d;(runs[k]=runs[k]||[]).push(j);});
  const partial=Object.keys(runs).filter(k=>{const r=runs[k];return r.some(j=>j.vAt)&&r.some(j=>(j.dAt||j.lAt)&&!j.vAt);})
    .map(k=>{const r=runs[k];const[v,d]=k.split('|');return{v,d,made:r.filter(j=>j.vAt),missed:r.filter(j=>!j.vAt)};});
  const never=due.filter(j=>!j.lAt&&!j.dAt&&!j.vAt);
  const reasons={};
  jobs.forEach(j=>{(j.mv||[]).forEach(m=>{if(m.why){const w=m.why.replace(/^Other:.*/,'Other');reasons[w]=(reasons[w]||0)+1;}});if(j.mw&&j.mw.why){const w=j.mw.why.replace(/^Other:.*/,'Other');reasons[w]=(reasons[w]||0)+1;}});
  const top=Object.entries(reasons).sort((a,b)=>b[1]-a[1]);
  return{planned:planned.length,due:due.length,onTime:onTime.length,pct:due.length?Math.round(100*onTime.length/due.length):null,moved,partial,never,top};
}
function todayDayIx(){return (i=>i<0?6:i)(DEL_DAYS.indexOf(wdName(new Date())));}
function scorecardHTML(n){
  const rows=[{lbl:'This week (so far)',p:weekPerf(liveWeekJobs(),todayDayIx()),live:true}];
  const ar=DB.delArchive||{};
  Object.keys(ar).sort().reverse().slice(0,n||8).forEach(k=>{
    const a=ar[k];const d=new Date(a.at);
    rows.push({lbl:'Wk '+wkNum(new Date(d.getTime()-3*86400000))+' · cleared '+d.toLocaleDateString('en-IE',{day:'numeric',month:'short'}),p:weekPerf(a.jobs.map(j=>({...j,mv:j.mv||[],mw:j.mw||null})),7)});
  });
  const pc=p=>p.pct===null?'<span style="color:var(--t3)">—</span>':`<b style="color:${p.pct>=90?'#0d6e46':p.pct>=75?'#8a5a00':'#b42318'}">${p.pct}%</b> <span style="color:var(--t3);font-size:11px">${p.onTime}/${p.due}</span>`;
  return `<table class="lst-tbl sc-tbl"><thead><tr><th>Week</th><th>Planned</th><th>On time</th><th>Moved</th><th>Partial runs</th><th>Never left</th><th>Main reasons</th></tr></thead><tbody>
    ${rows.map(r=>`<tr${r.live?' style="background:#f4f8ff"':''}><td style="font-weight:700">${escA(r.lbl)}</td><td>${r.p.planned}</td><td>${pc(r.p)}</td><td>${r.p.moved.length||'—'}</td><td>${r.p.partial.length||'—'}</td><td>${r.p.never.length?`<b style="color:#b42318">${r.p.never.length}</b>`:'—'}</td><td style="font-size:12px">${r.p.top.slice(0,3).map(([w,c])=>escA(w)+' ×'+c).join(' · ')||'<span style="color:var(--t3)">—</span>'}</td></tr>`).join('')}
  </tbody></table>
  <div style="font-size:11px;color:var(--t3);margin-top:6px">On time = delivered on the day it was planned, without being moved. Only days already gone are counted. Weeks are stored when the board is cleared (📚 Past weeks); moves and reasons are recorded from 15 Oct 2026.</div>`;
}

/* ---------- Production Manager view: the plan that lives in one head, on one screen ---------- */
function renderProd(app){
  const all=delAll();
  const[td,tm]=floorDays();
  const ix=todayDayIx();
  const live=all.filter(o=>o.delDay&&!o.manual&&dStage(o)==='');
  const rdy=o=>woReady(o.wo);
  const atRisk=live.filter(o=>(o.delDay===td||o.delDay===tm)&&rdy(o).lvl!=='green');
  const later=live.filter(o=>o.delDay!==td&&o.delDay!==tm&&DEL_DAYS.indexOf(o.delDay)>ix&&rdy(o).lvl!=='green');
  const perf=weekPerf(liveWeekJobs(),ix);
  const lim=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const unplaced=DB.orders.filter(o=>!o.delDay&&!o.delDone&&!o.delDelivAt&&!isShipped(o)&&!isOnHold(o)&&o.dueDate&&o.dueDate<=lim&&!/assembly complete|pallet/i.test(o.step||'')).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const holds=allHolds(['saw','fit'],'hold');
  const missNo=missedJobs().filter(o=>!o.missWhy);
  const moved=all.filter(o=>(o.delMoves||[]).length);
  const dot=l=>`<span class="rdy-dot rdy-${l}"></span>`;
  const rRow=o=>{const r=rdy(o);return `<div class="dsh-row">${dot(r.lvl)}<b>${escA(o.wo)}</b>${(o.floor||o.unit)?`<span class="flr-fu" style="font-size:12px">${escA([o.floor,o.unit].filter(Boolean).join(' · '))}</span>`:''}<span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-c">${escA(o.customer||'')}</span><span class="dsh-x">${escA(slotLbl(o.delVeh,o.delDay))} · <b class="rdy-t-${r.lvl}">${escA(r.why.join(' · '))}</b></span></div>`;};
  const panel=(title,color,inner)=>`<div class="dsh-p"><div class="dsh-ph" style="background:${color}">${title}</div>${inner}</div>`;
  const none=t=>`<div class="dsh-row" style="color:var(--t3);font-style:italic">${t}</div>`;
  const tile=(n,lbl,sub,bad)=>`<div class="dsh-tile" style="border-top:4px solid ${bad?'#c0392b':'#5b6b82'}"><div class="dsh-n" style="color:${bad?'#c0392b':'#14335c'}">${n}</div><div class="dsh-l">${lbl}</div>${sub?`<div class="dsh-s">${sub}</div>`:''}</div>`;
  app.innerHTML=`<div class="dsh">
    <h1 style="font-size:26px;color:#14335c;margin:0 0 12px">🧭 Production — what needs you today</h1>
    <div class="dsh-tiles">
      ${tile(atRisk.length,'AT RISK TODAY / TOMORROW','on a van, not ready',atRisk.length>0)}
      ${tile(holds.length,'ROWS WAITING ON MATERIAL','release when it arrives',holds.length>0)}
      ${tile(unplaced.length,'DUE IN 7 DAYS, NOT ON A VAN','',unplaced.length>0)}
      ${tile(missNo.length,'MISSED — REASON NEEDED','',missNo.length>0)}
      ${tile(perf.pct===null?'—':perf.pct+'%','ON TIME THIS WEEK',perf.due?perf.onTime+' of '+perf.due+' due so far':'nothing due yet',perf.pct!==null&&perf.pct<90)}
    </div>
    ${missNo.length?panel('⚠ MISSED — tap to give the reason','#c0392b',missNo.map(o=>`<div class="dsh-row"><b>${escA(o.wo)}</b><span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-c">${escA(o.customer||'')}</span><span class="dsh-x">${escA(slotLbl(o.delVeh,o.delDay))} · ${dStage(o)?dStageLbl[dStage(o)]:'NEVER LOADED'}</span><button class="btn btn-s" data-misswhy="${escA(o.wo)}">Give reason</button></div>`).join('')):''}
    <div class="dsh-cols">
      ${panel('🔴 AT RISK — '+td+' & '+tm+' loads not ready','#c0392b',atRisk.length?atRisk.sort((a,b)=>DEL_DAYS.indexOf(a.delDay)-DEL_DAYS.indexOf(b.delDay)).map(rRow).join(''):none('Every job on '+td+' and '+tm+' is ready ✓'))}
      ${panel('🟠 LATER THIS WEEK — not ready yet','#8a5a00',later.length?later.sort((a,b)=>DEL_DAYS.indexOf(a.delDay)-DEL_DAYS.indexOf(b.delDay)).map(rRow).join(''):none('Nothing else outstanding this week ✓'))}
      ${panel('📅 DUE IN THE NEXT 7 DAYS — not on a van','#14335c',unplaced.length?unplaced.slice(0,25).map(o=>`<div class="dsh-row">${dot(woReady(o.wo).lvl)}<b>${escA(o.wo)}</b><span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-c">${escA(o.customer||'')}</span><span class="dsh-x">due ${fmt(o.dueDate)}${o.delv?' · in the pool':''}</span></div>`).join(''):none('Everything due in the next week is on a van ✓'))}
      ${panel('🔁 MOVED THIS WEEK','#5b6b82',moved.length?moved.map(o=>{const m=o.delMoves[o.delMoves.length-1];return `<div class="dsh-row"><b>${escA(o.wo)}</b><span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-x">${escA(m.why||'')} · ${escA(m.by||'')}${o.delMoves.length>1?' · moved '+o.delMoves.length+'×':''}</span></div>`;}).join(''):none('No deliveries moved this week'))}
    </div>
    <div class="dsh-p" style="margin-top:14px"><div class="dsh-ph" style="background:#8a5a00">⏸ WAITING ON MATERIAL — release when it arrives</div><div style="padding:8px">${holdBookHTML(['saw','fit'])}</div></div>
    <div class="dsh-p" style="margin-top:14px"><div class="dsh-ph" style="background:#14335c">📈 WEEKLY DELIVERY SCORECARD</div><div style="padding:8px">${scorecardHTML(8)}</div></div>
    <div class="flr-ft">Live — refreshes automatically · Last update ${hhmm(nowISO())}</div>
  </div>`;
  bindMissWhy();
  bindHoldBook(['saw','fit'],officeWhoFn);
}

loadDB().then(()=>{render();startAutoRefresh();});
