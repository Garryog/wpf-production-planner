<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WPF Production Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="var s=document.createElement('script');s.src='xlsx.full.min.js';document.head.appendChild(s);"></script><!-- if the CDN is blocked by the works firewall, the copy in this site is used instead -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:3px solid #1a56db;outline-offset:2px}
.wl-h :focus-visible,.wl-selbar :focus-visible,.flr-vh :focus-visible{outline-color:#e8b931}
::placeholder{color:#7d8aa0}
:root{
  --bg:#f0f2f5;--card:#fff;--border:#dde1e7;--b2:#c4c9d4;
  --text:#1a1d23;--t2:#4a5568;--t3:#5b6b82;
  --green:#1a7a3c;--gl:#e6f4ec;--gb:#2d9e54;
  --red:#c0392b;--rl:#fdecea;
  --amber:#92400e;--al:#fef3c7;
  --blue:#1e4db7;--bl:#ebf0fb;
  --purple:#6d28d9;--pl:#f3effd;
  --accent:#c8a84b;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select{font-family:inherit;cursor:pointer}
.hdr{background:#1a1d23;color:#fff;border-bottom:3px solid var(--accent)}
.hdr-i{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:10px}
.lm{width:32px;height:32px;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1a1d23}
.lt{font-size:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#fff}
.ls{font-size:10px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.sync{font-size:11px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.dot{width:6px;height:6px;border-radius:50%;background:#4caf50;display:inline-block}
.dot.s{background:var(--accent)}.dot.e{background:#e53935}
.tabs{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tabs-i{max-width:1400px;margin:0 auto;display:flex;padding:0 20px;overflow-x:auto}
.tabs-i::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:10px 18px;border:none;background:none;font-size:13px;color:var(--t2);border-bottom:3px solid transparent;font-weight:500}
.tab:hover{color:var(--text)}.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.pg{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
.cap-bar{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 20px;margin-bottom:14px}
.cap-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:10px}
.week-caps{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.wk-cap{background:var(--bg);border-radius:8px;padding:8px 6px;text-align:center;border:2px solid transparent;cursor:pointer;transition:all .15s}
.wk-cap:hover{border-color:var(--b2)}.wk-cap.selected{border-color:var(--blue);background:var(--bl)}
.wk-label{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:3px}
.wk-date{font-size:10px;color:var(--t3);margin-bottom:5px}
.wk-bar-wrap{height:6px;background:#e5e8ed;border-radius:3px;overflow:hidden;margin-bottom:4px}
.wk-bar{height:100%;border-radius:3px;transition:width .3s}
.wk-bar.ok{background:var(--green)}.wk-bar.warn{background:var(--amber)}.wk-bar.over{background:var(--red)}
.wk-hours{font-size:11px;font-weight:600}
.wk-hours.ok{color:var(--green)}.wk-hours.warn{color:var(--amber)}.wk-hours.over{color:var(--red)}
.wk-count{font-size:10px;color:var(--t3)}
.board-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:6px;border:none;font-size:13px;font-weight:500}
.btn-g{background:var(--green);color:#fff}.btn-g:hover{background:var(--gb)}
.btn-s{background:#fff;border:1px solid var(--b2);color:var(--text)}.btn-s:hover{background:var(--bg)}
.btn-blue{background:var(--blue);color:#fff}
.search-input{padding:7px 12px;border:1px solid var(--b2);border-radius:6px;font-size:13px;min-width:200px;}
.search-input:focus{border-color:var(--blue)}
.filter-sel{padding:7px 10px;border:1px solid var(--b2);border-radius:6px;font-size:13px;background:#fff;-webkit-appearance:none}
.wo-table-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.wo-table{width:100%;border-collapse:collapse;font-size:13px}
.wo-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);padding:8px 10px;border-bottom:1px solid var(--border);background:#f8f9fb;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
.wo-table th:hover{color:var(--text)}
.wo-table th.asc::after{content:' ↑'}.wo-table th.desc::after{content:' ↓'}
.wo-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.wo-table tr:last-child td{border-bottom:none}
.wo-table tr:hover td{background:#fafbfc}
.wo-table tr.dragging{opacity:.3}
.wo-table tr.drag-over td{border-top:3px solid var(--blue)}
.wo-table tr.c-red td:first-child{border-left:4px solid var(--red)}
.wo-table tr.c-amber td:first-child{border-left:4px solid var(--amber)}
.wo-table tr.c-green td:first-child{border-left:4px solid var(--green)}
.wo-table tr.hl-row td{background:#fff8d6!important}
.wo-table tr.grp-start td{border-top:2px solid var(--b2)}
.wo-table tr.hl-row .wo-num{color:#b8860b;font-weight:700}
.wo-table tr.c-blue td:first-child{border-left:4px solid var(--blue)}
.wo-table tr.c-purple td:first-child{border-left:4px solid var(--purple)}
.wo-num{font-family:monospace;font-size:11px;color:var(--t2)}
.wo-title{font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.wo-cust{color:var(--t2);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.due-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.due-late{background:var(--rl);color:var(--red)}.due-soon{background:var(--al);color:var(--amber)}.due-ok{background:var(--gl);color:var(--green)}
.step-badge{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--bl);color:var(--blue);white-space:nowrap}
.week-sel{padding:4px 8px;border:1px solid var(--b2);border-radius:5px;font-size:12px;background:#fff;width:120px}
.notes-inp{width:100%;border:none;background:transparent;font-size:12px;color:var(--t2);padding:1px 0;font-family:inherit;min-width:100px}
.notes-inp:focus{border-bottom:1px solid var(--blue)}
.cdot{width:13px;height:13px;border-radius:50%;display:inline-block;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.cdot:hover{border-color:#fff;box-shadow:0 0 0 2px var(--b2)}
.drag-handle{cursor:grab;color:var(--t3);padding:0 3px;font-size:15px;user-select:none;line-height:1}
.drag-handle:active{cursor:grabbing}
.table-footer{padding:9px 12px;background:#f8f9fb;border-top:1px solid var(--border);display:flex;gap:20px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.changes-banner{background:var(--al);border:1px solid #f59e0b;border-radius:8px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.import-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.drop-zone{border:2px dashed var(--b2);border-radius:8px;padding:28px;text-align:center;color:var(--t3);cursor:pointer;transition:all .15s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--blue);background:var(--bl);color:var(--blue)}
.preview-row{padding:5px 10px;background:var(--bg);border-radius:4px;margin-bottom:3px;display:flex;align-items:center;gap:10px;font-size:12px}
.exp-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.empty{text-align:center;padding:40px;color:var(--t3);font-size:13px}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1d23;color:#fff;padding:9px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.toast.stick{pointer-events:none;white-space:normal;width:max-content;max-width:calc(100vw - 24px);box-sizing:border-box;border-radius:10px;text-align:left;background:#fff4d6;color:#7a5200;border:1px solid #e0a43a;font-weight:700;padding:8px 40px 8px 12px;line-height:1.35;max-height:25vh;overflow:hidden;display:flex;flex-direction:column}
.toast .toast-l{position:relative;overflow-y:auto;min-height:0;flex:1 1 auto;overscroll-behavior:contain}
.toast .toast-up,.toast .toast-dn{pointer-events:auto;position:absolute;right:2px;width:36px;height:36px;background:none;border:0;color:#7a5200;font-size:14px;line-height:1;padding:0;cursor:pointer}
.toast .toast-up{top:40px}.toast .toast-dn{bottom:2px}
.toast .toast-up::before{content:'▲'}.toast .toast-dn::before{content:'▼'}
.toast.stick:not(.scr) .toast-up,.toast.stick:not(.scr) .toast-dn{display:none}
.toast.stick .toast-i{position:relative}
.toast.stick .toast-i+.toast-i{margin-top:11px}
.toast.stick .toast-i+.toast-i::before{content:'';position:absolute;left:0;right:0;top:-6px;border-top:1px solid #e0a43a}
.toast .toast-x{pointer-events:auto;position:absolute;top:2px;right:2px;background:none;border:0;color:#7a5200;font-size:18px;line-height:1;width:36px;height:36px;padding:0;cursor:pointer}
.toast .toast-x::before{content:'✕'}
/* short landscape phones (a quarter of the screen is under 3 buttons high): ▲ sits beside ✕, ▼ at the bottom */
@media (max-height:520px){.toast.stick.scr{padding-right:78px;min-height:80px}.toast.stick.scr .toast-up{top:2px;right:40px}}
.savebar{position:sticky;top:0;z-index:9000;background:#c0392b;color:#fff;font-size:14px;font-weight:700;line-height:1.4;padding:10px 16px;text-align:center}
.savebar[hidden]{display:none}
.verbar{position:sticky;top:0;z-index:8999;width:100%;border:0;background:#14335c;color:#fff;font-size:14px;font-weight:700;padding:10px 16px;cursor:pointer}
.verbar[hidden]{display:none}
@media(max-width:1000px){.week-caps{grid-template-columns:repeat(5,1fr)}}
@media(max-width:700px){.week-caps{grid-template-columns:repeat(3,1fr)}.wo-table th:nth-child(n+7),.wo-table td:nth-child(n+7){display:none}.pg{padding:12px 12px 60px}}
/* ---- Shipped tab (phone-first cards) ---- */
.sh-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sh-bar .search-input{flex:1;min-width:200px}
.sh-chk{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sh-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sh-card.sh-done{background:#f4fbf6;border-color:#b3e0c4}
.sh-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sh-t{font-size:14px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.sh-m{font-size:12px;color:var(--t2);margin-top:2px;overflow-wrap:anywhere}
.sh-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sh-pill{font-size:11px;font-weight:700;border-radius:100px;padding:2px 8px;white-space:nowrap}
.sh-pill.ok{background:#e6f6ec;color:#0d6e46}.sh-pill.no{background:#f1f3f6;color:var(--t2)}.sh-pill.warn{background:#fdecea;color:#c0392b}
@media(max-width:700px){.sh-b .btn{flex:1;min-height:44px;font-size:14px}.sh-bar .search-input,.sh-bar .filter-sel{width:100%;min-width:0;min-height:40px;font-size:16px}.sh-chk{min-height:36px}}
/* ---- Column filters ---- */
.cf-row td{background:#f8f9fb;border-bottom:2px solid var(--border);padding:3px 4px}
.cf-inp{width:100%;min-width:44px;border:1px solid var(--b2);border-radius:4px;padding:3px 6px;font-size:11px;background:#fff;color:var(--text)}
.cf-inp::placeholder{color:#c3cad6}
.cf-inp:focus{border-color:#7ba7e0}
.cf-inp.on{background:#fff8d6;border-color:#e0b830;font-weight:600}
.cf-clear{background:#fff8d6;border:1px solid #e0b830;color:#8a6d00;border-radius:4px;font-size:10px;font-weight:700;padding:3px 6px;cursor:pointer;white-space:nowrap}
.cf-clear:hover{background:#ffefad}
/* ---- Board grouping ---- */
.gsel{width:14px;height:14px;cursor:pointer;accent-color:#1a56db;vertical-align:middle}
.grp-row td{background:#eef3fb!important;border-top:2px solid #b9cdec!important;border-bottom:1px solid #c9d8ee}
.grp-row .grp-title{font-weight:700;font-size:13px;width:100%;min-width:120px;border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:5px;color:#14335c;}
.grp-row .grp-title:hover{border-color:var(--b2);background:#fff}
.grp-row .grp-title:focus{border-color:#7ba7e0;background:#fff}
.grp-tog{cursor:pointer;font-family:monospace;font-size:11px;font-weight:700;color:#1a56db;white-space:nowrap;user-select:none}
.grp-tog:hover{text-decoration:underline}
.grp-member td{background:#f7fafd!important}
.grm-btn{background:none;border:1px solid transparent;color:var(--t3);font-size:13px;cursor:pointer;padding:1px 6px;border-radius:4px;line-height:1.2}
.grm-btn:hover{background:#fdecea;color:var(--red);border-color:#f3b3a6}
.grp-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#14335c;color:#fff;padding:10px 18px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:13px;box-shadow:0 8px 28px rgba(10,20,40,.4);z-index:60}
.grp-bar span{color:#bcd0f0;font-weight:600}
/* ---- Deliveries ---- */
.dvbtn{background:none;border:1px solid transparent;font-size:15px;filter:grayscale(1);opacity:.32;cursor:pointer;padding:1px 5px;border-radius:5px;line-height:1;transition:all .12s}
.dvbtn:hover{opacity:.7}
.dvbtn.on{filter:none;opacity:1;background:#e8f1fd;border-color:#b0c8e8}
#delcnt{display:none;background:#1a56db;color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:5px;vertical-align:1px}
#listcnt{display:none;background:#c0392b;color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:5px;vertical-align:1px}
.pwo-l{display:block;font-size:11px;color:var(--t3);font-weight:700;margin-bottom:3px}
#pwo-form input{padding:7px 9px;border:1px solid var(--b2);border-radius:6px;font-size:13px}
/* cutting lists library + saw/stores queues */
.lst-tbl{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.lst-tbl th{background:#f4f6f9;text-align:left;padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);border-bottom:1px solid var(--border)}
.lst-tbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.lst-chip{display:inline-block;background:#eef2f8;border:1px solid var(--b2);border-radius:5px;padding:1px 7px;font-size:11px;font-family:monospace;margin:1px 3px 1px 0;white-space:nowrap}
.lst-chip button{border:none;background:none;cursor:pointer;color:var(--t3);font-size:11px;padding:0 0 0 3px}
.lst-chip.p-wo,.wl-h .lst-chip.p-wo{background:#f3e8ff;color:#5b21b6;border-color:#c4b5fd} /* a planner P-number: not from Cienapps */
.lst-done{color:#0d6e46;font-weight:700;font-size:11px;white-space:nowrap}
.wl{max-width:1100px;margin:0 auto;padding:14px 18px}
.wl h1{font-size:26px;color:#14335c;border-bottom:4px solid #1a56db;padding-bottom:6px;margin-bottom:14px}
.wl h1 span{font-size:14px;color:var(--t3);font-weight:400;margin-left:10px}
.wl-card{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.wl-card.cdone{opacity:.55}
.wl-h{background:#14335c;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wl-h .wn{font-size:19px;font-weight:800}
.wl-h .wd{font-size:13px;opacity:.9}
.wl-due{background:#e8b931;color:#14335c;font-weight:800;font-size:13px;border-radius:6px;padding:3px 10px;white-space:nowrap}
.wl-h .lst-chip{background:rgba(255,255,255,.95);color:#14335c;border-color:transparent;font-weight:700}
.wl-tbl{width:100%;border-collapse:collapse;font-size:15px}
.wl-tbl th{background:#f4f6f9;text-align:left;padding:6px 10px;font-size:11px;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--border)}
.wl-tbl td{padding:7px 10px;border-bottom:1px solid #eef1f5}
.wl-tbl td.num{font-weight:700;font-family:monospace;white-space:nowrap}
.wl-sec td{background:#eaf0f8;font-weight:800;color:#14335c;font-size:14px;border-top:2px solid var(--b2)}
.wl-act{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wl-btn{background:#0b7e44;color:#fff;border:none;border-radius:10px;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer}
.wl-undo{background:#fff;border:2px solid #8e99ab;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;color:#4a5568;cursor:pointer;min-height:44px}
.wl-donelbl{color:#0d6e46;font-weight:800;font-size:15px}
.wl-tabs{display:flex;gap:10px;margin-bottom:14px}
.wl-tabs button{flex:1;padding:14px;font-size:17px;font-weight:800;border-radius:10px;border:2px solid var(--b2);background:#fff;color:var(--t3);cursor:pointer}
.wl-tabs button.on{background:#14335c;border-color:#14335c;color:#fff}
.wl-dday{font-size:13px;font-weight:800;color:#14335c;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px;border-bottom:2px solid #14335c;padding-bottom:3px}
.ls-nochip{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;background:#fff4d6;color:#7a4a00;border:1px solid #e0a43a;white-space:nowrap;vertical-align:middle}
.ls-nochip.late{background:#c0392b;color:#fff;border-color:#c0392b}
.tbc-chip{display:inline-block;margin-left:4px;font-size:11px;font-weight:800;border-radius:4px;padding:1px 6px;background:#c0392b;color:#fff;white-space:normal;vertical-align:middle}
.tbc-cell{color:#c0392b!important;font-weight:800}
.buy-chip{display:inline-block;margin-left:4px;font-size:10px;font-weight:800;border-radius:4px;padding:1px 6px;background:#e3f4f8;color:#0b5566;border:1px solid #7cc3d3;white-space:nowrap}
.chk-wait{display:inline-block;font-size:11px;font-weight:800;border-radius:4px;padding:1px 6px;background:#fff4d6;color:#7a4a00;border:1px solid #e0a43a;white-space:nowrap}
.chk-ok{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:#e7f6ec;color:#0d6e46;border:1px solid #9fd8b4;white-space:nowrap}
.lti-row{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.lti-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.lti-wo{font-family:monospace;font-size:14px;color:#14335c}.lti-t{flex:1;min-width:140px;overflow-wrap:anywhere}.lti-c{color:var(--t2);font-size:12px;overflow-wrap:anywhere}
/* WO | Floor | Unit | Title | Customer as separate columns (Garry, 4 Nov): the title is cut short, full text on hover */
.wo-cols{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;min-width:0;flex:1 1 100%}
.wo-cols .wc-wo{font-family:monospace;font-size:14px;color:#14335c;min-width:64px}.wo-cols .wc-f,.wo-cols .wc-u{min-width:72px}

/* ---------- Manual grouping of work orders on the capacity board ---------- */
function grpMembers(gid){return DB.orders.filter(o=>o.grp===gid);}
function cleanGroups(){
  DB.grps=DB.grps||{};
  const counts={};
  DB.orders.forEach(o=>{if(o.grp)counts[o.grp]=(counts[o.grp]||0)+1;});
  // dissolve groups that lost their members (deleted, excluded on import, ungrouped down to one)
  Object.keys(DB.grps).forEach(g=>{
    if(!counts[g]||counts[g]<2){
      DB.orders.forEach(o=>{if(o.grp===g)delete o.grp;});
      delete DB.grps[g];
    }
  });
  DB.orders.forEach(o=>{if(o.grp&&!DB.grps[o.grp])delete o.grp;});
}
// IDs made on two screens at the same moment must never collide (a shared counter would) — time + random.
function uniqId(p){return p+Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).slice(2,5).toUpperCase();}
function makeGroup(){
  const members=DB.orders.filter(o=>grpSel.has(o.wo));
  if(members.length<2){toast('Select at least 2 work orders to group');return;}
  let gid=uniqId('G');while(DB.grps&&DB.grps[gid])gid=uniqId('G');
  DB.grps=DB.grps||{};
  DB.grps[gid]={title:members[0].title||members[0].wo};
  members.forEach(o=>{o.grp=gid;});
  cleanGroups();
  grpSel.clear();expGrps.add(gid);
  sched();render();
  toast(members.length+' work orders grouped — click the title to rename');
}
function ungroupG(gid){
  DB.orders.forEach(o=>{if(o.grp===gid)delete o.grp;});
  if(DB.grps)delete DB.grps[gid];
  sched();render();toast('Ungrouped');
}

  const BO=boardOrders(),PO=planOrders(),AM=attnMap();
  const custs=[...new Set(BO.map(o=>o.customer))].sort();
  const chg=changes();

  let orders=[...BO];
  if(fWeek==='unscheduled')orders=orders.filter(o=>!o.plannedWeek);
  else if(fWeek)orders=orders.filter(o=>o.plannedWeek===fWeek);
  if(fCust)orders=orders.filter(o=>o.customer===fCust);
  if(fDel)orders=orders.filter(o=>o.delv);
  if(fLate)orders=orders.filter(isLateVsDue);
  if(srch){const q=srch.toLowerCase();orders=orders.filter(o=>(o.title||'').toLowerCase().includes(q)||String(o.wo||'').toLowerCase().includes(q)||(o.customer||'').toLowerCase().includes(q)||String(o.floor||'').toLowerCase().includes(q)||String(o.unit||'').toLowerCase().includes(q));}
  // Per-column contains filters — all applied together (AND), like Excel column filters
  const colVal=(o,k)=>{
    switch(k){
      case 'wo':return o.wo||'';
      case 'floor':return String(o.floor||'');
      case 'unit':return String(o.unit||'');
      case 'title':return o.title||'';
      case 'customer':return o.customer||'';
      case 'hours':return String(o.hours);
      case 'dueDate':return (o.dueDate||'')+' '+(o.dueDate?fmt(o.dueDate)+' wk'+wkNum(o.dueDate):'');
      case 'value':return String(Math.round(o.value||0));
      case 'step':return o.step||'';
      case 'plannedWeek':return o.plannedWeek?(o.plannedWeek+' '+wkLbl(o.plannedWeek)):'unscheduled';
    }
    return '';
  };
  Object.keys(colF).forEach(k=>{
    const q=String(colF[k]||'').trim().toLowerCase();
    if(q)orders=orders.filter(o=>colVal(o,k).toLowerCase().includes(q));
  });
  const nColF=Object.keys(colF).filter(k=>String(colF[k]||'').trim()).length;
  orders.sort((a,b)=>{
    let av=a[sortCol]||'',bv=b[sortCol]||'';
    if(sortCol==='hours'||sortCol==='value'){av=+av;bv=+bv;}
    if(sortCol==='plannedWeek'){if(!av)av='9999-99-99';if(!bv)bv='9999-99-99';} // unscheduled last
    if(av<bv)return -sortDir;
    if(av>bv)return sortDir;
    // Secondary: group same customer together
    const ac=(a.customer||'').toLowerCase(),bc=(b.customer||'').toLowerCase();
    if(ac<bc)return -1;
    if(ac>bc)return 1;
    // Tertiary: due date
    return (a.dueDate||'').localeCompare(b.dueDate||'');
  });

  // Collapse grouped orders into one item at the position of their first member
  const seenG=new Set();
  const items=[];
  orders.forEach(o=>{
    if(o.grp&&DB.grps&&DB.grps[o.grp]){
      if(seenG.has(o.grp))return;
      seenG.add(o.grp);
      items.push({g:o.grp,customer:grpMembers(o.grp)[0]?grpMembers(o.grp)[0].customer:''});
    } else items.push({o,customer:o.customer||''});
  });

  const unschHrs=Math.round(PO.filter(o=>!o.plannedWeek).reduce((a,o)=>a+(+o.hours||0),0)*10)/10;
  const unschCnt=PO.filter(o=>!o.plannedWeek).length;
  const selOrders=DB.orders.filter(o=>grpSel.has(o.wo));
  const selH=selOrders.reduce((a,o)=>a+(+o.hours||0),0), selV=selOrders.reduce((a,o)=>a+(o.value||0),0);

  const weekOpts=(cur,mixed)=>`${mixed?'<option value="__MIX" selected disabled>— Mixed weeks —</option>':''}
      <option value=""${!mixed&&!cur?' selected':''}>— Unscheduled —</option>
      ${!mixed&&cur&&!weeks.includes(cur)?`<option value="${cur}" selected>${wkLbl(cur)} (past)</option>`:''}
      ${weeks.map(w=>`<option value="${w}"${!mixed&&cur===w?' selected':''}>${wkLbl(w)}</option>`).join('')}`;

  // lists switch on: "📋 no list" on jobs at step 5-8 with no cutting list — red once the list is late
  const lnTd=todayLocal(),lnMap=V2()?new Map(listsNeeded().filter(lsProcessed).map(o=>[o.wo,lsNeedInfo(o,lnTd)])):null;
  // spec TBC on any live list of the job (Garry, 4 Nov): a red chip on the row — it never blocks anything
  const tbcMap=V2()?(()=>{const m=new Map();lists().forEach(l=>{const t=lsTbc(lsView(l.id).rows);if(t.length)(l.wos||[]).forEach(w=>m.set(w,[...new Set([...(m.get(w)||[]),...t])]));});return m;})():null;
  const lnChip=o=>lsTbcChip(tbcMap&&tbcMap.get(o.wo))+(phHas(o)?`<span class="ph-chip" data-phwo="${escA(o.wo)}" title="A photo of the paper list is attached — tap to see it">📷 photo list</span>`:'')+(n=>n?`<span class="ls-nochip${n.late?' late':''}" title="No cutting list yet — ${n.late?'LATE, was due':'due by'} ${n.due?fmt(n.due):'—'}">📋 no list</span>`:'')(lnMap&&lnMap.get(o.wo));
  const rowHTML=(o,member,sep)=>`<tr class="${o.colour?'c-'+o.colour:''}${o.hl?' hl-row':''}${sep?' grp-start':''}${member?' grp-member':''}" draggable="true" data-wo="${escA(o.wo)}">
          <td style="text-align:center">${member
            ?`<button class="grm-btn" data-grm="${escA(o.wo)}" title="Take this WO out of the group">×</button>`
            :`<input type="checkbox" class="gsel" data-gsel="${escA(o.wo)}"${grpSel.has(o.wo)?' checked':''} title="Select to group">`}</td>
          <td><span class="drag-handle">⠿</span></td>
          <td style="text-align:center"><button class="dvbtn${o.delv?' on':''}" data-dv="${escA(o.wo)}" title="${o.delv?'On the delivery board — click to untag':'Put on the delivery board'}">🚚</button></td>
          <td><span class="wo-num" data-hl="${escA(o.wo)}" style="cursor:pointer${member?';padding-left:10px':''}${/^P-\d+$/.test(o.wo)?';color:#7c5cd6;font-weight:800':''}" title="${/^P-\d+$/.test(o.wo)?'Created in the planner — not from Cienapps. ':''}Tap to mark as discussed">${o.hl?'✓ ':''}${escA(o.wo)}</span>${addBadge(o)}${lnChip(o)}${isShipped(o)?`<span class="fu-badge" style="background:#eef3fb;border-color:#b9cdec;color:#14418f;margin-left:4px" title="Shipped in Cienapps — on the board because it still has waiting lines">📦 ${AM.get(o.wo)||0} waiting</span>`:''}</td>
          <td>${o.floor?`<span class="fu-badge">${escA(o.floor)}</span>`:'<span style="color:var(--t3)">—</span>'}</td>
          <td>${o.unit?`<span class="fu-badge">${escA(o.unit)}</span>`:'<span style="color:var(--t3)">—</span>'}</td>
          <td><span class="wo-title" title="${escA(o.title)}">${escA(o.title)}</span></td>
          <td><span class="wo-cust" title="${escA(o.customer)}">${escA(o.customer)}</span></td>
          <td style="text-align:right"><input type="number" step="0.5" min="0" style="width:52px;text-align:right;border:1px solid ${o.hoursEstimated?'#f59e0b':'var(--b2)'};border-radius:4px;padding:2px 4px;font-size:12px;font-weight:600;background:${o.hoursEstimated?'#fffbeb':'#fff'}" title="${o.hoursEstimated?'Estimated from value — verify':'Actual hours from Cienapps'}" data-hi="${escA(o.wo)}" value="${+o.hours||0}"></td>
          <td>${dueBadge(o.dueDate,o.plannedWeek,o.origDueDate)}</td>
          <td style="text-align:right;font-size:12px;color:var(--t2)">€${Math.round(o.value||0).toLocaleString()}</td>
          <td><select class="step-sel" data-stepsel="${escA(o.wo)}" style="font-size:11px;padding:3px 4px;border-radius:6px;border:1px solid var(--b2);background:#fff;color:var(--text);max-width:120px">
            ${getSteps().map(s=>`<option value="${escA(s)}"${String(o.step||'').trim()===s?' selected':''}>${escA(stepShort(s))}</option>`).join('')}
            ${getSteps().includes(String(o.step||'').trim())||!(o.step||'')?'':`<option value="${escA(o.step)}" selected>${escA(stepShort(o.step))}</option>`}
          </select></td>
          <td><select class="week-sel" data-wsel="${escA(o.wo)}">${weekOpts(o.plannedWeek||'',false)}</select></td>
          <td style="text-align:center"><button style="background:none;border:none;color:var(--t3);font-size:14px;padding:0 2px;cursor:pointer;line-height:1" data-del="${escA(o.wo)}" title="Delete order">🗑</button></td>
        </tr>`;

  const grpRowHTML=(gid,sep)=>{
    const g=DB.grps[gid];
    const ms=grpMembers(gid).sort(woCmp);
    const th=ms.reduce((a,o)=>a+(+o.hours||0),0), tv=ms.reduce((a,o)=>a+(o.value||0),0);
    const wks=[...new Set(ms.map(o=>o.plannedWeek||''))];
    const mixed=wks.length>1, wk=mixed?'':wks[0];
    const cs=[...new Set(ms.map(o=>o.customer||''))];
    const due=ms.map(o=>o.dueDate).filter(Boolean).sort()[0]||'';
    const allSel=ms.every(o=>grpSel.has(o.wo));
    const allDelv=ms.every(o=>o.delv);
    const open=expGrps.has(gid);
    return `<tr class="grp-row${sep?' grp-start':''}" data-grow="${gid}">
          <td style="text-align:center"><input type="checkbox" class="gsel" data-gselg="${gid}"${allSel?' checked':''} title="Select whole group (e.g. to merge into a new group)"></td>
          <td><span class="grp-tog" data-gtog="${gid}" title="${open?'Collapse':'Expand'} group">${open?'▾':'▸'}</span></td>
          <td style="text-align:center"><button class="dvbtn${allDelv?' on':''}" data-gdv="${gid}" title="${allDelv?'Whole group tagged for delivery — click to untag all':'Tag whole group for delivery next week'}">🚚</button></td>
          <td><span class="grp-tog" data-gtog="${gid}">${ms.length}&nbsp;WOs</span></td>
          <td colspan="2"><span class="fu-badge" style="background:#e3ecfa;border-color:#b9cdec;color:#14418f">GROUP</span></td>
          <td><input class="grp-title" data-gtitle="${gid}" value="${escA(g.title||'')}" title="Group title — click to edit"></td>
          <td><span class="wo-cust" title="${escA(cs.join(', '))}">${cs.length===1?escA(cs[0]):cs.length+' customers'}</span></td>
          <td style="text-align:right;font-weight:700;white-space:nowrap">${Math.round(th*10)/10}h</td>
          <td>${due?dueBadge(due,wk,null):'—'}</td>
          <td style="text-align:right;font-weight:700;white-space:nowrap">€${Math.round(tv).toLocaleString()}</td>
          <td style="color:var(--t3);font-size:11px">—</td>
          <td><select class="week-sel" data-gwsel="${gid}" style="font-weight:600">${weekOpts(wk,mixed)}</select></td>
          <td style="text-align:center"><button class="grm-btn" data-gun="${gid}" title="Ungroup — the work orders stay, the grouping is removed">⛓</button></td>
        </tr>
        ${open?ms.map(o=>rowHTML(o,true,false)).join(''):''}`;
  };

  let prevCust=null;
  const bodyHTML=items.map(it=>{
    const sep=prevCust!==null&&(prevCust||'')!==(it.customer||'');
    prevCust=it.customer||'';
    return it.g?grpRowHTML(it.g,sep):rowHTML(it.o,false,sep);
  }).join('');

  app.innerHTML=`<div class="pg">
  ${chg.length>0?`<div class="changes-banner">
    <strong>⚠ ${chg.length} work order${chg.length!==1?'s':''} rescheduled this session.</strong>
    <span style="font-size:12px;color:var(--amber)">Remember to export and update Cienapps.</span>
    <button class="btn btn-s" style="padding:4px 10px;font-size:12px;margin-left:auto" onclick="showTab('x')">Export Changes →</button>
  </div>`:''}

  <div class="cap-bar">
    <div class="cap-title">8-Week Assembly Capacity — ${WCAP}h per week</div>
    <div class="week-caps">
      ${weeks.map(wk=>{
        const h=wkHrs(wk),cnt=wkCnt(wk),v=wkVal(wk),cap=wkCap(wk);
        const pct=Math.min(100,Math.round(h/cap*100));
        const vpct=Math.min(100,Math.round(v/VCAP*100));
        const cls=pct>=100?'over':pct>=80?'warn':'ok';
        const vcls=vpct>=100?'over':vpct>=80?'warn':'ok';
        return`<div class="wk-cap${fWeek===wk?' selected':''}" data-wk="${wk}">
          <div class="wk-label">${wkLbl(wk)}</div>
          <div style="font-size:9px;color:var(--t3);margin-bottom:2px">HOURS</div>
          <div class="wk-bar-wrap"><div class="wk-bar ${cls}" style="width:${pct}%"></div></div>
          <div class="wk-hours ${cls}">${h}h / ${cap}h${cap!==WCAP?'<span style="font-size:9px;color:var(--amber)"> ✎</span>':''}</div>
          ${h>cap?'<div style="font-size:11px;font-weight:700;color:var(--red);background:var(--rl);border-radius:3px;padding:1px 5px;margin-top:2px">+' + (h-cap) + 'h OVER</div>':''}
          <div style="font-size:9px;color:var(--t3);margin:4px 0 2px">VALUE</div>
          <div class="wk-bar-wrap"><div class="wk-bar ${vcls}" style="width:${vpct}%"></div></div>
          <div class="wk-hours ${vcls}">${fmtVal(v)} / ${fmtVal(VCAP)}</div>
          ${v>VCAP?'<div style="font-size:11px;font-weight:700;color:var(--red);background:var(--rl);border-radius:3px;padding:1px 5px;margin-top:2px">+' + fmtVal(v-VCAP) + ' OVER</div>':''}
          <div class="wk-count">${cnt} order${cnt!==1?'s':''}</div>
          <input type="number" class="wk-cap-inp" data-wk-c="${wk}" value="${cap}" min="1" step="10" title="Set capacity for this week" style="width:52px;font-size:10px;padding:2px 4px;border:1px solid var(--b2);border-radius:3px;text-align:center;margin-top:4px;background:${cap!==WCAP?'#fffbeb':'#fff'}">
        </div>`;
      }).join('')}
      <div class="wk-cap${fWeek==='unscheduled'?' selected':''}" data-wk="unscheduled">
        <div class="wk-label" style="color:var(--amber)">Unscheduled</div>
        <div class="wk-bar-wrap"><div class="wk-bar warn" style="width:100%"></div></div>
        <div class="wk-hours warn">${unschHrs}h · ${fmtVal(PO.filter(o=>!o.plannedWeek).reduce((a,o)=>a+(o.value||0),0))}</div>
        <div class="wk-count">${unschCnt} order${unschCnt!==1?'s':''}</div>
      </div>
    </div>
  </div>

  <div class="board-toolbar">
    <input class="search-input" id="srch" placeholder="Search WO, title, customer…" value="${escA(srch)}">
    <select class="filter-sel" id="fwk">
      <option value="">All weeks</option>
      <option value="unscheduled"${fWeek==='unscheduled'?' selected':''}>Unscheduled</option>
      ${weeks.map(w=>`<option value="${w}"${fWeek===w?' selected':''}>${wkLbl(w)}</option>`).join('')}
    </select>
    <select class="filter-sel" id="fcust">
      <option value="">All customers</option>
      ${custs.map(c=>`<option value="${escA(c)}"${fCust===c?' selected':''}>${escA(c)}</option>`).join('')}
    </select>
    <button class="btn btn-s" id="btn-fdel" style="${fDel?'background:#e8f1fd;border-color:#b0c8e8;color:#1a56db;font-weight:600':''}">🚚 On delivery board</button>
    ${(n=>n?`<button class="btn btn-s" id="btn-flate" title="Jobs whose planned week ends AFTER their Cienapps due date — dates have drifted since they were planned. Click to see only these and re-plan them." style="${fLate?'background:#fdecea;border-color:#e57368;font-weight:700;':''}border-color:#e57368;color:#c0392b">⚠ ${n} late vs due</button>`:'')(PO.filter(isLateVsDue).length)}
    <button class="btn btn-s" id="btn-clf">Clear filters</button>
    <span style="margin-left:auto;font-size:12px;color:var(--t2)">${orders.length} shown · ${PO.filter(o=>o.plannedWeek).length} scheduled · ${unschCnt} unscheduled${PO.length<DB.orders.length?` · <a href="#" id="go-ship" style="color:var(--t2)">${DB.orders.length-PO.length} shipped</a>`:''}</span>
    <button class="btn btn-g" id="btn-pwo" title="Create a work order directly in the planner — numbered P-…, it follows the same workflow as every Cienapps job but is never touched by imports">＋ New Work Order</button>
    <button class="btn btn-s" id="btn-snap" title="Save a single read-only HTML file with all current data baked in — email it or open it anywhere, no database or internet needed">📸 Offline Snapshot</button>
    <button class="btn btn-s" id="btn-clearall" style="border-color:var(--red);color:var(--red)">Clear All Orders</button>
  </div>
  <div id="pwo-form" style="display:none;background:#fff;border:2px solid #7c5cd6;border-radius:10px;padding:14px;margin-bottom:14px;max-width:1400px">
    <div style="font-size:13px;font-weight:800;color:#7c5cd6;margin-bottom:8px">New planner work order — numbered automatically (P-…), identified in purple, follows the full workflow (board → cutting lists → delivery → driver), never altered or removed by Cienapps imports.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div><label class="pwo-l">Title *</label><input id="pwo-title" placeholder="e.g. REPLACEMENT DOORS HOUSE 12" style="width:260px"></div>
      <div><label class="pwo-l">Customer</label><input id="pwo-cust" style="width:160px"></div>
      <div><label class="pwo-l">Floor</label><input id="pwo-floor" style="width:60px"></div>
      <div><label class="pwo-l">Unit</label><input id="pwo-unit" style="width:60px"></div>
      <div><label class="pwo-l">Value €</label><input id="pwo-val" type="number" min="0" style="width:90px"></div>
      <div><label class="pwo-l">Hours (blank = estimate from value)</label><input id="pwo-hrs" type="number" min="0" step="0.5" style="width:90px"></div>
      <div><label class="pwo-l">Due date *</label><input id="pwo-due" type="date" style="width:140px"></div>
      <button class="btn btn-g" id="pwo-add">Create</button>
      <button class="btn btn-s" id="pwo-cancel">Cancel</button>
    </div>
  </div>

  <div class="wo-table-wrap">
    <table class="wo-table">
      <thead><tr>
        <th style="width:28px;text-align:center" title="Select ALL shown work orders (respects the filters) — then Group into one line"><input type="checkbox" class="gsel" id="gselall"${orders.length>0&&orders.every(o=>grpSel.has(o.wo))?' checked':''}></th>
        <th style="width:22px"></th>
        <th style="width:34px;text-align:center" title="Delivery next week">🚚</th>
        <th data-s="wo" class="${sortCol==='wo'?sortDir>0?'asc':'desc':''}">WO #</th>
        <th data-s="floor" class="${sortCol==='floor'?sortDir>0?'asc':'desc':''}">Floor</th>
        <th data-s="unit" class="${sortCol==='unit'?sortDir>0?'asc':'desc':''}">Unit</th>
        <th data-s="title" class="${sortCol==='title'?sortDir>0?'asc':'desc':''}">Title</th>
        <th data-s="customer" class="${sortCol==='customer'?sortDir>0?'asc':'desc':''}">Customer</th>
        <th data-s="hours" class="${sortCol==='hours'?sortDir>0?'asc':'desc':''}" style="text-align:right">Hrs</th>
        <th data-s="dueDate" class="${sortCol==='dueDate'?sortDir>0?'asc':'desc':''}">Due Date</th>
        <th data-s="value" class="${sortCol==='value'?sortDir>0?'asc':'desc':''}" style="text-align:right">Value</th>
        <th data-s="step">Step</th>
        <th data-s="plannedWeek">Planned Week</th>
        <th style="width:30px"></th>
      </tr>
      <tr class="cf-row">
        <td></td><td></td>
        <td>${nColF?`<button class="cf-clear" id="btn-cfclear" title="Clear all column filters">✕ ${nColF}</button>`:''}</td>
        ${['wo','floor','unit','title','customer','hours','dueDate','value','step','plannedWeek'].map(k=>`<td><input class="cf-inp${String(colF[k]||'').trim()?' on':''}" data-cf="${k}" value="${String(colF[k]||'').replace(/"/g,'&quot;')}" placeholder="⌕"></td>`).join('')}
        <td></td>
      </tr></thead>
      <tbody id="tbody">
        ${!items.length?`<tr><td colspan="14"><div class="empty">No orders match filters</div></td></tr>`:''}
        ${bodyHTML}
      </tbody>
    </table>
    <div class="table-footer">
      <span>Shown: <strong>${Math.round(orders.reduce((a,o)=>a+(+o.hours||0),0)*10)/10}h</strong></span>
      <span>Total orders: <strong>${PO.length}</strong></span>
      <span>Total hours: <strong>${Math.round(PO.reduce((a,o)=>a+(+o.hours||0),0)*10)/10}h</strong></span>
      <span>Total value: <strong>${fmtVal(PO.reduce((a,o)=>a+(o.value||0),0))}</strong></span>
      ${(()=>{const weeks=get8Wks();const overH=weeks.filter(w=>wkHrs(w)>wkCap(w));const overV=weeks.filter(w=>wkVal(w)>VCAP);return overH.length>0?'<span style="color:var(--red);font-weight:600">⚠ '+overH.length+' week'+(overH.length!==1?'s':'')+' over hours capacity</span>':'';})()}
      ${(()=>{const weeks=get8Wks();const overV=weeks.filter(w=>wkVal(w)>VCAP);return overV.length>0?'<span style="color:var(--red);font-weight:600">⚠ '+overV.length+' week'+(overV.length!==1?'s':'')+' over value capacity</span>':'';})()}
    </div>
  </div>
  ${grpSel.size?`<div class="grp-bar">
    <b>${grpSel.size} selected</b><span>${Math.round(selH*10)/10}h · €${Math.round(selV).toLocaleString()}</span>
    <button class="btn btn-g" id="btn-mkgrp" style="padding:6px 14px">Group into one line</button>
    <button id="btn-gclear" style="background:none;border:none;color:#bcd0f0;text-decoration:underline;cursor:pointer;font-size:12px">clear</button>
  </div>`:''}
  </div>`;

  // Bind events
  document.querySelectorAll('[data-wk]').forEach(el=>el.onclick=()=>{fWeek=fWeek===el.dataset.wk?'':el.dataset.wk;render();});
  document.querySelectorAll('.wk-cap-inp').forEach(inp=>{
    inp.onclick=e=>e.stopPropagation(); // prevent week filter toggle
    inp.onchange=function(){
      const wk=this.dataset.wkC;
      const v=parseInt(this.value)||WCAP;
      if(!DB.weekCaps)DB.weekCaps={};
      if(v===WCAP)delete DB.weekCaps[wk]; // reset to default
      else DB.weekCaps[wk]=v;
      sched();render();
    };
  });
  const si=document.getElementById('srch');
  if(si)si.oninput=function(){
    srch=this.value;const pos=this.selectionStart;render();
    const n=document.getElementById('srch');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
  };
  const fw=document.getElementById('fwk');if(fw)fw.onchange=function(){fWeek=this.value;render();};
  const fc=document.getElementById('fcust');if(fc)fc.onchange=function(){fCust=this.value;render();};

        }
      };
    });
  }

/* ---------- 📦 Shipped tab: jobs Cienapps calls shipped/invoiced. Off the Capacity Board, kept here until the
   planner marks installation complete. Searchable; a job can be brought back to the board. Works on a phone (Chrome). ---------- */
let shSrch='',shDel='',shDone=false,shHoldQ='';
/* S1 (Garry 10 Nov; "Need to be able to update on capacity board to shipped or installed or completed. The job drops off
   capacity board after shipping", 12 Nov): the office moves a job to 9. JOB SHIPPED / 10. INSTALLED TO BE INVOICE /
   11. COMPLETED AND INVOICED by hand. Confirmed first. The job then leaves the board and the week totals exactly like one
   Cienapps called shipped (shippedAt / shippedStep); 10 and 11 mark it installed. "Installation complete" stays its own button
   (Garry 11 Nov). A job on a van stays on Deliveries until the driver confirms (same rule as an import). The step holds until a
   Cienapps import moves the job on (steps only move forward; while Cienapps is behind it is listed in Export Changes). Logged in
   the job's history; stepHand = what it was, so "↩ Bring back to board" can put the old step back. Never deletes anything. */
function stepShipHand(o,v){
  const n=stepNo(v),was=String(o.step||'').trim(),c=was?stepCmp(v,was):1;
  if(c!==null&&c<0&&isShipped(o)){toast('Steps only move forward — '+o.wo+' is already at '+stepShort(was));render();return;}
  const what=n===9?'Job shipped':n===10?'Installed (to be invoiced)':'Completed and invoiced';
  if(!confirm('Set '+o.wo+' to "'+v+'"?\n\n'+what+(isShipped(o)?'.':' — it leaves the Capacity Board and the week totals and goes to the 📦 Shipped tab'+(o.delv&&!o.delDelivAt&&!o.delDone?' (it stays on 🚚 Deliveries until the driver confirms)':'')+'.')
    +'\n\nCienapps is not changed — it is listed in Export Changes until Cienapps has it.')){render();return;}
  officeWho(by=>{const at=nowISO(),p0=o.stepHand&&String(o.step||'').trim()===o.stepHand.to?o.stepHand:null,h={from:p0?p0.from:was,to:v,at,by,...(p0&&p0.inst?{inst:true}:{})}; // 9 then 10 by hand: ↩ still goes back to the step before 9
    logEdit(o,'Step '+(was||'—')+' → '+v+' (set by hand)',by);o.step=v;
    if(!isShipped(o)){o.shippedAt=at;o.shippedStep=v;delete o.shipBack;logEdit(o,'Moved to Shipped — set by hand: '+v,by);}
    if(n>=10&&!o.installedAt){o.installedAt=at;h.inst=true;logEdit(o,'Installed — set by hand',by);}
    o.stepHand=h;sched();render();toast(o.wo+' — '+stepShort(v).toLowerCase()+(isShipped(o)?' · now on the 📦 Shipped tab':''));},()=>render());
}
function renderShipped(app){
  const am=attnMap();
  const all=DB.orders.filter(isShipped);
  let os=all.filter(o=>shDone||!o.completeAt);

      <div class="sh-b">
        ${o.completeAt?`<button class="btn btn-s" data-shu="${escA(o.wo)}">Undo complete</button>`:`<button class="btn btn-g" data-shc="${escA(o.wo)}">✓ Installation complete</button>`}
        <button class="btn btn-s" data-shb="${escA(o.wo)}">↩ Bring back to board</button>

  app.innerHTML=`<div class="pg">

      <input class="search-input" id="sh-q" placeholder="Search WO, title, customer, unit…" value="${escA(shSrch)}">
      <select class="filter-sel" id="sh-del">
        <option value=""${shDel===''?' selected':''}>Delivered: all</option>
        <option value="yes"${shDel==='yes'?' selected':''}>Delivered: yes</option>
        <option value="no"${shDel==='no'?' selected':''}>Delivered: no</option>
      </select>
      <label class="sh-chk"><input type="checkbox" id="sh-done"${shDone?' checked':''}> Show completed (${nDone})</label>
    </div>
    <div style="font-size:12px;color:var(--t2);margin:2px 0 10px">${os.length} shown · ${all.length} shipped in total. Shipped jobs are off the Capacity Board and out of the week totals; jobs on a van stay on 🚚 Deliveries until the driver confirms.</div>
    ${shown.length?shown.map(card).join(''):`<div class="empty">${all.length?'No shipped jobs match.':'No shipped jobs yet — they arrive here when a Cienapps import says shipped or invoiced.'}</div>`}
    ${os.length>shown.length?`<div style="font-size:12px;color:var(--t3);padding:6px 0">…and ${os.length-shown.length} more — search to narrow down</div>`:''}
    <div id="sh-hold" style="margin-top:22px;border-top:2px solid var(--b2);padding-top:12px">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px">⏸ On hold in Cienapps <span id="sh-hcnt" style="font-weight:400;color:var(--t2)">(${held.length})</span></div>
      <div style="font-size:12px;color:var(--t2);margin-bottom:8px">Step 12 ON HOLD / DELETE. Off the Capacity Board, week totals and capacity — never deleted. The next import with any other step puts the job back on the board.</div>
      ${held.length?`<input class="search-input" id="sh-hq" placeholder="Search on-hold jobs…" value="${escA(shHoldQ)}" style="margin-bottom:8px">`:''}
      ${hs.length?hs.slice(0,300).map(o=>`<div class="sh-card"><div class="sh-top"><span class="wo-num">${escA(o.wo)}</span>${fuHTML(o)}<span class="sh-pill no">⏸ On hold</span>${(am.get(o.wo)||0)?`<span class="sh-pill warn" title="Waiting (N/A) lines on its cutting/fittings lists">⚠ ${am.get(o.wo)} line${am.get(o.wo)!==1?'s':''} waiting</span>`:''}${!delHidden(o)&&o.delv?'<span class="sh-pill warn">🚚 Already loaded / on a van</span>':''}</div>
        <div class="sh-t">${escA(o.title||'')}</div><div class="sh-m">${escA(o.customer||'')} · on hold since ${dt(o.holdAt)} · ${o.hours!=null?escA(String(o.hours))+'h · ':''}due ${fmt(o.dueDate)}</div>${o.holdDel?`<div class="sh-m">Taken off Deliveries when it went on hold (was ${escA(o.holdDel)}) — not put back automatically</div>`:''}</div>`).join(''):`<div class="empty">${held.length?'No on-hold jobs match.':'No jobs on hold.'}</div>`}

  const hq=document.getElementById('sh-hq');
  if(hq)hq.oninput=function(){shHoldQ=this.value;const pos=this.selectionStart;render();const n=document.getElementById('sh-hq');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}};
  const q=document.getElementById('sh-q');
  if(q)q.oninput=function(){shSrch=this.value;const pos=this.selectionStart;render();const n=document.getElementById('sh-q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}};
  const sd=document.getElementById('sh-del');if(sd)sd.onchange=function(){shDel=this.value;render();};
  const sc=document.getElementById('sh-done');if(sc)sc.onchange=function(){shDone=this.checked;render();};
  const find=wo=>DB.orders.find(x=>x.wo===wo);
  app.querySelectorAll('[data-shc]').forEach(b=>b.onclick=()=>{const o=find(b.dataset.shc);if(!o)return;
    officeWho(by=>{o.completeAt=nowISO();o.completeBy=by;delete o.completeOverride;logEdit(o,'Installation complete',by);sched();render();toast(o.wo+' — installation complete ✓');});});
  app.querySelectorAll('[data-shu]').forEach(b=>b.onclick=()=>{const o=find(b.dataset.shu);if(!o)return;

  app.querySelectorAll('[data-shb]').forEach(b=>b.onclick=()=>{const o=find(b.dataset.shb);if(!o)return;
    if(!confirm('Bring '+o.wo+' back to the Capacity Board?\n\nIt stays there even though Cienapps says shipped — until Cienapps moves it on (e.g. to invoiced).'))return;
    officeWho(by=>{o.shipBack={at:nowISO(),by,cs:o.cienStep||o.shippedStep||''};delete o.shippedAt;delete o.completeAt;delete o.completeBy;

/* ---------- Deliveries: plan next week's deliveries by vehicle and day (v2) ---------- */
const DEL_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
const DEL_VEH=[
  {k:'ARTIC',  n:'Artic',        cat:'Artic', sub:''},
  {k:'VOLVO',  n:'Volvo',        cat:'Truck', sub:''},
  {k:'RENAULT',n:'Renault',      cat:'Truck', sub:''},
  {k:'IVECO',  n:'Iveco',        cat:'Truck', sub:''},
  {k:'CRAFTER',n:'Crafter',      cat:'Truck', sub:''},
  {k:'SMART',  n:'Smart Movers', cat:'Truck', sub:'external haulier'}
];
const vehLbl=k=>{const v=DEL_VEH.find(x=>x.k===k);return v?v.n:'';};
let delDragList=null,delFilter='';
const delSel=new Set();

/* On hold in Cienapps (12): off the Deliveries board and badge. A job already loaded / on the road / delivered stays —
   it is physically on a van and the driver must not lose it. */
function delHidden(o){return isOnHold(o)&&!o.delLoadedAt&&!o.delDispAt&&!o.delDelivAt&&!o.delDone;}
/* Planner overrides an import respects until the Cienapps step moves beyond the step they were made at:
   delvOverride — untagged from delivery by hand (stops the 7/8 auto-tag); completeOverride — "Undo complete" (stops 11 re-completing). */
function delvMark(o){if(o.delv)delete o.delvOverride;else o.delvOverride=o.step||o.cienStep||'(none)';}
function ovrHolds(ov,cs){if(!ov)return false;const a=stepRank(cs),b=stepRank(ov);return !(a!==null&&b!==null&&a>b);}
/* Garry, 4 Nov: a job whose step is set to 7 ASSEMBLY COMPLETE or 8 PALLETED in the planner is ticked for delivery
   (pool, no van/day). Never untags; a job already tagged keeps its van/day; a hand-untag at this step or later is
   respected (same rule as the import); shipped jobs are left alone. On hold still hides it from the board (delHidden). */

// Part-load guard: other live jobs for the SAME unit (or same board group) that are NOT dispatched and NOT in this load
function partLoadGaps(jobs){

function lqFoldV1(){ // one fold at a time: a second call waits for the one running (and gets its count)

          // lists, where a change made on another screen is never overwritten) — the line is left as the database has it.

      if(sv==='over'){LQ.err='';updSaveBar();lqKick(0);return 0;}

async function lqSaveSure(){

// One old-list row's tick and wait in a plan's settings (missing → null), and setting them back
function lqLnSt(s,list,k){s=s||{};const t=((s.listRow||{})[list]||{})[k],h=((s.listHold||{})[list]||{})[k];return{t:t||null,h:h||null};}

function lqWhyAll(bad){

function lsReadBook(data){
  const wb=XLSX.read(data,{type:'array',cellDates:true,sheetStubs:true}); // stubs: a formula with no saved value still shows its formula
  const out={project:'',sheets:[],skipped:[]};
  wb.SheetNames.forEach(sn=>{
    if(lsSkipSheet(sn)){out.skipped.push(sn);return;}
    const g=lsSheetAoa(wb.Sheets[sn]),p=lsParseGrid(g.v,{formulas:g.f,sheet:sn});
    if(!p.rows.some(r=>r.k==='part')){out.skipped.push(sn);return;}
    p.rows.forEach(r=>{r.keep=!r.info;}); // a line that isn't a part (room breakdown) starts unticked
    out.sheets.push({name:String(sn).trim(),meta:p.meta,rows:p.rows,warn:p.warn,on:true});
    if(p.meta.project&&!out.project)out.project=p.meta.project;

}

}

async function lsCountCheck(src){
  src=src||DB;
  const ids=(src.lists||[]).map(l=>l.id),got=await lsGetIn('list_lines','list_id',ids),bad=[];
  (src.lists||[]).forEach(l=>{
    const a=lsOldCounts(l,src),ln=got.filter(x=>x.list_id===l.id&&x.removed_rev==null&&x.kind!=='hdr');
    const b={n:ln.length,done:ln.filter(x=>x.status==='cut'||x.status==='got-out').length,wait:ln.filter(x=>x.status==='waiting').length};
    if(a.n!==b.n||a.done!==b.done||a.wait!==b.wait)bad.push({id:l.id,name:l.name,project:l.project||'',old:a,now:b});
  });
  return{lists:ids.length,lines:got.filter(x=>x.removed_rev==null&&x.kind!=='hdr').length,bad};
}
function lsDownload(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
async function lsMigrate(by){
  if(V2())throw new Error('the new lists are already switched on');
  if(!DB.loaded||DB.loadFailed)throw new Error('the plan is not loaded on this screen');
  // 0. this PC's own unsaved work first, then the latest planner record: ticks saved by other screens just before
  //    Migrate was pressed are copied, not left behind
  for(let i=0;i<100&&(saveT||SAVING);i++){if(saveT&&!SAVING){clearTimeout(saveT);saveT=null;await saveDB();}else await new Promise(r=>setTimeout(r,100));}
  const t0=nowISO();
  await loadDB();if(!DB.lastLoadOk)throw new Error('could not read the latest planner record — check the connection and try again');
  if(V2())throw new Error('the new lists were switched on by another screen meanwhile');
  if(DB.listStore==='migrating'&&!confirm('A migration was started and did not finish — or is running on another screen right now.\n\nRun it now?'))throw new Error('not started — another migration may be running');
  const src=clone({lists:DB.lists||[],listWBs:DB.listWBs||{},listRow:DB.listRow||{},listHold:DB.listHold||{},listDone:DB.listDone||{},holdLog:DB.holdLog||[]});
  // 1. a verified copy in planner_backups, and one on this PC — taken before the switch is touched, and without the
  //    switch in it: pasting it back can never turn the new lists on or off (only Migrate / Switch back do that)
  await backupNow('pre-lists-v2');updBakLine();
  lsDownload('WPF_Backup_pre-lists-v2_'+new Date().toISOString().slice(0,10)+'.json',{backedUpAt:new Date().toISOString(),orders:DB.orders,nid:DB.nid,settings:bakSettings()});
  // 'migrating' first: the new tables only take writes while the switch is 'migrating' or 'v2' (database rule)
  DB.listStore='migrating';clearTimeout(saveT);await saveDB();
  if(DB.saveFailed){DB.listStore='v1';throw new Error('could not start the migration (the planner record was not saved) — nothing changed');}
  const undo=async()=>{DB.listStore='v1';clearTimeout(saveT);await saveDB();}; // stopped: the floor stays on the old lists
  let m,ck;
  try{
  // 2-4. projects, lists, lines (fixed ids, so a second run gives the same result), old waiting history
  m=lsMigrationRows(await lsGet('projects?select=*'),src);
  await lsUpsert('projects',m.projects);
  await lsUpsert('lists',m.lists);
  await lsUpsert('list_lines',m.lines);
  const have=new Set(m.lists.map(l=>l.id)),mine=new Set(m.lines.map(x=>x.id));
  const extra=(await lsGetIn('list_lines','list_id',[...have])).filter(x=>x.removed_rev==null&&!mine.has(x.id)); // e.g. from an earlier switch-on
  for(const x of extra){const r=await fetch(SUPA_URL+'/list_lines?id=eq.'+encodeURIComponent(x.id),{method:'PATCH',headers:SUPA_WHDR,body:JSON.stringify({removed_rev:+((m.lists.find(l=>l.id===x.list_id)||{}).rev)||1})});if(!r.ok)throw new Error('could not set aside line '+x.id);}
  const seen=new Set((await lsGet('list_events?select=cid&cid=like.mig:*')).map(e=>e.cid)),ev=m.events.filter(e=>!seen.has(e.cid));
  for(let i=0;i<ev.length;i+=400){const r=await fetch(SUPA_URL+'/list_events',{method:'POST',headers:SUPA_WHDR,body:JSON.stringify(ev.slice(i,i+400))});if(!r.ok)throw new Error('saving the waiting history failed: HTTP '+r.status);}
  // 5. count check — any difference stops here and the switch is NOT set
  ck=await lsCountCheck(src);
  if(ck.bad.length){await undo();return{ok:false,check:ck,m};}
  }catch(e){await undo();throw e;}
  // 6. switch on. listStoreAt = when this migration started: old-format ticks after that are rescued by every screen.
  DB.listStore='v2';DB.listStoreAt=t0;
  lsStampProc(); // jobs already processed on switch-on day: their lists are due counted from today
  clearTimeout(saveT);await saveDB();
  if(DB.saveFailed){DB.listStore='v1';throw new Error('the lists were copied and checked, but the switch could not be saved — try again');}
  lsReset();await lsLoad();lsStart();
  // 7. anything another screen saved in the old format while this was copying (whatever its clock says) goes in now
  await loadDB();
  const same=(a,b)=>JSON.stringify(a||null)===JSON.stringify(b||null);
  lsRescue((kind,v,lid,k)=>!same(v,kind==='tick'?((src.listRow||{})[lid]||{})[k]:((src.listHold||{})[lid]||{})[k]));
  await lqSend();
  return{ok:true,check:ck,m};
}
// Switch back: rebuild the old-format data from the tables (lists made since included), then listStore 'v1'
function lsOldFrom(listRows0,lines){
  const rows=[],ticks={},holds={};
  lines.filter(x=>x.removed_rev==null&&x.status!=='na').sort((a,b)=>(a.seq||0)-(b.seq||0)).forEach(x=>{
    const n=v=>v==null||v===''?'':+v;
    const r=x.kind==='hdr'?{k:'hdr',item:lsHdrName(x),note:x.note||''}
      :x.kind==='saw'?{k:'saw',item:x.part||'',qty:lsQty(x.qty),L:n(x.length_mm),W:n(x.width_mm),mat:x.material||'',note:[lsEdgeTxt(x),x.note].filter(s=>String(s||'').trim()).join(' · ')}
      :{k:'fit',item:x.part||'',qty:lsQty(x.qty),mat:x.material||'',note:x.kind==='buy'?['Bought in',[x.length_mm,x.width_mm].filter(v=>v!=null&&v!=='').map(v=>+v).join(' × '),x.note].filter(s=>String(s||'').trim()).join(' · '):x.note||''}; // the old store has no "bought in": a Stores line that says so (never the saw)
    r.lid=x.id;rows.push(r);
    if(x.kind==='hdr')return;
    const k=v1Key(r);
    if(x.status==='cut'||x.status==='got-out')ticks[k]={m:r.k,at:x.status_at||'',by:x.status_by||''};
    const base={m:r.k,item:r.item,mat:r.mat,qty:r.qty,L:r.L||'',W:r.W||''};
    if(x.status==='waiting')holds[k]={...base,st:'hold',at:x.status_at||'',by:x.status_by||''};
    else if(x.released_at&&x.status==='todo')holds[k]={...base,st:'rel',at:x.status_at||'',by:x.status_by||'',relAt:x.released_at,relBy:x.released_by||''};
  });
  return{rows,ticks,holds};
}
async function lsSwitchBack(by){
  if(DB.listStore==='v1'){await loadDB();if(DB.listStore==='v1')return{lists:(DB.lists||[]).length,already:true};} // already done (e.g. a second Finish)
  if(!V2())throw new Error('the new lists are not switched on');
  // latest planner record first: old-tab ticks in it are rescued into the tables, then the rebuild replaces them
  // (rebuilt from an out-of-date copy, the merge would treat them as another screen's change and keep them)
  await loadDB();if(!DB.lastLoadOk)throw new Error('could not reach the planner database');
  if(DB.listStore==='v1')return{lists:(DB.lists||[]).length,already:true}; // switched back on another screen meanwhile
  if(!V2())throw new Error('the lists are not on the new store');
  lsReset();await lsLoad();if(!LST.loaded)throw new Error('could not reach the lists tables');
  const finishing=DB.listStore==='switching'; // 'Finish switch back': the tables already refuse changes
  lsRescue();
  if(!finishing){
    await lqSend();
    if(LQ.q.length)throw new Error('this screen still has '+LQ.q.length+' unsent change'+(LQ.q.length!==1?'s':'')+' — get a signal and try again');
    // 'switching' first: from now on the database refuses every list change (lists_switch_on), so nothing can land in the
    // tables after they are read below; devices keep such ticks queued and put them in the old lists once it says 'v1'
    DB.listStore='switching';clearTimeout(saveT);await saveDB();
    if(DB.saveFailed){DB.listStore='v2';throw new Error('could not start the switch back (planner not saved) — nothing changed');}
  }else if(LST.rescuing)await LST.rescuing; // finishing: rescued old-tab ticks are folded into the rebuilt old lists below
  try{return await lsSwitchBack2();}
  catch(e){DB.listStore='v2';clearTimeout(saveT);await saveDB();throw e;} // put the switch back on 'v2': nothing half-done
}
async function lsSwitchBack2(){
  const ls0=(await lsGet('lists?select=*')).filter(l=>!l.archived&&!l.is_template);
  const pj=new Map((await lsGet('projects?select=*')).map(p=>[p.id,p.name]));
  const lines=await lsGetIn('list_lines','list_id',ls0.map(l=>l.id));
  const frozen=new Map((DB.lists||[]).map(l=>[l.id,l]));
  const NL=[],WB={},LR={},LH={},LD={};
  ls0.forEach(r=>{
    const o=lsOldFrom([],lines.filter(x=>x.list_id===r.id)),f=frozen.get(r.id);
    const wb=f&&f.wb?f.wb:'WB'+r.id,sheet=r.name;
    WB[wb]=WB[wb]||{project:pj.get(r.project_id)||'',sheets:{},...(r.source==='manual'?{manual:true}:{})};
    WB[wb].sheets[sheet]=o.rows;
    NL.push({id:r.id,wb,sheet,name:r.name,project:pj.get(r.project_id)||'',sdate:r.sdate||'',saw:o.rows.filter(x=>x.k==='saw').length,fit:o.rows.filter(x=>x.k==='fit').length,
      wos:(r.wos||[]).slice(),up:r.updated_at,noCut:!!r.no_cut,noFit:!!r.no_fit,...(r.source==='manual'?{manual:true}:{}),log:r.log||[]});
    if(Object.keys(o.ticks).length)LR[r.id]=o.ticks;
    LH[r.id]=o.holds;
    const d={};if(r.saw_done_at)d.saw={at:r.saw_done_at,by:r.saw_done_by||''};if(r.fit_done_at)d.fit={at:r.fit_done_at,by:r.fit_done_by||''};
    if(Object.keys(d).length)LD[r.id]=d;
  });
  DB.lists=NL;DB.listWBs=WB;DB.listRow=LR;DB.listHold=LH;DB.listDone=LD;
  DB.listStore='v1';DB.listStoreAt=nowISO(); // 'v1', not blank: a blank value is skipped by the merge
  // Changes still queued on THIS screen (refused while 'switching', or rescued old-tab ticks): one the tables already
  // applied (its tap id is in list_events) is in the rebuild — dropped; the rest go straight into the rebuilt old lists.
  const q0=lqRead();
  if(q0.length){const got=new Set((await lsGetIn('list_events','cid',q0.map(e=>e.cid).filter(Boolean))).map(e=>e.cid));
    if(got.size)lqMut(qq=>qq.splice(0,qq.length,...qq.filter(e=>!got.has(e.cid))));}
  lsStart();clearTimeout(saveT);await saveDB();
  if(DB.saveFailed){DB.saveFailed=false;
    // the save may have landed with only the reply lost: ask the record what it really says before telling the office anything
    let sv=null;try{sv=await lqSwitchNow();}catch(e){}
    if(sv!=='v1')throw new Error(sv==null?'the old lists were rebuilt but the save could not be confirmed (no reply) — refresh Settings to see which lists the floor is on before trying again'
      :'the old lists were rebuilt but could not be saved — the planner record still says "'+sv+'", so the switch stays on the new lists; try again');
    await loadDB(); // it did land: carry on from the record as saved
  }
  if(lqRead().length)await lqFoldV1(); // folds and saves; anything it can't place stays queued and is shown
  return{lists:NL.length};
}
/* Tabs still on the old code after the switch keep writing ticks / holds into the frozen copy. Anything newer than
   listStoreAt is copied into the tables (done still wins — the database decides). Each one has a fixed id, so every
   screen that finds it sends the same change and the database applies it once. */
// pick(kind,v): which old-format entries to copy — default: newer than the switch. Lines not loaded yet are fetched first
// (the queue waits for that), so a fresh screen can rescue straight away.
function lsRescue(pick){
  if(!V2()||!LST.loaded||!DB.listStoreAt)return 0;
  const T=DB.listStoreAt;let n=0;
  // Default: an old-format entry that differs from what the line's migration copied (its fingerprint) — never the device
  // clock. Lines without a fingerprint (made after the switch) fall back to "newer than the switch".
  const custom=!!pick,sigNow=(lid,k)=>lsHash(JSON.stringify({t:((DB.listRow||{})[lid]||{})[k]||null,h:((DB.listHold||{})[lid]||{})[k]||null}));
  const recent=(kind,v)=>String((kind==='rel'?v.relAt:v.at)||'')>new Date(Date.parse(T)-86400000).toISOString(); // a day either side of the switch
  pick=pick||recent;
  const ok=(kind,v,lid,k,x)=>custom?pick(kind,v,lid,k):x.mig_sig!=null?x.mig_sig!==sigNow(lid,k):String((kind==='rel'?v.relAt:v.at)||'')>T;
  const want=new Set();
  Object.entries(DB.listRow||{}).forEach(([lid,t])=>Object.entries(t||{}).forEach(([k,v])=>{if(v&&pick('tick',v,lid,k))want.add(lid);}));
  Object.entries(DB.listHold||{}).forEach(([lid,h])=>Object.entries(h||{}).forEach(([k,v])=>{if(v&&pick(v.st==='rel'?'rel':'hold',v,lid,k))want.add(lid);}));
  const need=[...want].filter(id=>!LST.full.has(id)); // only lists with recent entries are fetched; loaded lists are all checked below
  if(need.length){if(!LST.rescuing)LST.rescuing=lsGetIn('lists','id',need.filter(id=>!LST.l.has(id))).then(r=>{lsPut('lists',r);return lsLines(need);}).catch(()=>{}).then(()=>{LST.rescuing=null;if([...want].every(id=>LST.full.has(id)))lsRescue(pick);});return 0;}
  const byList=new Map();
  const lineOf=(lid,k)=>{let m=byList.get(lid);if(!m){m=new Map();lsLinesOf(lid).forEach(x=>{if(x.removed_rev!=null||x.kind==='hdr'||x.status==='na')return;
      const kk=v1Key({k:x.kind,item:x.part,L:x.kind==='saw'&&x.length_mm!=null?+x.length_mm:'',W:x.kind==='saw'&&x.width_mm!=null?+x.width_mm:'',mat:x.material,note:x.kind==='saw'?[lsEdgeTxt(x),x.note].filter(s=>String(s||'').trim()).join(' · '):x.note});
      if(!m.has(kk))m.set(kk,[]);m.get(kk).push(x);});byList.set(lid,m);}return m.get(k)||[];};
  let done0;try{done0=new Set(JSON.parse(localStorage.getItem('wpfRescued')||'[]'));}catch(e){done0=new Set();}
  const send=(x,st,by,tag)=>{const cid='rescue:'+lsHash(x.id+'|'+tag);if(done0.has(cid)||LQ.q.some(e=>e.cid===cid))return;
    done0.add(cid);try{localStorage.setItem('wpfRescued',JSON.stringify([...done0].slice(-2000)));}catch(e){} // once per device; the database also applies it once
    const e={t:'line',cid,id:x.id,list:x.list_id,act:st==='release'?'release':'status',v:+x.version,rev:+((LST.l.get(x.list_id)||{}).rev)||1,from:x.status,at:nowISO(),by:lqBy(by),quiet:true};
    if(st!=='release')e.status=st;else{e.sa=x.status_at==null?null:x.status_at;e.ra=x.released_at==null?null:x.released_at;}lqMut(q=>q.push(e));n++;};
  Object.entries(DB.listRow||{}).forEach(([lid,t])=>Object.entries(t||{}).forEach(([k,v])=>{if(!v)return;
    lineOf(lid,k).forEach(x=>{if(!ok('tick',v,lid,k,x))return;const st=x.kind==='saw'?'cut':'got-out';if(x.status!==st)send(x,st,v.by,'t|'+k+'|'+v.at);});}));
  Object.entries(DB.listHold||{}).forEach(([lid,h])=>Object.entries(h||{}).forEach(([k,v])=>{if(!v)return;
    if(v.st==='hold')lineOf(lid,k).forEach(x=>{if(ok('hold',v,lid,k,x)&&x.status==='todo')send(x,'waiting',v.by,'h|'+k+'|'+v.at);});
    if(v.st==='rel')lineOf(lid,k).forEach(x=>{if(ok('rel',v,lid,k,x)&&x.status==='waiting')send(x,'release',v.relBy,'r|'+k+'|'+v.relAt);});}));
  if(n)lqKick(0);
  return n;
}

function lsBindPanel(){
  const msg=t=>{const e=document.getElementById('ls-msg');if(e)e.innerHTML=t;};
  const mg=document.getElementById('ls-mig');
  if(mg)mg.onclick=()=>{if(!lsAdminOk())return;if(!confirm('Copy all cutting lists into the new tables and switch over?\n\nClose every other planner tab and phone first (saw, stores, office) — like on Stage 1 go-live day.'))return;
    mg.disabled=true;msg('Migrating… do not close this page.');
    lsMigrate(whoNow()).then(r=>{window.LSMIG=r;
      if(r.ok){render();toast('Lists migrated — '+r.check.lists+' lists, '+r.check.lines+' lines, counts match ✓');}
      else{mg.disabled=false;msg('<b style="color:#c0392b">Counts did not match — NOT switched over.</b> Nothing changed for the floor.<br>'+r.check.bad.slice(0,20).map(b=>escA(b.project+' — '+b.name)+': old '+b.old.n+'/'+b.old.done+'/'+b.old.wait+' · new '+b.now.n+'/'+b.now.done+'/'+b.now.wait+' (lines/done/waiting)').join('<br>'));}})
    .catch(e=>{mg.disabled=false;window.LSMIG={ok:false,err:e.message};msg('<b style="color:#c0392b">Migration stopped: '+escA(e.message)+'</b> — the switch was not set.');});};
  const ck=document.getElementById('ls-chk');
  if(ck)ck.onchange=()=>{const v=ck.checked;if(!lsAdminOk()){ck.checked=!v;return;}
    DB.listChk=v;sched();render();toast(v?'Lists must now be checked before the saw sees them':'Lists go to the saw without a check');};
  const dl=document.getElementById('ls-delonly');
  if(dl)dl.onchange=()=>{const v=dl.checked;if(!lsAdminOk()){dl.checked=!v;return;}
    DB.listDelOnly=v;sched();render();toast(v?'Only jobs ticked for delivery need a cutting list now':'Every job at steps 5–8 needs a cutting list again');};
  const pc=document.getElementById('ls-photo');
  if(pc)pc.onchange=()=>{const v=pc.checked;if(!lsAdminOk()){pc.checked=!v;return;}
    DB.photoLists=v;sched();render();toast(v?'Photo lists allowed — "📷 Attach photo of list" is back':'Photo lists switched off — no more photos can be attached (the ones already attached still show)');};
  const sy=document.getElementById('ls-stay');
  if(sy)sy.onclick=()=>{if(!lsAdminOk())return;DB.listStore='v2';clearTimeout(saveT);saveDB().then(()=>{render();toast(DB.saveFailed?'Not saved yet — retrying':'Back on the new lists ✓');});};
  const bk=document.getElementById('ls-back');
  if(bk)bk.onclick=()=>{if(!lsAdminOk())return;if(!confirm('Switch back to the old lists? The old format is rebuilt from the tables (lists made since included). Templates and revisions stay in the tables.'))return;
    bk.disabled=true;msg('Switching back…');
    lsSwitchBack(whoNow()).then(r=>{window.LSBACK=r;render();toast('Back on the old lists — '+r.lists+' lists rebuilt');}).catch(e=>{bk.disabled=false;window.LSBACK={err:e.message};msg('<b style="color:#c0392b">Not switched back: '+escA(e.message)+'</b>');});};
}

// Templates, projects and materials are edited by the Production Manager, Drawing office or Admin. From another view the
// person enters one of those PINs once; this device remembers it (decision 11).
function lsEditOk(){
  if(['prod','design'].includes(ROLE))return true;
  const p=pins(),ok=v=>!!v&&[p.prod,p.design,p.admin].includes(v);
  if(ok(ls.get('wpfEditPin')))return true;
  const v=prompt('Projects, materials and templates are edited by the Production Manager or Drawing office.\n\nEnter the Production Manager, Drawing office or Admin PIN:','');
  if(v===null)return false;
  if(!ok(v.trim())){toast('Wrong PIN — not changed');return false;}

async function lsWrite(t,row,patch){ // insert (row) or version-checked update (row + patch); the database's copy comes back
  const u=patch?SUPA_URL+'/'+t+'?id=eq.'+encodeURIComponent(row.id)+'&version=eq.'+(+row.version||1):SUPA_URL+'/'+t;
  const r=await fetch(u,{method:patch?'PATCH':'POST',headers:{...SUPA_HDR,'Prefer':'return=representation'},body:JSON.stringify(patch?{...patch,updated_by:lqBy('')}:{...row,updated_by:lqBy('')})});
  const d=await r.json().catch(()=>null);
  if(r.status===409||(d&&d.code==='23505'))throw new Error('that name is already used in this project');
  if(!r.ok)throw new Error((d&&d.message)||('HTTP '+r.status));
  if(patch&&Array.isArray(d)&&!d.length){lsPut(t,await lsGet(t+'?select=*&id=eq.'+encodeURIComponent(row.id)));throw new Error('changed on another screen meanwhile — showing it as it is now, try again');}
  lsPut(t,d);return d[0];
}

function ltiConfirm(wos){
  wos=wos.filter(w=>!LTI.busy.has(w));if(!wos.length)return;
  officeWho(async by=>{
    const rs=new Map(ltiRows().map(r=>[r.o.wo,r]));
    const go=wos.filter(w=>rs.get(w)&&rs.get(w).tid);
    go.forEach(w=>{LTI.busy.add(w);delete LTI.res[w];});ltiAfter();
    let ok=0,bad=0,al=0;
    for(const w of go){const tid=rs.get(w).tid;
      try{const l=await confirmList(w,tid,by);ok++;if(l.already)al++;LTI.done.unshift({wo:w,name:l.name,tpl:ltiTplName(tid),already:!!l.already,gotMsg:l.gotMsg||''});delete LTI.pick[w];}
      catch(e){bad++;LTI.res[w]={err:e.message};}
      LTI.busy.delete(w);ltiAfter();

    const g1=go.length===1&&LTI.done[0]&&LTI.done[0].gotMsg;
    if(g1&&!bad){toast(g1,true);return;}
    toast(bad?ok+' list'+(ok!==1?'s':'')+' made, '+bad+' NOT saved — tap ↻ Retry on '+(bad!==1?'those rows':'that row'):ok+' list'+(ok!==1?'s':'')+' made ✓'+(al?' ('+al+' already made on another screen)':''),!!bad);
  });
}

/* Customer = project: a WO whose Cienapps customer heading isn't linked to a project yet. "Link to project ▾" adds the

function ltiLinkHTML(o){

  if(!c)return `<div class="lti-act"><span class="lti-why">No customer on this work order in Cienapps — </span><button class="btn btn-s" data-ltitype="${escA(w)}" style="${btn}">✍ Type a list</button></div>`;
  return `<div class="lti-act"><span style="font-size:12px;color:#7a4a00;font-weight:700;margin-right:6px">Customer not linked to a project:</span>
    <select data-ltilink="${escA(w)}" style="${LS_INP};max-width:100%;margin:2px 4px 2px 0"><option value="">Link to project ▾</option>${lsProjects().map(p=>`<option value="${escA(p.id)}">${escA(p.name)}</option>`).join('')}</select>
    <button class="btn btn-s" data-ltinewp="${escA(w)}" style="${btn};overflow-wrap:anywhere;text-align:left">＋ New project "${escA(c)}"</button></div>`;

async function ltiLink(o,pid){ // add the customer heading to the project's Cienapps names
  const c=String(o.customer||'').trim();
  lsPut('projects',await lsGet('projects?select=*&id=eq.'+encodeURIComponent(pid))); // the project as it is now
  const p=LST.p.get(pid);if(!p)throw new Error('that project is no longer there');
  const has=(p.cien_names||[]).some(n=>sgNorm(n)===sgNorm(c));if(has&&p.active!==false)return p;
  return lsWrite('projects',p,{...(has?{}:{cien_names:[...(p.cien_names||[]),c]}),...(p.active===false?{active:true}:{})}); // an inactive project picked here is made active again
}
/* L5 (Garry 10 Nov: "customer and project will always be the same"): the project of a WO, found or made from its customer —
   no PIN (same as the 3 Nov link rule). The projects are read fresh first (another PC may have made it a moment ago); a
   project with the customer's name is linked; otherwise one is made {name = customer, cien_names [customer]}; the database
   refusing a duplicate name (two PCs at once) → read again and use that one. Two projects fitting the customer equally →
   {st:'many'} (a person picks — never guessed); no customer → {st:'nocust'}. opt.make: skip the "fits" look (the
   "＋ New project" button on Lists: the person asked for that project). */
/* (Tester round 5) the list window links a customer to a project BY ITSELF only when the customer IS the project's name, customer
   or one of its Cienapps spellings (case, spaces and punctuation ignored). A "contains" / builder-only fit is asked
   ({st:'ask'}). Projects whose names are the same once normalised ("Race Homes" / "Race Homes." / "RACE HOMES") are one
   customer: the OLDEST is used (created_at if there is one, else the time inside the id; a hand-made id like "P1" counts as
   older) — never a second project made, and an extra one that slipped in is left alone (never deleted). */
function lsProjAge(p){if(p&&p.created_at)return Date.parse(p.created_at)||0;const m=/^P([0-9a-z]{8})/.exec(String(p&&p.id||''));return m?parseInt(m[1],36)||0:0;}
function lsProjOldest(a){return a.slice().sort((x,y)=>lsProjAge(x)-lsProjAge(y)||String(x.id).localeCompare(String(y.id)))[0]||null;}
function lsProjTwins(c,all){const h=sgNorm(c);return h?lsProjects(all).filter(p=>sgNorm(p.name)===h):[];}
function lsProjCore(s){return sgPh(sgNorm(s)).split(' ').filter(w=>w&&!SG_CO.has(w)).join(' ');} // "ADERRIG HOMES LTD" → "aderrig" (company words like Homes / Ltd / Developments left out)
function lsProjExact(c){const h=sgPh(sgNorm(c)),k=lsProjCore(c);if(!h)return[]; // the same once case, spaces, punctuation and company words are ignored
  return lsProjects().filter(p=>[p.name,p.customer,...(p.cien_names||[])].some(n=>n&&(sgPh(sgNorm(n))===h||(k&&lsProjCore(n)===k))));}
function lsProjAuto(c){ // {p} certain | {many:[…]} pick one | {ask:p} "Is this project …?" | {} none
  const ex=lsProjExact(c);
  if(ex.length===1)return{p:ex[0]};
  if(ex.length>1){const h=sgNorm(ex[0].name);return ex.every(p=>sgNorm(p.name)===h)?{p:lsProjOldest(ex)}:{many:ex};}
  const many=[],f=projForCust(c,lsProjects(),many);
  if(f)return{ask:f};if(many.length>1)return{many};return{};
}
function lsProjAutoId(c){return(lsProjAuto(c).p||{}).id||'';}
async function lsEnsureCustProj(o,opt){
  opt=opt||{};const c=String(o&&o.customer||'').trim();if(!c)return{st:'nocust'};
  const reload=async()=>lsPut('projects',await lsGet('projects?select=*'));
  await reload();
  if(!opt.make){const a=lsProjAuto(c);if(a.p)return{st:'ok',p:a.p};if(a.many)return{st:'many',ps:a.many};if(a.ask&&!opt.noAsk)return{st:'ask',p:a.ask,c};}
  const tw=lsProjTwins(c,true); // already a project of that name (any case / punctuation, maybe inactive, maybe made on another PC a moment ago): link to it
  if(tw.length)return{st:'ok',p:await ltiLink(o,lsProjOldest(tw).id)};
  let made;const nm=c.replace(/\s+/g,' ').replace(/[\s.,;:]+$/,'')||c; // "Race Homes." is made as "Race Homes": the database's one-name rule then stops a twin made at the same moment
  try{made=await lsWrite('projects',{id:uid('P'),name:nm,customer:c,cien_names:[c]});}
  catch(x){await reload();const t2=lsProjTwins(c,true);if(t2.length)return{st:'ok',p:await ltiLink(o,lsProjOldest(t2).id)};throw x;}
  await reload();const old=lsProjOldest(lsProjTwins(c,true))||made; // another PC made a twin at the same moment ("Race Homes."): both use the oldest
  if(old.id!==made.id)return{st:'ok',p:await ltiLink(o,old.id)};
  return{st:'ok',p:LST.p.get(made.id)||made,made:true};
}
function ltiLinkBind(){

  const fail=(w,e,again)=>{LTI.res[w]={err:e.message,again};ltiAfter();};
  const link=(w,pid)=>{const o=DB.orders.find(x=>x.wo===w);if(!o||!pid)return;
    delete LTI.res[w];ltiLink(o,pid).then(p=>{toast('"'+String(o.customer).trim()+'" is now linked to '+p.name+' ✓');ltiAfter();}).catch(x=>fail(w,x,()=>link(w,pid)));};
  const newp=(w,b)=>{const o=DB.orders.find(x=>x.wo===w);if(!o)return;

      .then(p=>{toast('Project "'+p.name+'" added — add its templates under Lists → Templates');ltiAfter();}).catch(x=>fail(w,x,()=>newp(w)));};

/* ---------- S4 (V2 only): the list editor with project picker, type, edging, and materials picked from the project ----------
   Saw material: only the project's sheet materials (no free typing). Fittings spec: the project's fittings, or "Other…"
   typed — that line gets an amber flag. A material already on a line but not on the project list stays, flagged. */
/* suggestTpl:start */
/* Customer = project (Garry, 3 Nov): the project title is always part of the Cienapps WO customer heading.
   projForCust: 1) the heading IS a project's name, customer or one of its Cienapps spellings (cien_names) — case,
   spaces and punctuation don't matter; 2) otherwise the heading CONTAINS a project name / Cienapps spelling (whole words,

/* Revision comparison — pure (no screen, no database), so the tests can check it on its own.
