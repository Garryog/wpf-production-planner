<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WPF Production Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="var s=document.createElement('script');s.src='xlsx.full.min.js';document.head.appendChild(s);"></script><!-- if the CDN is blocked by the works firewall, the copy in this site is used instead -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:3px solid #1a56db;outline-offset:2px}
.wl-h :focus-visible,.wl-selbar :focus-visible,.flr-vh :focus-visible{outline-color:#e8b931}
::placeholder{color:#7d8aa0}
:root{
  --bg:#f0f2f5;--card:#fff;--border:#dde1e7;--b2:#c4c9d4;
  --text:#1a1d23;--t2:#4a5568;--t3:#5b6b82;
  --green:#1a7a3c;--gl:#e6f4ec;--gb:#2d9e54;
  --red:#c0392b;--rl:#fdecea;
  --amber:#92400e;--al:#fef3c7;
  --blue:#1e4db7;--bl:#ebf0fb;
  --purple:#6d28d9;--pl:#f3effd;
  --accent:#c8a84b;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select{font-family:inherit;cursor:pointer}
.hdr{background:#1a1d23;color:#fff;border-bottom:3px solid var(--accent)}
.hdr-i{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:10px}
.lm{width:32px;height:32px;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1a1d23}
.lt{font-size:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#fff}
.ls{font-size:10px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.sync{font-size:11px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#4caf50;display:inline-block}
.dot.s{background:var(--accent)}.dot.e{background:#e53935}
.tabs{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tabs-i{max-width:1400px;margin:0 auto;display:flex;padding:0 20px;overflow-x:auto}
.tabs-i::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:10px 18px;border:none;background:none;font-size:13px;color:var(--t2);border-bottom:3px solid transparent;font-weight:500}
.tab:hover{color:var(--text)}.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.pg{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
.cap-bar{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 20px;margin-bottom:14px}
.cap-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:10px}
.week-caps{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.wk-cap{background:var(--bg);border-radius:8px;padding:8px 6px;text-align:center;border:2px solid transparent;cursor:pointer;transition:all .15s}
.wk-cap:hover{border-color:var(--b2)}.wk-cap.selected{border-color:var(--blue);background:var(--bl)}
.wk-label{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:3px}
.wk-date{font-size:10px;color:var(--t3);margin-bottom:5px}
.wk-bar-wrap{height:6px;background:#e5e8ed;border-radius:3px;overflow:hidden;margin-bottom:4px}
.wk-bar{height:100%;border-radius:3px;transition:width .3s}
.wk-bar.ok{background:var(--green)}.wk-bar.warn{background:var(--amber)}.wk-bar.over{background:var(--red)}
.wk-hours{font-size:11px;font-weight:600}
.wk-hours.ok{color:var(--green)}.wk-hours.warn{color:var(--amber)}.wk-hours.over{color:var(--red)}
.wk-count{font-size:10px;color:var(--t3)}
.board-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:6px;border:none;font-size:13px;font-weight:500}
.btn-g{background:var(--green);color:#fff}.btn-g:hover{background:var(--gb)}
.btn-s{background:#fff;border:1px solid var(--b2);color:var(--text)}.btn-s:hover{background:var(--bg)}
.btn-blue{background:var(--blue);color:#fff}
.search-input{padding:7px 12px;border:1px solid var(--b2);border-radius:6px;font-size:13px;min-width:200px;}
.search-input:focus{border-color:var(--blue)}
.filter-sel{padding:7px 10px;border:1px solid var(--b2);border-radius:6px;font-size:13px;background:#fff;-webkit-appearance:none}
.wo-table-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.wo-table{width:100%;border-collapse:collapse;font-size:13px}
.wo-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);padding:8px 10px;border-bottom:1px solid var(--border);background:#f8f9fb;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
.wo-table th:hover{color:var(--text)}
.wo-table th.asc::after{content:' ↑'}.wo-table th.desc::after{content:' ↓'}
.wo-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.wo-table tr:last-child td{border-bottom:none}
.wo-table tr:hover td{background:#fafbfc}
.wo-table tr.dragging{opacity:.3}
.wo-table tr.drag-over td{border-top:3px solid var(--blue)}
.wo-table tr.c-red td:first-child{border-left:4px solid var(--red)}
.wo-table tr.c-amber td:first-child{border-left:4px solid var(--amber)}
.wo-table tr.c-green td:first-child{border-left:4px solid var(--green)}
.wo-table tr.hl-row td{background:#fff8d6!important}
.wo-table tr.grp-start td{border-top:2px solid var(--b2)}
.wo-table tr.hl-row .wo-num{color:#b8860b;font-weight:700}
.wo-table tr.c-blue td:first-child{border-left:4px solid var(--blue)}
.wo-table tr.c-purple td:first-child{border-left:4px solid var(--purple)}
.wo-num{font-family:monospace;font-size:11px;color:var(--t2)}
.wo-title{font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.wo-cust{color:var(--t2);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.due-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.due-late{background:var(--rl);color:var(--red)}.due-soon{background:var(--al);color:var(--amber)}.due-ok{background:var(--gl);color:var(--green)}
.step-badge{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--bl);color:var(--blue);white-space:nowrap}
.week-sel{padding:4px 8px;border:1px solid var(--b2);border-radius:5px;font-size:12px;background:#fff;width:120px}
.notes-inp{width:100%;border:none;background:transparent;font-size:12px;color:var(--t2);padding:1px 0;font-family:inherit;min-width:100px}
.notes-inp:focus{border-bottom:1px solid var(--blue)}
.cdot{width:13px;height:13px;border-radius:50%;display:inline-block;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.cdot:hover{border-color:#fff;box-shadow:0 0 0 2px var(--b2)}
.drag-handle{cursor:grab;color:var(--t3);padding:0 3px;font-size:15px;user-select:none;line-height:1}
.drag-handle:active{cursor:grabbing}
.table-footer{padding:9px 12px;background:#f8f9fb;border-top:1px solid var(--border);display:flex;gap:20px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.changes-banner{background:var(--al);border:1px solid #f59e0b;border-radius:8px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.import-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.drop-zone{border:2px dashed var(--b2);border-radius:8px;padding:28px;text-align:center;color:var(--t3);cursor:pointer;transition:all .15s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--blue);background:var(--bl);color:var(--blue)}
.preview-row{padding:5px 10px;background:var(--bg);border-radius:4px;margin-bottom:3px;display:flex;align-items:center;gap:10px;font-size:12px}
.exp-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.empty{text-align:center;padding:40px;color:var(--t3);font-size:13px}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1d23;color:#fff;padding:9px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.savebar{position:sticky;top:0;z-index:9000;background:#c0392b;color:#fff;font-size:14px;font-weight:700;line-height:1.4;padding:10px 16px;text-align:center}
.savebar[hidden]{display:none}
.verbar{position:sticky;top:0;z-index:8999;width:100%;border:0;background:#14335c;color:#fff;font-size:14px;font-weight:700;padding:10px 16px;cursor:pointer}
.verbar[hidden]{display:none}
@media(max-width:1000px){.week-caps{grid-template-columns:repeat(5,1fr)}}
@media(max-width:700px){.week-caps{grid-template-columns:repeat(3,1fr)}.wo-table th:nth-child(n+7),.wo-table td:nth-child(n+7){display:none}.pg{padding:12px 12px 60px}}
/* ---- Shipped tab (phone-first cards) ---- */
.sh-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sh-bar .search-input{flex:1;min-width:200px}
.sh-chk{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sh-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sh-card.sh-done{background:#f4fbf6;border-color:#b3e0c4}
.sh-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sh-t{font-size:14px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.sh-m{font-size:12px;color:var(--t2);margin-top:2px;overflow-wrap:anywhere}
.sh-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sh-pill{font-size:11px;font-weight:700;border-radius:100px;padding:2px 8px;white-space:nowrap}
.sh-pill.ok{background:#e6f6ec;color:#0d6e46}.sh-pill.no{background:#f1f3f6;color:var(--t2)}.sh-pill.warn{background:#fdecea;color:#c0392b}
@media(max-width:700px){.sh-b .btn{flex:1;min-height:44px;font-size:14px}.sh-bar .search-input,.sh-bar .filter-sel{width:100%;min-width:0;min-height:40px;font-size:16px}.sh-chk{min-height:36px}}
/* ---- Column filters ---- */
.cf-row td{background:#f8f9fb;border-bottom:2px solid var(--border);padding:3px 4px}
.cf-inp{width:100%;min-width:44px;border:1px solid var(--b2);border-radius:4px;padding:3px 6px;font-size:11px;background:#fff;color:var(--text)}
.cf-inp::placeholder{color:#c3cad6}
.cf-inp:focus{border-color:#7ba7e0}
.cf-inp.on{background:#fff8d6;border-color:#e0b830;font-weight:600}
.cf-clear{background:#fff8d6;border:1px solid #e0b830;color:#8a6d00;border-radius:4px;font-size:10px;font-weight:700;padding:3px 6px;cursor:pointer;white-space:nowrap}
.cf-clear:hover{background:#ffefad}
/* ---- Board grouping ---- */
.gsel{width:14px;height:14px;cursor:pointer;accent-color:#1a56db;vertical-align:middle}
.grp-row td{background:#eef3fb!important;border-top:2px solid #b9cdec!important;border-bottom:1px solid #c9d8ee}
.grp-row .grp-title{font-weight:700;font-size:13px;width:100%;min-width:120px;border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:5px;color:#14335c;}
.grp-row .grp-title:hover{border-color:var(--b2);background:#fff}
.grp-row .grp-title:focus{border-color:#7ba7e0;background:#fff}
.grp-tog{cursor:pointer;font-family:monospace;font-size:11px;font-weight:700;color:#1a56db;white-space:nowrap;user-select:none}
.grp-tog:hover{text-decoration:underline}
.grp-member td{background:#f7fafd!important}
.grm-btn{background:none;border:1px solid transparent;color:var(--t3);font-size:13px;cursor:pointer;padding:1px 6px;border-radius:4px;line-height:1.2}
.grm-btn:hover{background:#fdecea;color:var(--red);border-color:#f3b3a6}
.grp-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#14335c;color:#fff;padding:10px 18px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:13px;box-shadow:0 8px 28px rgba(10,20,40,.4);z-index:60}
.grp-bar span{color:#bcd0f0;font-weight:600}
/* ---- Deliveries ---- */
.dvbtn{background:none;border:1px solid transparent;font-size:15px;filter:grayscale(1);opacity:.32;cursor:pointer;padding:1px 5px;border-radius:5px;line-height:1;transition:all .12s}
.dvbtn:hover{opacity:.7}
.dvbtn.on{filter:none;opacity:1;background:#e8f1fd;border-color:#b0c8e8}
#delcnt{display:none;background:#1a56db;color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:5px;vertical-align:1px}
#listcnt{display:none;background:#c0392b;color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:5px;vertical-align:1px}
.pwo-l{display:block;font-size:11px;color:var(--t3);font-weight:700;margin-bottom:3px}
#pwo-form input{padding:7px 9px;border:1px solid var(--b2);border-radius:6px;font-size:13px}
/* cutting lists library + saw/stores queues */
.lst-tbl{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.lst-tbl th{background:#f4f6f9;text-align:left;padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);border-bottom:1px solid var(--border)}
.lst-tbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.lst-chip{display:inline-block;background:#eef2f8;border:1px solid var(--b2);border-radius:5px;padding:1px 7px;font-size:11px;font-family:monospace;margin:1px 3px 1px 0;white-space:nowrap}
.lst-chip button{border:none;background:none;cursor:pointer;color:var(--t3);font-size:11px;padding:0 0 0 3px}
.lst-done{color:#0d6e46;font-weight:700;font-size:11px;white-space:nowrap}
.wl{max-width:1100px;margin:0 auto;padding:14px 18px}
.wl h1{font-size:26px;color:#14335c;border-bottom:4px solid #1a56db;padding-bottom:6px;margin-bottom:14px}
.wl h1 span{font-size:14px;color:var(--t3);font-weight:400;margin-left:10px}
.wl-card{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.wl-card.cdone{opacity:.55}
.wl-h{background:#14335c;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wl-h .wn{font-size:19px;font-weight:800}
.wl-h .wd{font-size:13px;opacity:.9}
.wl-due{background:#e8b931;color:#14335c;font-weight:800;font-size:13px;border-radius:6px;padding:3px 10px;white-space:nowrap}
.wl-h .lst-chip{background:rgba(255,255,255,.95);color:#14335c;border-color:transparent;font-weight:700}
.wl-tbl{width:100%;border-collapse:collapse;font-size:15px}
.wl-tbl th{background:#f4f6f9;text-align:left;padding:6px 10px;font-size:11px;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--border)}
.wl-tbl td{padding:7px 10px;border-bottom:1px solid #eef1f5}
.wl-tbl td.num{font-weight:700;font-family:monospace;white-space:nowrap}
.wl-sec td{background:#eaf0f8;font-weight:800;color:#14335c;font-size:14px;border-top:2px solid var(--b2)}
.wl-act{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wl-btn{background:#0b7e44;color:#fff;border:none;border-radius:10px;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer}
.wl-undo{background:#fff;border:2px solid #8e99ab;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;color:#4a5568;cursor:pointer;min-height:44px}
.wl-donelbl{color:#0d6e46;font-weight:800;font-size:15px}
.wl-tabs{display:flex;gap:10px;margin-bottom:14px}
.wl-tabs button{flex:1;padding:14px;font-size:17px;font-weight:800;border-radius:10px;border:2px solid var(--b2);background:#fff;color:var(--t3);cursor:pointer}
.wl-tabs button.on{background:#14335c;border-color:#14335c;color:#fff}
.wl-dday{font-size:13px;font-weight:800;color:#14335c;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px;border-bottom:2px solid #14335c;padding-bottom:3px}
.wl-drow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:14px}
.wl-drow>b{font-size:16px;color:#14335c}
/* batch-cut selection + combined view + per-house splits */
.wl-chk{width:44px;height:44px;border-radius:9px;border:2px solid rgba(255,255,255,.65);background:transparent;cursor:pointer;color:#14335c;font-weight:800;font-size:20px;line-height:1;flex-shrink:0}
.wl-chk.on{background:#e8b931;border-color:#e8b931}
.wl-selbar{position:sticky;top:8px;z-index:50;background:#14335c;color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.wl-selbar b{font-size:15px}
.wl-selbar .btn2{background:#e8b931;color:#14335c;border:none;border-radius:8px;padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer}
.wl-selbar .btn2:disabled{opacity:.45;cursor:default}
.wl-selbar .btn3{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer}
.ph-chip{display:inline-block;background:#eaf0f8;border:1px solid #c4cdd9;border-radius:5px;padding:1px 8px;font-size:12px;font-weight:700;color:#14335c;margin:1px 2px;white-space:nowrap}
.ph-chip b{color:#0d6e46}
.del-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.dgrp{margin-bottom:6px}
.dgrp-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 5px;cursor:pointer;user-select:none}
.dgrp-h:hover{color:#1a56db}
.dgrp-h .gcnt{font-weight:400;color:var(--t3);text-transform:none;letter-spacing:0;font-size:10px}
.dpool-chips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{width:216px;background:#fff;border:1px solid #cfd6df;border-radius:7px;padding:6px 8px;font-size:11px;cursor:grab;user-select:none;box-shadow:0 1px 2px rgba(15,25,40,.06)}
.dcell .dchip{width:100%;margin:0 0 4px;box-shadow:none}
.dchip-top{display:flex;align-items:center;gap:6px}
.dchip-top b{font-family:monospace;font-size:12px;font-weight:700;color:#14335c;white-space:nowrap}
.dfu{font-size:10px;font-weight:700;background:#eef2f7;border:1px solid #d8dfe8;border-radius:4px;padding:1px 5px;color:#3b4c63;white-space:nowrap}
.fu-badge{font-family:monospace;font-size:11px;font-weight:600;background:#f2f5f9;border:1px solid #e0e5ec;border-radius:4px;padding:1px 6px;color:var(--t2);white-space:nowrap}
.dsrch{width:100%;max-width:420px;padding:7px 11px;border:1px solid var(--b2);border-radius:6px;font-size:12px;margin-bottom:8px}
.dsrch:focus{border-color:#7ba7e0}
.dcv{margin-left:auto;font-weight:600;color:#0d6e46;font-size:11px;white-space:nowrap}
.dchip-btns{display:flex;gap:1px}
.dchip button{background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:7px 8px;min-width:32px;min-height:32px;border-radius:5px;color:#4a5568}
.dchip button:hover{background:#dde3ea;color:var(--text)}
.dchip .dchk.on{color:#0b7e44;font-weight:700}
.dchip-t{font-size:11px;color:var(--text);line-height:1.35;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dchip-c{font-size:10px;color:var(--t3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip.done{background:#eefbf3;border-color:#b3e0c4}
.dchip.done .dchip-t,.dchip.done .dchip-top b{text-decoration:line-through;opacity:.6}
.dchip.dispd{background:#e8f1fd;border-color:#9cbce8}

  new Set([...ob.keys(),...om.keys()]).forEach(k=>{const x=ob.get(k),y=om.get(k);if(!same(x,y))d.push({p:['o',k],b:x,m:y});});

function pbuild(t,d,side){ // the database copy t with one side ('b' before / 'm' mine) of the changes laid over it

/* 3-way merge: base = what both screens started from, mine = this screen, theirs = the database now.
   Changes made on only one side are kept. Both sides changed the same thing differently ("clash"):
   a tick / done flag wins over an un-tick, otherwise the later edit wins and the job's history notes it. */
const MERGE_ATOMIC={hourScale:1}; // edited as a whole, never mixed
function mKey(x,seen){
  if(!x||typeof x!=='object'||Array.isArray(x))return null;
  // a job with a blank WO still counts as a job (keyed 'wo:'), so one bad line can't turn the job merge into a text diff
  const k=x.id!=null&&x.id!==''?'id:'+x.id:Object.prototype.hasOwnProperty.call(x,'wo')?'wo:'+(x.wo==null?'':x.wo):null;
  if(!k)return null;const n=seen[k]=(seen[k]||0)+1;return n>1?k+'#'+n:k;
}
const NOU=Symbol('no-unsure'); // "no information about an unconfirmed save here"
function mArr(b,m,t,path,N,o,u){
  const ks=a=>{const seen={},r=[];for(const x of a){const k=mKey(x,seen);if(!k)return null;r.push([k,x]);}return r;};
  const kb=ks(b),km=ks(m),kt=ks(t),Us=u.map(x=>{const k=Array.isArray(x)?ks(x):null;return k?new Map(k):null;});
  if(kb&&km&&kt&&(b.length||m.length||t.length)){ // jobs, lists, staff… — merge item by item
    const B=new Map(kb),M=new Map(km),T=new Map(kt),out=[];
    const keys=[...km.map(x=>x[0]),...kt.map(x=>x[0]).filter(k=>!M.has(k))];
    keys.forEach(k=>{const v=m3(B.get(k),M.get(k),T.get(k),path.concat(k),N,o,Us.map(U=>U?U.get(k):NOU));if(v!==undefined)out.push(v);});
    return out;
  }
  // plain lists (history logs, WO tags, roles): keep additions from both sides, drop what either removed
  const J=x=>JSON.stringify(x),bs=new Set(b.map(J)),ms=new Set(m.map(J)),ts=new Set(t.map(J));
  return m.filter(x=>!(bs.has(J(x))&&!ts.has(J(x)))).concat(t.filter(x=>!bs.has(J(x))&&!ms.has(J(x))));
}
function m3(b,m,t,path,N,o,u){
  // A save from this screen whose reply never came back may have landed. Where the database now holds exactly
  // what that save sent, it's our own write — not another screen's change — so it counts as the base.
  for(const x of u)if(x!==NOU&&same(t,x)){b=x;break;}
  if(same(m,t))return m;
  if(same(m,b))return t;
  if(same(t,b))return m;
  const isObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
  if(!MERGE_ATOMIC[path[path.length-1]]){
    if(Array.isArray(m)&&Array.isArray(t))return mArr(Array.isArray(b)?b:[],m,t,path,N,o,u);
    if(isObj(m)&&isObj(t)){
      const bb=isObj(b)?b:{},r={};
      [...new Set([...Object.keys(m),...Object.keys(t)])].forEach(k=>{const v=m3(bb[k],m[k],t[k],path.concat(k),N,o,u.map(x=>isObj(x)?x[k]:NOU));if(v!==undefined)r[k]=v;});

    return m===undefined?t:m;
  }
  if((m===true&&!t)||(t===true&&!m))return true; // done wins, silently
  const win=o.theirsWins?t:m;

}
function mergePlan(base,mine,theirs,o){
  o=o||{};const N=[];base=base||{orders:[],settings:{}};

  const ren=renumberP(base,mine,theirs,o);
  const un=(o.unsure||[]).filter(Boolean);
  const orders=m3(base.orders||[],mine.orders||[],theirs.orders||[],['orders'],N,o,un.map(x=>x.orders||[]))||[];
  const settings=m3(base.settings||{},mine.settings||{},theirs.settings||{},['settings'],N,o,un.map(x=>x.settings||{}))||{};
  const plan={orders,nid:Math.max(+mine.nid||1,+theirs.nid||1),settings};
  const sh=v=>v===undefined||v===null||v===''?'(blank)':String(typeof v==='object'?JSON.stringify(v):v).slice(0,40);

/* Planner WOs (P-####) are numbered on the screen that makes them, so two PCs can both make P-1001 at the same
   moment. When merging, a P-number this screen created that the database already has for a DIFFERENT job is
   renumbered to the next free one (with its cutting-list tags and Export baseline), and the user is told. */
function renumberP(base,mine,theirs,o){
  const ren={},isP=w=>/^P-\d+$/.test(String(w||''));
  const inB=new Set((base.orders||[]).map(x=>x.wo)),T=new Map((theirs.orders||[]).map(x=>[x.wo,x]));
  const sent=w=>(o.unsure||[]).some(u=>u&&(u.orders||[]).some(x=>x.wo===w)); // may be our own job that landed
  let top=Math.max(1000,...[...(mine.orders||[]),...(theirs.orders||[])].map(x=>{const m=/^P-(\d+)$/.exec(String(x.wo||''));return m?+m[1]:0;}));
  (mine.orders||[]).forEach(od=>{

    const th=T.get(w),c0=x=>((x.log||[])[0]||{}).at||'';

    const nw='P-'+(++top);ren[w]=nw;od.wo=nw;

      (s.lists||[]).forEach(l=>{const b=bl.get(l.id);if((l.wos||[]).includes(w)&&!(b&&(b.wos||[]).includes(w)))l.wos=l.wos.map(x=>x===w?ren[w]:x);});

/* Refuse a missing, empty or damaged planner record (e.g. a wiped row or a permissions change that makes the

function checkRow(row){
  const saw=ls.get('wpfSawJobs')==='1'||!!(BASE&&BASE.orders&&BASE.orders.length);
  let bad='';
  if(!row)bad='the planner record is missing';
  else if(row.orders!=null&&!Array.isArray(row.orders))bad='the job list is damaged';
  else if(row.settings!=null&&(typeof row.settings!=='object'||Array.isArray(row.settings)))bad='the settings are damaged';
  else if(saw&&!Array.isArray(row.orders))bad='the job list is missing';
  else if(saw&&!row.orders.length&&(!row.settings||!Object.keys(row.settings).length))bad='the plan came back empty';
  if(bad){const e=new Error(bad);e.broken=true;throw e;}
  return row;
}
async function loadDB(){

        applyPlan(m.plan);noteMerge(m.notes,m.ren,row.updated_by);mergedRender();
        BASE=clone(theirs);UNSURE=[];
      }
      const mine=snap();
      let resp;try{resp=await fetch(SUPA_URL+'/production_planner?id=eq.main',{method:'PATCH',headers:SUPA_WHDR,body:JSON.stringify(mine)});}catch(e){unsureAdd(mine);throw e;}
      if(resp&&resp.ok===false)throw new Error('HTTP '+resp.status);
      BASE=mine;UNSURE=[];return;
    }
    // Only saves if the database is still at the version we loaded. We ask for VER+1; the database trigger
    // (SUPABASE_CHANGES.md) also sets old+1 on every update — same number, so never a double bump — and
    // bumps it for old-code tabs too. The reply carries just the new version number.
    let resp;

      body:JSON.stringify({...mine,version:VER+1,updated_by:whoTag()})});}
    catch(e){unsureAdd(mine);throw e;} // no reply: it may have landed — remember what we sent so it isn't mistaken for someone else's change
    if(!resp||resp.ok===false){

    if(Array.isArray(d)&&d.length){VER=+d[0].version||VER+1;BASE=mine;UNSURE=[];return;}
    if(!Array.isArray(d))throw new Error('unexpected save reply');
    // Nothing updated: another screen saved first. Fetch theirs, merge, try again.
    const row=checkRow(await fetchMain());

/* ---------- Manual grouping of work orders on the capacity board ---------- */
function grpMembers(gid){return DB.orders.filter(o=>o.grp===gid);}
function cleanGroups(){
  DB.grps=DB.grps||{};
  const counts={};
  DB.orders.forEach(o=>{if(o.grp)counts[o.grp]=(counts[o.grp]||0)+1;});
  // dissolve groups that lost their members (deleted, excluded on import, ungrouped down to one)
  Object.keys(DB.grps).forEach(g=>{
    if(!counts[g]||counts[g]<2){
      DB.orders.forEach(o=>{if(o.grp===g)delete o.grp;});
      delete DB.grps[g];
    }
  });
  DB.orders.forEach(o=>{if(o.grp&&!DB.grps[o.grp])delete o.grp;});
}
// IDs made on two screens at the same moment must never collide (a shared counter would) — time + random.
function uniqId(p){return p+Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).slice(2,5).toUpperCase();}
function makeGroup(){
  const members=DB.orders.filter(o=>grpSel.has(o.wo));
  if(members.length<2){toast('Select at least 2 work orders to group');return;}
  let gid=uniqId('G');while(DB.grps&&DB.grps[gid])gid=uniqId('G');
  DB.grps=DB.grps||{};
  DB.grps[gid]={title:members[0].title||members[0].wo};
  members.forEach(o=>{o.grp=gid;});
  cleanGroups();
  grpSel.clear();expGrps.add(gid);
  sched();render();
  toast(members.length+' work orders grouped — click the title to rename');
}
function ungroupG(gid){
  DB.orders.forEach(o=>{if(o.grp===gid)delete o.grp;});
  if(DB.grps)delete DB.grps[gid];
  sched();render();toast('Ungrouped');
}

  const custs=[...new Set(BO.map(o=>o.customer))].sort();
  const chg=changes();

  let orders=[...BO];
  if(fWeek==='unscheduled')orders=orders.filter(o=>!o.plannedWeek);
  else if(fWeek)orders=orders.filter(o=>o.plannedWeek===fWeek);
  if(fCust)orders=orders.filter(o=>o.customer===fCust);
  if(fDel)orders=orders.filter(o=>o.delv);
  if(fLate)orders=orders.filter(isLateVsDue);
  if(srch){const q=srch.toLowerCase();orders=orders.filter(o=>(o.title||'').toLowerCase().includes(q)||String(o.wo||'').toLowerCase().includes(q)||(o.customer||'').toLowerCase().includes(q)||String(o.floor||'').toLowerCase().includes(q)||String(o.unit||'').toLowerCase().includes(q));}
  // Per-column contains filters — all applied together (AND), like Excel column filters
  const colVal=(o,k)=>{
    switch(k){
      case 'wo':return o.wo||'';
      case 'floor':return String(o.floor||'');
      case 'unit':return String(o.unit||'');
      case 'title':return o.title||'';
      case 'customer':return o.customer||'';
      case 'hours':return String(o.hours);
      case 'dueDate':return (o.dueDate||'')+' '+(o.dueDate?fmt(o.dueDate)+' wk'+wkNum(o.dueDate):'');
      case 'value':return String(Math.round(o.value||0));
      case 'step':return o.step||'';
      case 'plannedWeek':return o.plannedWeek?(o.plannedWeek+' '+wkLbl(o.plannedWeek)):'unscheduled';
    }
    return '';
  };
  Object.keys(colF).forEach(k=>{
    const q=String(colF[k]||'').trim().toLowerCase();
    if(q)orders=orders.filter(o=>colVal(o,k).toLowerCase().includes(q));
  });
  const nColF=Object.keys(colF).filter(k=>String(colF[k]||'').trim()).length;
  orders.sort((a,b)=>{
    let av=a[sortCol]||'',bv=b[sortCol]||'';
    if(sortCol==='hours'||sortCol==='value'){av=+av;bv=+bv;}
    if(sortCol==='plannedWeek'){if(!av)av='9999-99-99';if(!bv)bv='9999-99-99';} // unscheduled last
    if(av<bv)return -sortDir;
    if(av>bv)return sortDir;
    // Secondary: group same customer together
    const ac=(a.customer||'').toLowerCase(),bc=(b.customer||'').toLowerCase();
    if(ac<bc)return -1;
    if(ac>bc)return 1;
    // Tertiary: due date
    return (a.dueDate||'').localeCompare(b.dueDate||'');
  });

  // Collapse grouped orders into one item at the position of their first member
  const seenG=new Set();
  const items=[];

    if(o.grp&&DB.grps&&DB.grps[o.grp]){

  const unschHrs=Math.round(PO.filter(o=>!o.plannedWeek).reduce((a,o)=>a+(+o.hours||0),0)*10)/10;

            ${getSteps().map(s=>`<option value="${escA(s)}"${(o.step||'')===s?' selected':''}>${escA(s.replace(/^\d+\.\s*/,''))}</option>`).join('')}

          <td style="text-align:center"><button style="background:none;border:none;color:var(--t3);font-size:14px;padding:0 2px;cursor:pointer;line-height:1" data-del="${escA(o.wo)}" title="Delete order">🗑</button></td>
        </tr>`;

  const grpRowHTML=(gid,sep)=>{
    const g=DB.grps[gid];
    const ms=grpMembers(gid).sort(woCmp);
    const th=ms.reduce((a,o)=>a+(+o.hours||0),0), tv=ms.reduce((a,o)=>a+(o.value||0),0);
    const wks=[...new Set(ms.map(o=>o.plannedWeek||''))];
    const mixed=wks.length>1, wk=mixed?'':wks[0];

  let prevCust=null;
  const bodyHTML=items.map(it=>{
    const sep=prevCust!==null&&(prevCust||'')!==(it.customer||'');

  app.innerHTML=`<div class="pg">
  ${chg.length>0?`<div class="changes-banner">
    <strong>⚠ ${chg.length} work order${chg.length!==1?'s':''} rescheduled this session.</strong>
    <span style="font-size:12px;color:var(--amber)">Remember to export and update Cienapps.</span>
    <button class="btn btn-s" style="padding:4px 10px;font-size:12px;margin-left:auto" onclick="showTab('x')">Export Changes →</button>
  </div>`:''}

  <div class="cap-bar">
    <div class="cap-title">8-Week Assembly Capacity — ${WCAP}h per week</div>
    <div class="week-caps">
      ${weeks.map(wk=>{
        const h=wkHrs(wk),cnt=wkCnt(wk),v=wkVal(wk),cap=wkCap(wk);
        const pct=Math.min(100,Math.round(h/cap*100));
        const vpct=Math.min(100,Math.round(v/VCAP*100));
        const cls=pct>=100?'over':pct>=80?'warn':'ok';
        const vcls=vpct>=100?'over':vpct>=80?'warn':'ok';
        return`<div class="wk-cap${fWeek===wk?' selected':''}" data-wk="${wk}">
          <div class="wk-label">${wkLbl(wk)}</div>
          <div style="font-size:9px;color:var(--t3);margin-bottom:2px">HOURS</div>
          <div class="wk-bar-wrap"><div class="wk-bar ${cls}" style="width:${pct}%"></div></div>
          <div class="wk-hours ${cls}">${h}h / ${cap}h${cap!==WCAP?'<span style="font-size:9px;color:var(--amber)"> ✎</span>':''}</div>
          ${h>cap?'<div style="font-size:11px;font-weight:700;color:var(--red);background:var(--rl);border-radius:3px;padding:1px 5px;margin-top:2px">+' + (h-cap) + 'h OVER</div>':''}
          <div style="font-size:9px;color:var(--t3);margin:4px 0 2px">VALUE</div>
          <div class="wk-bar-wrap"><div class="wk-bar ${vcls}" style="width:${vpct}%"></div></div>
          <div class="wk-hours ${vcls}">${fmtVal(v)} / ${fmtVal(VCAP)}</div>
          ${v>VCAP?'<div style="font-size:11px;font-weight:700;color:var(--red);background:var(--rl);border-radius:3px;padding:1px 5px;margin-top:2px">+' + fmtVal(v-VCAP) + ' OVER</div>':''}
          <div class="wk-count">${cnt} order${cnt!==1?'s':''}</div>
          <input type="number" class="wk-cap-inp" data-wk-c="${wk}" value="${cap}" min="1" step="10" title="Set capacity for this week" style="width:52px;font-size:10px;padding:2px 4px;border:1px solid var(--b2);border-radius:3px;text-align:center;margin-top:4px;background:${cap!==WCAP?'#fffbeb':'#fff'}">
        </div>`;
      }).join('')}
      <div class="wk-cap${fWeek==='unscheduled'?' selected':''}" data-wk="unscheduled">
        <div class="wk-label" style="color:var(--amber)">Unscheduled</div>
        <div class="wk-bar-wrap"><div class="wk-bar warn" style="width:100%"></div></div>
        <div class="wk-hours warn">${unschHrs}h · ${fmtVal(PO.filter(o=>!o.plannedWeek).reduce((a,o)=>a+(o.value||0),0))}</div>
        <div class="wk-count">${unschCnt} order${unschCnt!==1?'s':''}</div>
      </div>
    </div>
  </div>

  <div class="board-toolbar">
    <input class="search-input" id="srch" placeholder="Search WO, title, customer…" value="${escA(srch)}">
    <select class="filter-sel" id="fwk">
      <option value="">All weeks</option>
      <option value="unscheduled"${fWeek==='unscheduled'?' selected':''}>Unscheduled</option>
      ${weeks.map(w=>`<option value="${w}"${fWeek===w?' selected':''}>${wkLbl(w)}</option>`).join('')}
    </select>
    <select class="filter-sel" id="fcust">
      <option value="">All customers</option>
      ${custs.map(c=>`<option value="${escA(c)}"${fCust===c?' selected':''}>${escA(c)}</option>`).join('')}
    </select>
    <button class="btn btn-s" id="btn-fdel" style="${fDel?'background:#e8f1fd;border-color:#b0c8e8;color:#1a56db;font-weight:600':''}">🚚 On delivery board</button>
    ${(n=>n?`<button class="btn btn-s" id="btn-flate" title="Jobs whose planned week ends AFTER their Cienapps due date — dates have drifted since they were planned. Click to see only these and re-plan them." style="${fLate?'background:#fdecea;border-color:#e57368;font-weight:700;':''}border-color:#e57368;color:#c0392b">⚠ ${n} late vs due</button>`:'')(PO.filter(isLateVsDue).length)}
    <button class="btn btn-s" id="btn-clf">Clear filters</button>
    <span style="margin-left:auto;font-size:12px;color:var(--t2)">${orders.length} shown · ${PO.filter(o=>o.plannedWeek).length} scheduled · ${unschCnt} unscheduled${PO.length<DB.orders.length?` · <a href="#" id="go-ship" style="color:var(--t2)">${DB.orders.length-PO.length} shipped</a>`:''}</span>
    <button class="btn btn-g" id="btn-pwo" title="Create a work order directly in the planner — numbered P-…, it follows the same workflow as every Cienapps job but is never touched by imports">＋ New Work Order</button>
    <button class="btn btn-s" id="btn-snap" title="Save a single read-only HTML file with all current data baked in — email it or open it anywhere, no database or internet needed">📸 Offline Snapshot</button>
    <button class="btn btn-s" id="btn-clearall" style="border-color:var(--red);color:var(--red)">Clear All Orders</button>
  </div>
  <div id="pwo-form" style="display:none;background:#fff;border:2px solid #7c5cd6;border-radius:10px;padding:14px;margin-bottom:14px;max-width:1400px">
    <div style="font-size:13px;font-weight:800;color:#7c5cd6;margin-bottom:8px">New planner work order — numbered automatically (P-…), identified in purple, follows the full workflow (board → cutting lists → delivery → driver), never altered or removed by Cienapps imports.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div><label class="pwo-l">Title *</label><input id="pwo-title" placeholder="e.g. REPLACEMENT DOORS HOUSE 12" style="width:260px"></div>
      <div><label class="pwo-l">Customer</label><input id="pwo-cust" style="width:160px"></div>
      <div><label class="pwo-l">Floor</label><input id="pwo-floor" style="width:60px"></div>
      <div><label class="pwo-l">Unit</label><input id="pwo-unit" style="width:60px"></div>
      <div><label class="pwo-l">Value €</label><input id="pwo-val" type="number" min="0" style="width:90px"></div>
      <div><label class="pwo-l">Hours (blank = estimate from value)</label><input id="pwo-hrs" type="number" min="0" step="0.5" style="width:90px"></div>
      <div><label class="pwo-l">Due date *</label><input id="pwo-due" type="date" style="width:140px"></div>
      <button class="btn btn-g" id="pwo-add">Create</button>
      <button class="btn btn-s" id="pwo-cancel">Cancel</button>
    </div>
  </div>

  <div class="wo-table-wrap">
    <table class="wo-table">
      <thead><tr>
        <th style="width:28px;text-align:center" title="Select ALL shown work orders (respects the filters) — then Group into one line"><input type="checkbox" class="gsel" id="gselall"${orders.length>0&&orders.every(o=>grpSel.has(o.wo))?' checked':''}></th>
        <th style="width:22px"></th>
        <th style="width:34px;text-align:center" title="Delivery next week">🚚</th>
        <th data-s="wo" class="${sortCol==='wo'?sortDir>0?'asc':'desc':''}">WO #</th>
        <th data-s="floor" class="${sortCol==='floor'?sortDir>0?'asc':'desc':''}">Floor</th>
        <th data-s="unit" class="${sortCol==='unit'?sortDir>0?'asc':'desc':''}">Unit</th>
        <th data-s="title" class="${sortCol==='title'?sortDir>0?'asc':'desc':''}">Title</th>
        <th data-s="customer" class="${sortCol==='customer'?sortDir>0?'asc':'desc':''}">Customer</th>
        <th data-s="hours" class="${sortCol==='hours'?sortDir>0?'asc':'desc':''}" style="text-align:right">Hrs</th>
        <th data-s="dueDate" class="${sortCol==='dueDate'?sortDir>0?'asc':'desc':''}">Due Date</th>
        <th data-s="value" class="${sortCol==='value'?sortDir>0?'asc':'desc':''}" style="text-align:right">Value</th>
        <th data-s="step">Step</th>
        <th data-s="plannedWeek">Planned Week</th>
        <th style="width:30px"></th>
      </tr>
      <tr class="cf-row">
        <td></td><td></td>
        <td>${nColF?`<button class="cf-clear" id="btn-cfclear" title="Clear all column filters">✕ ${nColF}</button>`:''}</td>
        ${['wo','floor','unit','title','customer','hours','dueDate','value','step','plannedWeek'].map(k=>`<td><input class="cf-inp${String(colF[k]||'').trim()?' on':''}" data-cf="${k}" value="${String(colF[k]||'').replace(/"/g,'&quot;')}" placeholder="⌕"></td>`).join('')}
        <td></td>
      </tr></thead>
      <tbody id="tbody">
        ${!items.length?`<tr><td colspan="14"><div class="empty">No orders match filters</div></td></tr>`:''}
        ${bodyHTML}
      </tbody>
    </table>
    <div class="table-footer">
      <span>Shown: <strong>${Math.round(orders.reduce((a,o)=>a+(+o.hours||0),0)*10)/10}h</strong></span>
      <span>Total orders: <strong>${PO.length}</strong></span>
      <span>Total hours: <strong>${Math.round(PO.reduce((a,o)=>a+(+o.hours||0),0)*10)/10}h</strong></span>
      <span>Total value: <strong>${fmtVal(PO.reduce((a,o)=>a+(o.value||0),0))}</strong></span>
      ${(()=>{const weeks=get8Wks();const overH=weeks.filter(w=>wkHrs(w)>wkCap(w));const overV=weeks.filter(w=>wkVal(w)>VCAP);return overH.length>0?'<span style="color:var(--red);font-weight:600">⚠ '+overH.length+' week'+(overH.length!==1?'s':'')+' over hours capacity</span>':'';})()}
      ${(()=>{const weeks=get8Wks();const overV=weeks.filter(w=>wkVal(w)>VCAP);return overV.length>0?'<span style="color:var(--red);font-weight:600">⚠ '+overV.length+' week'+(overV.length!==1?'s':'')+' over value capacity</span>':'';})()}
    </div>
  </div>
  ${grpSel.size?`<div class="grp-bar">
    <b>${grpSel.size} selected</b><span>${Math.round(selH*10)/10}h · €${Math.round(selV).toLocaleString()}</span>
    <button class="btn btn-g" id="btn-mkgrp" style="padding:6px 14px">Group into one line</button>
    <button id="btn-gclear" style="background:none;border:none;color:#bcd0f0;text-decoration:underline;cursor:pointer;font-size:12px">clear</button>
  </div>`:''}
  </div>`;

  // Bind events
  document.querySelectorAll('[data-wk]').forEach(el=>el.onclick=()=>{fWeek=fWeek===el.dataset.wk?'':el.dataset.wk;render();});
  document.querySelectorAll('.wk-cap-inp').forEach(inp=>{
    inp.onclick=e=>e.stopPropagation(); // prevent week filter toggle

      const wk=this.dataset.wkC;
      const v=parseInt(this.value)||WCAP;

      else DB.weekCaps[wk]=v;
      sched();render();
    };
  });
  const si=document.getElementById('srch');
  if(si)si.oninput=function(){
    srch=this.value;const pos=this.selectionStart;render();
    const n=document.getElementById('srch');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
  };
  const fw=document.getElementById('fwk');if(fw)fw.onchange=function(){fWeek=this.value;render();};
  const fc=document.getElementById('fcust');if(fc)fc.onchange=function(){fCust=this.value;render();};
  const cf=document.getElementById('btn-clf');if(cf)cf.onclick=()=>{fWeek='';fCust='';srch='';fDel=false;fLate=false;colF={};render();};
  // Column filters — keep typing focus across re-renders
  document.querySelectorAll('.cf-inp').forEach(inp=>inp.oninput=function(){
    colF[this.dataset.cf]=this.value;
    cfFocus={k:this.dataset.cf,pos:this.selectionStart};
    render();
  });
  const cfc=document.getElementById('btn-cfclear');if(cfc)cfc.onclick=()=>{colF={};render();};
  if(cfFocus){
    const el=document.querySelector('.cf-inp[data-cf="'+cfFocus.k+'"]');
    if(el){el.focus();try{el.setSelectionRange(cfFocus.pos,cfFocus.pos);}catch(e){}}
    cfFocus=null;

  const fd=document.getElementById('btn-fdel');if(fd)fd.onclick=()=>{fDel=!fDel;render();};
  const gs=document.getElementById('go-ship');if(gs)gs.onclick=e=>{e.preventDefault();showTab('h');};
  const fl=document.getElementById('btn-flate');if(fl)fl.onclick=()=>{fLate=!fLate;render();};
  // Planner-created work orders: P-numbered, same workflow as Cienapps jobs, immune to imports
  const pwb=document.getElementById('btn-pwo');
  if(pwb)pwb.onclick=()=>{const f=document.getElementById('pwo-form');f.style.display=f.style.display==='none'?'':'none';if(f.style.display!=='none')document.getElementById('pwo-title').focus();};
  const pwc=document.getElementById('pwo-cancel');if(pwc)pwc.onclick=()=>{document.getElementById('pwo-form').style.display='none';};
  const pwa=document.getElementById('pwo-add');
  if(pwa)pwa.onclick=()=>{
    const g=id=>(document.getElementById(id)?.value||'').trim();
    const title=g('pwo-title'),due=g('pwo-due');
    if(!title){toast('Give the work order a title');document.getElementById('pwo-title').focus();return;}
    if(!due){toast('Set the due date — it drives cutting deadlines and the delivery plan');document.getElementById('pwo-due').focus();return;}
    let num=Math.max(1000,...DB.orders.map(o=>{const m=String(o.wo).match(/^P-(\d+)$/);return m?+m[1]:0;}))+1;
    while(DB.orders.some(o=>o.wo==='P-'+num))num++;
    const wo='P-'+num;

    let hours=parseFloat(g('pwo-hrs')),hoursEstimated=false;
    if(isNaN(hours)||hours<=0){hours=estimateHours(val);hoursEstimated=true;}
    DB.orders.push({wo,ref:'',floor:g('pwo-floor'),unit:g('pwo-unit'),title,customer:g('pwo-cust'),hours,hoursEstimated,
      dueDate:due,origDueDate:due,step:'Planner WO',salesRep:'',orderNo:'',value:val,plannedWeek:wkKey(new Date(due)),notes:'',colour:'',log:[{at:nowISO(),by:whoNow(),what:'Work order created in the planner'}]});
    orig[wo]='';origStep[wo]='Planner WO';
    sched();render();toast(wo+' created — scheduled to its due-date week ✓ · add its cutting list in 📋 Cutting Lists → ✍ Type a list');
  };
  // Delivery tag toggle — in place, no re-render, so the list doesn't jump while reviewing
  document.querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>{
    const o=DB.orders.find(x=>x.wo===b.dataset.dv);if(!o)return;

        ${o.completeAt?`<button class="btn btn-s" data-shu="${escA(o.wo)}">Undo complete</button>`:`<button class="btn btn-g" data-shc="${escA(o.wo)}">✓ Installation complete</button>`}
        <button class="btn btn-s" data-shb="${escA(o.wo)}">↩ Bring back to board</button>

    <div style="font-size:12px;color:var(--t2);margin:2px 0 10px">${os.length} shown · ${all.length} shipped in total. Shipped jobs are off the Capacity Board and out of the week totals; jobs on a van stay on 🚚 Deliveries until the driver confirms.</div>
    ${shown.length?shown.map(card).join(''):`<div class="empty">${all.length?'No shipped jobs match.':'No shipped jobs yet — they arrive here when a Cienapps import says shipped or invoiced.'}</div>`}

    <div id="sh-hold" style="margin-top:22px;border-top:2px solid var(--b2);padding-top:12px">

/* ---------- Deliveries: plan next week's deliveries by vehicle and day (v2) ---------- */
const DEL_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
const DEL_VEH=[
  {k:'ARTIC',  n:'Artic',        cat:'Artic', sub:''},
  {k:'VOLVO',  n:'Volvo',        cat:'Truck', sub:''},
  {k:'RENAULT',n:'Renault',      cat:'Truck', sub:''},
  {k:'IVECO',  n:'Iveco',        cat:'Truck', sub:''},
  {k:'CRAFTER',n:'Crafter',      cat:'Truck', sub:''},
  {k:'SMART',  n:'Smart Movers', cat:'Truck', sub:'external haulier'}
];
const vehLbl=k=>{const v=DEL_VEH.find(x=>x.k===k);return v?v.n:'';};
let delDragList=null,delFilter='';
const delSel=new Set();

function delAll(){return[...DB.orders.filter(o=>o.delv),...(DB.delx||[])];}
function findDel(wo){return DB.orders.find(o=>o.wo===wo)||(DB.delx||[]).find(o=>o.wo===wo);}
function woCmp(a,b){
  const na=(String(a.wo).match(/\d+/g)||[]).map(Number),nb=(String(b.wo).match(/\d+/g)||[]).map(Number);
  for(let i=0;i<Math.max(na.length,nb.length);i++){
    const x=i<na.length?na[i]:-1,y=i<nb.length?nb[i]:-1;
    if(x!==y)return x-y;
  }
  return String(a.wo).localeCompare(String(b.wo));
}
function dayVal(d){return delAll().filter(o=>o.delDay===d).reduce((a,o)=>a+(+o.value||0),0);}
const escA=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

/* Dispatch stages: '' → loaded → dispatched (left the factory, timestamped) → delivered */
function dStage(o){return (o.delDelivAt||o.delDone)?'deliv':(o.delDispAt?'disp':(o.delLoadedAt?'load':''));}
const dStageLbl={'':'','load':'LOADED','disp':'DISPATCHED','deliv':'DELIVERED'};
const hhmm=t=>{try{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}catch(e){return'';}};
function dStageTime(o){const s=dStage(o);return s==='deliv'?(o.delDelivAt?hhmm(o.delDelivAt):''):s==='disp'?hhmm(o.delDispAt):s==='load'?hhmm(o.delLoadedAt):'';}

// Part-load guard: other live jobs for the SAME unit (or same board group) that are NOT dispatched and NOT in this load
function partLoadGaps(jobs){
  const inLoad=new Set(jobs.map(j=>j.wo));
  const gaps=[];const seen=new Set();
  jobs.forEach(j=>{
    const rel=DB.orders.filter(o=>{
      if(inLoad.has(o.wo)||seen.has(o.wo))return false;
      if(o.delDispAt||o.delDelivAt||o.delDone||(isShipped(o)&&!o.delv)||isOnHold(o))return false;
      const sameUnit=j.orderNo&&o.orderNo===j.orderNo&&j.unit&&o.unit===j.unit&&!/multiple/i.test(j.unit||'');
      const sameGrp=j.grp&&o.grp===j.grp;
      return sameUnit||sameGrp;
    });
    rel.forEach(o=>{seen.add(o.wo);gaps.push({forWo:j.wo,unit:[j.floor,j.unit].filter(Boolean).join(' '),wo:o.wo,title:o.title});});
  });
  return gaps;
}
function confirmPartLoad(jobs){
  const gaps=partLoadGaps(jobs);
  if(!gaps.length)return true;
  const lines=gaps.slice(0,12).map(g=>'  • '+g.wo+' — '+(g.title||'').slice(0,40)+'  (same unit/group as '+g.forWo+')');
  return confirm('⚠ PART-LOAD WARNING\n\nThe following jobs belong to the same unit or group as jobs on this load, but are NOT dispatched and NOT on this van:\n\n'+lines.join('\n')+(gaps.length>12?'\n  …and '+(gaps.length-12)+' more':'')+'\n\nSend the load anyway WITHOUT them?');
}

/* ---------- Cutting lists & fittings: library, WO tagging, saw + stores queues ----------
   One workbook per project, one sheet per house. Rows with length/width = saw material;
   rows with qty but no dimensions = fittings for the stores. Both views are fed from the
   same upload, ordered by the earliest scheduled delivery of the tagged work orders. */
function lists(){return DB.lists||[];}
function listRows(l){const wb=(DB.listWBs||{})[l.wb];return wb&&wb.sheets&&wb.sheets[l.sheet]?wb.sheets[l.sheet]:[];}
function listDone(id){return (DB.listDone||{})[id]||{};}
function listLead(){return DB.listLead>0?DB.listLead:5;}
function listDueKey(l){ // earliest due date among tagged WOs — the ONLY thing that orders the queues
  let best='';
  (l.wos||[]).forEach(w=>{const o=DB.orders.find(x=>x.wo===w);if(o&&o.dueDate&&(!best||o.dueDate<best))best=o.dueDate;});
  return best;
}
function listDueKey2(arr){let b='';arr.forEach(l=>{const k=listDueKey(l);if(k&&(!b||k<b))b=k;});return b;}
function listCust(l){for(const w of (l.wos||[])){const o=DB.orders.find(x=>x.wo===w);if(o&&o.customer)return o.customer;}return'';}
// The factory rule: cutting and fittings must be finished THE DAY BEFORE delivery.
function todayLocal(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function listDeadline(l){ // calendar day before delivery — local-date arithmetic (UTC ms slipped a day when the clocks change)
  const d=listDueKey(l);if(!d)return'';
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d));
  const t=m?new Date(+m[1],+m[2]-1,+m[3],12):new Date(d);if(isNaN(t))return'';
  t.setDate(t.getDate()-1);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}
function listOverdue(l){const dl=listDeadline(l);return !!dl&&dl<todayLocal();}
function woFinished(o){return !!o&&(/shipped|invoiced|delivered/i.test(o.step||'')||!!o.delDelivAt||!!o.delDone||isShipped(o));}
function listFinished(l){ // every tagged job shipped/delivered (or none tagged but both sides signed off) — nothing left for the factory to do
  const ws=(l.wos||[]).map(w=>DB.orders.find(o=>o.wo===w));
  if(ws.length&&ws.every(o=>!o||woFinished(o)))return true;
  const dn=listDone(l.id);return !ws.length&&!!dn.saw&&!!dn.fit;
}
let lstShowFin=false; // library: completed lists hidden unless asked for
function listsNeeded(){ // WOs scheduled to deliver inside the lead time with NO cutting list tagged
  const tagged=new Set();lists().forEach(l=>(l.wos||[]).forEach(w=>tagged.add(w)));
  const lim=new Date(Date.now()+listLead()*86400000).toISOString().slice(0,10);
  return DB.orders.filter(o=>{
    if(tagged.has(o.wo)||o.delDelivAt||o.delDone||woFinished(o)||isOnHold(o))return false;
    const planned=o.delv&&o.delDay;                 // already on the delivery board
    const dueSoon=o.dueDate&&o.dueDate<=lim;        // due date inside the lead window
    return planned||dueSoon;
  }).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
}
function suggestWOs(l){ // match house/unit numbers in the sheet name against live WOs; customer-matches first
  const nums=(String(l.sheet).match(/\d+/g)||[]).map(Number);
  if(!nums.length)return[];
  const pw=(l.project||'').toLowerCase().split(/\s+/).filter(x=>x.length>2);
  const hits=DB.orders.filter(o=>{
    if(o.delDone||o.delDelivAt)return false;
    const u=parseInt(o.unit);return!isNaN(u)&&nums.includes(u);
  });
  const cm=o=>pw.some(w=>(o.customer||'').toLowerCase().includes(w))?0:1;
  return hits.sort((a,b)=>cm(a)-cm(b)||woCmp(a,b));
}
function parseListWorkbook(data){
  const wb=XLSX.read(data,{type:'array',cellDates:true});
  const out={project:'',sheets:{}},entries=[];
  wb.SheetNames.forEach(sn=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    const rows=[];let proj='',sdate='';
    aoa.forEach((r,i)=>{
      const A=r[0]!=null?String(r[0]).trim():'';
      const qv=r[1]!=null&&String(r[1]).trim()!==''?parseFloat(r[1]):NaN;
      const qs=r[1]!=null?String(r[1]).trim():'';

        return;
      }
      if(!isNaN(qv)){
        if(!isNaN(L)||!isNaN(W))rows.push({k:'saw',item:A,qty,L:isNaN(L)?'':L,W:isNaN(W)?'':W,mat,note});
        else rows.push({k:'fit',item:A||mat,qty,mat,note});
      }else if(!isNaN(L)&&!isNaN(W)&&(A||mat)){ // size but no quantity: still a part — kept as a line (flagged), not turned into a heading

      }else if(A||mat){
        if(/^item\s*$/i.test(A)&&r[1]!=null&&/qty/i.test(String(r[1])))return; // the template's column-header row is labels, not data
        rows.push({k:'hdr',item:A,note:mat||note});
      }
    });

      out.sheets[sn]=rows;
      entries.push({sheet:sn,sdate,saw:rows.filter(x=>x.k==='saw').length,fit:rows.filter(x=>x.k==='fit').length});
      if(proj&&!out.project)out.project=proj; // project name only from sheets that actually hold items (never a READ ME / cover sheet)
    }
  });

/* ---------- Sheets needed: board count per material for a cut-by date range (pure — reusable by a forklift view) ---------- */

  '2027-01-01','2027-02-01','2027-03-17','2027-03-29','2027-05-03','2027-06-07','2027-08-02','2027-10-25','2027-12-27','2027-12-28',
  '2028-01-01','2028-02-07','2028-03-17','2028-04-17','2028-05-01','2028-06-05','2028-08-07','2028-10-30','2028-12-25','2028-12-26'];

// Last cut-by date that is today's work: a cut-by on a weekend / bank holiday is done the working day before it.

function sheetNeed(ls,fromISO,toISO,opt){

      if(tk[k]&&since&&day(tk[k].at)<since)return; // cut on an earlier day

    labels+=`<div class="lb lb-hd">
      <div class="lb-top">${E(l.project||'')} · WESTERN POSTFORM</div>
      <div class="lb-house">${E(l.name)}</div>
      ${listCust(l)?`<div class="lb-cust">${E(listCust(l))}</div>`:''}
      <div class="lb-item">${saw?'CUT PACK':'FITTINGS BOX'}</div>
      <div class="lb-sub">${rows.length} line item${rows.length!==1?'s':''} · printed ${new Date().toLocaleDateString('en-IE')}</div>
      <div class="lb-wos">${(l.wos||[]).map(E).join(' · ')}</div></div>`;
    rows.forEach(r=>{labels+=one(l,r);});
  });
  const w=window.open('','_blank');
  if(!w){toast('Pop-up blocked — allow pop-ups for this site to print labels');return;}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>WPF Location Labels</title><style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;padding:6mm}
  .sheet{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
  .lb{border:1.6px dashed #555;border-radius:3mm;padding:4mm 5mm;height:62mm;overflow:hidden;page-break-inside:avoid;display:flex;flex-direction:column}
  .lb-hd{background:#14335c;color:#fff;border-style:solid;border-color:#14335c}
  .lb-top{font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:#888}
  .lb-hd .lb-top{color:#cbd5e6}
  .lb-house{font-size:30px;font-weight:800;color:#14335c;line-height:1.05;margin:1mm 0}
  .lb-hd .lb-house{color:#fff}
  .lb-cust{font-size:13px;font-weight:700;color:#1450a8;margin-bottom:1mm}
  .lb-hd .lb-cust{color:#e8b931}
  .lb-item{font-size:16px;font-weight:700;line-height:1.15}
  .lb-mid{display:flex;align-items:baseline;gap:6mm;margin:1.5mm 0}
  .lb-qty{font-size:26px;font-weight:800;color:#0d6e46}
  .lb-dims{font-size:19px;font-weight:700;font-family:monospace}
  .lb-sub{font-size:12px;color:#444;margin-top:auto}
  .lb-hd .lb-sub{color:#cbd5e6}
  .lb-wos{font-size:10px;font-family:monospace;color:#888;margin-top:1mm}
  .lb-hd .lb-wos{color:#cbd5e6}
  @media print{@page{size:A4 portrait;margin:8mm} body{padding:0}}
  </style></head><body><div class="sheet">${labels}</div><script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body></html>`);
  w.document.close();
}
function renderWorkList(app,mode){
  const cfg=mode==='saw'?{icon:'🪚',title:'SAW — Cutting Queue',done:'✓ CUT COMPLETE',cnt:l=>l.saw||0}
                        :{icon:'🧰',title:'STORES — Fittings Queue',done:'✓ FITTINGS PICKED',cnt:l=>l.fit||0};
  const rel=lists().filter(l=>cfg.cnt(l)>0);
  const todayISO=todayLocal();
  const srtDue=(a,b)=>(listDueKey(a)||'9999').localeCompare(listDueKey(b)||'9999');
  const relRows=l=>listHoldRows(l,mode,'rel').length;
  const open=rel.filter(l=>!listDone(l.id)[mode]||relRows(l)).sort(srtDue);
  const closed=rel.filter(l=>listDone(l.id)[mode]&&!relRows(l)).sort((a,b)=>String(listDone(b.id)[mode].at).localeCompare(String(listDone(a.id)[mode].at)));
  // The bench sees TODAY's work plus anything not cleared from past days — nothing else.
  const dueNow=open.filter(l=>dueToday(l,todayISO));                              // cut/pick by today, incl. overdue + cut-by on the non-working days ahead
  const upcoming=open.filter(l=>listDeadline(l)&&!dueToday(l,todayISO));           // later days — hidden unless peeked
  const undated=open.filter(l=>!listDeadline(l));                                  // no delivery date yet (office to tag)
  const holdModes=mode==='saw'?['saw']:['fit','saw']; // stores books material in, so it can release saw holds too
  const nHold=allHolds(holdModes,'hold').length;
  const visAll=(wlShowDone||wlShowHold)?[]:(wlShowUpcoming?[...dueNow,...upcoming,...undated]:dueNow);
  const custs=[...new Set(visAll.map(listCust).map(c=>c||'(no customer)'))].sort();
  if(wlCust&&!custs.includes(wlCust))wlCust='';
  const visible=wlCust?visAll.filter(l=>(listCust(l)||'(no customer)')===wlCust):visAll;
  [...wlSel].forEach(id=>{if(!visible.some(l=>l.id===id))wlSel.delete(id);}); // selections only valid while visible in the queue
  const selLists=visible.filter(l=>wlSel.has(l.id));
  const woChips=l=>(l.wos||[]).map(w=>{const o=DB.orders.find(x=>x.wo===w);return `<span class="lst-chip">${escA(w)}${o&&(o.floor||o.unit)?' · '+escA([o.floor,o.unit].filter(Boolean).join(' ')):''}</span>`;}).join('');
  const card=(l,isDone)=>{const dn=listDone(l.id)[mode];const due=listDueKey(l);const relOnly=!isDone&&!!dn&&relRows(l)>0;const nh=listHoldRows(l,mode,'hold').length;return `<div class="wl-card${isDone?' cdone':''}">
    <div class="wl-h"><div style="display:flex;gap:10px;align-items:flex-start">${!isDone?`<button class="wl-chk${wlSel.has(l.id)?' on':''}" data-wlsel="${escA(l.id)}" title="Select for batch cutting across houses">${wlSel.has(l.id)?'✓':''}</button>`:''}<div><span class="wn">${escA(l.name)}</span> <span class="wd">${escA(l.project||'')}${(c=>c&&c!==l.project?' · '+escA(c):'')(listCust(l))}</span><div style="margin-top:3px">${woChips(l)}</div></div></div>
    ${due?(od=>`<span class="wl-due"${od?' style="background:#c0392b;color:#fff"':''}>${od?'⚠ OVERDUE — ':''}${mode==='saw'?'CUT':'PICK'} BY ${fmt(listDeadline(l))} · DELIVERS ${fmt(due)}</span>`)(!isDone&&listOverdue(l)):'<span class="wd">no delivery date yet</span>'}</div>
    ${relOnly?`<div class="rel-note">▶ MATERIAL HAS ARRIVED — ${relRows(l)} row${relRows(l)!==1?'s':''} released from the waiting list. The rest of this house was done ${new Date(dn.at).toLocaleDateString('en-IE')}${dn.by?' by '+escA(dn.by):''}.</div>`:''}
    ${nh?`<div class="hold-note">⏸ ${nh} row${nh!==1?'s':''} waiting on ${mode==='saw'?'material':'stock'} — ${mode==='saw'?'cut':'pick'} the rest and tap ${cfg.done}; the waiting rows come back when released.</div>`:''}
    ${listTableHTML(l,mode,{relOnly,tick:!isDone})}
    <div class="wl-act">${isDone?`<span class="wl-donelbl">${cfg.done} — ${new Date(dn.at).toLocaleDateString('en-IE')} ${hhmm(dn.at)}${dn.by?' by '+escA(dn.by):''}</span><button class="wl-undo" data-wlundo="${escA(l.id)}">Undo</button>`
      :`<span style="font-size:12px;color:var(--t3)">${(n=>n.filter(r=>rowTicked(l.id,rowKey(r))).length)(tickableRows(l,mode))} of ${tickableRows(l,mode).length} ticked</span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="wl-undo" data-wlhold="${escA(l.id)}" title="Material or stock not in — park these rows until it arrives">⏸ ${mode==='saw'?'Material':'Stock'} not in</button><button class="wl-undo" data-wllbl="${escA(l.id)}" title="Print a label for every pack and item, marked with this house">🏷 Labels</button><button class="wl-btn" data-wldone="${escA(l.id)}">${cfg.done}</button></span>`}</div>
  </div>`;};
  // DONE screen: everything signed off, newest first, grouped under its date stamp
  const doneScreen=()=>{
    if(!closed.length)return `<div class="flr-none">Nothing signed off yet — completed lists land here, date-stamped.</div>`;
    const byDay={};const order=[];
    closed.slice(0,60).forEach(l=>{
      const at=listDone(l.id)[mode].at;
      const k=new Date(at).toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'short'});
      if(!byDay[k]){byDay[k]=[];order.push(k);}
      byDay[k].push(l);
    });
    return order.map(k=>`<div class="wl-dday">${k===new Date().toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'short'})?'TODAY — '+escA(k):escA(k)}</div>`+
      byDay[k].map(l=>{const dn=listDone(l.id)[mode];return `<div class="wl-drow"><b>${escA(l.name)}</b><span class="dsh-t">${escA(l.project||'')}</span><span class="dsh-c">${escA(listCust(l))}</span><span class="wl-donelbl" style="font-size:13px">✓ ${hhmm(dn.at)}${dn.by?' · '+escA(dn.by):''}</span><button class="wl-undo" data-wlundo="${escA(l.id)}">Undo</button></div>`;}).join('')).join('');
  };
  app.innerHTML=`<div class="wl"><h1>${cfg.icon} ${cfg.title}<span>today + anything not cleared · updates automatically</span></h1>
    <div class="wl-tabs">
      <button id="wl-tab-todo" class="${!wlShowDone?'on':''}">${mode==='saw'?'🪚':'🧰'} TO DO — ${dueNow.length} today${dueNow.filter(listOverdue).length?` <span style="color:#ffb3a7">(${dueNow.filter(listOverdue).length} overdue)</span>`:''}</button>
      <button id="wl-tab-hold" class="${wlShowHold?'on':''}">⏸ WAITING — ${nHold}</button>
      <button id="wl-tab-done" class="${wlShowDone?'on':''}">✓ DONE — ${closed.length}</button>
      <span class="wl-print"><button id="wl-pr1" title="Paper fallback — today's work and anything overdue, with tick boxes and initials">🖨 Print today</button><button id="wl-pr3" title="Paper fallback for a longer outage — the next 3 days">🖨 Next 3 days</button></span>
    </div>
    ${wlShowHold?`<div class="wl-hint">Rows parked because ${mode==='saw'?'the material':'stock'} isn't in. When it arrives, tap <b>ARRIVED — RELEASE</b> and the rows go straight back on the ${mode==='saw'?'saw':'stores'} queue as due work.</div>`+holdBookHTML(holdModes):wlShowDone?doneScreen():`
    ${mode==='saw'?sheetNeedHTML():''}
    ${custs.length>1?`<div class="wl-cust"><span>Customer:</span><button class="${!wlCust?'on':''}" data-wlc="">All · ${visAll.length}</button>${custs.map(c=>`<button class="${wlCust===c?'on':''}" data-wlc="${escA(c)}">${escA(c)} · ${visAll.filter(l=>(listCust(l)||'(no customer)')===c).length}</button>`).join('')}</div>`:''}
    ${visible.length>1?`<div style="font-size:12px;color:var(--t3);margin:-4px 0 10px">Cutting several houses together? Tick the box on each list for a combined table with per-house quantities and location labels.</div>`:''}
    ${selLists.length?`<div class="wl-selbar"><b>${selLists.length} house${selLists.length!==1?'s':''} selected</b>
      <button class="btn2" id="wl-comb" ${selLists.length<2?'disabled title="Select at least 2 lists to combine"':''}>⚡ Combined ${mode==='saw'?'cutting':'fittings'} table</button>
      <button class="btn3" id="wl-lblsel">🏷 Labels for selected</button>
      <button class="btn3" id="wl-clrsel">✕ Clear</button></div>`:''}
    ${visible.length?visible.map(l=>card(l,false)).join(''):`<div class="flr-none">Nothing to ${mode==='saw'?'cut':'pick'} for today — all clear ✓${upcoming.length?`<div style="font-size:13px;margin-top:6px;color:var(--t3)">${upcoming.length} list${upcoming.length!==1?'s':''} due on later days</div>`:''}</div>`}
    ${(upcoming.length||undated.length)?`<div style="text-align:center;margin:12px 0"><button class="btn btn-s" id="wl-upc">${wlShowUpcoming?'▴ Hide later days':'▾ Work ahead — show '+(upcoming.length+undated.length)+' list'+(upcoming.length+undated.length!==1?'s':'')+' due on later days'}</button></div>`:''}`}
    <div class="flr-ft">Last update ${hhmm(new Date().toISOString())}</div></div>`;
  const tb1=document.getElementById('wl-tab-todo');if(tb1)tb1.onclick=()=>{wlShowDone=false;wlShowHold=false;render();};
  const tb2=document.getElementById('wl-tab-done');if(tb2)tb2.onclick=()=>{wlShowDone=true;wlShowHold=false;render();};
  const tb3=document.getElementById('wl-tab-hold');if(tb3)tb3.onclick=()=>{wlShowHold=true;wlShowDone=false;render();};
  const pr1=document.getElementById('wl-pr1');if(pr1)pr1.onclick=()=>printWorkList(mode,1);
  const pr3=document.getElementById('wl-pr3');if(pr3)pr3.onclick=()=>printWorkList(mode,3);
  if(wlShowHold)bindHoldBook(holdModes,(what,cb)=>pickName(mode,what,cb));
  document.querySelectorAll('[data-wlhold]').forEach(b=>b.onclick=()=>{const l=lists().find(x=>x.id===b.dataset.wlhold);if(l)openHold(l,mode);});
  document.querySelectorAll('[data-wlc]').forEach(b=>b.onclick=()=>{wlCust=b.dataset.wlc;render();});
  // Per-row tick: the device's remembered name goes on the row (asked once); the last row ticked signs the house off
  document.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.rt,i=v.indexOf('|'),id=v.slice(0,i),k=v.slice(i+1);
    const l=lists().find(x=>x.id===id);if(!l)return;
    const on=!rowTicked(id,k);
    const go=by=>{
      setRowTick(l,k,mode,by,on);
      const rows=tickableRows(l,mode);
      if(on&&rows.length&&rows.every(r=>rowTicked(id,rowKey(r)))){
        markListDone([id],mode,by);clearReleased([l],mode,by);wlSel.delete(id);
        toast(l.name+' — all rows ticked · '+(mode==='saw'?'cut complete':'fittings picked')+' ✓');
      }
      sched();render();
    };
    const last=ls.get('wpfOpName');
    if(!on||last)go(last||'');else pickName(mode,(mode==='saw'?'Cutting':'Picking')+' — '+l.name,go);
  });
  // Per-row N/A: one tap parks the line in WAITING (device's remembered name); tap again to undo
  document.querySelectorAll('[data-rna]').forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    const v=b.dataset.rna,i=v.indexOf('|'),id=v.slice(0,i),k=v.slice(i+1);
    const l=lists().find(x=>x.id===id);if(!l)return;
    const on=!heldRow(l,k);
    if(on&&rowTicked(id,k))return;
    const go=by=>{
      if(on?holdOne(l,k,mode,by):unholdOne(l,k,mode,by)){sched();render();toast(on?'Line parked — find it under ⏸ WAITING':'Line back in the queue');}
    };
    const last=ls.get('wpfOpName');
    if(last)go(last);else pickName(mode,'Not available — '+l.name,go);
  });
  const upc=document.getElementById('wl-upc');if(upc)upc.onclick=()=>{wlShowUpcoming=!wlShowUpcoming;render();};
  document.querySelectorAll('[data-wlsel]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.wlsel;wlSel.has(id)?wlSel.delete(id):wlSel.add(id);render();
  });
  const cb=document.getElementById('wl-comb');if(cb)cb.onclick=()=>{if(selLists.length>=2)openCombined(selLists,mode);};
  const lb=document.getElementById('wl-lblsel');if(lb)lb.onclick=()=>printLabels(selLists,mode);
  const cs=document.getElementById('wl-clrsel');if(cs)cs.onclick=()=>{wlSel.clear();render();};
  document.querySelectorAll('[data-wllbl]').forEach(b=>b.onclick=()=>{
    const l=lists().find(x=>x.id===b.dataset.wllbl);if(l)printLabels([l],mode);
  });
  document.querySelectorAll('[data-wldone]').forEach(b=>b.onclick=()=>{
    const l=lists().find(x=>x.id===b.dataset.wldone);if(!l)return;
    pickName(mode,(mode==='saw'?'Cut complete':'Fittings picked')+' — '+l.name,by=>{
      tickableRows(l,mode).forEach(r=>{if(!rowTicked(l.id,rowKey(r)))setRowTick(l,rowKey(r),mode,by,true);});
      markListDone([l.id],mode,by);clearReleased([l],mode,by);
      wlSel.delete(l.id);
      sched();render();toast(l.name+' — '+(mode==='saw'?'cut complete':'fittings picked')+' ✓');
    });
  });
  document.querySelectorAll('[data-wlundo]').forEach(b=>b.onclick=()=>{
    if(!confirm('Put this list back in the queue?'))return;
    const id=b.dataset.wlundo;
    if(DB.listDone&&DB.listDone[id])delete DB.listDone[id][mode];
    const lu=lists().find(x=>x.id===id);if(lu)clearRowTicks(lu,mode,ls.get('wpfOpName')||'');
    sched();render();
  });
}

/* ---------- Management dashboard: one live read-only picture of the whole chain ---------- */
function renderDash(app){
  const all=delAll();
  const todayIx=(i=>i<0?6:i)(DEL_DAYS.indexOf(wdName(new Date()))); // Sunday counts the whole week as past
  const st=o=>dStage(o);
  const planned=all.filter(o=>o.delDay);
  const onTruck=all.filter(o=>st(o)==='disp');
  const delivered=all.filter(o=>st(o)==='deliv');
  const loadedNotGone=all.filter(o=>st(o)==='load');
  const missed=planned.filter(o=>DEL_DAYS.indexOf(o.delDay)<todayIx&&st(o)!=='deliv');
  const val=a=>a.reduce((s,o)=>s+(+o.value||0),0);
  const sawOpen=lists().filter(l=>(l.saw||0)>0&&!listDone(l.id).saw);
  const sawDone=lists().filter(l=>(l.saw||0)>0&&listDone(l.id).saw);
  const fitOpen=lists().filter(l=>(l.fit||0)>0&&!listDone(l.id).fit);
  const fitDone=lists().filter(l=>(l.fit||0)>0&&listDone(l.id).fit);
  const needed=listsNeeded();
  const srt=(a,b)=>(listDueKey(a)||'9999').localeCompare(listDueKey(b)||'9999');
  const tile=(n,lbl,sub,color)=>`<div class="dsh-tile" style="border-top:4px solid ${color}"><div class="dsh-n" style="color:${color}">${n}</div><div class="dsh-l">${lbl}</div>${sub?`<div class="dsh-s">${sub}</div>`:''}</div>`;
  const jrow=o=>`<div class="dsh-row"><b>${escA(o.wo)}</b>${(o.floor||o.unit)?`<span class="flr-fu" style="font-size:12px">${escA([o.floor,o.unit].filter(Boolean).join(' · '))}</span>`:''}<span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-c">${escA(o.customer||'')}</span><span class="dsh-x">${escA(vehLbl(o.delVeh)||'')} ${escA(o.delDay||'')}</span></div>`;
  const panel=(title,color,rows,empty)=>`<div class="dsh-p"><div class="dsh-ph" style="background:${color}">${title}</div>${rows.length?rows.join(''):`<div class="dsh-row" style="color:var(--t3);font-style:italic">${empty}</div>`}</div>`;
  const perf=weekPerf(liveWeekJobs(),todayIx);
  const movedJ=all.filter(o=>(o.delMoves||[]).length);
  const neverJ=planned.filter(o=>DEL_DAYS.indexOf(o.delDay)<todayIx&&!o.delLoadedAt&&!o.delDispAt&&!o.delDelivAt&&!o.delDone);
  const held=allHolds(['saw','fit'],'hold');
  app.innerHTML=`<div class="dsh">
    <div class="dsh-tiles">
      ${tile(perf.pct===null?'—':perf.pct+'%','ON TIME THIS WEEK',perf.due?perf.onTime+' of '+perf.due+' due so far':'nothing due yet',perf.pct!==null&&perf.pct<90?'#c0392b':'#0d6e46')}
      ${tile(movedJ.length,'MOVED DELIVERIES','day or van changed after planning',movedJ.length?'#c0392b':'#5b6b82')}
      ${tile(perf.partial.length,'PARTIAL RUNS','van went, not every drop delivered',perf.partial.length?'#c0392b':'#5b6b82')}
      ${tile(neverJ.length,'NEVER LEFT','planned day passed, never loaded',neverJ.length?'#c0392b':'#5b6b82')}
      ${tile(held.length,'WAITING ON MATERIAL','rows parked at saw / stores',held.length?'#c0392b':'#5b6b82')}
      ${tile(missed.length,'MISSED DELIVERIES','planned earlier this week, not delivered',missed.length?'#c0392b':'#5b6b82')}
      ${tile(onTruck.length,'ON TRUCKS NOW','dispatched, awaiting driver confirmation','#1450a8')}
      ${tile(loadedNotGone.length,'LOADED IN YARD','on a van, not yet dispatched','#8a6d00')}
      ${tile(delivered.length,'DELIVERED','this week · €'+Math.round(val(delivered)).toLocaleString(),'#0d6e46')}
      ${tile(planned.length,'ON DELIVERY BOARD','planned this week · €'+Math.round(val(planned)).toLocaleString(),'#14335c')}
      ${tile(sawOpen.length,'CUTTING LISTS OPEN',(n=>n?`<b style="color:#c0392b">${n} OVERDUE</b> · `:'')(sawOpen.filter(listOverdue).length)+sawDone.length+' cut complete','#7c5cd6')}
      ${tile(fitOpen.length,'FITTINGS TO PICK',(n=>n?`<b style="color:#c0392b">${n} OVERDUE</b> · `:'')(fitOpen.filter(listOverdue).length)+fitDone.length+' picked','#0e7490')}
      ${tile(needed.length,'LISTS MISSING','jobs scheduled with no cutting list',needed.length?'#c0392b':'#5b6b82')}
    </div>
    <div class="dsh-cols">
      ${panel('⚠ MISSED — planned earlier this week, not delivered','#c0392b',missed.sort((a,b)=>DEL_DAYS.indexOf(a.delDay)-DEL_DAYS.indexOf(b.delDay)).map(o=>`<div class="dsh-row"><b>${escA(o.wo)}</b><span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-c">${escA(o.customer||'')}</span><span class="dsh-x" style="color:#c0392b;font-weight:800">${escA(o.delDay)} · ${st(o)?dStageLbl[st(o)]:'NEVER LOADED'}</span></div>`),'None — every planned delivery is on time ✓')}
      ${panel('🚚 ON TRUCKS NOW','#1450a8',onTruck.map(o=>`<div class="dsh-row"><b>${escA(o.wo)}</b><span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-c">${escA(o.customer||'')}</span><span class="dsh-x">${escA(vehLbl(o.delVeh)||'')} · out since ${dStageTime(o)}</span></div>`),'Nothing out for delivery right now')}

    const mine=all.filter(o=>(o.customer||'')===c);

      ${delivWk.length?`<div class="pm-sec" style="color:#0d6e46">✓ DELIVERED THIS WEEK</div>`+delivWk.map(o=>row(`<b>${escA(o.wo)}</b>${fu(o)?`<span class="flr-fu" style="font-size:12px">${escA(fu(o))}</span>`:''}<span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-x" style="color:#0d6e46">${o.delDelivAt?new Date(o.delDelivAt).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'})+' '+dStageTime(o):''}${o.delivBy?' · '+escA(o.delivBy):''}</span>`)).join(''):''}
      ${past.length?`<div class="pm-sec" style="color:var(--t3)">📚 DELIVERED — PAST WEEKS</div>`+past.map(j=>row(`<b>${escA(j.wo)}</b>${fu(j)?`<span class="flr-fu" style="font-size:12px">${escA(fu(j))}</span>`:''}<span class="dsh-t">${escA(j.t||'')}</span><span class="dsh-x">${new Date(j._at).toLocaleDateString('en-IE',{day:'numeric',month:'short'})}${j.vBy?' · '+escA(j.vBy):''}</span>`)).join(''):''}
      ${coming.length?`<div class="pm-sec" style="color:#8a6d00">📅 COMING UP — due, not yet on the delivery board</div>`+coming.map(o=>row(`<b>${escA(o.wo)}</b>${fu(o)?`<span class="flr-fu" style="font-size:12px">${escA(fu(o))}</span>`:''}<span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-x">due ${fmt(o.dueDate)}${o.plannedWeek?' · build '+wkLbl(o.plannedWeek):''}</span>`)).join(''):''}

    <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <h1 style="font-size:26px;color:#14335c;margin:0">🏗 Project Managers — Deliveries by customer</h1>
      <select id="pm-cust" style="padding:8px 10px;border:1px solid var(--b2);border-radius:8px;font-size:14px;max-width:260px">
