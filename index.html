function lsRevInfo(id,mode){
  const r=LST.l.get(id),rev=+((r||{}).rev)||1,ls0=lsLinesOf(id).filter(x=>x.kind!=='hdr'&&(!mode||x.kind===mode));
  const out={rev,changed:0,added:0,removed:0,aside:[]};if(rev<2)return out;
  ls0.forEach(x=>{
    if(x.removed_rev!=null){if(+x.removed_rev===rev){out.removed++;if(x.status==='cut'||x.status==='got-out')out.aside.push(x);}return;}
    if(+x.changed_rev===rev)out.changed++;else if(+x.added_rev===rev)out.added++;
  });
  return out;
}
function lsRevBanner(l,mode){
  if(!V2())return'';const i=lsRevInfo(l.id,mode);if(i.rev<2)return'';
  return `<div class="rev-note" style="background:#fff4d6;border:1px solid #e0a43a;color:#7a5200;border-radius:6px;padding:6px 10px;font-weight:800;margin:6px 0">REV ${i.rev} — ${i.changed} changed, ${i.added} added, ${i.removed} removed</div>`
    +(i.aside.length?`<div class="rev-aside" style="background:#eef0f3;color:#5b6b82;border-radius:6px;padding:6px 10px;margin:4px 0;font-size:13px">${i.aside.map(x=>`<div><s>${escA(x.part||'')} ×${escA(x.qty)}${x.length_mm||x.width_mm?' · '+escA(x.length_mm==null?'':+x.length_mm)+' × '+escA(x.width_mm==null?'':+x.width_mm):''}</s> — <b>REMOVED — part already ${x.kind==='saw'?'cut':'got out'}, keep aside</b></div>`).join('')}</div>`:'');
}
function lsLineBadge(id){
  if(!V2())return'';const x=LST.ln.get(id),r=x&&LST.l.get(x.list_id);if(!x||!r)return'';const rev=+r.rev||1;
  if(rev>1&&+x.changed_rev===rev)return'<span class="rev-b" style="background:#c0392b;color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:800">CHANGED</span> ';
  if(rev>1&&+x.added_rev===rev)return'<span class="rev-b" style="background:#1a56db;color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:800">NEW</span> ';
  return'';
}
/* diffLines:start */
/* Revision comparison — pure (no screen, no database), so the tests can check it on its own.
   old: the list's lines as stored; nw: the edited / re-uploaded lines in their new order. In this order:
   1. identical lines (kind, part, L, W, qty, material, edging) keep their id and status — a note-only change keeps the tick
      but is flagged. Between identical twins, a ticked one is kept first (so a tick is never thrown away for an untouched twin).
   2. leftovers with the same kind, part and section pair in order: CHANGED (reset to todo).
   3. only in the new version: ADDED (new id after the highest one ever used).
   4. only in the old version: REMOVED — never deleted; kept aside if already cut / got out.
   Returns the lines for save_list_revision (reset:true where the content changed) plus the ids in each group. */
function diffLines(old,nw,opt){
  opt=opt||{};old=old||[];nw=nw||[];
  const T=v=>String(v==null?'':v).trim().replace(/\s+/g,' ').toLowerCase();
  const N=v=>{const s=String(v==null?'':v).trim().replace(/\s*mm$/i,'');if(s==='')return'';const n=Number(s);return isNaN(n)?s.toLowerCase().replace(/\s+/g,' '):String(n);};
  const key=x=>[T(x.kind),T(x.part),N(x.length_mm),N(x.width_mm),N(x.qty),T(x.material),T(x.edging)].join('|');
  const pk=x=>[T(x.kind),T(x.part),T(x.section)].join('|');
  const isDone=x=>x.status==='cut'||x.status==='got-out';
  const sq=x=>+x.seq||0;
  const live=old.filter(x=>x.removed_rev==null),used=new Set(),match=nw.map(()=>null),how=nw.map(()=>'');
  const pick=(i,f,doneFirst)=>{const c=live.filter(x=>!used.has(x.id)&&f(x));
    c.sort((a,b)=>(doneFirst?(isDone(b)?1:0)-(isDone(a)?1:0):0)||sq(a)-sq(b));
    if(c.length){match[i]=c[0];used.add(c[0].id);return true;}return false;};
  // 0. a line that names its own id (the editor knows which row is which) pairs with exactly that line — twins can't swap
  //    ... but only while it is still the same kind of part: a cut "Side" overtyped into "Shelf" is a removed Side + a new Shelf (so the saw is told to keep the Side aside)
  const kp=x=>T(x.kind)+'|'+T(x.part);
  nw.forEach((x,i)=>{if(x.id==null)return;const o=live.find(y=>y.id===x.id&&!used.has(y.id));if(!o||kp(o)!==kp(x))return;match[i]=o;used.add(o.id);how[i]=key(o)!==key(x)?'changed':T(o.note)!==T(x.note)?'note':'same';});
  // ... and a row naming a line that has since been removed, an id this list never had (pasted from another list), or an
  //     id an earlier row already names (a copied row) is a NEW line — it never takes another line's id. (A part overtyped
  //     into a different part still pairs by content below, so swapped rows keep their ticks.)
  const ids=new Set(old.map(x=>x.id)),gone=new Set(old.filter(x=>x.removed_rev!=null).map(x=>x.id)),first=new Map();
  nw.forEach((x,i)=>{if(x.id!=null&&!first.has(x.id))first.set(x.id,i);});
  const free=i=>{const id=nw[i].id;return !match[i]&&!(id!=null&&(gone.has(id)||!ids.has(id)||first.get(id)!==i));};
  nw.forEach((x,i)=>{if(!free(i))return;const k=key(x);if(pick(i,o=>key(o)===k&&T(o.note)===T(x.note),true))how[i]='same';});
  nw.forEach((x,i)=>{if(!free(i))return;const k=key(x);if(pick(i,o=>key(o)===k,true))how[i]='note';});
  nw.forEach((x,i)=>{if(!free(i))return;const k=pk(x);if(pick(i,o=>pk(o)===k,false))how[i]='changed';});
  const tail=x=>{const m=/:(\d+)$/.exec(String(x.id||''));return m?+m[1]:sq(x);};
  let top=Math.max(0,...old.map(tail));
  const mk=opt.mkId||(()=>(opt.listId||'L')+':'+(++top));
  const num=v=>{const s=String(v==null?'':v).trim().replace(/\s*mm$/i,'');return s===''||isNaN(+s)?null:+s;}; // "720mm" = 720
  const txt=v=>v==null||String(v).trim()===''?null:String(v).trim();
  const out={lines:[],changed:[],added:[],removed:[],keepAside:[],noteOnly:[]};
  nw.forEach((x,i)=>{
    const o=match[i],id=o?o.id:mk();
    const ln={id,seq:i+1,kind:x.kind,section:txt(x.section),part:txt(x.part),length_mm:num(x.length_mm),width_mm:num(x.width_mm),qty:txt(x.qty),unit_qty:txt(x.unit_qty),
      material:txt(x.material),material_other:!!x.material_other,edging:txt(x.edging),note:txt(x.note)};
    if(x.snag_id)ln.snag_id=x.snag_id;
    if(x.src_line_id)ln.src_line_id=x.src_line_id;
    if(how[i]==='changed'){ln.reset=true;out.changed.push(id);}
    else if(how[i]==='note')out.noteOnly.push(id);
    else if(!o)out.added.push(id);
    out.lines.push(ln);
  });
  live.forEach(x=>{if(!used.has(x.id)){out.removed.push(x.id);if(isDone(x))out.keepAside.push(x.id);}});
  out.summary={changed:out.changed.length,added:out.added.length,removed:out.removed.length,noteOnly:out.noteOnly.length,keepAside:out.keepAside.length};
  return out;
}

/* lsParseGrid:start */
/* One reader for WPF's cutting-list sheets — used by the Excel import AND by paste into the list editor. Pure (no screen,
   no database), so the tests can check it on its own.
   aoa: the sheet's rows from A1 (cached values; null = empty). opt.formulas: the same grid with each cell's formula (or null).
   opt.sheet: the sheet name (a sheet-wide "Nr of units" makes a unit block with this name). opt.paste: no project row.
   Columns: Description | Qty | Length | Width | Colour | Edging (| Note).
   Returns {meta:{project,title,date,carcass,door}, rows, warn}. Rows are the editor's rows:
     {k:'hdr',item,note[,units]}  a heading; with units it is a unit heading ("900 Single Rail + 2 shelves", 3 units)
     {k:'part',item,qty,L,W,mat,edging,note[,total]}  inside a unit block qty is PER UNIT and total = qty × units
     {k:'hdr',info:true,item,note}  a line that isn't a part (e.g. a school's room breakdown "Science Lab 1 … 6")
   Every row carries src = its row number in the sheet. */
function lsParseGrid(aoa,opt){
  opt=opt||{};aoa=aoa||[];const F=opt.formulas||[];
  const meta={project:'',title:'',date:'',carcass:'',door:''},rows=[],warn=[];
  const isErr=v=>typeof v==='string'&&/^#(VALUE|REF|N\/A|NAME|DIV\/0|NUM|NULL)[!?]?/i.test(v.trim());
  const raw=(r,c)=>{const v=(aoa[r]||[])[c];return v==null||isErr(v)||(typeof v==='string'&&v.trim()==='')?null:v;};
  const fm=(r,c)=>{const f=(F[r]||[])[c];return f==null||String(f).trim()===''?null:String(f).trim().replace(/^=/,'');};
  const num=v=>{if(v==null||v instanceof Date)return NaN;if(typeof v==='number')return v;const s=String(v).trim().replace(/\s*mm$/i,'');return /^-?\d+(\.\d+)?$/.test(s)?+s:NaN;};
  const col=s=>{let n=0;for(const ch of s.toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n-1;};
  // a tiny formula reader: numbers, cell references on this sheet ($ allowed), + - * / and brackets; anything else = unknown
  const evalF=(src,depth)=>{
    if(depth>20)return null;let i=0;const s=src.replace(/\s+/g,'');
    const ref=()=>{const m=/^\$?([A-Z]{1,3})\$?(\d+)/i.exec(s.slice(i));if(!m||/^[!(]/.test(s.slice(i+m[0].length)))return undefined;i+=m[0].length;const x=val(+m[2]-1,col(m[1]),depth+1);return typeof x==='string'&&!isNaN(num(x))?num(x):x;};
    const atom=()=>{if(s[i]==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return v;}if(s[i]==='-'){i++;const v=atom();return typeof v==='number'?-v:null;}
      const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(m){i+=m[0].length;return+m[0];}const v=ref();if(v===undefined)throw 0;return v;};
    const term=()=>{let v=atom();while(s[i]==='*'||s[i]==='/'){const op=s[i++],w=atom();v=typeof v==='number'&&typeof w==='number'?(op==='*'?v*w:v/w):null;}return v;};
    const expr=()=>{let v=term();while(s[i]==='+'||s[i]==='-'){const op=s[i++],w=term();v=typeof v==='number'&&typeof w==='number'?(op==='+'?v+w:v-w):null;}return v;};
    try{const v=expr();return i===s.length?v:null;}catch(e){return null;}
  };
  const val=(r,c,depth)=>{const v=raw(r,c);if(v!=null)return typeof v==='string'?v.trim():v;const f=fm(r,c);return f?evalF(f,depth||0):null;};
  // "=$B$5*3" / "=2*B6": the per-unit quantity when the reference is the block's units cell
  const perUnit=(r,c,u)=>{const f=fm(r,c);if(!f||!u)return null;const s=f.replace(/\s+/g,'');
    let m=/^\$?([A-Z]{1,3})\$?(\d+)\*(\d+(?:\.\d+)?)$/i.exec(s),c0,r0,k;
    if(m){c0=m[1];r0=m[2];k=m[3];}else{m=/^(\d+(?:\.\d+)?)\*\$?([A-Z]{1,3})\$?(\d+)$/i.exec(s);if(!m)return null;k=m[1];c0=m[2];r0=m[3];}
    return col(c0)===u.c&&+r0-1===u.r?+k:null;};
  const str=v=>v==null?'':v instanceof Date?v.toISOString().slice(0,10):String(v).trim();
  const isoDate=v=>{if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);const s=str(v);let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m)return m[0];
    m=/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/.exec(s);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}return'';};
  const LBL=/^(project( name)?|title|date|carcass colou?r|door colou?r|(nr|no\.?|number) of units)\s*:?$/i;
  const UNITS=/total\s*(nr|no\.?|number)\s*(of)?\s*units?/i;
  let cur=null; // the current heading row; cur.u = {r,c} of its units cell once it is a unit block
  const startUnits=(n,r,c)=>{
    if(!cur||cur.info||cur.units!=null){cur={k:'hdr',item:opt.sheet?String(opt.sheet).trim():'Units',note:'',src:r+1};rows.push(cur);}
    cur.units=n;cur.u={r,c};
  };
  const nRows=aoa.length;
  for(let r=0;r<nRows;r++){
    const cells=[0,1,2,3,4,5,6].map(c=>val(r,c));
    if(cells.every(v=>v==null||str(v)===''))continue;

      else if(/^carcass/.test(k))meta.carcass=str(v);else if(/^door/.test(k))meta.door=str(v);
      else if(!isNaN(num(v))&&num(v)>0)startUnits(num(v),r,vi);
      continue;
    }
    // 2. the column-header row ("Description | Qty | Length …") is labels, not a part
    if(/^(description|item|part( name)?)$/i.test(A)&&texts.slice(1).some(t=>/^(qty|nr|no\.?|quantity|length|width|dimension|colou?r|material)$/i.test(t)))continue;
    // 3. "2 | total nr of units" sets the units of the block above
    const ui=texts.findIndex(t=>UNITS.test(t));
    if(ui>=0){
      let c=texts.findIndex((t,j)=>j!==ui&&t!==''&&!isNaN(num(cells[j])));let n=c>=0?num(cells[c]):NaN;
      if(isNaN(n)){const m=/^\s*(\d+)/.exec(texts[ui]);if(m){n=+m[1];c=ui;}}
      if(n>0){startUnits(n,r,c);continue;}
    }
    // 4. the legacy project row: the very first row, one name in A (and maybe the date in F)
    if(r===0&&!opt.paste&&A&&cells.slice(1).every((v,c)=>v==null||(c===4&&(v instanceof Date||isoDate(v))))){meta.project=A;if(cells[5]!=null)meta.date=isoDate(cells[5]);continue;}
    const qv=cells[1]==null?NaN:typeof cells[1]==='number'?cells[1]:parseFloat(texts[1]);
    const L=num(cells[2]),W=num(cells[3]),mat=texts[4],edging=texts[5],note=texts[6];
    if(!isNaN(qv)||(!isNaN(L)&&!isNaN(W)&&(A||mat))){
      const sized=!isNaN(L)||!isNaN(W);
      const p={k:'part',item:sized?A:(A||mat),qty:'',L:isNaN(L)?'':L,W:isNaN(W)?'':W,mat,edging:sized?edging:'',note:sized?note:[edging,note].filter(Boolean).join(' · '),src:r+1}; // decision 4: column F is Edging on a saw part, a note on a Stores part
      const qty=isNaN(qv)?'':typeof cells[1]==='number'||/^\d+(\.\d+)?(\s*(off|pcs?|no\.?))?$/i.test(texts[1])?qv:texts[1]; // "2x2" kept as typed, never guessed
      if(cur&&cur.units!=null&&!cur.info){
        const k=perUnit(r,1,cur.u);
        if(k!=null){p.qty=k;p.total=typeof qty==='number'?qty:k*cur.units;}
        else if(typeof qty==='number'){const per=Math.round(qty/cur.units*1e6)/1e6;p.qty=per;p.total=qty;
          if(per!==Math.round(per))warn.push('Row '+(r+1)+' "'+(p.item||'part')+'": '+qty+' isn\'t a whole number for each of '+cur.units+' units — check it');}
        else{p.qty=qty;p.total=qty;if(qty!=='')warn.push('Row '+(r+1)+' "'+(p.item||'part')+'": quantity "'+qty+'" can\'t be worked out per unit — check it');}
      }else p.qty=qty;
      rows.push(p);continue;
    }
    if(A||mat){
      if(!isNaN(L)||!isNaN(W)){rows.push({k:'hdr',info:true,item:A||mat,note:texts.slice(1,7).filter(Boolean).join(' '),src:r+1});continue;} // e.g. "Science Lab 1 … 6"
      cur={k:'hdr',item:A||mat,note:A?[mat,edging,note].filter(Boolean).join(' · '):'',src:r+1};rows.push(cur);
    }
  }
  rows.forEach(x=>{delete x.u;});
  if(meta.title&&/^#/.test(meta.title))meta.title='';
  return{meta,rows,warn};
}
// A worksheet (SheetJS) → the grids lsParseGrid reads, anchored at A1: values (errors = null) and formulas.
function lsSheetAoa(ws){
  const v=[],f=[];if(!ws)return{v,f};
  Object.keys(ws).forEach(a=>{if(a[0]==='!')return;const m=/^([A-Z]+)(\d+)$/.exec(a);if(!m)return;
    let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;c--;const r=+m[2]-1,x=ws[a];if(c>7)return;
    (v[r]=v[r]||[])[c]=x.t==='e'||x.t==='z'||x.v===undefined?null:x.t==='s'?String(x.v):x.v;
    if(x.f)(f[r]=f[r]||[])[c]=x.f;});
  for(let r=0;r<v.length;r++){v[r]=v[r]||[];f[r]=f[r]||[];}
  return{v,f};
}
// Text copied from Excel (tabs between cells, new lines between rows) → a grid for lsParseGrid
function lsPasteAoa(text){
  const lines=String(text||'').replace(/\r\n?/g,'\n').split('\n');if(lines.length&&lines[lines.length-1]==='')lines.pop();
  return lines.map(l=>l.split('\t').map(c=>{c=c.trim();if(/^".*"$/s.test(c))c=c.slice(1,-1).replace(/""/g,'"');return c===''?null:c;}));
}
// Sheets that are never cutting lists (Garry, 3 Nov): the unit library, the index and the stock sheets
function lsSkipSheet(name){return /^\s*(blank|index|stock|door stock)\s*$/i.test(String(name||''));}
// per-unit × units = the total to cut ("2x2" or a blank stays as typed — the editor's check asks for a number)
function lsMul(q,u){const a=String(q==null?'':q).trim(),b=String(u==null?'':u).trim();if(!/^\d+(\.\d+)?$/.test(a)||!/^\d+(\.\d+)?$/.test(b))return a;return String(Math.round(+a*+b*1e6)/1e6);}
/* Editor / import rows → lines for the tables. A row with a length or width goes to the Saw, one without to Stores.
   A part's section = the heading above it. Inside a unit block (a heading with units) the row's qty is PER UNIT: the line
   keeps it as unit_qty and its qty is the TOTAL to cut, so the saw, sheet calculator and labels read qty as before.
   A unit heading is stored as kind 'hdr' with qty = the number of units. Old-shape rows (k 'saw'/'fit') still work. */
function lsEdLines(rows){
  const s=v=>v==null?'':String(v).trim(),n=v=>{const x=parseFloat(String(v==null?'':v).replace(/\s*mm$/i,''));return isNaN(x)?0:x;};
  let sec='',units=null;
  return (rows||[]).map(r=>{
    let ln;
    if(r.k==='hdr'){sec=s(r.item);units=r.units!==undefined&&r.units!==null?s(r.units):null;
      ln={kind:'hdr',section:'',part:s(r.item),note:s(r.note)};if(units!==null)ln.qty=units;}
    else{ // 'part': Saw if it has a length or width; old-shape rows (k 'saw' / 'fit') keep their kind
      const kind=r.k==='saw'||r.k==='fit'?r.k:n(r.L)>0||n(r.W)>0?'saw':'fit',inU=units!==null;
      ln={kind,section:sec||s(r.sec),part:s(r.item),qty:inU?lsMul(r.qty,units):s(r.qty),unit_qty:inU?s(r.qty):'',material:s(r.mat),edging:s(r.edging),note:s(r.note)};
      if(kind==='saw'){ln.length_mm=r.L;ln.width_mm=r.W;}else{ln.length_mm='';ln.width_mm='';}
      if(r.matOther)ln.material_other=true;

function lists(){if(V2())return lsCache().all.filter(l=>!l.archived&&!l.tpl);return DB.lists||[];}
function listRows(l){if(V2())return lsView(l.id,true).rows;const wb=(DB.listWBs||{})[l.wb];return wb&&wb.sheets&&wb.sheets[l.sheet]?wb.sheets[l.sheet]:[];}
function listDone(id){if(V2()){const a=lsList(id);return a?a.done:{};}return (DB.listDone||{})[id]||{};}
function listLead(){return DB.listLead>0?DB.listLead:5;}
function listDueKey(l){ // earliest due date among tagged WOs — the ONLY thing that orders the queues
  let best='';
  (l.wos||[]).forEach(w=>{const o=DB.orders.find(x=>x.wo===w);if(o&&o.dueDate&&(!best||o.dueDate<best))best=o.dueDate;});
  if(l.deliverBy&&(!best||l.deliverBy<best))best=l.deliverBy; // V2: a snag list has no WO — its deliver-by date puts it on the saw
  return best;
}
function listDueKey2(arr){let b='';arr.forEach(l=>{const k=listDueKey(l);if(k&&(!b||k<b))b=k;});return b;}
function listCust(l){for(const w of (l.wos||[])){const o=DB.orders.find(x=>x.wo===w);if(o&&o.customer)return o.customer;}return'';}
// The factory rule: cutting and fittings must be finished THE DAY BEFORE delivery.
function todayLocal(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function listDeadline(l){ // calendar day before delivery — local-date arithmetic (UTC ms slipped a day when the clocks change)
  const d=listDueKey(l);if(!d)return'';
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d));
  const t=m?new Date(+m[1],+m[2]-1,+m[3],12):new Date(d);if(isNaN(t))return'';
  t.setDate(t.getDate()-1);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');

function listOverdue(l){const dl=listDeadline(l);return !!dl&&dl<todayLocal();}

function woFinished(o){

function listFinished(l){ // every tagged job shipped/delivered (or none tagged but both sides signed off) — nothing left for the factory to do
  const ws=(l.wos||[]).map(w=>DB.orders.find(o=>o.wo===w));
  if(ws.length&&ws.every(o=>!o||woFinished(o)))return true;
  const dn=listDone(l.id);

// Every tagged job is on hold in Cienapps (or finished, with at least one on hold): nothing to cut or pick for now —
// left out of the Saw/Stores queues, "Print today", the sheets panel and the dashboard counts until a job comes back.
function listParked(l){
  const ws=(l.wos||[]).map(w=>DB.orders.find(o=>o.wo===w));
  return ws.some(o=>o&&isOnHold(o))&&ws.every(o=>!o||isOnHold(o)||woFinished(o));

function listsNeeded(){ // WOs scheduled to deliver inside the lead time with NO cutting list tagged
  const tagged=new Set();lists().forEach(l=>(l.wos||[]).forEach(w=>tagged.add(w)));
  const v2=V2();
  const lim=v2?lsAddWorkDays(todayLocal(),listLead()):new Date(Date.now()+listLead()*86400000).toISOString().slice(0,10); // V2: lead in working days (Christmas, bank holidays)
  return DB.orders.filter(o=>{
    if(tagged.has(o.wo)||o.delDelivAt||o.delDone||woFinished(o)||isOnHold(o))return false;
    if(v2&&o.listNA)return false;                   // V2: marked "No list needed" / "Paper list issued"
    const planned=o.delv&&o.delDay;                 // already on the delivery board
    const dueSoon=o.dueDate&&o.dueDate<=lim;        // due date inside the lead window
    return planned||dueSoon||(v2&&lsProcessed(o));  // V2: also every live job at steps 5-8 (Garry, 3 Nov)

function suggestWOs(l){ // match house/unit numbers in the sheet name against live WOs; customer-matches first
  const nums=(String(l.sheet).match(/\d+/g)||[]).map(Number);
  if(!nums.length)return[];
  const pw=(l.project||'').toLowerCase().split(/\s+/).filter(x=>x.length>2);
  const hits=DB.orders.filter(o=>{
    if(o.delDone||o.delDelivAt)return false;

  });

function parseListWorkbook(data){
  const wb=XLSX.read(data,{type:'array',cellDates:true});
  const out={project:'',sheets:{}},entries=[];
  wb.SheetNames.forEach(sn=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    const rows=[];let proj='',sdate='';
    aoa.forEach((r,i)=>{
      const A=r[0]!=null?String(r[0]).trim():'';
      const qv=r[1]!=null&&String(r[1]).trim()!==''?parseFloat(r[1]):NaN;
      const qs=r[1]!=null?String(r[1]).trim():'';
      const qty=typeof r[1]==='number'||/^\d+(\.\d+)?(\s*(off|pcs?|no\.?))?$/i.test(qs)?qv:qs; // "2x2", "4+2" kept as typed — flagged "check quantity", never guessed
      const L=r[2]!=null?parseFloat(r[2]):NaN,W=r[3]!=null?parseFloat(r[3]):NaN;
      const mat=r[4]!=null?String(r[4]).trim():'',note=r[5]!=null&&!(r[5] instanceof Date)?String(r[5]).trim():'';
      if(!A&&isNaN(qv)&&!mat)return;
      if(i===0&&A&&isNaN(qv)){ // project header row: name in A, date in F
        proj=A;const d=r[5];
        if(d instanceof Date)sdate=d.toISOString().slice(0,10);
        else if(typeof d==='string'&&/\d{4}-\d{2}-\d{2}/.test(d))sdate=d.slice(0,10);
        return;
      }
      if(!isNaN(qv)){
        if(!isNaN(L)||!isNaN(W))rows.push({k:'saw',item:A,qty,L:isNaN(L)?'':L,W:isNaN(W)?'':W,mat,note});
        else rows.push({k:'fit',item:A||mat,qty,mat,note});
      }else if(!isNaN(L)&&!isNaN(W)&&(A||mat)){ // size but no quantity: still a part — kept as a line (flagged), not turned into a heading
        rows.push({k:'saw',item:A,qty:'',L,W,mat,note});
      }else if(A||mat){
        if(/^item\s*$/i.test(A)&&r[1]!=null&&/qty/i.test(String(r[1])))return; // the template's column-header row is labels, not data
        rows.push({k:'hdr',item:A,note:mat||note});
      }
    });
    if(rows.some(x=>x.k!=='hdr')){
      out.sheets[sn]=rows;
      entries.push({sheet:sn,sdate,saw:rows.filter(x=>x.k==='saw').length,fit:rows.filter(x=>x.k==='fit').length});
      if(proj&&!out.project)out.project=proj; // project name only from sheets that actually hold items (never a READ ME / cover sheet)
    }
  });
  return{wb:out,entries};
}

/* ---------- Sheets needed: board count per material for a cut-by date range (pure — reusable by a forklift view) ---------- */
const SHEET_M2=5.75,SHEET_WASTE=0.10; // one full board = 5.75 m²; +10% for offcuts and kerf

function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDayISO(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoOf(d);}

const IE_BANK_HOLS=['2026-01-01','2026-02-02','2026-03-17','2026-04-06','2026-05-04','2026-06-01','2026-08-03','2026-10-26','2026-12-25','2026-12-28',
  '2027-01-01','2027-02-01','2027-03-17','2027-03-29','2027-05-03','2027-06-07','2027-08-02','2027-10-25','2027-12-27','2027-12-28',
  '2028-01-01','2028-02-07','2028-03-17','2028-04-17','2028-05-01','2028-06-05','2028-08-07','2028-10-30','2028-12-25','2028-12-26'];

// Last cut-by date that is today's work: a cut-by on a weekend / bank holiday is done the working day before it.

    listRows(l).filter(r=>r.k==='saw').forEach(r=>{
      const k=rowKey(r);

function houseLabels(lsArr){
  // per-house split is by list, not by name: two selected houses both called "House 1" become "House 1" and "House 1 (2)".
  // Every list's real name is reserved first, so a list really called "House 1 (2)" keeps that name and the repeat becomes "House 1 (3)".
  // Names that only differ by spaces or capitals ("House 1", "House 1 ", "house 1") look the same on a chip, so they count
  // as repeats too; a list with no name shows "(no name)".
  const tx=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
  const projs=new Set(lsArr.map(l=>matKey(tx(l.project))));
  const hbase=l=>{const n=tx(l.name)||'(no name)',p=tx(l.project);return projs.size>1&&p?p+' — '+n:n;};
  const lbl=new Map(),real=new Set(lsArr.map(l=>matKey(hbase(l)))),taken=new Set();
  lsArr.forEach(l=>{if(lbl.has(l.id))return;const b=hbase(l);if(!taken.has(matKey(b))){taken.add(matKey(b));lbl.set(l.id,b);}});
  lsArr.forEach(l=>{if(lbl.has(l.id))return;const b=hbase(l);let n=1,t;do{n++;t=b+' ('+n+')';}while(taken.has(matKey(t))||real.has(matKey(t)));taken.add(matKey(t));lbl.set(l.id,t);});
  return lbl;
}
function combineLists(lsArr,mode){
  // aggregate identical items (same item + dims + material + edging) across houses, keeping the per-house split
  const byKey=Object.create(null),order=[]; // no prototype: a house or item called "constructor"/"__proto__" is just a name
  const lbl=houseLabels(lsArr);
  const hname=l=>lbl.get(l.id);
  lsArr.forEach(l=>{
    const hb=holdsOf(l.id),relOnly=!!listDone(l.id)[mode]&&relOpen(l,mode);
    listRows(l).filter(r=>r.k===mode).filter(r=>{const h=hb[rowKey(r)];if(heldRow(l,rowKey(r)))return false;return !relOnly||(h&&h.st==='rel');})
      .filter(r=>!rowTicked(l.id,rowKey(r))).forEach(r=>{ // already cut/picked — not added to the total again
      const key=[matKey(r.item),matKey(r.L),matKey(r.W),matKey(r.mat),matKey(r.note)].join('|'); // same normalising as the sheets panel: spaces/NBSP/accents/case don't split a row; first spelling shown
      if(!byKey[key]){byKey[key]={item:r.item,L:r.L,W:r.W,mat:r.mat,note:r.note,k:r.k,qty:0,bad:0,per:Object.create(null)};order.push(key);}
      const g=byKey[key],h=hname(l),qs=String(r.qty==null?'':r.qty).trim(),q=+qs;
      if(/^\d+$/.test(qs)&&q>0){g.qty+=q;g.per[h]=typeof g.per[h]==='string'?g.per[h]+' + '+q:(g.per[h]||0)+q;}
      else{g.bad++;const t=qs||'no qty';g.per[h]=g.per[h]===undefined?t:g.per[h]+' + '+t;} // "2x2", blank — shown as typed, never guessed
    });
  });
  return order.map(k=>byKey[k]);
}

        markListDone([id],mode,by);clearReleased([l],mode,by);wlSel.delete(id);
        toast(l.name+' — all rows ticked · '+(mode==='saw'?'cut complete':'fittings picked')+' ✓');
      }
      lsSched();render();
    };
    const last=ls.get('wpfOpName');
    if(!on||last)go(last||'');else pickName(mode,(mode==='saw'?'Cutting':'Picking')+' — '+l.name,go);
  });
  // Per-row N/A: one tap parks the line in WAITING (device's remembered name); tap again to undo
  document.querySelectorAll('[data-rna]').forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    const v=b.dataset.rna,i=v.indexOf('|'),id=v.slice(0,i),k=v.slice(i+1);
    const l=lists().find(x=>x.id===id);if(!l)return;
    const on=!heldRow(l,k);
    if(on&&rowTicked(id,k))return;
    const go=by=>{
      if(on?holdOne(l,k,mode,by):unholdOne(l,k,mode,by)){lsSched();render();toast(on?'Line parked — find it under ⏸ WAITING':'Line back in the queue');}
    };
    const last=ls.get('wpfOpName');
    if(last)go(last);else pickName(mode,'Not available — '+l.name,go);
  });
  const upc=document.getElementById('wl-upc');if(upc)upc.onclick=()=>{wlShowUpcoming=!wlShowUpcoming;render();};
  document.querySelectorAll('[data-wlsel]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.wlsel;wlSel.has(id)?wlSel.delete(id):wlSel.add(id);render();
  });
  const cb=document.getElementById('wl-comb');if(cb)cb.onclick=()=>{if(selLists.length>=2)openCombined(selLists,mode);};
  const lb=document.getElementById('wl-lblsel');if(lb)lb.onclick=()=>printLabels(selLists,mode);
  const cs=document.getElementById('wl-clrsel');if(cs)cs.onclick=()=>{wlSel.clear();render();};
  document.querySelectorAll('[data-wllbl]').forEach(b=>b.onclick=()=>{
    const l=lists().find(x=>x.id===b.dataset.wllbl);if(l)printLabels([l],mode);
  });
  document.querySelectorAll('[data-wldone]').forEach(b=>b.onclick=()=>{
    const l=lists().find(x=>x.id===b.dataset.wldone);if(!l)return;
    pickName(mode,(mode==='saw'?'Cut complete':'Fittings picked')+' — '+l.name,by=>{
      tickableRows(l,mode).forEach(r=>{if(!rowTicked(l.id,rowKey(r)))setRowTick(l,rowKey(r),mode,by,true);});
      markListDone([l.id],mode,by);clearReleased([l],mode,by);
      wlSel.delete(l.id);
      lsSched();render();toast(l.name+' — '+(mode==='saw'?'cut complete':'fittings picked')+' ✓');
    });
  });
  document.querySelectorAll('[data-wlundo]').forEach(b=>b.onclick=()=>{
    if(!confirm('Put this list back in the queue?'))return;
    const id=b.dataset.wlundo;
    const lu=lists().find(x=>x.id===id);
    listSetDone(lu||{id},mode,false,ls.get('wpfOpName')||'');
    if(lu)clearRowTicks(lu,mode,ls.get('wpfOpName')||'');
    lsSched();render();
  });
}

/* ---------- Driver phone view: check jobs onto the van, group ALL DELIVERED, photo proof ---------- */
// Cutting/fittings readiness for one WO, from its tagged lists: is the material cut, are the fittings out?
function woListStat(wo){ // per side: 'none' (not applicable) | 'unset' (no rows, not confirmed) | 'hold' | 'open' | 'done'
  const ls2=lists().filter(l=>(l.wos||[]).includes(wo));
  if(!ls2.length)return null;
  const r=woReady(wo);
  const when=m=>{let t='';ls2.forEach(l=>{const d=listDone(l.id)[m];if(d&&d.at>t)t=d.at;});return t;};
  const m=x=>x==='na'?'none':x;
  return{saw:m(r.saw),fit:m(r.fit),sawAt:when('saw'),fitAt:when('fit'),lvl:r.lvl,why:r.why};
}
function sideChipHTML(mode,st,at,big){
  const fs=big?' style="font-size:13px"':'';
  if(st==='none')return'';
  if(st==='done')return`<span class="ls-ok"${fs}>${mode==='saw'?'🪚 CUT ✓':'🧰 PICKED ✓'}${at?' '+hhmm(at):''}</span>`;
  if(st==='hold')return`<span class="ls-hold"${fs}>${mode==='saw'?'🪚 ⏸ WAITING ON MATERIAL':'🧰 ⏸ WAITING ON STOCK'}</span>`;
  if(st==='unset')return`<span class="ls-hold"${fs}>${mode==='saw'?'🪚 no saw rows — confirm "no cutting"':'🧰 no fittings listed — confirm "no fittings"'}</span>`;
  return`<span class="ls-no"${fs}>${mode==='saw'?'🪚 NOT CUT':'🧰 NOT PICKED'}</span>`;
}
function listStatHTML(wo){
  const s=woListStat(wo);
  if(!s)return`<div class="drv-ls"><span class="ls-none">📋 no cutting list linked</span></div>`;
  return`<div class="drv-ls">${sideChipHTML('saw',s.saw,s.sawAt)} ${sideChipHTML('fit',s.fit,s.fitAt)}</div>`;
}
/* Scheduling check: the moment a job is put on the delivery board, show where its cutting
   and fittings lists stand — and whether a list still needs to be issued at all. */
function showReadiness(wos,ctx,always){
  const items=wos.map(w=>{const o=DB.orders.find(x=>x.wo===w)||findDel(w);return o?{o,s:woListStat(w)}:null;}).filter(Boolean);
  if(!items.length)return;
  const attention=items.filter(i=>!i.s||i.s.lvl!=='green');
  if(!attention.length&&!always){toast('✓ Cutting & fittings all ready for '+(items.length===1?items[0].o.wo:items.length+' jobs'));return;}
  const chip=(ok,txtOk,txtNo)=>ok?`<span class="ls-ok" style="font-size:13px">${txtOk}</span>`:`<span class="ls-no" style="font-size:13px">${txtNo}</span>`;

function shrinkImage(file){return new Promise((res,rej)=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{
    const mx=1400,sc=Math.min(1,mx/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('compress failed')),'image/jpeg',.72);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
  img.src=url;
});}
async function addPodPhotos(files,pk){
  if(!files||!files.length)return;
  drvUploading=true;render();
  try{
    DB.pod=DB.pod||{};DB.pod[pk]=DB.pod[pk]||{photos:[]};
    for(const f of files){
      const blob=await shrinkImage(f);
      const path=pk.replace(/[^A-Za-z0-9-]/g,'-')+'/'+Date.now()+'-'+Math.floor(Math.random()*1e4)+'.jpg';
      const r=await fetch(SUPA_STORE+'/object/pod/'+path,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
      if(!r.ok)throw new Error('HTTP '+r.status);
      DB.pod[pk].photos.push(SUPA_STORE+'/object/public/pod/'+path);
    }
    sched();toast('Photo saved ✓');
  }catch(e){
    toast('Photo upload failed ('+e.message+') — tell the office; the photo bucket may not be set up yet.');
  }
  drvUploading=false;render();
}

    const o=findDel(b.dataset.dd);if(!o)return;
    const st=dStage(o);
    const ov=document.createElement('div');ov.className='pod-ovl';
    const dis='disabled style="opacity:.4;cursor:default"';
    ov.innerHTML=`<div class="pod-in" style="min-width:min(400px,92vw)">
      <div style="font-weight:800;color:#14335c;margin-bottom:2px">${escA(o.wo)} — ${escA(o.title||'')}</div>
      <div style="font-size:12px;color:var(--t3);margin-bottom:10px">Current status: <b>${st?dStageLbl[st]:'planned'}</b>${dStageTime(o)?' '+dStageTime(o):''}</div>
      <button class="rbtn" data-st="load" ${st?dis:''} style="justify-content:center">📦 Mark LOADED</button>
      <button class="rbtn" data-st="disp" ${st==='disp'||st==='deliv'?dis:''} style="justify-content:center">🚚 Mark DISPATCHED — left the factory</button>
      <button class="rbtn" data-st="deliv" ${st==='deliv'?dis:''} style="justify-content:center">✅ Mark DELIVERED (records who)</button>
      ${st?`<button class="rbtn" data-st="clear" style="justify-content:center">↩ Clear status</button>`:''}
      <div style="text-align:right;margin-top:6px"><button class="btn btn-s" id="pod-x">Cancel</button></div></div>`;
    document.body.appendChild(ov);
    ov.onclick=e=>{if(e.target===ov||e.target.id==='pod-x')ov.remove();};
    ov.querySelectorAll('[data-st]').forEach(x=>x.onclick=()=>{
      if(x.disabled)return;
      const a=x.dataset.st;
      if(a==='load'){o.delLoadedAt=new Date().toISOString();toast(o.wo+' marked LOADED');}
      else if(a==='disp'){
        if(!confirmPartLoad([o])){ov.remove();return;}
        if(!o.delLoadedAt)o.delLoadedAt=new Date().toISOString();
        o.delDispAt=new Date().toISOString();toast(o.wo+' DISPATCHED — left the factory');
      }
      else if(a==='deliv'){
        ov.remove();
        pickName('driver','Delivered — '+o.wo,by=>{
          const now=new Date().toISOString();
          if(!o.delLoadedAt)o.delLoadedAt=now;if(!o.delDispAt)o.delDispAt=now;
          o.delDelivAt=now;o.delDone=true;o.delivBy=by;
          sched();render();toast(o.wo+' DELIVERED ✓ by '+by);
        });
        return;
      }
      else{delete o.delLoadedAt;delete o.delDispAt;delete o.delDelivAt;delete o.ldBy;delete o.delivBy;o.delDone=false;toast(o.wo+' status cleared');}
      ov.remove();sched();render();
    });
  });
  // Dispatch a whole van load at once
  document.querySelectorAll('[data-cdisp]').forEach(b=>b.onclick=()=>{
    const parts=b.dataset.cdisp.split('|');
    const jobs=delAll().filter(o=>o.delVeh===parts[0]&&o.delDay===parts[1]&&!o.delDispAt&&!o.delDelivAt&&!o.delDone);
    if(!jobs.length)return;
    if(!confirmPartLoad(jobs))return;
    if(!confirm('Dispatch '+jobs.length+' job'+(jobs.length!==1?'s':'')+' on the '+vehLbl(parts[0])+' ('+parts[1]+')?\n\nThis records that the load physically left the factory, timestamped now.'))return;
    const now=new Date().toISOString();
    jobs.forEach(o=>{if(!o.delLoadedAt)o.delLoadedAt=now;o.delDispAt=now;});
    sched();render();toast(vehLbl(parts[0])+' '+parts[1]+' dispatched — '+jobs.length+' jobs, '+hhmm(now));
  });
  // Proof-of-delivery photo viewer (photos the driver took on site)
  document.querySelectorAll('[data-pod]').forEach(b=>b.onclick=()=>{
    const pd=(DB.pod||{})[b.dataset.pod];if(!pd)return;
    const parts=b.dataset.pod.split('|');
    const ov=document.createElement('div');ov.className='pod-ovl';
    ov.innerHTML=`<div class="pod-in"><div style="font-weight:700;color:#14335c;margin-bottom:8px">Proof of delivery — ${escA(vehLbl(parts[0])||parts[0])} ${escA(parts[1]||'')}${pd.by?' · delivered by '+escA(pd.by):''}${pd.at?' · '+new Date(pd.at).toLocaleDateString('en-IE')+' '+hhmm(pd.at):''}</div>${(pd.photos||[]).map(u=>`<a href="${escA(u)}" target="_blank" rel="noopener"><img src="${escA(u)}" alt="proof"></a>`).join('')||'<i>No photos</i>'}<div style="margin-top:10px;text-align:right"><button class="btn btn-s" id="pod-x">Close</button></div></div>`;
    document.body.appendChild(ov);
    ov.onclick=e=>{if(e.target===ov||e.target.id==='pod-x')ov.remove();};
  });
  document.querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{
    const o=findDel(b.dataset.dx);if(!o)return;
    if(o.delDay){placeJobs([o],'','');return;}
    else if(o.manual){DB.delx=(DB.delx||[]).filter(x=>x.wo!==o.wo);toast(o.wo+' deleted');}
    else{o.delv=false;delvMark(o);o.delVeh='';o.delDay='';o.delDone=false;delete o.delLoadedAt;delete o.delDispAt;delete o.delDelivAt;delete o.ldBy;delete o.delivBy;toast(o.wo+' removed from delivery plan');}
    delSel.delete(o.wo);sched();render();
  });
  // Every placement is stamped with who; every MOVE of a planned job also needs a reason (placeJobs)
  const dropTo=(el,veh,day)=>{
    el.ondragover=e=>{e.preventDefault();el.classList.add('dragover');};
    el.ondragleave=()=>el.classList.remove('dragover');
    el.ondrop=e=>{
      e.preventDefault();el.classList.remove('dragover');
      const list=delDragList||[];delDragList=null;
      placeJobs(list.map(findDel),veh,day);
    };
  };
  document.querySelectorAll('.dcell').forEach(c=>{
    const parts=c.dataset.cell.split('|');
    dropTo(c,parts[0],parts[1]);
  });
  document.querySelectorAll('[data-dinfo]').forEach(b=>b.onclick=e=>{e.stopPropagation();showReadiness([b.dataset.dinfo],b.dataset.dinfo,true);});
  bindMissWhy();
  // Tap-to-place: select chips, then tap a day cell — works with gloves/touch and keyboards, no dragging needed
  document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{
    const[veh,day]=b.dataset.place.split('|');
    placeJobs([...delSel].map(findDel),veh,day);
  });
  const pl=document.getElementById('dpool');
  if(pl)dropTo(pl,'','');
  document.querySelectorAll('.dnote').forEach(inp=>inp.oninput=function(){
    (DB.delNotes=DB.delNotes||{})[this.dataset.dnote]=this.value;sched();
  });
  const aj=document.getElementById('btn-addjob');
  if(aj)aj.onclick=()=>{document.getElementById('ajform').classList.toggle('open');const t=document.getElementById('aj-title');if(t)t.focus();};
  const aja=document.getElementById('aj-add');
  if(aja)aja.onclick=()=>{
    const title=document.getElementById('aj-title').value.trim();
    if(!title){toast('Give the job a description');return;}
    let wo=document.getElementById('aj-wo').value.trim();
    if(!wo){wo=uniqId('JOB-');while(delAll().some(o=>o.wo===wo))wo=uniqId('JOB-');}
    if(findDel(wo)||DB.orders.find(o=>o.wo===wo)){toast(wo+' already exists — use a different ref');return;}
    DB.delx=DB.delx||[];
    DB.delx.push({wo,title,customer:document.getElementById('aj-cust').value.trim(),value:parseFloat(document.getElementById('aj-val').value)||0,manual:true,delVeh:'',delDay:'',delDone:false});
    sched();render();toast(wo+' added to the pool');
  };
  const ex=document.getElementById('btn-delexp');if(ex)ex.onclick=exportDeliveries;
  const pp=document.getElementById('btn-delprint');if(pp)pp.onclick=printPoster;
  const rsh=document.getElementById('btn-runsheets');if(rsh)rsh.onclick=printRunSheets;
  const ab=document.getElementById('btn-delarch');if(ab)ab.onclick=openDelArchive;
  const rs=document.getElementById('btn-delreset');
  if(rs)rs.onclick=async()=>{
    if(!confirm('Clear the whole delivery plan ('+tagged.length+' jobs)? A safety backup of the whole plan is saved to the database first, and the week is ARCHIVED (📚 Past weeks keeps every job, timestamp, name and note), then the board starts fresh for the next production meeting.'))return;
    if(!await backupFirst('Clear Week'))return;
    // Archive the week before anything is cleared — starting fresh must never lose information
    const snap=tagged.filter(o=>o.delVeh||o.delDay||o.delv||o.manual);
    if(snap.length){
      DB.delArchive=DB.delArchive||{};
      const key=new Date().toISOString().slice(0,10)+'.'+Date.now().toString(36);
      DB.delArchive[key]={at:new Date().toISOString(),notes:{...(DB.delNotes||{})},pod:{...(DB.pod||{})},
        jobs:snap.map(o=>({wo:o.wo,t:o.title||'',c:o.customer||'',f:o.floor||'',u:o.unit||'',v:o.delVeh||'',d:o.delDay||'',val:Math.round(o.value||0),lAt:o.delLoadedAt||'',dAt:o.delDispAt||'',vAt:o.delDelivAt||'',lBy:o.ldBy||'',vBy:o.delivBy||'',mv:(o.delMoves||[]).map(m=>({at:m.at,by:m.by,why:m.why,from:m.from,to:m.to})),fd:o.delFirst||'',mw:o.missWhy||null}))};
      const ks=Object.keys(DB.delArchive).sort();
      while(ks.length>26)delete DB.delArchive[ks.shift()]; // keep half a year of history
      DB.pod={}; // the week's proof photos move into the archive with it — a fresh board shows no stale 📷
    }
    DB.orders.forEach(o=>{const wasDeliv=!!(o.delDelivAt||o.delDone);delete o.delv;delete o.delVeh;delete o.delDay;delete o.delLoadedAt;delete o.delDispAt;delete o.delDelivAt;delete o.ldBy;delete o.delivBy;delete o.delMoves;delete o.delFirst;delete o.missWhy;delete o.delPlacedBy;delete o.delPlacedAt;if(wasDeliv)o.delDone=true;else delete o.delDone;});
    DB.delx=[];DB.delNotes={};delSel.clear();
    sched();render();toast('Week archived to 📚 Past weeks — board cleared for next week');
  };
}

/* 📚 Past weeks: every cleared delivery week is archived — view it read-only or export it.
   This is the answer to "clearing each week will lose information": it can't, it's archived. */
function openDelArchive(detailKey){
  const ar=DB.delArchive||{};
  const keys=Object.keys(ar).sort().reverse();
  const ov=document.createElement('div');ov.className='pod-ovl';
  const sum=k=>{const a=ar[k];return{n:a.jobs.length,val:a.jobs.reduce((s,j)=>s+(+j.val||0),0),dlv:a.jobs.filter(j=>j.vAt).length};};
  const stamp=t=>t?new Date(t).toLocaleDateString('en-IE',{day:'numeric',month:'short'})+' '+hhmm(t):'';
  let detail='';
  if(detailKey&&ar[detailKey]){
    const a=ar[detailKey];
    const rows=[...a.jobs].sort((x,y)=>DEL_DAYS.indexOf(x.d)-DEL_DAYS.indexOf(y.d)||String(x.v).localeCompare(String(y.v))||woCmp({wo:x.wo},{wo:y.wo}));
    detail=`<div style="margin-top:14px;border-top:2px solid var(--border);padding-top:10px">
      <div style="font-weight:700;color:#14335c;margin-bottom:6px">Week archived ${new Date(a.at).toLocaleDateString('en-IE')} — ${a.jobs.length} jobs</div>
      <table class="lst-tbl"><thead><tr><th>Day</th><th>Vehicle</th><th>WO #</th><th>Floor/Unit</th><th>Title</th><th>Customer</th><th>€</th><th>Loaded</th><th>Dispatched</th><th>Delivered</th></tr></thead><tbody>
      ${rows.map(j=>`<tr><td>${escA(j.d)||'—'}</td><td>${escA(vehLbl(j.v)||j.v)||'—'}</td><td style="font-family:monospace;font-weight:700">${escA(j.wo)}</td><td>${escA([j.f,j.u].filter(Boolean).join(' · '))}</td><td>${escA(j.t)}</td><td>${escA(j.c)}</td><td>${j.val?j.val.toLocaleString():''}</td>
        <td>${stamp(j.lAt)}${j.lBy?' · '+escA(j.lBy):''}</td><td>${stamp(j.dAt)}</td><td style="color:#0d6e46;font-weight:700">${stamp(j.vAt)}${j.vBy?' · '+escA(j.vBy):''}</td></tr>`).join('')}
      ${Object.keys(a.notes||{}).filter(d=>(a.notes[d]||'').trim()).map(d=>`<tr><td style="font-weight:700">${escA(d)}</td><td colspan="9" style="font-style:italic;color:var(--t2)">Note: ${escA(a.notes[d])}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  ov.innerHTML=`<div class="pod-in" style="min-width:min(1050px,95vw)">
    <div style="font-weight:800;color:#14335c;font-size:17px;margin-bottom:4px">📚 Past delivery weeks</div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:10px">Every time the board is cleared, the week is stored here first — jobs, vans, days, who loaded, who delivered, when, and the day notes. Last 26 weeks kept.</div>
    ${keys.length?`<table class="lst-tbl"><thead><tr><th>Archived</th><th>Jobs</th><th>Delivered</th><th>Value</th><th></th></tr></thead><tbody>
      ${keys.map(k=>{const s=sum(k);return `<tr${k===detailKey?' style="background:#eaf2ff"':''}><td style="font-weight:700">${new Date(ar[k].at).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short',year:'numeric'})} ${hhmm(ar[k].at)}</td><td>${s.n}</td><td>${s.dlv}/${s.n}</td><td>€${Math.round(s.val).toLocaleString()}</td>
        <td style="white-space:nowrap"><button class="btn btn-s" data-arcv="${escA(k)}" style="padding:2px 8px;font-size:11px">${k===detailKey?'Viewing':'View'}</button> <button class="btn btn-s" data-arcx="${escA(k)}" style="padding:2px 8px;font-size:11px">⬇ Export</button></td></tr>`;}).join('')}
      </tbody></table>`:'<p style="font-size:13px;color:var(--t3)">No archived weeks yet — the first Clear Week will create one.</p>'}
    ${detail}
    <div style="margin-top:12px;text-align:right"><button class="btn btn-s" id="pod-x">Close</button></div></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov||e.target.id==='pod-x')ov.remove();};
  ov.querySelectorAll('[data-arcv]').forEach(b=>b.onclick=()=>{ov.remove();openDelArchive(b.dataset.arcv);});
  ov.querySelectorAll('[data-arcx]').forEach(b=>b.onclick=()=>{
    const a=ar[b.dataset.arcx];if(!a)return;
    const stamp2=t=>t?new Date(t).toLocaleString('en-IE'):'';
    const rows=[['Day','Vehicle','WO #','Floor','Unit','Title','Customer','Value','Loaded at','Loaded by','Dispatched at','Delivered at','Delivered by'],
      ...[...a.jobs].sort((x,y)=>DEL_DAYS.indexOf(x.d)-DEL_DAYS.indexOf(y.d)||String(x.v).localeCompare(String(y.v)))
        .map(j=>[j.d,vehLbl(j.v)||j.v,j.wo,j.f,j.u,j.t,j.c,j.val,stamp2(j.lAt),j.lBy,stamp2(j.dAt),stamp2(j.vAt),j.vBy]),
      [],['NOTES'],...Object.keys(a.notes||{}).filter(d=>(a.notes[d]||'').trim()).map(d=>[d,a.notes[d]])];
    const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:6},{wch:13},{wch:16},{wch:7},{wch:7},{wch:34},{wch:24},{wch:9},{wch:18},{wch:12},{wch:18},{wch:18},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws,'Delivery Week');
    XLSX.writeFile(wb,'WPF_DeliveryWeek_'+String(a.at).slice(0,10)+'.xlsx');
    toast('Archived week exported ✓');
  });
}

/* Printable A4 run sheets: one docket per vehicle per day with tick boxes and signature lines.
   Print at load-out, the loader ticks each job onto the van and signs — the paper trail for dispatch. */
function printRunSheets(){
  const all=delAll();
  const planned=all.filter(o=>o.delDay&&o.delVeh);
  if(!planned.length){toast('No jobs placed on a vehicle and day yet');return;}
  const now=new Date();const dow=now.getDay();
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+(dow===0?-6:1)+7); // next week's Monday (same rule as the poster)
  const dd=i=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;};
  const fmtD=(d,o)=>d.toLocaleDateString('en-IE',o);
  const printed=fmtD(now,{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' '+hhmm(now.toISOString());
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const DAYNAMES=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  let sheets='';
  DEL_VEH.forEach(v=>{
    DEL_DAYS.forEach((d,di)=>{
      const jobs=planned.filter(o=>o.delVeh===v.k&&o.delDay===d).sort(woCmp);
      if(!jobs.length)return;
      const note=(DB.delNotes||{})[d]||'';
      sheets+=`<div class="sheet">
        <div class="hd"><div><div class="kick">WPF DISPATCH RUN SHEET</div><div class="h1">${esc(v.n)} — ${DAYNAMES[di]} ${fmtD(dd(di),{day:'numeric',month:'short',year:'numeric'})}</div></div>
        <div class="meta">${jobs.length} job${jobs.length!==1?'s':''} · €${Math.round(jobs.reduce((a,o)=>a+(+o.value||0),0)).toLocaleString()}<br>Printed ${esc(printed)}</div></div>
        ${note?`<div class="note">NOTE: ${esc(note)}</div>`:''}
        <table><thead><tr><th class="tick">ON VAN</th><th>WO #</th><th>FLOOR</th><th>UNIT</th><th>DESCRIPTION</th><th>CUSTOMER / SITE</th><th class="tick">CHECKED</th></tr></thead><tbody>
        ${jobs.map(o=>`<tr><td class="tick">☐</td><td class="mono">${esc(o.wo)}</td><td class="mono">${esc(o.floor||'')}</td><td class="mono">${esc(o.unit||'')}</td><td>${esc(o.title||'')}</td><td class="cu">${esc(o.customer||'')}</td><td class="tick">☐</td></tr>`).join('')}
        </tbody></table>
        <div class="sig">
          <div><span>Loaded by:</span><i></i></div>
          <div><span>Checked against van by:</span><i></i></div>
          <div><span>Time van left:</span><i></i></div>
        </div>
        <div class="ft">Every job ticked ON VAN must be marked Dispatched in the planner before the van leaves. Anything NOT ticked must be reported to dispatch immediately.</div>
      </div>`;
    });
  });
  const doc=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>WPF Run Sheets — printed ${esc(printed)}</title><style>
@page{size:A4 portrait;margin:12mm}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17191d;background:#8a8886}
.sheet{width:186mm;min-height:260mm;background:#fff;margin:12px auto;padding:10mm;page-break-after:always;display:flex;flex-direction:column}
@media print{body{background:none}.sheet{margin:0;width:auto;min-height:auto}}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #17191d;padding-bottom:5mm;gap:8mm}
.kick{font-size:11px;font-weight:800;letter-spacing:2px;color:#ec3013;margin-bottom:4px}
.h1{font-size:26px;font-weight:800;line-height:1.05}
.meta{font-size:11px;text-align:right;color:#555;font-weight:600;white-space:nowrap}
.note{background:#fbdcd5;border:1px solid #f3b3a6;color:#5c130a;font-weight:700;font-size:12px;padding:6px 10px;margin-top:4mm;border-radius:4px}
table{width:100%;border-collapse:collapse;margin-top:5mm;font-size:12px}
th{font-size:9px;letter-spacing:1px;text-align:left;background:#17191d;color:#fff;padding:6px 7px}
td{border-bottom:1px solid #c9c6c3;padding:8px 7px;vertical-align:top}
.tick{text-align:center;font-size:17px;width:16mm}
.mono{font-family:monospace;font-size:11px;white-space:nowrap}
.cu{font-size:10px;color:#555}
tr:nth-child(even) td{background:#f4f3f1}
.sig{display:flex;gap:10mm;margin-top:auto;padding-top:10mm}
.sig div{flex:1;font-size:11px;font-weight:700}
.sig i{display:block;border-bottom:2px solid #17191d;height:9mm;margin-top:2mm}
.ft{font-size:9px;color:#777;margin-top:4mm;font-weight:600;letter-spacing:.3px}
</style></head><body>${sheets}<script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body></html>`;
  const w=window.open('','_blank');
  if(!w){toast('Popup blocked — allow popups for this page');return;}
  w.document.write(doc);w.document.close();
  toast('Run sheets opened — one page per van per day, A4');
}

/* Print the delivery plan as A3 landscape wall posters:
   Sheet 1 Artic · Sheet 2 Trucks (Volvo/Renault/Iveco/Crafter + notes) · Sheet 3 Smart Movers (only if used) */
function printPoster(){
  const all=delAll();
  const planned=all.filter(o=>o.delDay);
  if(!planned.length){toast('No jobs placed on a vehicle and day yet');return;}
  const notes=DB.delNotes||{};
  const now=new Date();const dow=now.getDay();
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+(dow===0?-6:1)+7); // next week's Monday
  const dd=i=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;};
  const wn=wkNum(mon);
  const fmtD=(d,o)=>d.toLocaleDateString('en-IE',o);
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const DAYNAMES=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const range='Mon '+fmtD(dd(0),{day:'numeric',month:'short'})+' \u2013 Sat '+fmtD(dd(5),{day:'numeric',month:'short',year:'numeric'});
  const printed=fmtD(now,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const hasNotes=DEL_DAYS.some(d=>(notes[d]||'').trim());
  const smart=planned.some(o=>o.delVeh==='SMART');
  const total=smart?3:2;
  const job=o=>`<div class="job"><div class="jwo">${esc(o.wo)}</div><div class="jti">${esc(o.title||'\u2014')}</div><div class="jcu">${esc(o.customer||'')}</div></div>`;

/* Overflow pagination: a page only ever holds WHOLE vehicle rows. If a category page
   overflows, whole vehicles (last first, e.g. Crafter) move to a continuation page —
   one vehicle's deliveries are never split across pages and no job is ever clipped.
   If a single vehicle alone still overflows its page, the cards step down in size instead. */
function paginate(){
  var list=[].slice.call(document.querySelectorAll('.sheet'));
  for(var si=0;si<list.length;si++){
    var sh=list[si],grid=sh.querySelector('.pgrid'),guard=0;
    while(grid.scrollHeight>grid.clientHeight+2&&guard++<60){
      var rows=sh.querySelectorAll('.vrow');
      if(rows.length<=1){
        var lvl=+(sh.getAttribute('data-c')||0);
        if(lvl>=3)break;
        lvl++;sh.setAttribute('data-c',lvl);sh.className='sheet c'+lvl;
        continue;
      }
      var next=list[si+1];
      var cont=(next&&next.getAttribute('data-cont')===sh.getAttribute('data-cat'))?next:null;
      if(!cont){
        cont=document.createElement('div');
        cont.className='sheet';
        cont.setAttribute('data-cat',sh.getAttribute('data-cat'));
        cont.setAttribute('data-cont',sh.getAttribute('data-cat'));
        var h=sh.querySelector('.ph').cloneNode(true);
        var h1=h.querySelector('.h1');h1.textContent=h1.textContent.replace(' (cont.)','')+' (cont.)';
        var g=document.createElement('div');g.className='pgrid';
        g.appendChild(sh.querySelector('.dhead').cloneNode(true));
        cont.appendChild(h);cont.appendChild(g);
        cont.appendChild(sh.querySelector('.pf').cloneNode(true));
        sh.parentNode.insertBefore(cont,sh.nextSibling);
        list.splice(si+1,0,cont);
      }
      var cg=cont.querySelector('.pgrid');
      cg.insertBefore(rows[rows.length-1],cg.children[1]||null);
      var nr=sh.querySelector('.nrow');
      if(nr)cg.appendChild(nr);
    }
  }
  var all=document.querySelectorAll('.sheet');
  for(var i=0;i<all.length;i++){var f=all[i].querySelector('.pfn');if(f)f.textContent='Sheet '+(i+1)+' of '+all.length;}
}
/* Load the poster font WITHOUT blocking: if Google Fonts is slow or the office is
   offline, we still paginate and print (system font fallback) after 3s. */
(function(){
  var done=false;
  function go(){if(done)return;done=true;paginate();setTimeout(function(){window.print();},250);}
  var l=document.createElement('link');l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap';

    else setTimeout(go,400);
  };
  l.onerror=function(){go();};
  document.head.appendChild(l);
  setTimeout(go,3000);
})();
<\/script></body></html>`;

function exportDeliveries(){
  const all=delAll();
  if(!all.length){toast('No jobs tagged for delivery yet');return;}
  const notes=DB.delNotes||{};
  // Calendar sheet — mirrors the on-screen grid
  const jobTxt=o=>o.wo+' — '+(o.title||'')+(o.customer?'  ['+o.customer+']':'')+'  €'+Math.round(o.value||0).toLocaleString()+(o.delDone?'  — DELIVERED':'');
  const cal=[['Vehicle',...DEL_DAYS]];
  DEL_VEH.forEach(v=>{
    const by={};DEL_DAYS.forEach(d=>{by[d]=all.filter(o=>o.delVeh===v.k&&o.delDay===d).sort(woCmp);});
    const k=Math.max(1,...DEL_DAYS.map(d=>by[d].length));
    for(let i=0;i<k;i++)cal.push([i===0?v.n:'',...DEL_DAYS.map(d=>by[d][i]?jobTxt(by[d][i]):'')]);
    cal.push(['',...DEL_DAYS.map(()=>'')]);
  });
  cal.push(['NOTES',...DEL_DAYS.map(d=>notes[d]||'')]);
  cal.push(['JOBS / DAY',...DEL_DAYS.map(d=>all.filter(o=>o.delDay===d).length)]);
  cal.push(['VALUE / DAY €',...DEL_DAYS.map(d=>Math.round(dayVal(d)))]);
  cal.push(['WEEK TOTAL €',Math.round(all.filter(o=>o.delDay).reduce((a,o)=>a+(+o.value||0),0))]);
  const un=all.filter(o=>!o.delDay);

  const dayIx=o=>{const i=DEL_DAYS.indexOf(o.delDay);return i<0?99:i;};
  const vehIx=o=>{const i=DEL_VEH.findIndex(v=>v.k===o.delVeh);return i<0?99:i;};

  const widths=[{wch:10},{wch:13},{wch:14},{wch:7},{wch:9},{wch:9},{wch:34},{wch:30},{wch:9},{wch:7},{wch:15}];
  const mkSheet=list=>{const ws=XLSX.utils.aoa_to_sheet([hdr,...[...list].sort(srt).map(rowOf)]);ws['!cols']=widths;return ws;};

  const wb=XLSX.utils.book_new();
  const cws=XLSX.utils.aoa_to_sheet(cal);
  cws['!cols']=[{wch:13},...DEL_DAYS.map(()=>({wch:48}))];
  XLSX.utils.book_append_sheet(wb,cws,'Calendar');
  XLSX.utils.book_append_sheet(wb,mkSheet(all),'By Day');
  XLSX.utils.book_append_sheet(wb,mkSheet(all.filter(o=>o.delVeh==='ARTIC')),'Artic');
  XLSX.utils.book_append_sheet(wb,mkSheet(all.filter(o=>o.delVeh&&o.delVeh!=='ARTIC')),'Trucks');
  if(un.length)XLSX.utils.book_append_sheet(wb,mkSheet(un),'Unplanned');
  XLSX.writeFile(wb,'WPF_Deliveries_'+new Date().toISOString().split('T')[0]+'.xlsx');
  toast('Delivery plan exported');
}

function autoSchedule(newOrders){
  const weeks=get8Wks();
  const currentWeek=weeks[0];
  const wkLoad={};
  // Jobs due after the 8-week window stay unscheduled — they are planned when their week comes into view
  const endD=new Date(weeks[weeks.length-1]+'T00:00:00Z');endD.setUTCDate(endD.getUTCDate()+7);
  const windowEnd=wkKey(endD);
  DB.orders.forEach(o=>{if(o.plannedWeek)wkLoad[o.plannedWeek]=(wkLoad[o.plannedWeek]||0)+(+o.hours||0);});
  newOrders.forEach(o=>{if(o.plannedWeek)wkLoad[o.plannedWeek]=(wkLoad[o.plannedWeek]||0)+(+o.hours||0);});
  newOrders.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  newOrders.forEach(o=>{
    if(o.plannedWeek)return;
    let assigned=null;
    if(!o.dueDate){
      assigned=currentWeek;
    } else {
      const due=o.dueDate;
      if(due<currentWeek){
        // Overdue — put in current week
        assigned=currentWeek;
      } else if(due>=windowEnd){
        assigned=''; // beyond the 8 weeks — unscheduled
      } else {
        // Match to the exact week the due date falls in
        for(let i=0;i<weeks.length;i++){
          const wkStart=weeks[i];
          const wkEnd=i<weeks.length-1?weeks[i+1]:null;
          if(due>=wkStart&&(!wkEnd||due<wkEnd)){assigned=wkStart;break;}
        }
        if(!assigned)assigned=weeks[weeks.length-1];
      }
    }
    o.plannedWeek=assigned;
    if(assigned)wkLoad[assigned]=(wkLoad[assigned]||0)+(+o.hours||0);
  });
}

function objsFrom(rows,map){

function importError(msg,detail){

    ${detail?`<div style="font-size:11px;color:#7f1d1d;margin-top:8px;font-family:monospace;opacity:.8">${detail}</div>`:''}

function doImport(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    if(typeof XLSX==='undefined'){importError('The Excel reader library did not load, so no file can be opened. Check your internet connection and reload this page.');return;}
    let wb;
    try{wb=XLSX.read(e.target.result,{type:'binary'});}
    catch(ex){importError('That file could not be read as an Excel workbook. Export again from Cienapps as .xlsx and retry.',String(ex.message||ex));return;}
    const sh=wb.Sheets[wb.SheetNames[0]];
    if(!sh){importError('That workbook contains no sheets.');return;}
    const aoa=XLSX.utils.sheet_to_json(sh,{header:1,blankrows:false}).filter(r=>r&&r.some(c=>c!==''&&c!=null));
    if(aoa.length<2){importError('That sheet has no data rows.');return;}
    const h=findHeaderRow(aoa);
    if(h>-1){
      const map=mapFromHeader(aoa[h]);
      const missing=IMP_FIELDS.filter(f=>f.req&&map[f.k]<0);
      if(missing.length){PEND={rows:aoa.slice(h+1),map:map};renderMapping('Header row found, but no column for: '+missing.map(f=>f.label).join(', ')+'. Confirm the mapping below.');return;}
      runImport(objsFrom(aoa.slice(h+1),map));
    } else {
      const rows=aoa;
      PEND={rows:rows,map:guessCols(rows)};
      renderMapping('This export has no header row, so the columns were matched by their contents. Check the mapping below, then import.');
    }
  };
  reader.readAsBinaryString(file);
}

function renderMapping(note){
  const rows=PEND.rows,map=PEND.map;
  const n=rows.reduce((a,r)=>Math.max(a,r.length),0);
  const isDt=x=>(x instanceof Date)||(typeof x==='number'&&x>35000&&x<80000);
  const sample=i=>{
    const v=rows.map(r=>r[i]).filter(x=>x!==''&&x!=null);
    if(!v.length)return '(empty)';
    // Show date columns as readable dates, not raw Excel serial numbers
    if(v.filter(isDt).length/v.length>=0.9){
      const d=v[0] instanceof Date?v[0]:new Date(Math.round((v[0]-25569)*86400*1000));
      return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
    }
    return String(v[0]).substring(0,24);
  };
  const opts=sel=>{let s=`<option value="-1"${sel<0?' selected':''}>— not used —</option>`;for(let i=0;i<n;i++)s+=`<option value="${i}"${sel===i?' selected':''}>Col ${colLtr(i)} · ${escA(sample(i))}</option>`;return s;};
  document.getElementById('iprev').innerHTML=`<div style="margin-top:14px">
    <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:10px 13px;font-size:12px;color:#92400e;margin-bottom:12px;line-height:1.5">${note}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px">
      ${IMP_FIELDS.map(f=>`<div>
        <label style="display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:3px">${f.label}${f.req?' <span style="color:#dc2626">*</span>':''}</label>
        <select data-mf="${f.k}" style="width:100%;padding:5px 6px;font-size:12px;border:1px solid var(--b2);border-radius:4px;background:#fff">${opts(map[f.k])}</select>
      </div>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--t3);margin:10px 0 12px">${rows.length} data rows detected. Fields marked * are required.</div>
    <button class="btn btn-g" id="mapgo">Import ${rows.length} rows →</button>
    <button class="btn" id="mapcancel" style="margin-left:8px">Cancel</button>
  </div>`;
  document.getElementById('mapcancel').onclick=()=>{PEND=null;document.getElementById('iprev').innerHTML='';};
  document.getElementById('mapgo').onclick=()=>{
    const m={};
    document.querySelectorAll('[data-mf]').forEach(s=>{m[s.getAttribute('data-mf')]=parseInt(s.value,10);});
    const missing=IMP_FIELDS.filter(f=>f.req&&m[f.k]<0);
    if(missing.length){toast('Choose a column for: '+missing.map(f=>f.label).join(', '));return;}
    runImport(objsFrom(PEND.rows,m));
    PEND=null;
  };
}

/* Two-phase import: ANALYZE builds a plan without touching the board; the office reviews

   Nothing changes — and nothing is saved — until Apply is clicked. */

function runImport(rows){

/* ---------- Stage 2 import pipeline ----------

    if(r.skip){skip[r.skip]++;if(r.skip==='totals')skipped.push({line:i+1,wo:String(row.wo).trim(),why:'totals / count row — not a work order'});return;}
    if(isSnagWo(r.key)){skip.snag++;return;}

// Hours source: 'hand' (set in the planner — imports never touch it), 'cien' (Cienapps Hours column), 'est' (estimated / rule).

function hSrc(o){return o.hoursSrc||(o.hoursEstimated?'est':'hand');}
// Hours rules: assembly complete / palleted = 0h · WO-BI / WO-PF = 1h · Cienapps Hours column · no value = 1h · else estimate from value

/* Cienapps status ladder (exact list from Garry, 22 Oct 2026 — docs/ROADMAP.md):
   1.DRAWING · 2.NO SITE MEASURE DONE · 3. READY FOR UPLOAD · 4. READY FOR PRODUCTION · 5. WORK ORDER PROCESSED ·
   6. JOB CUT COMPLETE · 7. ASSEMBLY COMPLETE · 8. PALLETED · 9. JOB SHIPPED · 10. INSTALLED TO BE INVOICE ·
   11. COMPLETED AND INVOICED · 12. ON HOLD / DELETE

   Unnumbered wording falls back to the named ladder below, and is never read as shipped or on hold.
   stepCmp → >0 a is ahead, <0 behind, 0 same rank, null = can't tell. */

const stepNum=stepNo;

   10 INSTALLED TO BE INVOICE or 11 COMPLETED AND INVOICED (by number). Wording that mentions shipped/invoiced

  if(/production\s*complete/.test(t))return 8.5;
  if(/pallet/.test(t))return 8;if(/assembly\s*complete/.test(t))return 7;if(/assembl/.test(t))return 6.5;
  if(/cut/.test(t))return 6;if(/work\s*order\s*processed|production/.test(t))return 5;

  el.innerHTML=`<div style="margin-top:14px">

  const setAll=v=>el.querySelectorAll('[data-dk]').forEach(r=>{if(r.value===v)r.checked=true;});

  if(tk)tk.onclick=()=>setAll('take');if(kp)kp.onclick=()=>setAll('keep');
  document.getElementById('imp-cancel').onclick=()=>{IMPPLAN=null;el.innerHTML='<div style="margin-top:14px;font-size:13px;color:var(--t3)">Import cancelled — nothing was changed.</div>';};
  document.getElementById('imp-apply').onclick=async()=>{
    if(!IMPPLAN)return;

    document.querySelectorAll('[data-rmv]').forEach(s=>{if(s.value)moves[s.dataset.rmv]=s.value;});
    document.querySelectorAll('[data-dk]').forEach(r=>{if(r.checked)dueDec[r.dataset.dk]=r.value;});
    const ns=IMPPLAN.shipped.length;
    if(ns>20&&!await backupFirst('import moving '+ns+' work orders to Shipped'))return;
    if(!IMPPLAN)return;
    const prev=IMPPLAN,btn=document.getElementById('imp-apply'),btxt=btn?btn.textContent:'';
    if(btn){btn.disabled=true;btn.textContent='Checking for changes made on other PCs…';}
    // Another PC may have edited jobs while this preview was open: load the database copy NOW and plan again on it

    if(IMPPLAN!==prev)return; // cancelled meanwhile
    if(!ok){if(btn){btn.disabled=false;btn.textContent=btxt;}toast('Could not check the database for changes made on other PCs — import NOT applied. Check the connection and try again.');return;}
    const fresh=reanalyzeImport(prev);
    if(!fresh){IMPPLAN=null;return;}
    const d=planDiff(prev,fresh,moves);
    // carried over from earlier re-shows, so the final message lists everything
    fresh.dropped=(prev.dropped||[]).concat(d.dropped);fresh.applied=(prev.applied||[]).concat(d.applied);
    if(d.added.length||d.changed.length){ // the import would now do something that wasn't in the preview, or would write to a job someone else just changed — show it again, apply nothing
      fresh.changedNote={added:d.changed.map(x=>x.l).concat(d.added)};IMPPLAN=fresh;renderImportPreview(fresh);
      // choices made before another PC changed that job aren't carried over: the row starts at Keep (the other PC's date) and the job's week stays
      const chg=new Set(d.changed.map(x=>x.key));
      document.querySelectorAll('[data-dk]').forEach(r=>{const k=woKey(r.dataset.dk);if(chg.has(k))r.checked=r.value==='keep';else if(dueDec[r.dataset.dk])r.checked=dueDec[r.dataset.dk]===r.value;});
      document.querySelectorAll('[data-rmv]').forEach(s=>{if(chg.has(woKey(s.dataset.rmv)))return;if(moves[s.dataset.rmv]&&[...s.options].some(o=>o.value===moves[s.dataset.rmv]))s.value=moves[s.dataset.rmv];});
      toast('The plan changed while you were reviewing — check the preview again');
      return;
    }
    // Same or fewer changes: each dropped one was either already applied by another PC, or edited there (the planner's edit wins)
    fresh.moves=moves;fresh.dueDec=dueDec;
    applyImport(fresh);IMPPLAN=null;
  };
}
// Apply's fresh load: wait for a save in flight, then reload. False = the database copy could not be fetched.
async function freshForImport(){
  for(let i=0;i<150&&SAVING;i++)await new Promise(r=>setTimeout(r,100));
  if(SAVING)return false;
  await loadDB();
  return !!DB.lastLoadOk;
}
function reanalyzeImport(p){
  const inp=p.input;if(!inp)return p; // a plan built without its input can't be re-run; applyImport still looks every job up again
  const f=analyzeImport(inp.raw?prepImport(inp.raw):inp,p.source);
  if(!f)return f;
  // A job that was on the planner when the preview was built but has been deleted on another PC since: skipped, never re-added
  const pp=p.pre||{},fp=f.pre||{},gone=Object.keys(pp).filter(k=>!(k in fp));
  if(gone.length){const g=new Set(gone);f.newOrders=f.newOrders.filter(o=>!g.has(woKey(o.wo)));f.counts.added=f.newOrders.length;}
  f.gone=[...new Set((p.gone||[]).concat(gone))];
  return f;
}
/* What the planner holds for a job, for every field an import can write or depends on (due date, step, hours and
   where they came from, week, delivery tag/van/day, shipped / on hold / installed / complete, the planner's overrides).
   Apply compares this between the preview and the latest database copy. */
const PRE_K=['dueDate','dueKeep','step','hours','plannedWeek','delv','delVeh','delDay','delLoadedAt','shippedAt','shipBack','cienHold','installedAt','completeAt','completeOverride','delvOverride'];
const PRE_L={dueDate:'due date',dueKeep:'due date',step:'step',hours:'hours',plannedWeek:'week',delv:'delivery tag',delVeh:'van',delDay:'delivery day',delLoadedAt:'loaded',shippedAt:'shipped',shipBack:'brought back',cienHold:'on hold',installedAt:'installed',completeAt:'complete',completeOverride:'complete undone',delvOverride:'untagged'};
function preOf(ex){return JSON.stringify(PRE_K.map(k=>ex[k]==null||ex[k]===''||ex[k]===false?null:ex[k]).concat(hSrc(ex)));}
function preWhat(a,b){
  try{const A=JSON.parse(a),B=JSON.parse(b),r=new Set();PRE_K.forEach((k,i)=>{if(JSON.stringify(A[i])!==JSON.stringify(B[i]))r.add(PRE_L[k]);});
    if(A[PRE_K.length]!==B[PRE_K.length])r.add('hours');return[...r].join(', ');}catch(e){return'';}
}
// Every change a plan would make, as key → plain-English label (what's compared between preview and Apply)
function planActs(p){
  const m=new Map(),v=x=>x===undefined||x===''?'(none)':String(x);
  (p.newOrders||[]).forEach(o=>m.set('new|'+woKey(o.wo)+'|'+JSON.stringify([o.value,o.hours,o.hoursSrc||'',o.dueDate,o.step,!!o.delv,!!o.cienHold,o.plannedWeek||'']),o.wo+': new job'));
  (p.updates||[]).forEach(u=>{const s=u.set||{};Object.keys(s).forEach(k=>{if(k==='hoursSrc'||k==='hoursEstimated')return;
    const val=k==='hours'?[s.hours,s.hoursSrc||'']:s[k];
    m.set('upd|'+u.key+'|'+k+'|'+JSON.stringify(val),u.wo+': '+k+' → '+v(s[k]));});});
  (p.shipped||[]).forEach(s=>m.set('ship|'+s.key+'|'+s.cs,s.wo+': to Shipped ('+s.cs+')'));
  (p.marks||[]).forEach(x=>m.set('mark|'+x.key+'|'+JSON.stringify([!!x.inst,!!x.done]),x.wo+': marked '+(x.done?'complete':'installed')+' ('+x.cs+')'));
  return m;
}
// Is a preview change no longer needed because the job already holds it (another PC applied the same import)?
function actDone(k,board){
  const p=k.split('|'),ex=board.get(p[1]);
  if(p[0]==='new')return !!ex;
  if(!ex)return false;
  if(p[0]==='ship')return !!ex.shippedAt;
  let v;try{v=JSON.parse(p.slice(p[0]==='upd'?3:2).join('|'));}catch(e){return false;}
  if(p[0]==='mark')return(!v[0]||!!ex.installedAt)&&(!v[1]||!!ex.completeAt);
  const f=p[2];
  if(f==='hours')return +ex.hours===+v[0]&&hSrc(ex)===v[1];
  if(f==='dueDate')return ex.dueDate===v||ex.dueKeep===v;
  if(f==='cienHold')return !!ex.cienHold===!!v;
  if(f==='delv')return !!ex.delv===!!v;
  return String(ex[f]==null?'':ex[f])===String(v==null?'':v);
}
/* Preview (a) vs the import worked out again on the latest data (b). The preview is shown again when
   - the import would now do something it didn't show (added), or
   - another PC changed a job (due date, step, hours, week, delivery, shipped/on hold…) that the import still
     writes to, or that has a "Move to" chosen (changed).
   Changes that dropped out are either already applied by another PC, or the other PC's edit wins (dropped). */
function planDiff(a,b,moves){
  const A=planActs(a),B=planActs(b),added=[],dropped=[],applied=[],changed=[],board=boardMap();
  B.forEach((l,k)=>{if(!A.has(k))added.push(l);});
  A.forEach((l,k)=>{if(B.has(k))return;if(actDone(k,board))applied.push(l);else if(board.has(k.split('|')[1]))dropped.push(l);});
  const pa=a.pre||{},pb=b.pre||{},inB=new Set([...B.keys()].map(k=>k.split('|')[1])),mv=new Set(Object.keys(moves||{}).map(woKey));
  Object.keys(pa).forEach(k=>{
    if(!(k in pb)||pa[k]===pb[k]||!(inB.has(k)||mv.has(k)))return;
    const ex=board.get(k);changed.push({key:k,l:(ex?ex.wo:k)+': changed on another PC ('+(preWhat(pa[k],pb[k])||'details')+')'});
  });
  return{added,dropped,applied,changed};
}
// Going on hold: off the Deliveries board — tag, van and day cleared, what it was is noted on the job (and its history).
// Coming back restores none of it. A job already loaded / on the road / delivered is left alone (it stays on
// Deliveries with an ON HOLD marker on its chip).
function holdUntag(ex){
  if(!ex.delv&&!ex.delVeh&&!ex.delDay)return;
  if(!delHidden(ex))return;
  const was=[ex.delVeh?vehLbl(ex.delVeh)||ex.delVeh:'',ex.delDay||''].filter(Boolean).join(' · ')||'tagged, no van/day';
  ex.holdDel=was;ex.delv=false;ex.delVeh='';ex.delDay='';
  logEdit(ex,'On hold in Cienapps — taken off Deliveries (was '+was+')','(import)');
}
function applyImport(plan){
    plan=plan||{};
    // Look every job up again NOW — another screen may have added, edited or deleted jobs since the preview was built.
    // No import ever removes a job (an old-style plan.removals list is ignored).
    const board=boardMap(),get=x=>board.get(x.key||woKey(x.wo));
    const dec=plan.dueDec||{},at=nowISO();
    (plan.updates||[]).forEach(u=>{
      const ex=get(u);if(!ex)return; // deleted on another screen meanwhile — nothing to update
      const s=u.set||{};
      Object.keys(s).forEach(k=>{if(k!=='dueDate')ex[k]=s[k];});
      if('cienHold' in s){if(s.cienHold){ex.holdAt=at;holdUntag(ex);}else{delete ex.cienHold;delete ex.holdAt;ex.holdBack=at;}}
      if('dueDate' in s){
        if(dec[u.wo]==='keep')ex.dueKeep=s.dueDate; // planner date kept; this Cienapps date won't be asked about again
        else{if(!ex.origDueDate)ex.origDueDate=ex.dueDate||'';ex.dueDate=s.dueDate;delete ex.dueKeep;}
      }
      if('step' in s)origStep[ex.wo]=s.step; // the step came FROM Cienapps — nothing to send back
      if(u.what)logEdit(ex,'Cienapps import: '+u.what+('dueDate' in s?(u.what?' · ':'')+'due '+(dec[u.wo]==='keep'?'kept '+(ex.dueDate||'—'):'→ '+s.dueDate):''),'(import)');
    });
    (plan.fills||[]).forEach(f=>{const ex=get(f);if(!ex)return;Object.keys(f.set).forEach(k=>{if(f.set[k]===undefined)delete ex[k];else ex[k]=f.set[k];});});
    (plan.synced||[]).forEach(s=>{const ex=get(s);if(ex&&String(ex.step||'').trim()===s.step)origStep[ex.wo]=ex.step;});
    // week moves chosen on the Differs rows (these DO show in Export Changes, as they should)
    if(plan.moves)Object.keys(plan.moves).forEach(wo=>{const ex=board.get(woKey(wo));if(ex)ex.plannedWeek=plan.moves[wo];});
    // shipped / invoiced → Shipped tab (first time seen)
    let nShip=0;
    (plan.shipped||[]).forEach(s=>{const ex=get(s);if(!ex||ex.shippedAt)return;ex.shippedAt=at;ex.shippedStep=s.cs;delete ex.shipBack;nShip++;logEdit(ex,'Moved to Shipped — Cienapps: '+s.cs,'(import)');});
    (plan.marks||[]).forEach(m=>{const ex=get(m);if(!ex||!ex.shippedAt)return;
      if(m.inst&&!ex.installedAt){ex.installedAt=at;logEdit(ex,'Installed — Cienapps: '+m.cs,'(import)');}
      if(m.done&&!ex.completeAt){ex.completeAt=at;ex.completeBy='Cienapps';logEdit(ex,'Installation complete — Cienapps: '+m.cs,'(import)');}});
    // new orders — skip any that another screen added meanwhile, then schedule to their due-date week
    const fresh=(plan.newOrders||[]).filter(o=>!board.has(woKey(o.wo)));
    const noAuto=new Set(plan.unsched||[]); // on hold / unreadable due date: left unscheduled
    autoSchedule(fresh.filter(o=>!noAuto.has(woKey(o.wo)))); // (autoSchedule sorts its list; the jobs keep the file's order on the board data)
    fresh.forEach(o=>{
      if(o.cienHold)o.holdAt=at;
      DB.orders.push(o);board.set(woKey(o.wo),o);
      orig[o.wo]=o.plannedWeek||'';origStep[o.wo]=o.step||''; // baseline AFTER auto-schedule so auto-assignments don't show as changes
    });
    // o.procAt: the day the planner first saw the job at 5. WORK ORDER PROCESSED or later — its cutting list is due a set
    // number of working days after it. Jobs already past step 5 the first time this runs get today's date.
    const td=todayLocal();DB.orders.forEach(o=>{if(!o.procAt&&stepNo(o.step)>=5)o.procAt=td;});
    cleanGroups();
    sched();
    const c=plan.counts||{},el=document.getElementById('iprev');
    if(el)el.innerHTML=`<div style="margin-top:14px">
      <div style="font-size:13px;font-weight:600;color:var(--green);margin-bottom:10px">✓ Import applied: ${fresh.length} added · ${(plan.updates||[]).length} updated · ${c.skipped||0} unchanged · ${nShip} moved to 📦 Shipped · nothing removed</div>
      ${plan.applied&&plan.applied.length?`<div style="font-size:12px;color:var(--t2);margin-bottom:10px">${plan.applied.length} change${plan.applied.length!==1?'s':''} already applied by another PC: ${escA(plan.applied.slice(0,10).join(' · '))}${plan.applied.length>10?' …':''}</div>`:''}
      ${plan.dropped&&plan.dropped.length?`<div style="font-size:12px;color:#8a6d00;margin-bottom:10px">${plan.dropped.length} change${plan.dropped.length!==1?'s':''} from the preview not made — edited on another PC meanwhile (the planner's edit wins): ${escA(plan.dropped.slice(0,10).join(' · '))}${plan.dropped.length>10?' …':''}</div>`:''}
      ${plan.gone&&plan.gone.length?`<div style="font-size:12px;color:#8a6d00;margin-bottom:10px">Skipped — deleted on another PC while the preview was open (not re-added): ${escA(plan.gone.slice(0,20).join(', '))}${plan.gone.length>20?' …':''}</div>`:''}
      <button class="btn btn-g" onclick="showTab('b')">Go to Capacity Board →</button>
      ${nShip?`<button class="btn btn-s" style="margin-left:8px" onclick="showTab('h')">Open Shipped →</button>`:''}
      ${V2()?'<div style="margin-top:14px">'+listsToIssueHTML()+'</div>':''}
    </div>`;
    if(el&&V2()){LTI.afterImp=true;ltiBind();}
    toast(`Import applied — ${fresh.length} added, ${(plan.updates||[]).length} updated${nShip?', '+nShip+' to Shipped':''}`);
}

/* ---------- Delivery moves: first placement is stamped; every later move needs a name AND a reason ---------- */
function slotLbl(v,d){return d?((vehLbl(v)||v)+' '+d):'the pool';}
function placeJobs(moved,veh,day){
  moved=moved.filter(Boolean);
  if(!moved.length)return;
  const changing=moved.filter(o=>(o.delVeh||'')!==veh||(o.delDay||'')!==day);
  if(!changing.length){delSel.clear();render();return;}
  const reMoves=changing.filter(o=>o.delDay);
  const apply=(by,why)=>{
    const at=nowISO(),to=day?veh+'|'+day:'';
    changing.map(o=>findDel(o.wo)).filter(Boolean).forEach(o=>{
      if(o.delDay){
        (o.delMoves=o.delMoves||[]).push({at,by,why,from:o.delVeh+'|'+o.delDay,to});
        logEdit(o,'Delivery moved '+slotLbl(o.delVeh,o.delDay)+' → '+slotLbl(veh,day),by,why);
      }else if(day){
        if(!o.delFirst)o.delFirst=to;
        o.delPlacedBy=by;o.delPlacedAt=at;
        logEdit(o,'Delivery planned for '+slotLbl(veh,day),by);
      }
      o.delVeh=veh;o.delDay=day;
    });
    delSel.clear();sched();render();
    if(day)showReadiness(changing.map(o=>o.wo),'scheduled to '+slotLbl(veh,day));
    else toast(changing.length+' job'+(changing.length!==1?'s':'')+' returned to the pool');
  };
  officeWho(by=>{
    if(!reMoves.length){apply(by,'');return;}
    pickReason('Why is '+(reMoves.length===1?reMoves[0].wo:reMoves.length+' jobs')+' moving?',
      `Moving to <b>${escA(slotLbl(veh,day))}</b>${reMoves.length===1?' from <b>'+escA(slotLbl(reMoves[0].delVeh,reMoves[0].delDay))+'</b>':''}. Every move is recorded with your name (${escA(by)}) and shows on the management scorecard.`,
      why=>apply(by,why),()=>render());
  },()=>render());
}
