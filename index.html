<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WPF Production Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--card:#fff;--border:#dde1e7;--b2:#c4c9d4;
  --text:#1a1d23;--t2:#4a5568;--t3:#8896aa;
  --green:#1a7a3c;--gl:#e6f4ec;--gb:#2d9e54;
  --red:#c0392b;--rl:#fdecea;
  --amber:#d97706;--al:#fef3c7;
  --blue:#1e4db7;--bl:#ebf0fb;
  --purple:#6d28d9;--pl:#f3effd;
  --accent:#c8a84b;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select{font-family:inherit;cursor:pointer}
.hdr{background:#1a1d23;color:#fff;border-bottom:3px solid var(--accent)}
.hdr-i{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:10px}
.lm{width:32px;height:32px;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1a1d23}
.lt{font-size:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#fff}
.ls{font-size:10px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.sync{font-size:11px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#4caf50;display:inline-block}
.dot.s{background:var(--accent)}.dot.e{background:#e53935}
.tabs{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tabs-i{max-width:1400px;margin:0 auto;display:flex;padding:0 20px;overflow-x:auto}
.tabs-i::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:10px 18px;border:none;background:none;font-size:13px;color:var(--t2);border-bottom:3px solid transparent;font-weight:500}
.tab:hover{color:var(--text)}.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.pg{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
.cap-bar{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 20px;margin-bottom:14px}
.cap-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:10px}
.week-caps{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.wk-cap{background:var(--bg);border-radius:8px;padding:8px 6px;text-align:center;border:2px solid transparent;cursor:pointer;transition:all .15s}
.wk-cap:hover{border-color:var(--b2)}.wk-cap.selected{border-color:var(--blue);background:var(--bl)}
.wk-label{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:3px}
.wk-date{font-size:10px;color:var(--t3);margin-bottom:5px}
.wk-bar-wrap{height:6px;background:#e5e8ed;border-radius:3px;overflow:hidden;margin-bottom:4px}
.wk-bar{height:100%;border-radius:3px;transition:width .3s}
.wk-bar.ok{background:var(--green)}.wk-bar.warn{background:var(--amber)}.wk-bar.over{background:var(--red)}
.wk-hours{font-size:11px;font-weight:600}
.wk-hours.ok{color:var(--green)}.wk-hours.warn{color:var(--amber)}.wk-hours.over{color:var(--red)}
.wk-count{font-size:10px;color:var(--t3)}
.board-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:6px;border:none;font-size:13px;font-weight:500}
.btn-g{background:var(--green);color:#fff}.btn-g:hover{background:var(--gb)}
.btn-s{background:#fff;border:1px solid var(--b2);color:var(--text)}.btn-s:hover{background:var(--bg)}
.btn-blue{background:var(--blue);color:#fff}
.search-input{padding:7px 12px;border:1px solid var(--b2);border-radius:6px;font-size:13px;min-width:200px;outline:none}
.search-input:focus{border-color:var(--blue)}
.filter-sel{padding:7px 10px;border:1px solid var(--b2);border-radius:6px;font-size:13px;background:#fff;outline:none;-webkit-appearance:none}
.wo-table-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.wo-table{width:100%;border-collapse:collapse;font-size:13px}
.wo-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);padding:8px 10px;border-bottom:1px solid var(--border);background:#f8f9fb;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
.wo-table th:hover{color:var(--text)}
.wo-table th.asc::after{content:' ↑'}.wo-table th.desc::after{content:' ↓'}
.wo-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.wo-table tr:last-child td{border-bottom:none}
.wo-table tr:hover td{background:#fafbfc}
.wo-table tr.dragging{opacity:.3}
.wo-table tr.drag-over td{border-top:3px solid var(--blue)}
.wo-table tr.c-red td:first-child{border-left:4px solid var(--red)}
.wo-table tr.c-amber td:first-child{border-left:4px solid var(--amber)}
.wo-table tr.c-green td:first-child{border-left:4px solid var(--green)}
.wo-table tr.hl-row td{background:#fff8d6!important}
.wo-table tr.grp-start td{border-top:2px solid var(--b2)}
.wo-table tr.hl-row .wo-num{color:#b8860b;font-weight:700}
.wo-table tr.c-blue td:first-child{border-left:4px solid var(--blue)}
.wo-table tr.c-purple td:first-child{border-left:4px solid var(--purple)}
.wo-num{font-family:monospace;font-size:11px;color:var(--t2)}
.wo-title{font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.wo-cust{color:var(--t2);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.due-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.due-late{background:var(--rl);color:var(--red)}.due-soon{background:var(--al);color:var(--amber)}.due-ok{background:var(--gl);color:var(--green)}
.step-badge{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--bl);color:var(--blue);white-space:nowrap}
.week-sel{padding:4px 8px;border:1px solid var(--b2);border-radius:5px;font-size:12px;background:#fff;width:120px}
.notes-inp{width:100%;border:none;background:transparent;font-size:12px;color:var(--t2);padding:1px 0;outline:none;font-family:inherit;min-width:100px}
.notes-inp:focus{border-bottom:1px solid var(--blue)}
.cdot{width:13px;height:13px;border-radius:50%;display:inline-block;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.cdot:hover{border-color:#fff;box-shadow:0 0 0 2px var(--b2)}
.drag-handle{cursor:grab;color:var(--t3);padding:0 3px;font-size:15px;user-select:none;line-height:1}
.drag-handle:active{cursor:grabbing}
.table-footer{padding:9px 12px;background:#f8f9fb;border-top:1px solid var(--border);display:flex;gap:20px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.changes-banner{background:var(--al);border:1px solid #f59e0b;border-radius:8px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.import-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.drop-zone{border:2px dashed var(--b2);border-radius:8px;padding:28px;text-align:center;color:var(--t3);cursor:pointer;transition:all .15s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--blue);background:var(--bl);color:var(--blue)}
.preview-row{padding:5px 10px;background:var(--bg);border-radius:4px;margin-bottom:3px;display:flex;align-items:center;gap:10px;font-size:12px}
.exp-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.empty{text-align:center;padding:40px;color:var(--t3);font-size:13px}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1d23;color:#fff;padding:9px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
@media(max-width:1000px){.week-caps{grid-template-columns:repeat(5,1fr)}}
@media(max-width:700px){.week-caps{grid-template-columns:repeat(3,1fr)}.wo-table th:nth-child(n+7),.wo-table td:nth-child(n+7){display:none}.pg{padding:12px 12px 60px}}
/* ---- Deliveries ---- */
.dvbtn{background:none;border:1px solid transparent;font-size:15px;filter:grayscale(1);opacity:.32;cursor:pointer;padding:1px 5px;border-radius:5px;line-height:1;transition:all .12s}
.dvbtn:hover{opacity:.7}
.dvbtn.on{filter:none;opacity:1;background:#e8f1fd;border-color:#b0c8e8}
#delcnt{display:none;background:#1a56db;color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:5px;vertical-align:1px}
.del-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.dgrp{margin-bottom:6px}
.dgrp-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 5px;cursor:pointer;user-select:none}
.dgrp-h:hover{color:#1a56db}
.dgrp-h .gcnt{font-weight:400;color:var(--t3);text-transform:none;letter-spacing:0;font-size:10px}
.dpool-chips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{width:216px;background:#fff;border:1px solid #cfd6df;border-radius:7px;padding:6px 8px;font-size:11px;cursor:grab;user-select:none;box-shadow:0 1px 2px rgba(15,25,40,.06)}
.dcell .dchip{width:100%;margin:0 0 4px;box-shadow:none}
.dchip-top{display:flex;align-items:center;gap:6px}
.dchip-top b{font-family:monospace;font-size:12px;font-weight:700;color:#14335c;white-space:nowrap}
.dfu{font-size:10px;font-weight:700;background:#eef2f7;border:1px solid #d8dfe8;border-radius:4px;padding:1px 5px;color:#3b4c63;white-space:nowrap}
.fu-badge{font-family:monospace;font-size:11px;font-weight:600;background:#f2f5f9;border:1px solid #e0e5ec;border-radius:4px;padding:1px 6px;color:var(--t2);white-space:nowrap}
.dsrch{width:100%;max-width:420px;padding:7px 11px;border:1px solid var(--b2);border-radius:6px;font-size:12px;outline:none;margin-bottom:8px}
.dsrch:focus{border-color:#7ba7e0}
.dcv{margin-left:auto;font-weight:600;color:#0d6e46;font-size:11px;white-space:nowrap}
.dchip-btns{display:flex;gap:1px}
.dchip button{background:none;border:none;cursor:pointer;font-size:12px;line-height:1;padding:2px 4px;border-radius:3px;color:var(--t3)}
.dchip button:hover{background:#dde3ea;color:var(--t1)}
.dchip .dchk.on{color:#0d9450;font-weight:700}
.dchip-t{font-size:11px;color:var(--text);line-height:1.35;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dchip-c{font-size:10px;color:var(--t3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip.done{background:#eefbf3;border-color:#b3e0c4}
.dchip.done .dchip-t,.dchip.done .dchip-top b{text-decoration:line-through;opacity:.6}
.dchip.manual{border-left:3px solid #7c5cd6}
.dchip.sel{outline:2px solid #1a56db;outline-offset:-1px;background:#eaf2ff}
.dchip.dragging{opacity:.4}
.selbar{display:flex;align-items:center;gap:10px;background:#e8f1fd;border:1px solid #b0c8e8;border-radius:6px;padding:7px 12px;font-size:12px;color:#14418f;margin-bottom:10px}
.selbar button{background:none;border:none;color:#1a56db;font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.del-grid{width:100%;min-width:1100px;border-collapse:collapse}
.del-grid th{background:#f5f6f8;border:1px solid var(--border);padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--t2)}
.del-grid th:first-child{width:106px;text-align:left}
.del-grid td.dveh{border:1px solid var(--border);padding:6px 8px;font-size:12px;font-weight:600;background:#fafbfc;vertical-align:top;width:106px}
.del-grid td.dveh .dsub{display:block;font-size:10px;font-weight:400;color:var(--t3);margin-top:1px}
.dcell{border:1px solid var(--border);padding:4px;min-height:56px;vertical-align:top}
.dcell.dragover{background:#eaf2ff;outline:2px dashed #7ba7e0;outline-offset:-2px}
.del-pool{border:2px dashed #cfd6df;border-radius:8px;padding:10px;min-height:46px;background:#fafbfc}
.del-pool.dragover{background:#eaf2ff;border-color:#7ba7e0}
.dtot{font-size:11px;color:var(--t2);text-align:center;padding:6px;border:1px solid var(--border);background:#fafbfc;font-weight:600;line-height:1.5}
.dnote{width:100%;border:1px solid var(--b2);border-radius:4px;padding:5px 7px;font-size:11px;background:#fffdf2;outline:none}
.dnote:focus{border-color:#e0b830}
.addjob-row{display:none;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px;background:#f7f4fe;border:1px solid #d9cdf5;border-radius:8px;align-items:center}
.addjob-row.open{display:flex}
.addjob-row input{border:1px solid var(--b2);border-radius:5px;padding:6px 8px;font-size:12px;outline:none}
@media(max-width:900px){.dchip{width:100%}}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-i">
  <div class="logo"><div class="lm">WP</div><div><div class="lt">Western Postform</div><div class="ls">Production Planner</div></div></div>
  <div class="sync"><span class="dot" id="dot"></span><span id="stxt">Loading…</span></div>
</div></div>
<div class="tabs"><div class="tabs-i">
  <button class="tab on" id="t-b">Capacity Board</button>
  <button class="tab" id="t-d">🚚 Deliveries<span id="delcnt"></span></button>
  <button class="tab" id="t-i">Import Work Orders</button>
  <button class="tab" id="t-x">Export Changes</button>
  <button class="tab" id="t-s">⚙ Settings</button>
</div></div>
<div id="app"><div style="padding:60px;text-align:center"><div class="spin"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const SUPA_URL='https://klyropbsupqfmtjjwlfa.supabase.co/rest/v1';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtseXJvcGJzdXBxZm10amp3bGZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNjY4MDEsImV4cCI6MjA5NDg0MjgwMX0.VuP5mnSgNhzoIdx7t3R7mgt2tyLZVtElUihei3xgC5Q';
const SUPA_HDR={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
const SUPA_WHDR={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'};
let WCAP=350;

let DB={orders:[],nid:1,weekCaps:{}};
// Default value-to-hours scale (editable in Settings tab)
function getSteps(){const base=['Assembly complete','Production complete','Job shipped'];const s=new Set([...DB.orders.map(o=>o.step||'').filter(Boolean),...base]);return[...s].sort();}
let HOUR_SCALE=[
  {maxVal:1000,  hours:1},
  {maxVal:3000,  hours:3},
  {maxVal:6000,  hours:7},
  {maxVal:7000,  hours:9},
  {maxVal:8000,  hours:10},
  {maxVal:9000,  hours:11},
  {maxVal:10000, hours:12},
  {maxVal:12000, hours:14},
  {maxVal:15000, hours:16},
  {maxVal:20000, hours:20},
  {maxVal:30000, hours:26},
  {maxVal:999999,hours:32},
];
function estimateHours(value){
  const v=parseFloat(value)||0;
  if(v===0)return 1;
  const tier=HOUR_SCALE.find(t=>v<=t.maxVal);
  return tier?tier.hours:32;
}
let orig={};
let origStep={};
let tab='b',sortCol='plannedWeek',sortDir=1,fWeek='',fCust='',srch='',fDel=false;
let saveT=null,dragSrc=null;

async function loadDB(){
  try{
    const r=await fetch(SUPA_URL+'/production_planner?id=eq.main',{headers:SUPA_HDR});
    const d=await r.json();
    if(d&&d[0]){
      if(d[0].orders)DB.orders=d[0].orders;
      if(d[0].nid)DB.nid=d[0].nid;
      if(d[0].settings&&d[0].settings.weekCaps)DB.weekCaps=d[0].settings.weekCaps||{};
      if(d[0].settings&&d[0].settings.hourScale&&d[0].settings.hourScale.length)HOUR_SCALE=d[0].settings.hourScale;
      if(d[0].settings&&d[0].settings.wcap>0)WCAP=d[0].settings.wcap;
      if(d[0].settings&&d[0].settings.vcap>0)VCAP=d[0].settings.vcap;
      if(d[0].settings&&d[0].settings.delx)DB.delx=d[0].settings.delx;
      if(d[0].settings&&d[0].settings.delNotes)DB.delNotes=d[0].settings.delNotes;
    }
    DB.orders.forEach(o=>{orig[o.wo]=o.plannedWeek||'';origStep[o.wo]=o.step||'';});
  }catch(e){setSS('e');}
  setSS('ok');
}
async function saveDB(){
  setSS('s');
  try{
    await fetch(SUPA_URL+'/production_planner?id=eq.main',{method:'PATCH',headers:SUPA_WHDR,body:JSON.stringify({orders:DB.orders,nid:DB.nid,settings:{weekCaps:DB.weekCaps||{},hourScale:HOUR_SCALE,wcap:WCAP,vcap:VCAP,delx:DB.delx||[],delNotes:DB.delNotes||{}}})});
    setSS('ok');
  }catch(e){setSS('e');}
}
function sched(){clearTimeout(saveT);saveT=setTimeout(saveDB,1200);}
function setSS(st){const d=document.getElementById('dot'),t=document.getElementById('stxt');if(!d)return;d.className='dot'+(st==='s'?' s':st==='e'?' e':'');t.textContent=st==='s'?'Saving…':st==='e'?'Save failed':'Synced';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2500);}
function fmt(s){if(!s)return'—';return new Date(s).toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'2-digit'});}
function getMonday(d){
  const dt=new Date(d);
  // Use UTC day to avoid timezone issues
  const day=dt.getUTCDay();
  const diff=dt.getUTCDate()-day+(day===0?-6:1);
  return new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),diff));
}
function wkKey(d){
  const m=getMonday(d);
  return m.getUTCFullYear()+'-'+String(m.getUTCMonth()+1).padStart(2,'0')+'-'+String(m.getUTCDate()).padStart(2,'0');
}
function wkNum(d){const dt=new Date(d);const s=new Date(Date.UTC(dt.getUTCFullYear(),0,1));return Math.ceil(((dt-s)/86400000+((s.getUTCDay()||7))+1)/7);}
function wkLbl(k){if(!k)return'—';const d=new Date(k);return'Wk '+wkNum(d)+' · '+d.toLocaleDateString('en-IE',{day:'numeric',month:'short'});}
function get8Wks(){const w=[];let d=getMonday(new Date());for(let i=0;i<8;i++){w.push(wkKey(d));d=new Date(d);d.setDate(d.getDate()+7);}return w;}
function wkCap(k){return DB.weekCaps&&DB.weekCaps[k]?DB.weekCaps[k]:WCAP;}
function wkHrs(k){return DB.orders.filter(o=>o.plannedWeek===k).reduce((a,o)=>a+o.hours,0);}
function wkVal(k){return DB.orders.filter(o=>o.plannedWeek===k).reduce((a,o)=>a+(o.value||0),0);}
function wkCnt(k){return DB.orders.filter(o=>o.plannedWeek===k).length;}
let VCAP=250000;
function fmtVal(v){return'€'+Math.round(v/1000)+'k';}
function dueBadge(due,pw,origDue){
  if(!due)return'<span class="due-badge due-ok">—</span>';
  const d=new Date(due),now=new Date(),diff=(d-now)/86400000;
  const wk='Wk'+wkNum(d);
  const origStr=origDue&&origDue!==due?` <span style="font-size:10px;color:var(--t3)">(orig: ${fmt(origDue)} Wk${wkNum(new Date(origDue))})</span>`:'';
  const label=`${fmt(due)} ${wk}`;
  if(pw){const pe=new Date(pw);pe.setDate(pe.getDate()+4);if(pe>d)return`<span class="due-badge due-late">${label}</span>${origStr}`;}
  if(diff<0)return`<span class="due-badge due-late">OVERDUE ${label}</span>${origStr}`;
  if(diff<14)return`<span class="due-badge due-soon">${label}</span>${origStr}`;
  return`<span class="due-badge due-ok">${label}</span>${origStr}`;
}
function changes(){return DB.orders.filter(o=>(orig[o.wo]!==undefined&&orig[o.wo]!==(o.plannedWeek||''))||(origStep[o.wo]!==undefined&&origStep[o.wo]!==(o.step||'')));}

function showTab(t){tab=t;['b','d','i','x','s'].forEach(id=>{const el=document.getElementById('t-'+id);if(el)el.className='tab'+(id===t?' on':'');});render();}

function render(){
  const app=document.getElementById('app');
  if(tab==='b')renderBoard(app);
  else if(tab==='d')renderDeliveries(app);
  else if(tab==='i')renderImport(app);
  else if(tab==='x')renderExport(app);
  else renderSettings(app);
  updDelBadge();
}
function updDelBadge(){
  const el=document.getElementById('delcnt');if(!el)return;
  const n=DB.orders.filter(o=>o.delv&&!o.delDone).length+(DB.delx||[]).filter(o=>!o.delDone).length;
  el.textContent=n;el.style.display=n?'inline':'none';
}

function renderSettings(app){
  const scaleRows=HOUR_SCALE.map((tier,i)=>{
    const prevVal=i===0?'Up to':'&euro;'+HOUR_SCALE[i-1].maxVal.toLocaleString()+' &mdash; ';
    const maxNote=i===HOUR_SCALE.length-1?' (max)':'';
    return '<tr>'
      +'<td style="padding:5px 12px;border-bottom:1px solid var(--border)">'+prevVal
      +' <input type="number" id="hs-v-'+i+'" value="'+tier.maxVal+'" step="500" min="0" style="width:90px;padding:3px 6px;border:1px solid var(--b2);border-radius:4px;font-size:13px">'+maxNote+'</td>'
      +'<td style="padding:5px 12px;border-bottom:1px solid var(--border)">'
      +'<input type="number" id="hs-h-'+i+'" value="'+tier.hours+'" step="0.5" min="1" style="width:70px;padding:3px 6px;border:1px solid var(--b2);border-radius:4px;font-size:13px"> hours</td>'
      +'</tr>';
  }).join('');

  app.innerHTML='<div class="pg">'
    +'<div class="exp-panel">'
    +'<div style="font-size:14px;font-weight:600;margin-bottom:6px">Value &rarr; Assembly Hours Scale</div>'
    +'<p style="font-size:12px;color:var(--t3);margin-bottom:14px">When Cienapps hours field is zero, hours are estimated from order value. Edit thresholds and click Save. Applies to next import only.</p>'
    +'<table style="border-collapse:collapse;font-size:13px;margin-bottom:14px">'
    +'<thead><tr>'
    +'<th style="padding:6px 12px;border-bottom:1px solid var(--border);text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--t3)">Order Value Up To</th>'
    +'<th style="padding:6px 12px;border-bottom:1px solid var(--border);text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--t3)">Assembly Hours</th>'
    +'</tr></thead><tbody>'+scaleRows+'</tbody></table>'
    +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    +'<button class="btn btn-g" id="btn-save-scale">Save Scale</button>'
    +'<button class="btn btn-s" id="btn-reestimate">Re-estimate all estimated orders</button>'
    +'<span style="font-size:12px;color:var(--t3)">Amber hours = estimated from value</span>'
    +'</div></div>'
    +'<div class="exp-panel">'
    +'<div style="font-size:14px;font-weight:600;margin-bottom:6px">Capacity Settings</div>'
    +'<div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px">'
    +'<div><label style="font-size:12px;color:var(--t2);display:block;margin-bottom:4px">Weekly Assembly Hours</label>'
    +'<input type="number" id="s-wcap" value="'+WCAP+'" step="10" min="1" style="padding:6px 10px;border:1px solid var(--b2);border-radius:6px;font-size:14px;width:120px"></div>'
    +'<div><label style="font-size:12px;color:var(--t2);display:block;margin-bottom:4px">Weekly Value Capacity (&euro;)</label>'
    +'<input type="number" id="s-vcap" value="'+VCAP+'" step="10000" min="1" style="padding:6px 10px;border:1px solid var(--b2);border-radius:6px;font-size:14px;width:140px"></div>'
    +'</div>'
    +'<button class="btn btn-g" id="btn-save-cap">Save Capacity</button>'
    +'</div></div>';

  document.getElementById('btn-save-scale')?.addEventListener('click',()=>{
    HOUR_SCALE.forEach((tier,i)=>{
      tier.maxVal=parseFloat(document.getElementById('hs-v-'+i)?.value)||tier.maxVal;
      tier.hours=parseFloat(document.getElementById('hs-h-'+i)?.value)||tier.hours;
    });
    sched();
    toast('Scale saved ✓ — applies to next import');
  });

  document.getElementById('btn-reestimate')?.addEventListener('click',()=>{
    let count=0;
    DB.orders.forEach(o=>{if(o.hoursEstimated){o.hours=estimateHours(o.value);count++;}});
    sched();toast(count+' orders re-estimated');render();
  });

  document.getElementById('btn-save-cap')?.addEventListener('click',()=>{
    const newWcap=parseFloat(document.getElementById('s-wcap')?.value);
    const newVcap=parseFloat(document.getElementById('s-vcap')?.value);
    if(newWcap>0)WCAP=newWcap;
    if(newVcap>0)VCAP=newVcap;
    sched();
    toast('Capacity updated ✓');
  });
}

function renderBoard(app){
  const weeks=get8Wks();
  const custs=[...new Set(DB.orders.map(o=>o.customer))].sort();
  const chg=changes();

  let orders=[...DB.orders];
  if(fWeek==='unscheduled')orders=orders.filter(o=>!o.plannedWeek);
  else if(fWeek)orders=orders.filter(o=>o.plannedWeek===fWeek);
  if(fCust)orders=orders.filter(o=>o.customer===fCust);
  if(fDel)orders=orders.filter(o=>o.delv);
  if(srch){const q=srch.toLowerCase();orders=orders.filter(o=>o.title.toLowerCase().includes(q)||o.wo.toLowerCase().includes(q)||o.customer.toLowerCase().includes(q)||String(o.floor||'').toLowerCase().includes(q)||String(o.unit||'').toLowerCase().includes(q));}
  orders.sort((a,b)=>{
    let av=a[sortCol]||'',bv=b[sortCol]||'';
    if(sortCol==='hours'||sortCol==='value'){av=+av;bv=+bv;}
    if(sortCol==='plannedWeek'){if(!av)av='9999-99-99';if(!bv)bv='9999-99-99';} // unscheduled last
    if(av<bv)return -sortDir;
    if(av>bv)return sortDir;
    // Secondary: group same customer together
    const ac=(a.customer||'').toLowerCase(),bc=(b.customer||'').toLowerCase();
    if(ac<bc)return -1;
    if(ac>bc)return 1;
    // Tertiary: due date

  });

  app.innerHTML=`<div class="pg">

  </div>`:''}

  <div class="cap-bar">
    <div class="cap-title">8-Week Assembly Capacity — ${WCAP}h per week</div>
    <div class="week-caps">
      ${weeks.map(wk=>{

        return`<div class="wk-cap${fWeek===wk?' selected':''}" data-wk="${wk}">
          <div class="wk-label">${wkLbl(wk)}</div>
          <div style="font-size:9px;color:var(--t3);margin-bottom:2px">HOURS</div>
          <div class="wk-bar-wrap"><div class="wk-bar ${cls}" style="width:${pct}%"></div></div>
          <div class="wk-hours ${cls}">${h}h / ${cap}h${cap!==WCAP?'<span style="font-size:9px;color:var(--amber)"> ✎</span>':''}</div>
          ${h>cap?'<div style="font-size:11px;font-weight:700;color:var(--red);background:var(--rl);border-radius:3px;padding:1px 5px;margin-top:2px">+' + (h-cap) + 'h OVER</div>':''}
          <div style="font-size:9px;color:var(--t3);margin:4px 0 2px">VALUE</div>
          <div class="wk-bar-wrap"><div class="wk-bar ${vcls}" style="width:${vpct}%"></div></div>
          <div class="wk-hours ${vcls}">${fmtVal(v)} / ${fmtVal(VCAP)}</div>
          ${v>VCAP?'<div style="font-size:11px;font-weight:700;color:var(--red);background:var(--rl);border-radius:3px;padding:1px 5px;margin-top:2px">+' + fmtVal(v-VCAP) + ' OVER</div>':''}
          <div class="wk-count">${cnt} order${cnt!==1?'s':''}</div>
          <input type="number" class="wk-cap-inp" data-wk-c="${wk}" value="${cap}" min="1" step="10" title="Set capacity for this week" style="width:52px;font-size:10px;padding:2px 4px;border:1px solid var(--b2);border-radius:3px;text-align:center;margin-top:4px;background:${cap!==WCAP?'#fffbeb':'#fff'}">
        </div>`;
      }).join('')}
      <div class="wk-cap${fWeek==='unscheduled'?' selected':''}" data-wk="unscheduled">
        <div class="wk-label" style="color:var(--amber)">Unscheduled</div>
        <div class="wk-bar-wrap"><div class="wk-bar warn" style="width:100%"></div></div>
        <div class="wk-hours warn">${unschHrs}h · ${fmtVal(DB.orders.filter(o=>!o.plannedWeek).reduce((a,o)=>a+(o.value||0),0))}</div>
        <div class="wk-count">${unschCnt} order${unschCnt!==1?'s':''}</div>
      </div>
    </div>
  </div>

  <div class="board-toolbar">
    <input class="search-input" id="srch" placeholder="Search WO, title, customer…" value="${srch}">
    <select class="filter-sel" id="fwk">
      <option value="">All weeks</option>
      <option value="unscheduled"${fWeek==='unscheduled'?' selected':''}>Unscheduled</option>
      ${weeks.map(w=>`<option value="${w}"${fWeek===w?' selected':''}>${wkLbl(w)}</option>`).join('')}
    </select>
    <select class="filter-sel" id="fcust">
      <option value="">All customers</option>
      ${custs.map(c=>`<option value="${c}"${fCust===c?' selected':''}>${c}</option>`).join('')}
    </select>
    <button class="btn btn-s" id="btn-fdel" style="${fDel?'background:#e8f1fd;border-color:#b0c8e8;color:#1a56db;font-weight:600':''}">🚚 Delivering only</button>
    <button class="btn btn-s" id="btn-clf">Clear filters</button>
    <span style="margin-left:auto;font-size:12px;color:var(--t2)">${orders.length} shown · ${DB.orders.filter(o=>o.plannedWeek).length} scheduled · ${unschCnt} unscheduled</span>

  </div>

  <div class="wo-table-wrap">
    <table class="wo-table">

        <th style="width:22px"></th>
        <th style="width:34px;text-align:center" title="Delivery next week">🚚</th>

        <th data-s="floor" class="${sortCol==='floor'?sortDir>0?'asc':'desc':''}">Floor</th>
        <th data-s="unit" class="${sortCol==='unit'?sortDir>0?'asc':'desc':''}">Unit</th>
        <th data-s="title" class="${sortCol==='title'?sortDir>0?'asc':'desc':''}">Title</th>
        <th data-s="customer" class="${sortCol==='customer'?sortDir>0?'asc':'desc':''}">Customer</th>
        <th data-s="hours" class="${sortCol==='hours'?sortDir>0?'asc':'desc':''}" style="text-align:right">Hrs</th>
        <th data-s="dueDate" class="${sortCol==='dueDate'?sortDir>0?'asc':'desc':''}">Due Date</th>
        <th data-s="value" class="${sortCol==='value'?sortDir>0?'asc':'desc':''}" style="text-align:right">Value</th>
        <th data-s="step">Step</th>
        <th data-s="plannedWeek">Planned Week</th>
        <th style="width:30px"></th>
      </tr></thead>
      <tbody id="tbody">
        ${!orders.length?`<tr><td colspan="13"><div class="empty">No orders match filters</div></td></tr>`:''}
        ${orders.map((o,ri)=>`<tr class="${o.colour?'c-'+o.colour:''}${o.hl?' hl-row':''}${ri>0&&(orders[ri-1].customer||'')!==(o.customer||'')?' grp-start':''}" draggable="true" data-wo="${o.wo}">
          <td><span class="drag-handle">⠿</span></td>
          <td style="text-align:center"><button class="dvbtn${o.delv?' on':''}" data-dv="${o.wo}" title="${o.delv?'Delivering next week — click to untag':'Tag for delivery next week'}">🚚</button></td>
          <td><span class="wo-num" data-hl="${o.wo}" style="cursor:pointer" title="Tap to mark as discussed">${o.hl?'✓ ':''}${o.wo}</span></td>
          <td>${o.floor?`<span class="fu-badge">${o.floor}</span>`:'<span style="color:var(--t3)">—</span>'}</td>
          <td>${o.unit?`<span class="fu-badge">${o.unit}</span>`:'<span style="color:var(--t3)">—</span>'}</td>
          <td><span class="wo-title" title="${o.title}">${o.title}</span></td>
          <td><span class="wo-cust" title="${o.customer}">${o.customer}</span></td>
          <td style="text-align:right"><input type="number" step="0.5" min="0" style="width:52px;text-align:right;border:1px solid ${o.hoursEstimated?'#f59e0b':'var(--b2)'};border-radius:4px;padding:2px 4px;font-size:12px;font-weight:600;background:${o.hoursEstimated?'#fffbeb':'#fff'}" title="${o.hoursEstimated?'Estimated from value — verify':'Actual hours from Cienapps'}" data-hi="${o.wo}" value="${o.hours}"></td>
          <td>${dueBadge(o.dueDate,o.plannedWeek,o.origDueDate)}</td>
          <td style="text-align:right;font-size:12px;color:var(--t2)">€${Math.round(o.value||0).toLocaleString()}</td>
          <td><select class="step-sel" data-stepsel="${o.wo}" style="font-size:11px;padding:3px 4px;border-radius:6px;border:1px solid var(--bd);background:var(--bg2);color:var(--t1);max-width:120px">
            ${getSteps().map(s=>`<option value="${s}"${(o.step||'')===s?' selected':''}>${s.replace(/^\d+\.\s*/,'')}</option>`).join('')}
            ${getSteps().includes(o.step||'')||!(o.step||'')?'':`<option value="${o.step}" selected>${o.step.replace(/^\d+\.\s*/,'')}</option>`}
          </select></td>
          <td><select class="week-sel" data-wsel="${o.wo}">
            <option value="">— Unscheduled —</option>
            ${weeks.map(w=>`<option value="${w}"${o.plannedWeek===w?' selected':''}>${wkLbl(w)}</option>`).join('')}
          </select></td>
          <td style="text-align:center"><button style="background:none;border:none;color:var(--t3);font-size:14px;padding:0 2px;cursor:pointer;line-height:1" data-del="${o.wo}" title="Delete order">🗑</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="table-footer">
      <span>Shown: <strong>${orders.reduce((a,o)=>a+o.hours,0)}h</strong></span>
      <span>Total orders: <strong>${DB.orders.length}</strong></span>
      <span>Total hours: <strong>${DB.orders.reduce((a,o)=>a+o.hours,0)}h</strong></span>
      <span>Total value: <strong>${fmtVal(DB.orders.reduce((a,o)=>a+(o.value||0),0))}</strong></span>
      ${(()=>{const weeks=get8Wks();const overH=weeks.filter(w=>wkHrs(w)>wkCap(w));const overV=weeks.filter(w=>wkVal(w)>VCAP);return overH.length>0?'<span style="color:var(--red);font-weight:600">⚠ '+overH.length+' week'+(overH.length!==1?'s':'')+' over hours capacity</span>':'';})()} 
      ${(()=>{const weeks=get8Wks();const overV=weeks.filter(w=>wkVal(w)>VCAP);return overV.length>0?'<span style="color:var(--red);font-weight:600">⚠ '+overV.length+' week'+(overV.length!==1?'s':'')+' over value capacity</span>':'';})()} 
    </div>
  </div>
  </div>`;

  // Bind events
  document.querySelectorAll('[data-wk]').forEach(el=>el.onclick=()=>{fWeek=fWeek===el.dataset.wk?'':el.dataset.wk;render();});
  document.querySelectorAll('.wk-cap-inp').forEach(inp=>{
    inp.onclick=e=>e.stopPropagation(); // prevent week filter toggle
    inp.onchange=function(){
      const wk=this.dataset.wkC;
      const v=parseInt(this.value)||WCAP;
      if(!DB.weekCaps)DB.weekCaps={};
      if(v===WCAP)delete DB.weekCaps[wk]; // reset to default
      else DB.weekCaps[wk]=v;
      sched();render();
    };
  });
  const si=document.getElementById('srch');if(si)si.oninput=function(){srch=this.value;render();};
  const fw=document.getElementById('fwk');if(fw)fw.onchange=function(){fWeek=this.value;render();};
  const fc=document.getElementById('fcust');if(fc)fc.onchange=function(){fCust=this.value;render();};
  const cf=document.getElementById('btn-clf');if(cf)cf.onclick=()=>{fWeek='';fCust='';srch='';fDel=false;render();};
  const fd=document.getElementById('btn-fdel');if(fd)fd.onclick=()=>{fDel=!fDel;render();};
  // Delivery tag toggle — in place, no re-render, so the list doesn't jump while reviewing
  document.querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>{
    const o=DB.orders.find(x=>x.wo===b.dataset.dv);if(!o)return;
    o.delv=!o.delv;
    if(!o.delv){o.delVeh='';o.delDay='';o.delDone=false;}
    b.className='dvbtn'+(o.delv?' on':'');
    b.title=o.delv?'Delivering next week — click to untag':'Tag for delivery next week';
    updDelBadge();sched();
  });
  const ca=document.getElementById('btn-clearall');
  if(ca)ca.onclick=()=>{
    if(!confirm('Delete ALL '+DB.orders.length+' orders from the planner? This cannot be undone.'))return;
    DB.orders=[];
    Object.keys(orig).forEach(k=>delete orig[k]);Object.keys(origStep).forEach(k=>delete origStep[k]);
    sched();render();toast('All orders cleared');
  };
  document.querySelectorAll('[data-s]').forEach(th=>th.onclick=()=>{const s=th.dataset.s;if(sortCol===s)sortDir*=-1;else{sortCol=s;sortDir=1;}render();});
  document.querySelectorAll('[data-wsel]').forEach(sel=>sel.onchange=function(){const o=DB.orders.find(x=>x.wo===this.dataset.wsel);if(o){o.plannedWeek=this.value;sched();render();}});
  document.querySelectorAll('[data-stepsel]').forEach(sel=>sel.onchange=function(){const o=DB.orders.find(x=>x.wo===this.dataset.stepsel);if(o){o.step=this.value;sched();render();toast('Step updated');}});
  document.querySelectorAll('[data-hl]').forEach(el=>el.onclick=function(){const o=DB.orders.find(x=>x.wo===this.dataset.hl);if(o){o.hl=!o.hl;sched();render();}});
  document.querySelectorAll('[data-hi]').forEach(inp=>inp.onchange=function(){const o=DB.orders.find(x=>x.wo===this.dataset.hi);if(o){o.hours=parseFloat(this.value)||0;o.hoursEstimated=false;sched();render();}});
  document.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>{
    if(!confirm('Delete '+btn.dataset.del+' from the planner?'))return;
    DB.orders=DB.orders.filter(o=>o.wo!==btn.dataset.del);
    delete orig[btn.dataset.del];delete origStep[btn.dataset.del];
    sched();render();toast('Order removed');
  });
  // Drag & drop to swap weeks
  const tbody=document.getElementById('tbody');
  if(tbody){
    tbody.querySelectorAll('tr[draggable]').forEach(row=>{
      row.ondragstart=e=>{dragSrc=row;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';};
      row.ondragend=()=>{row.classList.remove('dragging');tbody.querySelectorAll('tr').forEach(r=>r.classList.remove('drag-over'));};
      row.ondragover=e=>{e.preventDefault();row.classList.add('drag-over');};
      row.ondragleave=()=>row.classList.remove('drag-over');
      row.ondrop=e=>{
        e.preventDefault();row.classList.remove('drag-over');
        if(dragSrc&&dragSrc!==row){
          const a=DB.orders.find(o=>o.wo===dragSrc.dataset.wo),b=DB.orders.find(o=>o.wo===row.dataset.wo);
          if(a&&b){[a.plannedWeek,b.plannedWeek]=[b.plannedWeek,a.plannedWeek];sched();render();toast('Swapped: '+a.wo+' ↔ '+b.wo);}
        }
      };
    });
  }
}

/* ---------- Deliveries: plan next week's deliveries by vehicle and day (v2) ---------- */
const DEL_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
const DEL_VEH=[
  {k:'ARTIC',  n:'Artic',        cat:'Artic', sub:''},
  {k:'VOLVO',  n:'Volvo',        cat:'Truck', sub:''},
  {k:'RENAULT',n:'Renault',      cat:'Truck', sub:''},
  {k:'IVECO',  n:'Iveco',        cat:'Truck', sub:''},
  {k:'CRAFTER',n:'Crafter',      cat:'Truck', sub:''},
  {k:'SMART',  n:'Smart Movers', cat:'Truck', sub:'external haulier'}
];
const vehLbl=k=>{const v=DEL_VEH.find(x=>x.k===k);return v?v.n:'';};
let delDragList=null,delFilter='';
const delSel=new Set();

function delAll(){return[...DB.orders.filter(o=>o.delv),...(DB.delx||[])];}
function findDel(wo){return DB.orders.find(o=>o.wo===wo)||(DB.delx||[]).find(o=>o.wo===wo);}
function woCmp(a,b){
  const na=(String(a.wo).match(/\d+/g)||[]).map(Number),nb=(String(b.wo).match(/\d+/g)||[]).map(Number);
  for(let i=0;i<Math.max(na.length,nb.length);i++){
    const x=i<na.length?na[i]:-1,y=i<nb.length?nb[i]:-1;
    if(x!==y)return x-y;
  }
  return String(a.wo).localeCompare(String(b.wo));
}
function dayVal(d){return delAll().filter(o=>o.delDay===d).reduce((a,o)=>a+(+o.value||0),0);}
const escA=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function dchip(o,showCust){
  return `<div class="dchip${o.delDone?' done':''}${o.manual?' manual':''}${delSel.has(o.wo)?' sel':''}" draggable="true" data-dw="${escA(o.wo)}" title="Click to select · drag onto a day${o.manual?' · added manually':''}">
    <div class="dchip-top"><b>${escA(o.wo)}</b>${(o.floor||o.unit)?`<span class="dfu">${escA([o.floor,o.unit].filter(Boolean).join(' · '))}</span>`:''}<span class="dcv">€${Math.round(o.value||0).toLocaleString()}</span>
      <span class="dchip-btns"><button class="dchk${o.delDone?' on':''}" data-dd="${escA(o.wo)}" title="${o.delDone?'Delivered — click to undo':'Mark delivered'}">✓</button><button data-dx="${escA(o.wo)}" title="${o.delDay?'Return to pool':(o.manual?'Delete this manual job':'Remove from delivery plan')}">×</button></span>
    </div>
    <div class="dchip-t">${escA(o.title)||'—'}</div>
    ${showCust?`<div class="dchip-c">${escA(o.customer)}</div>`:''}
  </div>`;
}

function renderDeliveries(app){
  const tagged=delAll();
  const pool=tagged.filter(o=>!o.delDay);
  const done=tagged.filter(o=>o.delDone).length;
  const notes=DB.delNotes||{};
  const wkTot=tagged.filter(o=>o.delDay).reduce((a,o)=>a+(+o.value||0),0);
  // pool grouped by customer, WO-number numeric order inside each group
  const grps={};pool.forEach(o=>{const c=o.customer||'(no customer)';(grps[c]=grps[c]||[]).push(o);});
  const gkeys=Object.keys(grps).sort((a,b)=>a.localeCompare(b));
  gkeys.forEach(k=>grps[k].sort(woCmp));

  app.innerHTML=`<div class="pg">
  <div class="del-panel">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px">
      <div style="font-size:14px;font-weight:600">Delivery Plan — Next Week</div>
      <span style="font-size:12px;color:var(--t2)">${tagged.length} tagged · ${tagged.length-pool.length} planned · ${done} delivered</span>
      <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-s" id="btn-addjob">＋ Add Job</button>
        <button class="btn btn-blue" id="btn-delprint">🖨 Print A3 Poster</button>
        <button class="btn btn-g" id="btn-delexp">⬇ Export Delivery Plan</button>
        <button class="btn btn-s" id="btn-delreset" style="border-color:var(--red);color:var(--red)">Clear Week — Start Fresh</button>

    </div>

    <div class="addjob-row" id="ajform">
      <input id="aj-wo" placeholder="WO / ref (optional)" style="width:140px">
      <input id="aj-title" placeholder="Description *" style="flex:1;min-width:180px">
      <input id="aj-cust" placeholder="Customer" style="width:180px">
      <input id="aj-val" type="number" min="0" placeholder="€ value" style="width:100px">
      <button class="btn btn-g" id="aj-add">Add to pool</button>
    </div>
    ${delSel.size?`<div class="selbar" style="margin-top:10px"><b>${delSel.size} selected</b> — drag any selected card onto a day to move them all <button id="selclr">clear selection</button></div>`:''}
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:10px 0 5px">
      <span style="font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.4px">To plan — ${pool.length} job${pool.length!==1?'s':''}</span>
      <input class="dsrch" id="dsrch" placeholder="🔍 Filter jobs — WO, customer, floor, unit, title…" value="${escA(delFilter)}">
    </div>
    <div class="del-pool" id="dpool">
      ${pool.length?gkeys.map(c=>`<div class="dgrp">
        <div class="dgrp-h" data-grp="${escA(c)}">${escA(c)}<span class="gcnt">${grps[c].length} job${grps[c].length!==1?'s':''} · €${Math.round(grps[c].reduce((a,o)=>a+(+o.value||0),0)).toLocaleString()} · click to select all</span></div>
        <div class="dpool-chips">${grps[c].map(o=>dchip(o,false)).join('')}</div>
      </div>`).join(''):'<span style="font-size:12px;color:var(--t3)">Nothing waiting. Tag jobs on the Capacity Board with the 🚚 button, or use ＋ Add Job.</span>'}
    </div>
  </div>
  <div class="del-panel" style="overflow-x:auto">
    <table class="del-grid">
      <thead><tr><th>Vehicle</th>${DEL_DAYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead>
      <tbody>
        ${DEL_VEH.map((v,i)=>{const vc=tagged.filter(o=>o.delVeh===v.k).length;return `<tr${i===1?' style="border-top:3px double var(--border)"':''}>
          <td class="dveh">${v.n}<span class="dsub">${v.cat}${v.sub?' · '+v.sub:''} · ${vc} job${vc!==1?'s':''}</span></td>
          ${DEL_DAYS.map(d=>`<td class="dcell" data-cell="${v.k}|${d}">${tagged.filter(o=>o.delVeh===v.k&&o.delDay===d).sort(woCmp).map(o=>dchip(o,true)).join('')}</td>`).join('')}
        </tr>`;}).join('')}
        <tr><td class="dveh">Notes</td>${DEL_DAYS.map(d=>`<td style="border:1px solid var(--border);padding:4px;background:#fffef7"><input class="dnote" data-dnote="${d}" value="${escA(notes[d]||'')}" placeholder="${d} note…"></td>`).join('')}</tr>

          ${DEL_DAYS.map(d=>{const c=tagged.filter(o=>o.delDay===d).length,v=dayVal(d);return `<td class="dtot">${c?c+' job'+(c!==1?'s':'')+'<br><span style="color:#0d6e46">€'+Math.round(v).toLocaleString()+'</span>':'—'}</td>`;}).join('')}

  // ----- bindings -----
  document.querySelectorAll('.dchip').forEach(ch=>{
    ch.onclick=e=>{
      if(e.target.closest('button'))return;
      const wo=ch.dataset.dw;
      delSel.has(wo)?delSel.delete(wo):delSel.add(wo);
      render();
    };
    ch.ondragstart=e=>{
      const wo=ch.dataset.dw;
      delDragList=delSel.has(wo)?[...delSel]:[wo];
      ch.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    };
    ch.ondragend=()=>ch.classList.remove('dragging');
  });
  // Live pool filter — hides cards in place (no re-render, keeps focus while typing)
  const applyDelFilter=()=>{
    const q=delFilter.toLowerCase().trim();
    document.querySelectorAll('#dpool .dchip').forEach(ch=>{
      const o=findDel(ch.dataset.dw);
      const hay=o?[o.wo,o.title,o.customer,o.floor,o.unit].map(x=>String(x==null?'':x)).join(' ').toLowerCase():'';
      ch.style.display=!q||hay.indexOf(q)>-1?'':'none';
    });
    document.querySelectorAll('#dpool .dgrp').forEach(g=>{
      const any=[...g.querySelectorAll('.dchip')].some(c=>c.style.display!=='none');
      g.style.display=any?'':'none';
    });
  };
  applyDelFilter();
  const dsr=document.getElementById('dsrch');
  if(dsr)dsr.oninput=function(){delFilter=this.value;applyDelFilter();};
  document.querySelectorAll('.dgrp-h').forEach(h=>h.onclick=()=>{
    // select all VISIBLE (filter-respecting) jobs in this customer group
    const wos=[...h.parentElement.querySelectorAll('.dchip')].filter(c=>c.style.display!=='none').map(c=>c.dataset.dw);
    const allIn=wos.length>0&&wos.every(w=>delSel.has(w));
    wos.forEach(w=>allIn?delSel.delete(w):delSel.add(w));
    render();
  });
  const sc=document.getElementById('selclr');if(sc)sc.onclick=()=>{delSel.clear();render();};
  document.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{
    const o=findDel(b.dataset.dd);if(o){o.delDone=!o.delDone;sched();render();}
  });
  document.querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{
    const o=findDel(b.dataset.dx);if(!o)return;
    if(o.delDay){o.delVeh='';o.delDay='';toast(o.wo+' returned to the pool');}
    else if(o.manual){DB.delx=(DB.delx||[]).filter(x=>x.wo!==o.wo);toast(o.wo+' deleted');}
    else{o.delv=false;o.delVeh='';o.delDay='';o.delDone=false;toast(o.wo+' removed from delivery plan');}
    delSel.delete(o.wo);sched();render();
  });
  const dropTo=(el,fn)=>{
    el.ondragover=e=>{e.preventDefault();el.classList.add('dragover');};
    el.ondragleave=()=>el.classList.remove('dragover');
    el.ondrop=e=>{
      e.preventDefault();el.classList.remove('dragover');
      const list=delDragList||[];delDragList=null;
      const moved=list.map(findDel).filter(Boolean);
      if(!moved.length)return;
      moved.forEach(fn);delSel.clear();sched();render();
      if(moved.length>1)toast(moved.length+' jobs moved');
    };
  };
  document.querySelectorAll('.dcell').forEach(c=>{
    const parts=c.dataset.cell.split('|');
    dropTo(c,o=>{o.delVeh=parts[0];o.delDay=parts[1];});
  });
  const pl=document.getElementById('dpool');
  if(pl)dropTo(pl,o=>{o.delVeh='';o.delDay='';});
  document.querySelectorAll('.dnote').forEach(inp=>inp.oninput=function(){
    (DB.delNotes=DB.delNotes||{})[this.dataset.dnote]=this.value;sched();
  });
  const aj=document.getElementById('btn-addjob');
  if(aj)aj.onclick=()=>{document.getElementById('ajform').classList.toggle('open');const t=document.getElementById('aj-title');if(t)t.focus();};
  const aja=document.getElementById('aj-add');
  if(aja)aja.onclick=()=>{
    const title=document.getElementById('aj-title').value.trim();
    if(!title){toast('Give the job a description');return;}
    let wo=document.getElementById('aj-wo').value.trim();
    if(!wo)wo='JOB-'+(DB.nid++);
    if(findDel(wo)||DB.orders.find(o=>o.wo===wo)){toast(wo+' already exists — use a different ref');return;}
    DB.delx=DB.delx||[];
    DB.delx.push({wo,title,customer:document.getElementById('aj-cust').value.trim(),value:parseFloat(document.getElementById('aj-val').value)||0,manual:true,delVeh:'',delDay:'',delDone:false});
    sched();render();toast(wo+' added to the pool');
  };
  const ex=document.getElementById('btn-delexp');if(ex)ex.onclick=exportDeliveries;
  const pp=document.getElementById('btn-delprint');if(pp)pp.onclick=printPoster;
  const rs=document.getElementById('btn-delreset');
  if(rs)rs.onclick=()=>{
    if(!confirm('Clear the whole delivery plan ('+tagged.length+' jobs)? Tags, manual jobs, day notes, vehicles and days are all removed so you can start fresh at the next production meeting.'))return;
    DB.orders.forEach(o=>{delete o.delv;delete o.delVeh;delete o.delDay;delete o.delDone;});
    DB.delx=[];DB.delNotes={};delSel.clear();
    sched();render();toast('Delivery plan cleared — ready for next week');
  };
}

/* Print the delivery plan as A3 landscape wall posters:
   Sheet 1 Artic · Sheet 2 Trucks (Volvo/Renault/Iveco/Crafter + notes) · Sheet 3 Smart Movers (only if used) */
function printPoster(){
  const all=delAll();
  const planned=all.filter(o=>o.delDay);
  if(!planned.length){toast('No jobs placed on a vehicle and day yet');return;}
  const notes=DB.delNotes||{};
  const now=new Date();const dow=now.getDay();
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+(dow===0?-6:1)+7); // next week's Monday
  const dd=i=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;};
  const wn=(d=>{const s=new Date(Date.UTC(d.getFullYear(),0,1));return Math.ceil(((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-s.getTime())/864e5+s.getUTCDay()+1)/7);})(mon);
  const fmtD=(d,o)=>d.toLocaleDateString('en-IE',o);
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const DAYNAMES=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const range='Mon '+fmtD(dd(0),{day:'numeric',month:'short'})+' \u2013 Sat '+fmtD(dd(5),{day:'numeric',month:'short',year:'numeric'});
  const printed=fmtD(now,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const hasNotes=DEL_DAYS.some(d=>(notes[d]||'').trim());
  const smart=planned.some(o=>o.delVeh==='SMART');
  const total=smart?3:2;
  const job=o=>`<div class="job"><div class="jwo">${esc(o.wo)}</div><div class="jti">${esc(o.title||'\u2014')}</div><div class="jcu">${esc(o.customer||'')}</div></div>`;
  const vRow=v=>`<div class="vrow"><div class="vcell"><div class="vn">${esc(v.n)}</div><div class="vs">${esc(v.cat)}${v.sub?' \u00b7 '+esc(v.sub):''}</div></div>${DEL_DAYS.map(d=>`<div class="dc">${planned.filter(o=>o.delVeh===v.k&&o.delDay===d).sort(woCmp).map(job).join('')}</div>`).join('')}</div>`;
  const head=t=>`<div class="ph"><div><div class="kick">Western Postform \u2014 Factory floor</div><div class="h1">Delivery plan \u2014 ${t}</div></div><div class="wk"><div class="wkn">Week ${wn}</div><div class="wkr">${range}</div></div></div>`;
  const dhead=`<div class="dhead"><div class="dh0">Vehicle</div>${DAYNAMES.map((n,i)=>`<div class="dh">${n.toUpperCase()} <span>${fmtD(dd(i),{day:'numeric',month:'short'}).toUpperCase()}</span></div>`).join('')}</div>`;
  const notesRow=hasNotes?`<div class="nrow"><div class="n0">Notes</div>${DEL_DAYS.map(d=>`<div class="nc">${esc(notes[d]||'')}</div>`).join('')}</div>`:'';
  const foot=i=>`<div class="pf"><span>Printed ${printed} \u00b7 WPF Production Planner \u2014 reprint after each production meeting</span><span class="pfn">Sheet ${i} of ${total}</span></div>`;
  const sheet=(t,rows,extra,i)=>`<div class="sheet" data-cat="${esc(t)}">${head(t)}<div class="pgrid">${dhead}${rows}${extra}</div>${foot(i)}</div>`;
  const body=sheet('Artic',vRow(DEL_VEH[0]),'',1)
    +sheet('Trucks',DEL_VEH.slice(1,5).map(vRow).join(''),notesRow,2)
    +(smart?sheet('Smart Movers',vRow(DEL_VEH[5]),'',3):'');
  const doc=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>WPF Delivery Plan \u2014 Week ${wn}</title>
<style>
@page{size:A3 landscape;margin:0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:'Archivo',sans-serif;color:#201e1d;background:#8a8886}

/* compact steps — used only when a single vehicle's own page overflows, so nothing is ever cut off */
.sheet.c1 .jwo{font-size:13.5px}.sheet.c1 .jti{font-size:12px}.sheet.c1 .jcu{font-size:10px}.sheet.c1 .dc{padding:8px 10px;gap:8px}
.sheet.c2 .jwo{font-size:12px}.sheet.c2 .jti{font-size:10.5px}.sheet.c2 .jcu{font-size:9px}.sheet.c2 .dc{padding:6px 8px;gap:6px}
.sheet.c3 .jwo{font-size:10.5px}.sheet.c3 .jti{font-size:9.5px}.sheet.c3 .jcu{font-size:8.5px}.sheet.c3 .dc{padding:5px 7px;gap:5px}
</style></head><body>${body}<script>
/* Overflow pagination: a page only ever holds WHOLE vehicle rows. If a category page
   overflows, whole vehicles (last first, e.g. Crafter) move to a continuation page —
   one vehicle's deliveries are never split across pages and no job is ever clipped.
   If a single vehicle alone still overflows its page, the cards step down in size instead. */
function paginate(){
  var list=[].slice.call(document.querySelectorAll('.sheet'));
  for(var si=0;si<list.length;si++){
    var sh=list[si],grid=sh.querySelector('.pgrid'),guard=0;
    while(grid.scrollHeight>grid.clientHeight+2&&guard++<60){
      var rows=sh.querySelectorAll('.vrow');
      if(rows.length<=1){
        var lvl=+(sh.getAttribute('data-c')||0);
        if(lvl>=3)break;
        lvl++;sh.setAttribute('data-c',lvl);sh.className='sheet c'+lvl;
        continue;
      }
      var next=list[si+1];
      var cont=(next&&next.getAttribute('data-cont')===sh.getAttribute('data-cat'))?next:null;
      if(!cont){
        cont=document.createElement('div');
        cont.className='sheet';
        cont.setAttribute('data-cat',sh.getAttribute('data-cat'));
        cont.setAttribute('data-cont',sh.getAttribute('data-cat'));
        var h=sh.querySelector('.ph').cloneNode(true);
        var h1=h.querySelector('.h1');h1.textContent=h1.textContent.replace(' (cont.)','')+' (cont.)';
        var g=document.createElement('div');g.className='pgrid';
        g.appendChild(sh.querySelector('.dhead').cloneNode(true));
        cont.appendChild(h);cont.appendChild(g);
        cont.appendChild(sh.querySelector('.pf').cloneNode(true));
        sh.parentNode.insertBefore(cont,sh.nextSibling);
        list.splice(si+1,0,cont);
      }
      var cg=cont.querySelector('.pgrid');
      cg.insertBefore(rows[rows.length-1],cg.children[1]||null);
      var nr=sh.querySelector('.nrow');
      if(nr)cg.appendChild(nr);
    }
  }
  var all=document.querySelectorAll('.sheet');
  for(var i=0;i<all.length;i++){var f=all[i].querySelector('.pfn');if(f)f.textContent='Sheet '+(i+1)+' of '+all.length;}
}
/* Load the poster font WITHOUT blocking: if Google Fonts is slow or the office is
   offline, we still paginate and print (system font fallback) after 3s. */
(function(){
  var done=false;
  function go(){if(done)return;done=true;paginate();setTimeout(function(){window.print();},250);}
  var l=document.createElement('link');l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap';
  l.onload=function(){
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){setTimeout(go,120);});
    else setTimeout(go,400);
  };
  l.onerror=function(){go();};
  document.head.appendChild(l);
  setTimeout(go,3000);
})();
<\/script></body></html>`;
  const w=window.open('','_blank');
  if(!w){toast('Popup blocked \u2014 allow popups for this page');return;}
  w.document.write(doc);w.document.close();
  toast('Poster opened \u2014 print at A3 landscape');
}

function exportDeliveries(){
  const all=delAll();
  if(!all.length){toast('No jobs tagged for delivery yet');return;}
  const notes=DB.delNotes||{};
  // Calendar sheet — mirrors the on-screen grid
  const jobTxt=o=>o.wo+' — '+(o.title||'')+(o.customer?'  ['+o.customer+']':'')+'  €'+Math.round(o.value||0).toLocaleString()+(o.delDone?'  — DELIVERED':'');
  const cal=[['Vehicle',...DEL_DAYS]];
  DEL_VEH.forEach(v=>{
    const by={};DEL_DAYS.forEach(d=>{by[d]=all.filter(o=>o.delVeh===v.k&&o.delDay===d).sort(woCmp);});
    const k=Math.max(1,...DEL_DAYS.map(d=>by[d].length));
    for(let i=0;i<k;i++)cal.push([i===0?v.n:'',...DEL_DAYS.map(d=>by[d][i]?jobTxt(by[d][i]):'')]);
    cal.push(['',...DEL_DAYS.map(()=>'')]);
  });
  cal.push(['NOTES',...DEL_DAYS.map(d=>notes[d]||'')]);
  cal.push(['JOBS / DAY',...DEL_DAYS.map(d=>all.filter(o=>o.delDay===d).length)]);
  cal.push(['VALUE / DAY €',...DEL_DAYS.map(d=>Math.round(dayVal(d)))]);
  cal.push(['WEEK TOTAL €',Math.round(all.filter(o=>o.delDay).reduce((a,o)=>a+(+o.value||0),0))]);
  const un=all.filter(o=>!o.delDay);
  if(un.length)cal.push(['UNPLANNED',un.length+' job'+(un.length!==1?'s':'')+' still in the pool — see Unplanned sheet']);

  // List sheets
  const dayIx=o=>{const i=DEL_DAYS.indexOf(o.delDay);return i<0?99:i;};
  const vehIx=o=>{const i=DEL_VEH.findIndex(v=>v.k===o.delVeh);return i<0?99:i;};
  const srt=(a,b)=>dayIx(a)-dayIx(b)||vehIx(a)-vehIx(b)||woCmp(a,b);
  const hdr=['Day','Vehicle','WO #','Floor','Unit','Order #','Title','Customer','Value €','Hours','Status'];
  const rowOf=o=>[o.delDay||'UNPLANNED',vehLbl(o.delVeh)||'Unassigned',o.wo,o.floor||'',o.unit||'',o.orderNo||'',o.title||'',o.customer||'',Math.round(o.value||0),o.hours||'',o.delDone?'DELIVERED':(o.manual?'added manually':'')];
  const widths=[{wch:10},{wch:13},{wch:14},{wch:7},{wch:9},{wch:9},{wch:34},{wch:30},{wch:9},{wch:7},{wch:15}];
  const mkSheet=list=>{const ws=XLSX.utils.aoa_to_sheet([hdr,...[...list].sort(srt).map(rowOf)]);ws['!cols']=widths;return ws;};

  const wb=XLSX.utils.book_new();
  const cws=XLSX.utils.aoa_to_sheet(cal);
  cws['!cols']=[{wch:13},...DEL_DAYS.map(()=>({wch:48}))];
  XLSX.utils.book_append_sheet(wb,cws,'Calendar');
  XLSX.utils.book_append_sheet(wb,mkSheet(all),'By Day');
  XLSX.utils.book_append_sheet(wb,mkSheet(all.filter(o=>o.delVeh==='ARTIC')),'Artic');
  XLSX.utils.book_append_sheet(wb,mkSheet(all.filter(o=>o.delVeh&&o.delVeh!=='ARTIC')),'Trucks');
  if(un.length)XLSX.utils.book_append_sheet(wb,mkSheet(un),'Unplanned');
  XLSX.writeFile(wb,'WPF_Deliveries_'+new Date().toISOString().split('T')[0]+'.xlsx');
  toast('Delivery plan exported');
}

function autoSchedule(newOrders){
  const weeks=get8Wks();
  const currentWeek=weeks[0];
  const wkLoad={};
  DB.orders.forEach(o=>{if(o.plannedWeek)wkLoad[o.plannedWeek]=(wkLoad[o.plannedWeek]||0)+o.hours;});
  newOrders.forEach(o=>{if(o.plannedWeek)wkLoad[o.plannedWeek]=(wkLoad[o.plannedWeek]||0)+o.hours;});
  newOrders.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  newOrders.forEach(o=>{
    if(o.plannedWeek)return;
    let assigned=null;
    if(!o.dueDate){
      assigned=currentWeek;
    } else {
      const due=o.dueDate;
      if(due<currentWeek){
        // Overdue — put in current week
        assigned=currentWeek;
      } else {
        // Match to the exact week the due date falls in
        for(let i=0;i<weeks.length;i++){
          const wkStart=weeks[i];
          const wkEnd=i<weeks.length-1?weeks[i+1]:null;
          if(due>=wkStart&&(!wkEnd||due<wkEnd)){assigned=wkStart;break;}
        }
        if(!assigned)assigned=weeks[weeks.length-1];
      }
    }
    o.plannedWeek=assigned;
    wkLoad[assigned]=(wkLoad[assigned]||0)+o.hours;
  });
}

/* ---------- Import: header-tolerant column mapping (v16) ---------- */
const IMP_FIELDS=[
  {k:'wo',      label:'WO number',  req:true,  al:['# wo','wo','wo #','wo no','wo number','work order','work order #','work order no']},
  {k:'dueDate', label:'Due date',   req:true,  al:['due date','due','required date','date required','req date','due dt']},
  {k:'title',   label:'Title',      req:false, al:['title','description','job title','job','name']},
  {k:'customer',label:'Customer',   req:false, al:['customer','client','customer name','account']},
  {k:'step',    label:'Step',       req:false, al:['step','status','stage']},
  {k:'value',   label:'Value',      req:false, al:['sub-total','sub total','subtotal','value','net','net value','total']},
  {k:'hours',   label:'Hours',      req:false, al:['hours assembly time','to process','hours','assembly hours','hrs']},
  {k:'ref',     label:'Reference',  req:false, al:['reference','ref','our ref']},
  {k:'floor',   label:'Floor',      req:false, al:['floor','level','flr','storey']},
  {k:'unit',    label:'Unit',       req:false, al:['position','unit','unit no','house','house no','plot','apt','apartment','pos']},
  {k:'orderNo', label:'Order #',    req:false, al:['order #','order no','order number','order']},
  {k:'salesRep',label:'Sales rep',  req:false, al:['sales rep','rep','salesperson','sales person','sales']}
];
const nrmH=s=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
const colLtr=i=>{let s='',n=i;while(n>=0){s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26)-1;}return s;};
let PEND=null;

// Find a real header row anywhere in the first 12 rows. Returns row index or -1.
function findHeaderRow(aoa){
  for(let r=0;r<Math.min(12,aoa.length);r++){
    const cells=(aoa[r]||[]).map(nrmH);
    let hits=0,hasWo=false;
    IMP_FIELDS.forEach(f=>{
      if(cells.some(c=>c&&f.al.indexOf(c)>-1)){hits++;if(f.k==='wo')hasWo=true;}
    });
    if(hasWo&&hits>=3)return r;
  }
  return -1;
}
function mapFromHeader(hdrCells){
  const m={};
  IMP_FIELDS.forEach(f=>{
    m[f.k]=-1;
    for(let p=0;p<f.al.length&&m[f.k]<0;p++){
      const idx=hdrCells.findIndex(c=>nrmH(c)===f.al[p]);
      if(idx>-1&&Object.keys(m).every(k=>k===f.k||m[k]!==idx))m[f.k]=idx;
    }
  });
  return m;
}

// No header row — infer each column from its contents.
function guessCols(rows){
  const n=rows.reduce((a,r)=>Math.max(a,r.length),0);
  const col=i=>rows.map(r=>r[i]).filter(v=>v!==''&&v!=null);
  const used={};
  const take=i=>{if(i>-1)used[i]=1;return i;};
  const free=i=>!used[i];
  const m={};
  const byTest=t=>{let best=-1,bs=0.5;for(let i=0;i<n;i++){if(!free(i))continue;const v=col(i);if(v.length<3)continue;const s=v.filter(t).length/v.length;if(s>bs){bs=s;best=i;}}return best;};
  m.wo=take(byTest(v=>/^wo[-\s_]/i.test(String(v))));
  m.step=take(byTest(v=>/^\s*\d+\s*\./.test(String(v))));
  // Due date: date-like column, well filled, latest-skewed (creation dates sit in the past).
  const isDt=v=>(v instanceof Date)||(typeof v==='number'&&v>35000&&v<80000);
  const ser=v=>v instanceof Date?(v.getTime()/86400000)+25569:v;
  let bd=-1,bmed=-1;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i);
    if(!v.length||v.filter(isDt).length/v.length<0.9)continue;
    if(v.length/rows.length<0.8)continue;
    const s=v.map(ser).sort((a,b)=>a-b);
    const med=s[Math.floor(s.length/2)];
    if(med>bmed){bmed=med;bd=i;}
  }
  m.dueDate=take(bd);
  // Order #: numeric column whose value appears inside the WO number (WO-2604-7 -> 2604).
  if(m.wo>-1){
    let bo=-1,bs=0.6;
    for(let i=0;i<n;i++){
      if(!free(i))continue;
      const v=rows.map(r=>[r[m.wo],r[i]]).filter(p=>p[0]!=null&&p[1]!=null&&p[1]!=='');
      if(v.length<3)continue;
      const s=v.filter(p=>String(p[0]).indexOf(String(p[1]))>-1).length/v.length;
      if(s>bs){bs=s;bo=i;}
    }
    m.orderNo=take(bo);
    // Reference: text column that also embeds the order number but is near-unique.
    let br=-1,bsr=0.6;
    for(let i=0;i<n;i++){
      if(!free(i))continue;
      const v=col(i);
      if(v.length<3||new Set(v.map(String)).size/v.length<0.9)continue;
      const pr=rows.map(r=>[r[m.orderNo],r[i]]).filter(p=>p[0]!=null&&p[1]!=null&&p[1]!=='');
      if(!pr.length)continue;
      const s=pr.filter(p=>String(p[1]).indexOf(String(p[0]))===0).length/pr.length;
      if(s>bsr){bsr=s;br=i;}
    }
    m.ref=take(br);
  } else {m.orderNo=-1;m.ref=-1;}
  // Floor & Unit: the Reference encodes them as segments 3 and 4 (e.g. 2604-7-0-22 = order-seq-floor-unit),
  // so find the columns whose values match those segments.
  m.floor=-1;m.unit=-1;
  if(m.ref>-1){
    const segs=rows.map(r=>String(r[m.ref]==null?'':r[m.ref]).split('-'));
    const s3=segs.map(s=>s.length>=4?String(s[2]):null);
    const s4=segs.map(s=>s.length>=4?s.slice(3).join('-'):null);
    const matchCol=target=>{
      let best=-1,bs=0.6;
      for(let i=0;i<n;i++){
        if(!free(i))continue;
        const pairs=rows.map((r,j)=>[target[j],r[i]]).filter(p=>p[0]!=null&&p[1]!=null&&p[1]!=='');
        if(pairs.length<3)continue;
        const s=pairs.filter(p=>String(p[1]).toUpperCase().trim()===String(p[0]).toUpperCase().trim()).length/pairs.length;
        if(s>bs){bs=s;best=i;}
      }
      return best;
    };
    m.floor=take(matchCol(s3));
    m.unit=take(matchCol(s4));
  }
  // Value: numeric, many distinct, decent magnitude — prefer the one with decimals.
  let bv=-1,bvs=-1;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i).filter(x=>typeof x==='number'||(typeof x==='string'&&x!==''&&!isNaN(Number(x)))).map(Number);
    if(v.length/Math.max(1,col(i).length)<0.9||v.length<3)continue;
    const d=new Set(v).size;
    if(d<10)continue;
    const s=d+(v.some(x=>x%1!==0)?1000:0);
    if(s>bvs){bvs=s;bv=i;}
  }
  m.value=take(bv);
  // Customer: text column with the longest average value (company names).
  let bc=-1,bl=6;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i).map(String);
    if(v.length<3||v.some(x=>x instanceof Date))continue;
    if(v.filter(x=>isNaN(Number(x))).length/v.length<0.9)continue;
    const d=new Set(v).size;
    if(d<3||d/v.length>0.9)continue;
    const avg=v.reduce((a,x)=>a+x.length,0)/v.length;
    if(avg>bl){bl=avg;bc=i;}
  }
  m.customer=take(bc);
  // Title: remaining text column with the most distinct values.
  let bt=-1,bts=2;
  for(let i=0;i<n;i++){
    if(!free(i))continue;
    const v=col(i).map(String);
    if(v.length<3)continue;
    if(v.filter(x=>isNaN(Number(x))).length/v.length<0.8)continue;
    const d=new Set(v).size;
    if(d>bts){bts=d;bt=i;}
  }
  m.title=take(bt);
  // Sales rep: remaining text column, few distinct, names with a space.
  let bp=-1;
  for(let i=0;i<n&&bp<0;i++){
    if(!free(i))continue;
    const v=col(i).map(String);
    if(v.length<3)continue;
    const d=new Set(v).size;
    if(d>=3&&d<=20&&v.filter(x=>/^[A-Za-z .'\-]+$/.test(x)&&x.indexOf(' ')>-1).length/v.length>0.8)bp=i;
  }
  m.salesRep=take(bp);
  if(m.hours===undefined)m.hours=-1;
  IMP_FIELDS.forEach(f=>{if(m[f.k]===undefined)m[f.k]=-1;});
  return m;
}

function objsFrom(rows,map){
  return rows.map(r=>{
    const o={};
    IMP_FIELDS.forEach(f=>{o[f.k]=map[f.k]>-1?r[map[f.k]]:undefined;});
    return o;
  });
}
