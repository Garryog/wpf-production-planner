<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WPF Production Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="var s=document.createElement('script');s.src='xlsx.full.min.js';document.head.appendChild(s);"></script><!-- if the CDN is blocked by the works firewall, the copy in this site is used instead -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:3px solid #1a56db;outline-offset:2px}
.wl-h :focus-visible,.wl-selbar :focus-visible,.flr-vh :focus-visible{outline-color:#e8b931}
::placeholder{color:#7d8aa0}
:root{
  --bg:#f0f2f5;--card:#fff;--border:#dde1e7;--b2:#c4c9d4;
  --text:#1a1d23;--t2:#4a5568;--t3:#5b6b82;
  --green:#1a7a3c;--gl:#e6f4ec;--gb:#2d9e54;
  --red:#c0392b;--rl:#fdecea;
  --amber:#92400e;--al:#fef3c7;
  --blue:#1e4db7;--bl:#ebf0fb;
  --purple:#6d28d9;--pl:#f3effd;
  --accent:#c8a84b;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select{font-family:inherit;cursor:pointer}
.hdr{background:#1a1d23;color:#fff;border-bottom:3px solid var(--accent)}
.hdr-i{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:10px}
.lm{width:32px;height:32px;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1a1d23}
.lt{font-size:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#fff}
.ls{font-size:10px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.sync{font-size:11px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.dot{width:6px;height:6px;border-radius:50%;background:#4caf50;display:inline-block}
.dot.s{background:var(--accent)}.dot.e{background:#e53935}
.tabs{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tabs-i{max-width:1400px;margin:0 auto;display:flex;padding:0 20px;overflow-x:auto}
.tabs-i::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:10px 18px;border:none;background:none;font-size:13px;color:var(--t2);border-bottom:3px solid transparent;font-weight:500}
.tab:hover{color:var(--text)}.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.pg{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
.cap-bar{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 20px;margin-bottom:14px}
.cap-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:10px}
.week-caps{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.wk-cap{background:var(--bg);border-radius:8px;padding:8px 6px;text-align:center;border:2px solid transparent;cursor:pointer;transition:all .15s}
.wk-cap:hover{border-color:var(--b2)}.wk-cap.selected{border-color:var(--blue);background:var(--bl)}
.wk-label{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:3px}
.wk-date{font-size:10px;color:var(--t3);margin-bottom:5px}
.wk-bar-wrap{height:6px;background:#e5e8ed;border-radius:3px;overflow:hidden;margin-bottom:4px}
.wk-bar{height:100%;border-radius:3px;transition:width .3s}
.wk-bar.ok{background:var(--green)}.wk-bar.warn{background:var(--amber)}.wk-bar.over{background:var(--red)}
.wk-hours{font-size:11px;font-weight:600}
.wk-hours.ok{color:var(--green)}.wk-hours.warn{color:var(--amber)}.wk-hours.over{color:var(--red)}
.wk-count{font-size:10px;color:var(--t3)}
.board-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:6px;border:none;font-size:13px;font-weight:500}
.btn-g{background:var(--green);color:#fff}.btn-g:hover{background:var(--gb)}
.btn-s{background:#fff;border:1px solid var(--b2);color:var(--text)}.btn-s:hover{background:var(--bg)}
.btn-blue{background:var(--blue);color:#fff}
.search-input{padding:7px 12px;border:1px solid var(--b2);border-radius:6px;font-size:13px;min-width:200px;}
.search-input:focus{border-color:var(--blue)}
.filter-sel{padding:7px 10px;border:1px solid var(--b2);border-radius:6px;font-size:13px;background:#fff;-webkit-appearance:none}
.wo-table-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.wo-table{width:100%;border-collapse:collapse;font-size:13px}
.wo-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);padding:8px 10px;border-bottom:1px solid var(--border);background:#f8f9fb;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
.wo-table th:hover{color:var(--text)}
.wo-table th.asc::after{content:' ↑'}.wo-table th.desc::after{content:' ↓'}
.wo-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.wo-table tr:last-child td{border-bottom:none}
.wo-table tr:hover td{background:#fafbfc}
.wo-table tr.dragging{opacity:.3}
.wo-table tr.drag-over td{border-top:3px solid var(--blue)}
.wo-table tr.c-red td:first-child{border-left:4px solid var(--red)}
.wo-table tr.c-amber td:first-child{border-left:4px solid var(--amber)}
.wo-table tr.c-green td:first-child{border-left:4px solid var(--green)}
.wo-table tr.hl-row td{background:#fff8d6!important}
.wo-table tr.grp-start td{border-top:2px solid var(--b2)}
.wo-table tr.hl-row .wo-num{color:#b8860b;font-weight:700}
.wo-table tr.c-blue td:first-child{border-left:4px solid var(--blue)}
.wo-table tr.c-purple td:first-child{border-left:4px solid var(--purple)}
.wo-num{font-family:monospace;font-size:11px;color:var(--t2)}
.wo-title{font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.wo-cust{color:var(--t2);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.due-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.due-late{background:var(--rl);color:var(--red)}.due-soon{background:var(--al);color:var(--amber)}.due-ok{background:var(--gl);color:var(--green)}
.step-badge{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--bl);color:var(--blue);white-space:nowrap}
.week-sel{padding:4px 8px;border:1px solid var(--b2);border-radius:5px;font-size:12px;background:#fff;width:120px}
.notes-inp{width:100%;border:none;background:transparent;font-size:12px;color:var(--t2);padding:1px 0;font-family:inherit;min-width:100px}
.notes-inp:focus{border-bottom:1px solid var(--blue)}
.cdot{width:13px;height:13px;border-radius:50%;display:inline-block;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.cdot:hover{border-color:#fff;box-shadow:0 0 0 2px var(--b2)}
.drag-handle{cursor:grab;color:var(--t3);padding:0 3px;font-size:15px;user-select:none;line-height:1}
.drag-handle:active{cursor:grabbing}
.table-footer{padding:9px 12px;background:#f8f9fb;border-top:1px solid var(--border);display:flex;gap:20px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.changes-banner{background:var(--al);border:1px solid #f59e0b;border-radius:8px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.import-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.drop-zone{border:2px dashed var(--b2);border-radius:8px;padding:28px;text-align:center;color:var(--t3);cursor:pointer;transition:all .15s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--blue);background:var(--bl);color:var(--blue)}
.preview-row{padding:5px 10px;background:var(--bg);border-radius:4px;margin-bottom:3px;display:flex;align-items:center;gap:10px;font-size:12px}
.exp-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.empty{text-align:center;padding:40px;color:var(--t3);font-size:13px}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1d23;color:#fff;padding:9px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.toast.stick{pointer-events:none;white-space:normal;width:max-content;max-width:calc(100vw - 24px);box-sizing:border-box;border-radius:10px;text-align:left;background:#fff4d6;color:#7a5200;border:1px solid #e0a43a;font-weight:700;padding:8px 40px 8px 12px;line-height:1.35;max-height:25vh;overflow:hidden;display:flex;flex-direction:column}
.toast .toast-l{position:relative;overflow-y:auto;min-height:0;flex:1 1 auto;overscroll-behavior:contain}
.toast .toast-up,.toast .toast-dn{pointer-events:auto;position:absolute;right:2px;width:36px;height:36px;background:none;border:0;color:#7a5200;font-size:14px;line-height:1;padding:0;cursor:pointer}
.toast .toast-up{top:40px}.toast .toast-dn{bottom:2px}
.toast .toast-up::before{content:'▲'}.toast .toast-dn::before{content:'▼'}
.toast.stick:not(.scr) .toast-up,.toast.stick:not(.scr) .toast-dn{display:none}
.toast.stick .toast-i{position:relative}
.toast.stick .toast-i+.toast-i{margin-top:11px}
.toast.stick .toast-i+.toast-i::before{content:'';position:absolute;left:0;right:0;top:-6px;border-top:1px solid #e0a43a}
.toast .toast-x{pointer-events:auto;position:absolute;top:2px;right:2px;background:none;border:0;color:#7a5200;font-size:18px;line-height:1;width:36px;height:36px;padding:0;cursor:pointer}
.toast .toast-x::before{content:'✕'}
/* short landscape phones (a quarter of the screen is under 3 buttons high): ▲ sits beside ✕, ▼ at the bottom */
@media (max-height:520px){.toast.stick.scr{padding-right:78px;min-height:80px}.toast.stick.scr .toast-up{top:2px;right:40px}}
.savebar{position:sticky;top:0;z-index:9000;background:#c0392b;color:#fff;font-size:14px;font-weight:700;line-height:1.4;padding:10px 16px;text-align:center}
.savebar[hidden]{display:none}
.verbar{position:sticky;top:0;z-index:8999;width:100%;border:0;background:#14335c;color:#fff;font-size:14px;font-weight:700;padding:10px 16px;cursor:pointer}
.verbar[hidden]{display:none}
@media(max-width:1000px){.week-caps{grid-template-columns:repeat(5,1fr)}}
@media(max-width:700px){.week-caps{grid-template-columns:repeat(3,1fr)}.wo-table th:nth-child(n+7),.wo-table td:nth-child(n+7){display:none}.pg{padding:12px 12px 60px}}
/* ---- Shipped tab (phone-first cards) ---- */
.sh-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sh-bar .search-input{flex:1;min-width:200px}
.sh-chk{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sh-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sh-card.sh-done{background:#f4fbf6;border-color:#b3e0c4}
.sh-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sh-t{font-size:14px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.sh-m{font-size:12px;color:var(--t2);margin-top:2px;overflow-wrap:anywhere}
.sh-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sh-pill{font-size:11px;font-weight:700;border-radius:100px;padding:2px 8px;white-space:nowrap}
.sh-pill.ok{background:#e6f6ec;color:#0d6e46}.sh-pill.no{background:#f1f3f6;color:var(--t2)}.sh-pill.warn{background:#fdecea;color:#c0392b}
@media(max-width:700px){.sh-b .btn{flex:1;min-height:44px;font-size:14px}.sh-bar .search-input,.sh-bar .filter-sel{width:100%;min-width:0;min-height:40px;font-size:16px}.sh-chk{min-height:36px}}
/* ---- Column filters ---- */
.cf-row td{background:#f8f9fb;border-bottom:2px solid var(--border);padding:3px 4px}
.cf-inp{width:100%;min-width:44px;border:1px solid var(--b2);border-radius:4px;padding:3px 6px;font-size:11px;background:#fff;color:var(--text)}
.cf-inp::placeholder{color:#c3cad6}
.cf-inp:focus{border-color:#7ba7e0}
.cf-inp.on{background:#fff8d6;border-color:#e0b830;font-weight:600}
.cf-clear{background:#fff8d6;border:1px solid #e0b830;color:#8a6d00;border-radius:4px;font-size:10px;font-weight:700;padding:3px 6px;cursor:pointer;white-space:nowrap}
.cf-clear:hover{background:#ffefad}
/* ---- Board grouping ---- */
.gsel{width:14px;height:14px;cursor:pointer;accent-color:#1a56db;vertical-align:middle}
.grp-row td{background:#eef3fb!important;border-top:2px solid #b9cdec!important;border-bottom:1px solid #c9d8ee}
.grp-row .grp-title{font-weight:700;font-size:13px;width:100%;min-width:120px;border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:5px;color:#14335c;}
.grp-row .grp-title:hover{border-color:var(--b2);background:#fff}
.grp-row .grp-title:focus{border-color:#7ba7e0;background:#fff}
.grp-tog{cursor:pointer;font-family:monospace;font-size:11px;font-weight:700;color:#1a56db;white-space:nowrap;user-select:none}
.grp-tog:hover{text-decoration:underline}
.grp-member td{background:#f7fafd!important}
.grm-btn{background:none;border:1px solid transparent;color:var(--t3);font-size:13px;cursor:pointer;padding:1px 6px;border-radius:4px;line-height:1.2}
.grm-btn:hover{background:#fdecea;color:var(--red);border-color:#f3b3a6}
.grp-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#14335c;color:#fff;padding:10px 18px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:13px;box-shadow:0 8px 28px rgba(10,20,40,.4);z-index:60}
.grp-bar span{color:#bcd0f0;font-weight:600}
/* ---- Deliveries ---- */
.dvbtn{background:none;border:1px solid transparent;font-size:15px;filter:grayscale(1);opacity:.32;cursor:pointer;padding:1px 5px;border-radius:5px;line-height:1;transition:all .12s}
.dvbtn:hover{opacity:.7}
.dvbtn.on{filter:none;opacity:1;background:#e8f1fd;border-color:#b0c8e8}
#delcnt{display:none;background:#1a56db;color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:5px;vertical-align:1px}
#listcnt{display:none;background:#c0392b;color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:5px;vertical-align:1px}
.pwo-l{display:block;font-size:11px;color:var(--t3);font-weight:700;margin-bottom:3px}
#pwo-form input{padding:7px 9px;border:1px solid var(--b2);border-radius:6px;font-size:13px}
/* cutting lists library + saw/stores queues */
.lst-tbl{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.lst-tbl th{background:#f4f6f9;text-align:left;padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);border-bottom:1px solid var(--border)}
.lst-tbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.lst-chip{display:inline-block;background:#eef2f8;border:1px solid var(--b2);border-radius:5px;padding:1px 7px;font-size:11px;font-family:monospace;margin:1px 3px 1px 0;white-space:nowrap}
.lst-chip button{border:none;background:none;cursor:pointer;color:var(--t3);font-size:11px;padding:0 0 0 3px}
.lst-done{color:#0d6e46;font-weight:700;font-size:11px;white-space:nowrap}
.wl{max-width:1100px;margin:0 auto;padding:14px 18px}
.wl h1{font-size:26px;color:#14335c;border-bottom:4px solid #1a56db;padding-bottom:6px;margin-bottom:14px}
.wl h1 span{font-size:14px;color:var(--t3);font-weight:400;margin-left:10px}
.wl-card{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.wl-card.cdone{opacity:.55}
.wl-h{background:#14335c;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wl-h .wn{font-size:19px;font-weight:800}
.wl-h .wd{font-size:13px;opacity:.9}
.wl-due{background:#e8b931;color:#14335c;font-weight:800;font-size:13px;border-radius:6px;padding:3px 10px;white-space:nowrap}
.wl-h .lst-chip{background:rgba(255,255,255,.95);color:#14335c;border-color:transparent;font-weight:700}
.wl-tbl{width:100%;border-collapse:collapse;font-size:15px}
.wl-tbl th{background:#f4f6f9;text-align:left;padding:6px 10px;font-size:11px;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--border)}
.wl-tbl td{padding:7px 10px;border-bottom:1px solid #eef1f5}
.wl-tbl td.num{font-weight:700;font-family:monospace;white-space:nowrap}
.wl-sec td{background:#eaf0f8;font-weight:800;color:#14335c;font-size:14px;border-top:2px solid var(--b2)}
.wl-act{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wl-btn{background:#0b7e44;color:#fff;border:none;border-radius:10px;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer}
.wl-undo{background:#fff;border:2px solid #8e99ab;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;color:#4a5568;cursor:pointer;min-height:44px}
.wl-donelbl{color:#0d6e46;font-weight:800;font-size:15px}
.wl-tabs{display:flex;gap:10px;margin-bottom:14px}
.wl-tabs button{flex:1;padding:14px;font-size:17px;font-weight:800;border-radius:10px;border:2px solid var(--b2);background:#fff;color:var(--t3);cursor:pointer}
.wl-tabs button.on{background:#14335c;border-color:#14335c;color:#fff}
.wl-dday{font-size:13px;font-weight:800;color:#14335c;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px;border-bottom:2px solid #14335c;padding-bottom:3px}
.ls-nochip{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;background:#fff4d6;color:#7a4a00;border:1px solid #e0a43a;white-space:nowrap;vertical-align:middle}
.ls-nochip.late{background:#c0392b;color:#fff;border-color:#c0392b}
.lti-row{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.lti-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.lti-wo{font-family:monospace;font-size:14px;color:#14335c}.lti-t{flex:1;min-width:140px;overflow-wrap:anywhere}.lti-c{color:var(--t2);font-size:12px;overflow-wrap:anywhere}
.lti-b{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.lti-sug{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:5px 0 2px}.lti-chip{border:1px solid;border-radius:6px;padding:3px 8px;font-size:12px;overflow-wrap:anywhere}
.lti-why{font-size:11px;color:var(--t3)}.lti-act{display:flex;flex-wrap:wrap;align-items:center;margin-top:4px}.lti-msg{font-size:12px;font-weight:700;margin-top:4px}
.lti-done{background:#e7f6ec;border:1px solid #9fd8b4;border-radius:8px;padding:6px 10px;margin-bottom:8px;font-size:12px;color:#0d6e46}
.lti-nar{padding:3px 0;border-bottom:1px solid var(--border)}
details.lti-other{margin-bottom:14px}details.lti-other>summary{cursor:pointer;font-size:13px;font-weight:700;color:#14335c;padding:8px 4px}
.wl-drow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:14px}

   matches what we sent — but our tag is still in the list, so we know it landed and can use it as the merge base
   (otherwise a tick we sent would come back over the office's untick). Old-code tabs (before this change) drop
   saveIds when they save; then this falls back to the earlier "can't tell" behaviour, which is safe. */
const USID=new WeakMap(); // unconfirmed save → its tag
const SAVEID_N=40;

  if(!ids||!ids.size)return null;
  for(let i=UNSURE.length-1;i>=0;i--){const t=USID.get(UNSURE[i]);if(t&&ids.has(t)){const p=UNSURE[i];UNSURE=UNSURE.slice(i+1);return p;}}

function clone(x){return x===undefined?undefined:JSON.parse(JSON.stringify(x));}

  const ka=Object.keys(a).filter(k=>a[k]!==undefined),kb=Object.keys(b).filter(k=>b[k]!==undefined);

  for(const k of ka)if(!same(a[k],b[k]))return false;

function snap(){return clone({orders:DB.orders,nid:DB.nid,settings:fullSettings()});}
/* Unsaved changes are also kept on this device (localStorage), so closing the tab, a dead battery or
   no signal can't lose them: on next open they're merged into the latest plan and sent.
   Cutting-list workbooks (listWBs) are too big for the device copy and are left out. */
const PEND_KEY='wpfPending';let pendT=null;

// moment never overwrite each other's copy. The old single shared key (wpfPending) is still read, then tidied away once recovered.
const TAB_ID=(()=>{try{let t=sessionStorage.getItem('wpfTab');if(!t){t='T'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);sessionStorage.setItem('wpfTab',t);}return t;}catch(e){return'T'+Math.random().toString(36).slice(2,8);}})();

function pendOld(){ // the old shared key, in any of its earlier formats
  const p=JSON.parse(localStorage.getItem(PEND_KEY)||'null');
  if(!p)return{};
  if(p.tabs)return p.tabs;
  if(p.base&&p.mine)return{old:{at:p.at,d:pdiff(noWB(p.base),noWB(p.mine))}}; // earlier single-slot formats
  if(Array.isArray(p.d))return{old:p};

function pendKeys(){const r=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(PEND_PRE)===0)r.push(k);}return r;}

  pend.forEach(s=>{if(s.id===TAB_ID)return;const k=PEND_PRE+s.id;try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v&&v.at===s.at)localStorage.removeItem(k);}catch(e){}});

   again — at about 0.05, 0.25, 0.6, 1.2, 2, 3 and 4 s, giving up after ~5 s — and only then "can't tell" (''). The screen

async function backupNow(reason){

    body:JSON.stringify({reason:reason+' · '+whoTag(),orders_count:n,payload:{orders:DB.orders,nid:DB.nid,settings:bakSettings()}})});
  if(!r.ok)throw new Error(bakErrText(r,await r.text().catch(()=>'')));

async function tryDailyBackup(){

  BAK.busy=true;

    const b=await backupNow('daily');

  }
}

let viewTimer=null;
/* "New version available": a HEAD request (no download) asks the server when index.html last changed;
   if that's newer than the copy this tab is running, offer a one-tap reload. */
let SEEN_ETAG=null;
async function checkNewVersion(){
  try{
    if(!/^https?:$/.test(location.protocol))return;
    const r=await fetch(location.pathname+'?v='+Date.now(),{method:'HEAD',cache:'no-store'});
    if(!r||!r.ok)return;
    const lm=r.headers.get('last-modified'),et=r.headers.get('etag');
    let newer=false;
    if(lm){const a=Date.parse(lm),b=Date.parse(document.lastModified);newer=!!(a&&b&&a-b>60000);}
    else if(et){if(SEEN_ETAG===null)SEEN_ETAG=et;else newer=et!==SEEN_ETAG;}
    const vb=document.getElementById('verbar');
    if(newer&&vb&&vb.hidden){vb.hidden=false;vb.onclick=()=>{writePend();location.reload();};}
  }catch(e){}
}
function startAutoRefresh(){
  clearInterval(viewTimer);
  lsStart(); // V2 lists poll on their own timer; does nothing with the switch off
  if(['floor','driver','saw','stores','office','dash','pm','prod','design'].includes(ROLE)){
    viewTimer=setInterval(()=>{

      if(drvUploading)return; // never interrupt a photo upload (unsaved edits are merged by loadDB, not skipped)
      if(typeof IMPPLAN!=='undefined'&&(IMPPLAN||PEND))return; // an import review in progress must never be wiped by a refresh

  document.getElementById('btn-reestimate')?.addEventListener('click',()=>{
    let count=0;
    DB.orders.forEach(o=>{if(o.hoursEstimated){o.hours=estimateHours(o.value);count++;}});
    sched();toast(count+' orders re-estimated');render();
  });

  document.getElementById('btn-save-cap')?.addEventListener('click',()=>{
    const newWcap=parseFloat(document.getElementById('s-wcap')?.value);
    const newVcap=parseFloat(document.getElementById('s-vcap')?.value);
    if(newWcap>0)WCAP=newWcap;
    if(newVcap>0)VCAP=newVcap;
    sched();
    toast('Capacity updated ✓');
  });
}

/* ---------- Manual grouping of work orders on the capacity board ---------- */
function grpMembers(gid){return DB.orders.filter(o=>o.grp===gid);}
function cleanGroups(){
  DB.grps=DB.grps||{};
  const counts={};
  DB.orders.forEach(o=>{if(o.grp)counts[o.grp]=(counts[o.grp]||0)+1;});
  // dissolve groups that lost their members (deleted, excluded on import, ungrouped down to one)
  Object.keys(DB.grps).forEach(g=>{
    if(!counts[g]||counts[g]<2){
      DB.orders.forEach(o=>{if(o.grp===g)delete o.grp;});
      delete DB.grps[g];
    }
  });
  DB.orders.forEach(o=>{if(o.grp&&!DB.grps[o.grp])delete o.grp;});
}
// IDs made on two screens at the same moment must never collide (a shared counter would) — time + random.
function uniqId(p){return p+Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).slice(2,5).toUpperCase();}
function makeGroup(){
  const members=DB.orders.filter(o=>grpSel.has(o.wo));
  if(members.length<2){toast('Select at least 2 work orders to group');return;}
  let gid=uniqId('G');while(DB.grps&&DB.grps[gid])gid=uniqId('G');
  DB.grps=DB.grps||{};
  DB.grps[gid]={title:members[0].title||members[0].wo};
  members.forEach(o=>{o.grp=gid;});
  cleanGroups();
  grpSel.clear();expGrps.add(gid);
  sched();render();
  toast(members.length+' work orders grouped — click the title to rename');
}
function ungroupG(gid){
  DB.orders.forEach(o=>{if(o.grp===gid)delete o.grp;});
  if(DB.grps)delete DB.grps[gid];
  sched();render();toast('Ungrouped');
}

function renderBoard(app){
  cleanGroups();

  if(srch){const q=srch.toLowerCase();orders=orders.filter(o=>(o.title||'').toLowerCase().includes(q)||String(o.wo||'').toLowerCase().includes(q)||(o.customer||'').toLowerCase().includes(q)||String(o.floor||'').toLowerCase().includes(q)||String(o.unit||'').toLowerCase().includes(q));}
  // Per-column contains filters — all applied together (AND), like Excel column filters
  const colVal=(o,k)=>{
    switch(k){
      case 'wo':return o.wo||'';
      case 'floor':return String(o.floor||'');
      case 'unit':return String(o.unit||'');
      case 'title':return o.title||'';
      case 'customer':return o.customer||'';
      case 'hours':return String(o.hours);
      case 'dueDate':return (o.dueDate||'')+' '+(o.dueDate?fmt(o.dueDate)+' wk'+wkNum(o.dueDate):'');
      case 'value':return String(Math.round(o.value||0));
      case 'step':return o.step||'';
      case 'plannedWeek':return o.plannedWeek?(o.plannedWeek+' '+wkLbl(o.plannedWeek)):'unscheduled';
    }
    return '';
  };
  Object.keys(colF).forEach(k=>{
    const q=String(colF[k]||'').trim().toLowerCase();
    if(q)orders=orders.filter(o=>colVal(o,k).toLowerCase().includes(q));

  const nColF=Object.keys(colF).filter(k=>String(colF[k]||'').trim()).length;

    let av=a[sortCol]||'',bv=b[sortCol]||'';

    if(sortCol==='plannedWeek'){if(!av)av='9999-99-99';if(!bv)bv='9999-99-99';} // unscheduled last
    if(av<bv)return -sortDir;
    if(av>bv)return sortDir;
    // Secondary: group same customer together
    const ac=(a.customer||'').toLowerCase(),bc=(b.customer||'').toLowerCase();
    if(ac<bc)return -1;
    if(ac>bc)return 1;
    // Tertiary: due date

  });

  // Collapse grouped orders into one item at the position of their first member

  const grpRowHTML=(gid,sep)=>{

      <span>Total value: <strong>${fmtVal(PO.reduce((a,o)=>a+(o.value||0),0))}</strong></span>
      ${(()=>{const weeks=get8Wks();const overH=weeks.filter(w=>wkHrs(w)>wkCap(w));const overV=weeks.filter(w=>wkVal(w)>VCAP);return overH.length>0?'<span style="color:var(--red);font-weight:600">⚠ '+overH.length+' week'+(overH.length!==1?'s':'')+' over hours capacity</span>':'';})()}
      ${(()=>{const weeks=get8Wks();const overV=weeks.filter(w=>wkVal(w)>VCAP);return overV.length>0?'<span style="color:var(--red);font-weight:600">⚠ '+overV.length+' week'+(overV.length!==1?'s':'')+' over value capacity</span>':'';})()}
    </div>
  </div>
  ${grpSel.size?`<div class="grp-bar">
    <b>${grpSel.size} selected</b><span>${Math.round(selH*10)/10}h · €${Math.round(selV).toLocaleString()}</span>
    <button class="btn btn-g" id="btn-mkgrp" style="padding:6px 14px">Group into one line</button>
    <button id="btn-gclear" style="background:none;border:none;color:#bcd0f0;text-decoration:underline;cursor:pointer;font-size:12px">clear</button>
  </div>`:''}
  </div>`;

  // Bind events
  document.querySelectorAll('[data-wk]').forEach(el=>el.onclick=()=>{fWeek=fWeek===el.dataset.wk?'':el.dataset.wk;render();});
  document.querySelectorAll('.wk-cap-inp').forEach(inp=>{
    inp.onclick=e=>e.stopPropagation(); // prevent week filter toggle
    inp.onchange=function(){
      const wk=this.dataset.wkC;
      const v=parseInt(this.value)||WCAP;
      if(!DB.weekCaps)DB.weekCaps={};
      if(v===WCAP)delete DB.weekCaps[wk]; // reset to default
      else DB.weekCaps[wk]=v;
      sched();render();
    };
  });
  const si=document.getElementById('srch');
  if(si)si.oninput=function(){
    srch=this.value;const pos=this.selectionStart;render();
    const n=document.getElementById('srch');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
  };
  const fw=document.getElementById('fwk');if(fw)fw.onchange=function(){fWeek=this.value;render();};
  const fc=document.getElementById('fcust');if(fc)fc.onchange=function(){fCust=this.value;render();};
  const cf=document.getElementById('btn-clf');if(cf)cf.onclick=()=>{fWeek='';fCust='';srch='';fDel=false;fLate=false;colF={};render();};
  // Column filters — keep typing focus across re-renders
  document.querySelectorAll('.cf-inp').forEach(inp=>inp.oninput=function(){
    colF[this.dataset.cf]=this.value;
    cfFocus={k:this.dataset.cf,pos:this.selectionStart};
    render();
  });
  const cfc=document.getElementById('btn-cfclear');if(cfc)cfc.onclick=()=>{colF={};render();};
  if(cfFocus){
    const el=document.querySelector('.cf-inp[data-cf="'+cfFocus.k+'"]');
    if(el){el.focus();try{el.setSelectionRange(cfFocus.pos,cfFocus.pos);}catch(e){}}
    cfFocus=null;
  }
  const fd=document.getElementById('btn-fdel');if(fd)fd.onclick=()=>{fDel=!fDel;render();};
  const gs=document.getElementById('go-ship');if(gs)gs.onclick=e=>{e.preventDefault();showTab('h');};
  const fl=document.getElementById('btn-flate');if(fl)fl.onclick=()=>{fLate=!fLate;render();};
  // Planner-created work orders: P-numbered, same workflow as Cienapps jobs, immune to imports
  const pwb=document.getElementById('btn-pwo');
  if(pwb)pwb.onclick=()=>{const f=document.getElementById('pwo-form');f.style.display=f.style.display==='none'?'':'none';if(f.style.display!=='none')document.getElementById('pwo-title').focus();};
  const pwc=document.getElementById('pwo-cancel');if(pwc)pwc.onclick=()=>{document.getElementById('pwo-form').style.display='none';};
  const pwa=document.getElementById('pwo-add');
  if(pwa)pwa.onclick=()=>{
    const g=id=>(document.getElementById(id)?.value||'').trim();
    const title=g('pwo-title'),due=g('pwo-due');
    if(!title){toast('Give the work order a title');document.getElementById('pwo-title').focus();return;}
    if(!due){toast('Set the due date — it drives cutting deadlines and the delivery plan');document.getElementById('pwo-due').focus();return;}
    let num=Math.max(1000,...DB.orders.map(o=>{const m=String(o.wo).match(/^P-(\d+)$/);return m?+m[1]:0;}))+1;
    while(DB.orders.some(o=>o.wo==='P-'+num))num++;
    const wo='P-'+num;
    const val=parseFloat(g('pwo-val'))||0;
    let hours=parseFloat(g('pwo-hrs')),hoursEstimated=false;
    if(isNaN(hours)||hours<=0){hours=estimateHours(val);hoursEstimated=true;}
    DB.orders.push({wo,ref:'',floor:g('pwo-floor'),unit:g('pwo-unit'),title,customer:g('pwo-cust'),hours,hoursEstimated,
      dueDate:due,origDueDate:due,step:'Planner WO',salesRep:'',orderNo:'',value:val,plannedWeek:wkKey(new Date(due)),notes:'',colour:'',log:[{at:nowISO(),by:whoNow(),what:'Work order created in the planner'}]});
    orig[wo]='';origStep[wo]='Planner WO';
    sched();render();toast(wo+' created — scheduled to its due-date week ✓ · add its cutting list in 📋 Cutting Lists → ✍ Type a list');
  };
  // Delivery tag toggle — in place, no re-render, so the list doesn't jump while reviewing
  document.querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>{
    const o=DB.orders.find(x=>x.wo===b.dataset.dv);if(!o)return;
    o.delv=!o.delv;delvMark(o);
    if(!o.delv){o.delVeh='';o.delDay='';o.delDone=false;}
    b.className='dvbtn'+(o.delv?' on':'');
    b.title=o.delv?'On the delivery board — click to untag':'Put on the delivery board';
    updDelBadge();sched();
    if(o.delv)showReadiness([o.wo],'put on the delivery board'); // list status the moment it's scheduled
  });
  // Grouping
  document.querySelectorAll('[data-gsel]').forEach(cb=>cb.onchange=function(){
    this.checked?grpSel.add(this.dataset.gsel):grpSel.delete(this.dataset.gsel);
    render();
  });
  document.querySelectorAll('[data-gselg]').forEach(cb=>cb.onchange=function(){
    const ms=grpMembers(this.dataset.gselg).map(o=>o.wo);
    this.checked?ms.forEach(w=>grpSel.add(w)):ms.forEach(w=>grpSel.delete(w));
    render();
  });
  const ga=document.getElementById('gselall');
  if(ga)ga.onchange=function(){
    // select/deselect every order currently shown (after all filters) — filter first, tick once, group
    this.checked?orders.forEach(o=>grpSel.add(o.wo)):orders.forEach(o=>grpSel.delete(o.wo));
    render();
  };
  const mg=document.getElementById('btn-mkgrp');if(mg)mg.onclick=makeGroup;
  const gc=document.getElementById('btn-gclear');if(gc)gc.onclick=()=>{grpSel.clear();render();};
  document.querySelectorAll('[data-gtog]').forEach(el=>el.onclick=()=>{
    const g=el.dataset.gtog;
    expGrps.has(g)?expGrps.delete(g):expGrps.add(g);
    render();
  });
  document.querySelectorAll('[data-gtitle]').forEach(inp=>inp.oninput=function(){
    if(DB.grps&&DB.grps[this.dataset.gtitle]){DB.grps[this.dataset.gtitle].title=this.value;sched();}
  });
  document.querySelectorAll('[data-gwsel]').forEach(sel=>sel.onchange=function(){
    if(this.value==='__MIX')return;
    const ms=grpMembers(this.dataset.gwsel),v=this.value;
    officeWho(by=>{
      ms.forEach(o=>{logEdit(o,'Build week '+(o.plannedWeek?wkLbl(o.plannedWeek):'unscheduled')+' → '+(v?wkLbl(v):'unscheduled')+' (group)',by);o.plannedWeek=v;});
      sched();render();
      toast(ms.length+' work orders moved to '+(v?wkLbl(v):'Unscheduled'));
    },()=>render());
  });
  document.querySelectorAll('[data-gdv]').forEach(b=>b.onclick=()=>{
    const ms=grpMembers(b.dataset.gdv);
    const on=!ms.every(o=>o.delv);
    ms.forEach(o=>{o.delv=on;delvMark(o);if(!on){o.delVeh='';o.delDay='';o.delDone=false;}});
    updDelBadge();sched();render();
    if(on)showReadiness(ms.map(o=>o.wo),'group put on the delivery board');
    else toast('Group untagged');
  });
  document.querySelectorAll('[data-gun]').forEach(b=>b.onclick=()=>ungroupG(b.dataset.gun));
  document.querySelectorAll('[data-grm]').forEach(b=>b.onclick=()=>{
    const o=DB.orders.find(x=>x.wo===b.dataset.grm);
    if(o){delete o.grp;cleanGroups();sched();render();toast(o.wo+' taken out of the group');}
  });
  const sn=document.getElementById('btn-snap');if(sn)sn.onclick=exportSnapshot;
  const ca=document.getElementById('btn-clearall');
  if(ca)ca.onclick=async()=>{
    const typed=prompt('This deletes ALL '+DB.orders.length+' orders from the planner. A safety backup is saved to the database first.\n\nType DELETE to confirm:');
    if(typed!=='DELETE'){if(typed!==null)toast('Not deleted — you must type DELETE');return;}
    if(!await backupFirst('Clear all orders'))return;
    DB.orders=[];DB.grps={};grpSel.clear();
    if(V2())lists().forEach(l=>(l.wos||[]).forEach(w=>listTag(l,w,false)));else lists().forEach(l=>{l.wos=[];});
    Object.keys(orig).forEach(k=>delete orig[k]);Object.keys(origStep).forEach(k=>delete origStep[k]);
    sched();render();toast('All orders cleared');
  };
  document.querySelectorAll('[data-s]').forEach(th=>th.onclick=()=>{const s=th.dataset.s;if(sortCol===s)sortDir*=-1;else{sortCol=s;sortDir=1;}render();});
  // Every board edit is stamped with the person at this machine (asked once per tab)
  document.querySelectorAll('[data-wsel]').forEach(sel=>sel.onchange=function(){const o=DB.orders.find(x=>x.wo===this.dataset.wsel);const v=this.value;if(o)officeWho(by=>{const was=o.plannedWeek||'';o.plannedWeek=v;logEdit(o,'Build week '+(was?wkLbl(was):'unscheduled')+' → '+(v?wkLbl(v):'unscheduled'),by);sched();render();},()=>render());});
  document.querySelectorAll('[data-stepsel]').forEach(sel=>sel.onchange=function(){const o=DB.orders.find(x=>x.wo===this.dataset.stepsel);const v=this.value;if(o)officeWho(by=>{logEdit(o,'Step '+(o.step||'—')+' → '+v,by);o.step=v;sched();render();toast('Step updated');},()=>render());});
  document.querySelectorAll('[data-hl]').forEach(el=>el.onclick=function(){const o=DB.orders.find(x=>x.wo===this.dataset.hl);if(o){o.hl=!o.hl;sched();render();}});
  document.querySelectorAll('[data-hi]').forEach(inp=>inp.onchange=function(){const o=DB.orders.find(x=>x.wo===this.dataset.hi);const v=parseFloat(this.value)||0;if(o)officeWho(by=>{logEdit(o,'Hours '+o.hours+' → '+v,by);o.hours=v;o.hoursEstimated=false;o.hoursSrc='hand';sched();render();},()=>render());});
  document.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>{
    if(!confirm('Delete '+btn.dataset.del+' from the planner?'))return;
    officeWho(by=>{
    if(!V2())(DB.holdLog=DB.holdLog||[]).push({at:nowISO(),act:'wo-deleted',list:btn.dataset.del,proj:'',n:0,m:'',by});
    DB.orders=DB.orders.filter(o=>o.wo!==btn.dataset.del);
    delete orig[btn.dataset.del];delete origStep[btn.dataset.del];
    lists().forEach(l=>{if((l.wos||[]).includes(btn.dataset.del))listTag(l,btn.dataset.del,false,by);}); // release cutting-list tags
    cleanGroups();
    sched();render();toast('Order removed');
    });
  });
  // Drag & drop to swap weeks
  const tbody=document.getElementById('tbody');
  if(tbody){
    tbody.querySelectorAll('tr[draggable]').forEach(row=>{
      row.ondragstart=e=>{dragSrc=row;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';};
      row.ondragend=()=>{row.classList.remove('dragging');tbody.querySelectorAll('tr').forEach(r=>r.classList.remove('drag-over'));};
      row.ondragover=e=>{e.preventDefault();row.classList.add('drag-over');};
      row.ondragleave=()=>row.classList.remove('drag-over');
      row.ondrop=e=>{
        e.preventDefault();row.classList.remove('drag-over');
        if(dragSrc&&dragSrc!==row){
          const a=DB.orders.find(o=>o.wo===dragSrc.dataset.wo),b=DB.orders.find(o=>o.wo===row.dataset.wo);
          if(a&&b)officeWho(by=>{[a.plannedWeek,b.plannedWeek]=[b.plannedWeek,a.plannedWeek];logEdit(a,'Build week swapped with '+b.wo,by);logEdit(b,'Build week swapped with '+a.wo,by);sched();render();toast('Swapped: '+a.wo+' ↔ '+b.wo);});
        }
      };
    });
  }
}

/* ---------- 📦 Shipped tab: jobs Cienapps calls shipped/invoiced. Off the Capacity Board, kept here until the
   planner marks installation complete. Searchable; a job can be brought back to the board. Works on a phone (Chrome). ---------- */
let shSrch='',shDel='',shDone=false,shHoldQ='';
function renderShipped(app){
  const am=attnMap();
  const all=DB.orders.filter(isShipped);
  let os=all.filter(o=>shDone||!o.completeAt);
  if(shDel==='yes')os=os.filter(o=>dStage(o)==='deliv');else if(shDel==='no')os=os.filter(o=>dStage(o)!=='deliv');
  if(shSrch){const q=shSrch.toLowerCase();os=os.filter(o=>[o.wo,o.title,o.customer,o.floor,o.unit].some(v=>String(v||'').toLowerCase().includes(q)));}
  os.sort((a,b)=>String(b.shippedAt||'').localeCompare(String(a.shippedAt||''))||woCmp(a,b));
  const shown=os.slice(0,300);
  const dt=s=>s?new Date(s).toLocaleDateString('en-IE',{day:'numeric',month:'short'}):'—';
  const nDone=all.filter(o=>o.completeAt).length;
  const held=DB.orders.filter(o=>isOnHold(o)&&!isShipped(o));
  const hs=shHoldQ?held.filter(o=>[o.wo,o.title,o.customer,o.floor,o.unit].some(v=>String(v||'').toLowerCase().includes(shHoldQ.toLowerCase()))):held;
  const card=o=>{
    const deliv=dStage(o)==='deliv',w=am.get(o.wo)||0,fu=[o.floor,o.unit].filter(Boolean).join(' · ');
    return `<div class="sh-card${o.completeAt?' sh-done':''}">
      <div class="sh-top"><span class="wo-num">${escA(o.wo)}</span>${fu?`<span class="fu-badge">${escA(fu)}</span>`:''}${addBadge(o)}
        <span class="sh-pill ${deliv?'ok':'no'}">${deliv?'✓ Delivered '+dt(o.delDelivAt):(o.delDispAt?'🚚 On the road':o.delv?'🚚 On Deliveries':'Not delivered')}</span>
        ${w?`<span class="sh-pill warn" title="Waiting (N/A) lines on its cutting/fittings lists — also shown on the Capacity Board">⚠ ${w} waiting</span>`:''}</div>
      <div class="sh-t">${escA(o.title||'')}</div>
      <div class="sh-m">${escA(o.customer||'')} · shipped ${dt(o.shippedAt)} · Cienapps: ${escA(String(o.cienStep||o.shippedStep||o.step||'—').replace(/^\d+\.\s*/,''))}</div>
      ${o.installedAt&&!o.completeAt?`<div class="sh-m" style="color:#0d6e46;font-weight:700">✓ Installed (Cienapps) ${dt(o.installedAt)} — to be invoiced</div>`:''}
      ${o.completeAt?`<div class="sh-m" style="color:#0d6e46;font-weight:700">✓ Installation complete ${dt(o.completeAt)}${o.completeBy?' — '+escA(o.completeBy):''}</div>`:''}
      <div class="sh-b">
        ${o.completeAt?`<button class="btn btn-s" data-shu="${escA(o.wo)}">Undo complete</button>`:`<button class="btn btn-g" data-shc="${escA(o.wo)}">✓ Installation complete</button>`}
        <button class="btn btn-s" data-shb="${escA(o.wo)}">↩ Bring back to board</button>
      </div>
    </div>`;
  };
  app.innerHTML=`<div class="pg">
    <div class="sh-bar">
      <input class="search-input" id="sh-q" placeholder="Search WO, title, customer, unit…" value="${escA(shSrch)}">
      <select class="filter-sel" id="sh-del">
        <option value=""${shDel===''?' selected':''}>Delivered: all</option>
        <option value="yes"${shDel==='yes'?' selected':''}>Delivered: yes</option>
        <option value="no"${shDel==='no'?' selected':''}>Delivered: no</option>
      </select>
      <label class="sh-chk"><input type="checkbox" id="sh-done"${shDone?' checked':''}> Show completed (${nDone})</label>
    </div>
    <div style="font-size:12px;color:var(--t2);margin:2px 0 10px">${os.length} shown · ${all.length} shipped in total. Shipped jobs are off the Capacity Board and out of the week totals; jobs on a van stay on 🚚 Deliveries until the driver confirms.</div>
    ${shown.length?shown.map(card).join(''):`<div class="empty">${all.length?'No shipped jobs match.':'No shipped jobs yet — they arrive here when a Cienapps import says shipped or invoiced.'}</div>`}
    ${os.length>shown.length?`<div style="font-size:12px;color:var(--t3);padding:6px 0">…and ${os.length-shown.length} more — search to narrow down</div>`:''}
    <div id="sh-hold" style="margin-top:22px;border-top:2px solid var(--b2);padding-top:12px">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px">⏸ On hold in Cienapps <span id="sh-hcnt" style="font-weight:400;color:var(--t2)">(${held.length})</span></div>
      <div style="font-size:12px;color:var(--t2);margin-bottom:8px">Step 12 ON HOLD / DELETE. Off the Capacity Board, week totals and capacity — never deleted. The next import with any other step puts the job back on the board.</div>
      ${held.length?`<input class="search-input" id="sh-hq" placeholder="Search on-hold jobs…" value="${escA(shHoldQ)}" style="margin-bottom:8px">`:''}
      ${hs.length?hs.slice(0,300).map(o=>`<div class="sh-card"><div class="sh-top"><span class="wo-num">${escA(o.wo)}</span>${[o.floor,o.unit].filter(Boolean).length?`<span class="fu-badge">${escA([o.floor,o.unit].filter(Boolean).join(' · '))}</span>`:''}<span class="sh-pill no">⏸ On hold</span>${(am.get(o.wo)||0)?`<span class="sh-pill warn" title="Waiting (N/A) lines on its cutting/fittings lists">⚠ ${am.get(o.wo)} line${am.get(o.wo)!==1?'s':''} waiting</span>`:''}${!delHidden(o)&&o.delv?'<span class="sh-pill warn">🚚 Already loaded / on a van</span>':''}</div>
        <div class="sh-t">${escA(o.title||'')}</div><div class="sh-m">${escA(o.customer||'')} · on hold since ${dt(o.holdAt)} · ${o.hours!=null?escA(String(o.hours))+'h · ':''}due ${fmt(o.dueDate)}</div>${o.holdDel?`<div class="sh-m">Taken off Deliveries when it went on hold (was ${escA(o.holdDel)}) — not put back automatically</div>`:''}</div>`).join(''):`<div class="empty">${held.length?'No on-hold jobs match.':'No jobs on hold.'}</div>`}
    </div>
  </div>`;
  const hq=document.getElementById('sh-hq');
  if(hq)hq.oninput=function(){shHoldQ=this.value;const pos=this.selectionStart;render();const n=document.getElementById('sh-hq');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}};
  const q=document.getElementById('sh-q');
  if(q)q.oninput=function(){shSrch=this.value;const pos=this.selectionStart;render();const n=document.getElementById('sh-q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}};
  const sd=document.getElementById('sh-del');if(sd)sd.onchange=function(){shDel=this.value;render();};
  const sc=document.getElementById('sh-done');if(sc)sc.onchange=function(){shDone=this.checked;render();};
  const find=wo=>DB.orders.find(x=>x.wo===wo);
  app.querySelectorAll('[data-shc]').forEach(b=>b.onclick=()=>{const o=find(b.dataset.shc);if(!o)return;
    officeWho(by=>{o.completeAt=nowISO();o.completeBy=by;delete o.completeOverride;logEdit(o,'Installation complete',by);sched();render();toast(o.wo+' — installation complete ✓');});});
  app.querySelectorAll('[data-shu]').forEach(b=>b.onclick=()=>{const o=find(b.dataset.shu);if(!o)return;
    officeWho(by=>{delete o.completeAt;delete o.completeBy;o.completeOverride=o.cienStep||o.shippedStep||o.step||'(none)';logEdit(o,'Installation complete undone',by);sched();render();});});
  app.querySelectorAll('[data-shb]').forEach(b=>b.onclick=()=>{const o=find(b.dataset.shb);if(!o)return;
    if(!confirm('Bring '+o.wo+' back to the Capacity Board?\n\nIt stays there even though Cienapps says shipped — until Cienapps moves it on (e.g. to invoiced).'))return;
    officeWho(by=>{o.shipBack={at:nowISO(),by,cs:o.cienStep||o.shippedStep||''};delete o.shippedAt;delete o.completeAt;delete o.completeBy;logEdit(o,'Brought back to the board from Shipped',by);sched();render();toast(o.wo+' is back on the Capacity Board');});});
}

/* ---------- Deliveries: plan next week's deliveries by vehicle and day (v2) ---------- */
const DEL_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
const DEL_VEH=[
  {k:'ARTIC',  n:'Artic',        cat:'Artic', sub:''},
  {k:'VOLVO',  n:'Volvo',        cat:'Truck', sub:''},
  {k:'RENAULT',n:'Renault',      cat:'Truck', sub:''},
  {k:'IVECO',  n:'Iveco',        cat:'Truck', sub:''},
  {k:'CRAFTER',n:'Crafter',      cat:'Truck', sub:''},
  {k:'SMART',  n:'Smart Movers', cat:'Truck', sub:'external haulier'}
];
const vehLbl=k=>{const v=DEL_VEH.find(x=>x.k===k);return v?v.n:'';};
let delDragList=null,delFilter='';
const delSel=new Set();

/* On hold in Cienapps (12): off the Deliveries board and badge. A job already loaded / on the road / delivered stays —
   it is physically on a van and the driver must not lose it. */
function delHidden(o){return isOnHold(o)&&!o.delLoadedAt&&!o.delDispAt&&!o.delDelivAt&&!o.delDone;}
/* Planner overrides an import respects until the Cienapps step moves beyond the step they were made at:
   delvOverride — untagged from delivery by hand (stops the 7/8 auto-tag); completeOverride — "Undo complete" (stops 11 re-completing). */
function delvMark(o){if(o.delv)delete o.delvOverride;else o.delvOverride=o.step||o.cienStep||'(none)';}
function ovrHolds(ov,cs){if(!ov)return false;const a=stepRank(cs),b=stepRank(ov);return !(a!==null&&b!==null&&a>b);}
function delAll(){return[...DB.orders.filter(o=>o.delv&&!delHidden(o)),...(DB.delx||[])];}
function findDel(wo){return DB.orders.find(o=>o.wo===wo)||(DB.delx||[]).find(o=>o.wo===wo);}
function woCmp(a,b){
  const na=(String(a.wo).match(/\d+/g)||[]).map(Number),nb=(String(b.wo).match(/\d+/g)||[]).map(Number);
  for(let i=0;i<Math.max(na.length,nb.length);i++){
    const x=i<na.length?na[i]:-1,y=i<nb.length?nb[i]:-1;
    if(x!==y)return x-y;
  }
  return String(a.wo).localeCompare(String(b.wo));
}
function dayVal(d){return delAll().filter(o=>o.delDay===d).reduce((a,o)=>a+(+o.value||0),0);}

// Part-load guard: other live jobs for the SAME unit (or same board group) that are NOT dispatched and NOT in this load
function partLoadGaps(jobs){
  const inLoad=new Set(jobs.map(j=>j.wo));
  const gaps=[];const seen=new Set();
  jobs.forEach(j=>{
    const rel=DB.orders.filter(o=>{
      if(inLoad.has(o.wo)||seen.has(o.wo))return false;
      if(o.delDispAt||o.delDelivAt||o.delDone||(isShipped(o)&&!o.delv)||isOnHold(o))return false;
      const sameUnit=j.orderNo&&o.orderNo===j.orderNo&&j.unit&&o.unit===j.unit&&!/multiple/i.test(j.unit||'');
      const sameGrp=j.grp&&o.grp===j.grp;
      return sameUnit||sameGrp;
    });
    rel.forEach(o=>{seen.add(o.wo);gaps.push({forWo:j.wo,unit:[j.floor,j.unit].filter(Boolean).join(' '),wo:o.wo,title:o.title});});
  });

}
function confirmPartLoad(jobs){
  const gaps=partLoadGaps(jobs);

  const lines=gaps.slice(0,12).map(g=>'  • '+g.wo+' — '+(g.title||'').slice(0,40)+'  (same unit/group as '+g.forWo+')');
  return confirm('⚠ PART-LOAD WARNING\n\nThe following jobs belong to the same unit or group as jobs on this load, but are NOT dispatched and NOT on this van:\n\n'+lines.join('\n')+(gaps.length>12?'\n  …and '+(gaps.length-12)+' more':'')+'\n\nSend the load anyway WITHOUT them?');
}

/* ---------- Stage 3 lists store — ONLY when V2(); with the switch off none of this runs and nothing is fetched ----------

   LST holds exactly what the database last said; this device's unsent changes (LQ, the line queue) are laid over it

async function lsGet1(q){
  const r=await fetch(SUPA_URL+'/'+q,{headers:SUPA_HDR});const d=await r.json().catch(()=>null);
  if(!r.ok||!Array.isArray(d))throw new Error('lists load failed: '+r.status+' '+JSON.stringify(d).slice(0,120));

// Supabase answers at most 1,000 rows per request ("Max rows"): read in pages, in a fixed order, until a short page
const LS_PAGE=1000;
async function lsGet(q){
  const base=q+(/[?&]order=/.test(q)?'':(q.includes('?')?'&':'?')+'order=id.asc')+(q.includes('?')||/[?&]order=/.test(q)?'&':'?');
  const out=[];
  for(let off=0;;off+=LS_PAGE){const d=await lsGet1(base+'limit='+LS_PAGE+'&offset='+off);out.push(...d);if(d.length<LS_PAGE)break;}
  return out;
}
// Keep a database row unless we already hold that version or a newer one (the 30-second overlap re-sends rows we have)
function lsPut(t,rows,part){
  const M=LST[LS_T[t]];let n=0;
  (rows||[]).forEach(r=>{
    if(!r||r.id==null)return;
    if(t==='list_lines'&&!LST.full.has(r.list_id))return; // lines of a list not loaded yet come with the whole list when it's opened
    if(r.updated_at&&!part&&(!LST.since[t]||r.updated_at>LST.since[t]))LST.since[t]=r.updated_at; // the database's clock, never this device's
    const o=M.get(r.id);
    if(o&&((+o.version||0)>(+r.version||0)||((+o.version||0)===(+r.version||0)&&!o._part)))return;
    M.set(r.id,part?{...(o||{}),...r,_part:true}:r);n++;
  });

}
function lsFinishedRow(r){return !!(r.archived||r.is_template)||listFinished(lsAdapt(r));}
async function lsLines(ids){
  ids=[...new Set(ids)].filter(id=>!LST.full.has(id));

    const ch=ids.slice(i,i+60);
    const rows=await lsGet('list_lines?select=*&list_id=in.('+ch.map(id=>'"'+encodeURIComponent(id)+'"').join(',')+')');
    ch.forEach(id=>{if(LST.l.has(id))LST.full.add(id);});lsPut('list_lines',rows);LST.gen++; // only lists we know: an unknown id is fetched again later

}
async function lsLoad(){

function lsReset(){['l','ln','p','m','s'].forEach(k=>LST[k].clear());LST.full.clear();LST.since={};LST.loaded=false;LST.gen++;}

async function lsPoll(){

  LST.polling=true;let n=0;

      const s=LST.since[t]||LST.since.lists;
      n+=lsPut(t,await lsGet(t+'?select=*'+(s?'&updated_at=gt.'+encodeURIComponent(new Date(Date.parse(s)-30000).toISOString()):'')+'&order=updated_at,id')); // id breaks ties: rows changed in one transaction share updated_at, and paging must not skip or repeat them
    }

    if(need.length){await lsLines(need);n++;}

function lsRedraw(){mergedRender();} // the same rule as a merge: never redraw under someone's fingers or over an open dialog
function lsWantMs(){return ROLE==='saw'||ROLE==='stores'||ROLE==='design'||(ROLE==='office'&&tab==='l')||(ROLE==='prod'&&prodTab==='lists')?10000:60000;}
function lsStart(){ // own timer, separate from the planner refresh; off (and silent) unless V2()
  if(!V2()){if(LST.timer){clearInterval(LST.timer);LST.timer=null;}if(LQ.q.length)lqFoldV1();return;}
  const ms=lsWantMs();

/* Read adapters: the new rows in the shapes today's screens already use, so the saw/stores/board code is unchanged. */

function lsAdapt(r){

// One cache per (database copy, queue) generation — rebuilt only when either changes
function lsCache(){
  const k=LST.gen+'|'+LQ.gen;if(LST.c&&LST.ck===k)return LST.c;

function lsList(id){return lsCache().byId.get(id)||null;}
function lsView(id,open){ // rows / ticks / holds of one list, in the old shapes (build notes c and e)

// A unit heading (a heading line whose qty is the number of units) as the saw sees it: "900 Single Rail + 2 shelves – 3 units"

/* ---------- Line queue (V2 only): every tick / N/A / release / sign-off / tag waits on THIS device until the database has it ----------

   again when the connection comes back. Each tap has its own id (cid): a resend after a lost reply only counts once. */
const LQ={q:[],gen:0,fly:new Set(),busy:false,t:null,iv:null,err:'',msgs:[],memOnly:false,solo:0};
function lqRead(){try{const v=JSON.parse(localStorage.getItem('wpfLineQ')||'[]');return Array.isArray(v)?v:[];}catch(e){return LQ.q.slice();}}

function lqLine(lineId,st,by){

      if(sv==='over'){LQ.err='';updSaveBar();lqKick(0);return 0;}

// Save the planner and say whether THIS save reached the database: true / false / 'over' (landed, but another screen
// saved over it before this screen heard back). A save already in flight is waited for first,
// because saveDB only queues another one behind it and returns straight away.
async function lqSaveSure(){
  LQ.sentU=null;
  for(let i=0;i<600&&SAVING;i++)await new Promise(r=>setTimeout(r,100));
  if(SAVING)return false;
  const pre=new Set(UNSURE),ov=SAVE_OVERS;
  clearTimeout(saveT);await saveDB();
  const ok=!DB.saveFailed&&!DB.remoteBroken&&!DB.loadFailed;
  if(!ok){const nu=UNSURE.filter(p=>!pre.has(p));LQ.sentU=nu[nu.length-1]||null;} // sent with no reply: may have landed
  else if(SAVE_OVERS!==ov){LQ.sentU=LAST_OVER;return'over';} // landed, but saved over since (reply was lost)
  return ok;
}
// One old-list row's tick and wait in a plan's settings (missing → null), and setting them back
function lqLnSt(s,list,k){s=s||{};const t=((s.listRow||{})[list]||{})[k],h=((s.listHold||{})[list]||{})[k];return{t:t||null,h:h||null};}
function lqLnPut(s,list,k,v){
  s.listRow=s.listRow||{};const t=s.listRow[list]=s.listRow[list]||{};if(v.t)t[k]=clone(v.t);else delete t[k];if(!Object.keys(t).length)delete s.listRow[list];

/* A line a fold sent without a confirmed reply belongs to the queue: a merge or the device copy must not put it back by

   reads what the fold sent, the database copy (ref) is used; the next fold then decides from the database (lqFoldV1x).
   Not while a fold is running — that fold's own save is placing those lines on purpose. */
function lqOwn(s,ref){
  try{
    if(!s||LQ.folding||s.listStore==='v2')return;
    lqRead().forEach(e=>{if(e.t==='line'&&e.fk&&e.fs&&same(lqLnSt(s,e.list,e.fk),e.fs))lqLnPut(s,e.list,e.fk,lqLnSt(ref,e.list,e.fk));});

// Several refused at once (e.g. "Release all"): the first in full, then every other line by name and why (up to 5 named)
function lqWhyAll(bad){
  if(bad.length<2)return lqWhy(bad[0]);
  const why=x=>({stale:'changed on another screen',done:'already done',changed:'changed in a new revision',removed:'taken off the list','not-needed':'marked not needed','not-waiting':'not waiting any more',missing:'no longer on the list','wrong-kind':'is the wrong kind of line for that'})[x.why]||(x.why||'refused');
  const rest=bad.slice(1);
  return lqWhy(bad[0])+' (+'+rest.length+' more: '+rest.slice(0,5).map(x=>'"'+lqPart(x)+'" '+why(x)).join('; ')+(rest.length>5?'; and '+(rest.length-5)+' other line'+(rest.length-5!==1?'s':''):'')+')';
}
function lqSay(m,ok){LQ.msgs.push(m);if(LQ.msgs.length>20)LQ.msgs.shift();toast(m,!ok);} // a warning stays until tapped; ok=true: a short note

// must not send into tables nobody reads. Only the switch is fetched, not the whole plan.
async function lqSwitchNow(){
  const r=await fetch(SUPA_URL+'/production_planner?id=eq.main&select=ls:settings->>listStore',{headers:SUPA_HDR});
  const d=await r.json().catch(()=>null);if(!r.ok||!Array.isArray(d)||!d[0])throw new Error('could not check the lists switch');

async function lqSwitchedOff(sv){ // the database says the lists are not on the new store: reload, then fold the queue in

  if(sv==='v2')return;

  LQ.swTries=0;

  await loadDB();

async function lqSend(){

    if(lqRead().length&&!DB.lastLoadOk&&!LQ.folding){await lqSwitchedOff();return;} // the last refresh was skipped or failed: reload first
    if(lqRead().some(e=>e.fs)&&!LQ.folding){ // an earlier fold got no reply: check against the database as it is now
      for(let i=0;i<100&&SAVING;i++)await new Promise(r=>setTimeout(r,100));
      await loadDB();
      if(!DB.lastLoadOk){LQ.err='could not reload the planner to check changes kept on this device — will try again';updSaveBar();lqKick(10000);return;}
    }
    await lqFoldV1();return;}
  if(!lqRead().length&&!LQ.q.length)return;
  try{const sv=await lqSwitchNow();if(sv!=='v2'){await lqSwitchedOff(sv);return;}}catch(e){LQ.err=(e&&e.message)||'no signal';updSaveBar();return;}

        if(d&&(d.code==='40P01'||d.code==='40001'))throw new Error('busy — will try again'); // deadlock / clash with another save: nothing landed, retry later

        if(r.status===400||r.status===409||r.status===422){lqDrop(cids);lqSay('Not saved — the database refused it ('+String((d&&d.message)||r.status).slice(0,80)+')');continue;}

/* Another office saved this list after this editor opened it. Merge, never overwrite silently:
   - a line only THEY changed keeps their version; a line only they added is kept;
   - only when something of theirs really will be overwritten (both changed it, you removed a line they changed, or

function lsEditMerge(id,rows,lines){
  const r0=rows.find(r=>r.opened);if(!r0)return{ok:true,kept:0};
  const opened=r0.opened,openIds=new Set(String(r0.ids||'').split(',').filter(Boolean));
  const now=lsLinesOf(id).filter(x=>x.removed_rev==null),byId=new Map(now.map(x=>[x.id,x])); // headings too — they are kept in the editor now
  const mine=new Set(rows.filter(r=>r.lid).map(r=>r.lid));
  const nm=x=>(x.part||x.material||'line')+' ×'+(x.qty==null?'':x.qty);
  const asLine=x=>({id:x.id,kind:x.kind,section:x.section,part:x.part,length_mm:x.length_mm,width_mm:x.width_mm,qty:x.qty,unit_qty:x.unit_qty,material:x.material,material_other:!!x.material_other,edging:x.edging,note:x.note});
  const over=[];let kept=0;
  rows.forEach((r,i)=>{
    if(!r.lid||!r.sig)return;
    const x=byId.get(r.lid),meChanged=lsLineSig(lines[i])!==r.sig;
    if(!x){if(lsLinesOf(id).some(y=>y.id===r.lid&&y.removed_rev!=null)){if(meChanged)over.push('they removed '+nm(lines[i])+', which you changed — your save puts it back');else{lines[i]._drop=true;kept++;}}return;} // removed by them, untouched here: stays removed
    if(lsLineSig(x)===r.sig)return;                                  // they didn't change it
    if(!meChanged){lines[i]=asLine(x);kept++;return;}               // only they changed it: keep theirs
    over.push(nm(x)+' was changed on the other screen — yours ('+nm(lines[i])+') replaces it');
  });
  now.forEach(x=>{
    if(mine.has(x.id))return;
    if(!openIds.has(x.id)){lines.push(asLine(x));kept++;return;}      // they added it: keep it
    if(String(x.updated_at||'')>opened)over.push('you removed '+nm(x)+', which was changed or ticked on the other screen since — it will be removed');
  });
  if(over.length&&!confirm('⚠ Another screen saved this list after you opened it. Their other changes are kept, but saving yours will overwrite:\n\n'+over.map(t=>'  • '+t).join('\n')+'\n\nOK = save anyway (overwrite these). Cancel = don\'t save.'))return{ok:false,kept};
  return{ok:true,kept};
}

/* V2 Excel import: every sheet read by lsParseGrid (unit blocks, per-unit quantities, headings), the Blank / Index / Stock /

function lsReadBook(data){
  const wb=XLSX.read(data,{type:'array',cellDates:true,sheetStubs:true}); // stubs: a formula with no saved value still shows its formula
  const out={project:'',sheets:[],skipped:[]};
  wb.SheetNames.forEach(sn=>{
    if(lsSkipSheet(sn)){out.skipped.push(sn);return;}
    const g=lsSheetAoa(wb.Sheets[sn]),p=lsParseGrid(g.v,{formulas:g.f,sheet:sn});
    if(!p.rows.some(r=>r.k==='part')){out.skipped.push(sn);return;}
    p.rows.forEach(r=>{r.keep=!r.info;}); // a line that isn't a part (room breakdown) starts unticked
    out.sheets.push({name:String(sn).trim(),meta:p.meta,rows:p.rows,warn:p.warn,on:true});
    if(p.meta.project&&!out.project)out.project=p.meta.project;
  });
  return out;
}
// The rows a sheet brings in: an unticked unit block drops its heading and parts; unticked Stores / other lines are dropped
function lsKeptRows(sh){

}

async function lsMigrate(by){

  for(let i=0;i<ev.length;i+=400){const r=await fetch(SUPA_URL+'/list_events',{method:'POST',headers:SUPA_WHDR,body:JSON.stringify(ev.slice(i,i+400))});if(!r.ok)throw new Error('saving the waiting history failed: HTTP '+r.status);}

}

function lsOldFrom(listRows0,lines){

      :{k:'fit',item:x.part||'',qty:lsQty(x.qty),mat:x.material||'',note:x.note||''};

async function lsSwitchBack(by){

  if(!V2())throw new Error('the new lists are not switched on');

  // (rebuilt from an out-of-date copy, the merge would treat them as another screen's change and keep them)
  await loadDB();if(!DB.lastLoadOk)throw new Error('could not reach the planner database');
  if(DB.listStore==='v1')return{lists:(DB.lists||[]).length,already:true}; // switched back on another screen meanwhile
  if(!V2())throw new Error('the lists are not on the new store');
  lsReset();await lsLoad();if(!LST.loaded)throw new Error('could not reach the lists tables');
  const finishing=DB.listStore==='switching'; // 'Finish switch back': the tables already refuse changes
  lsRescue();

    // 'switching' first: from now on the database refuses every list change (lists_switch_on), so nothing can land in the

    DB.listStore='switching';clearTimeout(saveT);await saveDB();

/* Tabs still on the old code after the switch keep writing ticks / holds into the frozen copy. Anything newer than
   listStoreAt is copied into the tables (done still wins — the database decides). Each one has a fixed id, so every
   screen that finds it sends the same change and the database applies it once. */
// pick(kind,v): which old-format entries to copy — default: newer than the switch. Lines not loaded yet are fetched first
// (the queue waits for that), so a fresh screen can rescue straight away.
function lsRescue(pick){
  if(!V2()||!LST.loaded||!DB.listStoreAt)return 0;
  const T=DB.listStoreAt;let n=0;
  // Default: an old-format entry that differs from what the line's migration copied (its fingerprint) — never the device
  // clock. Lines without a fingerprint (made after the switch) fall back to "newer than the switch".
  const custom=!!pick,sigNow=(lid,k)=>lsHash(JSON.stringify({t:((DB.listRow||{})[lid]||{})[k]||null,h:((DB.listHold||{})[lid]||{})[k]||null}));
  const recent=(kind,v)=>String((kind==='rel'?v.relAt:v.at)||'')>new Date(Date.parse(T)-86400000).toISOString(); // a day either side of the switch
  pick=pick||recent;
  const ok=(kind,v,lid,k,x)=>custom?pick(kind,v,lid,k):x.mig_sig!=null?x.mig_sig!==sigNow(lid,k):String((kind==='rel'?v.relAt:v.at)||'')>T;
  const want=new Set();
  Object.entries(DB.listRow||{}).forEach(([lid,t])=>Object.entries(t||{}).forEach(([k,v])=>{if(v&&pick('tick',v,lid,k))want.add(lid);}));
  Object.entries(DB.listHold||{}).forEach(([lid,h])=>Object.entries(h||{}).forEach(([k,v])=>{if(v&&pick(v.st==='rel'?'rel':'hold',v,lid,k))want.add(lid);}));
  const need=[...want].filter(id=>!LST.full.has(id)); // only lists with recent entries are fetched; loaded lists are all checked below
  if(need.length){if(!LST.rescuing)LST.rescuing=lsGetIn('lists','id',need.filter(id=>!LST.l.has(id))).then(r=>{lsPut('lists',r);return lsLines(need);}).catch(()=>{}).then(()=>{LST.rescuing=null;if([...want].every(id=>LST.full.has(id)))lsRescue(pick);});return 0;}
  const byList=new Map();
  const lineOf=(lid,k)=>{let m=byList.get(lid);if(!m){m=new Map();lsLinesOf(lid).forEach(x=>{if(x.removed_rev!=null||x.kind==='hdr'||x.status==='na')return;
      const kk=v1Key({k:x.kind,item:x.part,L:x.kind==='saw'&&x.length_mm!=null?+x.length_mm:'',W:x.kind==='saw'&&x.width_mm!=null?+x.width_mm:'',mat:x.material,note:x.kind==='saw'?[x.edging,x.note].filter(s=>String(s||'').trim()).join(' · '):x.note});

  let done0;try{done0=new Set(JSON.parse(localStorage.getItem('wpfRescued')||'[]'));}catch(e){done0=new Set();}
  const send=(x,st,by,tag)=>{const cid='rescue:'+lsHash(x.id+'|'+tag);if(done0.has(cid)||LQ.q.some(e=>e.cid===cid))return;
    done0.add(cid);try{localStorage.setItem('wpfRescued',JSON.stringify([...done0].slice(-2000)));}catch(e){} // once per device; the database also applies it once
    const e={t:'line',cid,id:x.id,list:x.list_id,act:st==='release'?'release':'status',v:+x.version,rev:+((LST.l.get(x.list_id)||{}).rev)||1,from:x.status,at:nowISO(),by:lqBy(by),quiet:true};

  Object.entries(DB.listRow||{}).forEach(([lid,t])=>Object.entries(t||{}).forEach(([k,v])=>{if(!v)return;
    lineOf(lid,k).forEach(x=>{if(!ok('tick',v,lid,k,x))return;const st=x.kind==='saw'?'cut':'got-out';if(x.status!==st)send(x,st,v.by,'t|'+k+'|'+v.at);});}));
  Object.entries(DB.listHold||{}).forEach(([lid,h])=>Object.entries(h||{}).forEach(([k,v])=>{if(!v)return;
    if(v.st==='hold')lineOf(lid,k).forEach(x=>{if(ok('hold',v,lid,k,x)&&x.status==='todo')send(x,'waiting',v.by,'h|'+k+'|'+v.at);});
    if(v.st==='rel')lineOf(lid,k).forEach(x=>{if(ok('rel',v,lid,k,x)&&x.status==='waiting')send(x,'release',v.relBy,'r|'+k+'|'+v.relAt);});}));
  if(n)lqKick(0);

}

async function lsWrite(t,row,patch){ // insert (row) or version-checked update (row + patch); the database's copy comes back
  const u=patch?SUPA_URL+'/'+t+'?id=eq.'+encodeURIComponent(row.id)+'&version=eq.'+(+row.version||1):SUPA_URL+'/'+t;
  const r=await fetch(u,{method:patch?'PATCH':'POST',headers:{...SUPA_HDR,'Prefer':'return=representation'},body:JSON.stringify(patch?{...patch,updated_by:lqBy('')}:{...row,updated_by:lqBy('')})});
  const d=await r.json().catch(()=>null);
  if(r.status===409||(d&&d.code==='23505'))throw new Error('that name is already used in this project');
  if(!r.ok)throw new Error((d&&d.message)||('HTTP '+r.status));
  if(patch&&Array.isArray(d)&&!d.length){lsPut(t,await lsGet(t+'?select=*&id=eq.'+encodeURIComponent(row.id)));throw new Error('changed on another screen meanwhile — showing it as it is now, try again');}
  lsPut(t,d);return d[0];
}

// The material (other than `id`) that already answers to `name` — by its name or one of its other spellings, ignoring case and spaces
function lsMatClash(pid,name,id){const k=matKey(name);return k?lsMats(pid,'',true).find(m=>m.id!==id&&[m.name,...(m.aliases||[])].some(a=>matKey(a)===k)):null;}
function lsMaterialsDlg(pid,after){
  const ov=lsDlg('<div id="mt-body"></div>',820);
  if(after)ov.addEventListener('click',e=>{if(e.target===ov||e.target.id==='pod-x')after();});
  const draw=()=>{

      <td><input data-mta="${escA(m.id)}" value="${escA((m.aliases||[]).join(', '))}" placeholder="other spellings, comma-separated" style="${LS_INP};width:100%"></td>

      <div style="font-size:12px;color:var(--t3);margin-bottom:10px">Sheet materials are the only boards the office can pick on this project's lists. Other spellings from Excel files are remembered as aliases. Untick Active to retire a material — it is never deleted.</div>
      <table class="lst-tbl"><thead><tr><th>Name</th><th>Kind</th><th>Also called</th><th>Active</th><th></th></tr></thead><tbody>${ms.map(row).join('')||'<tr><td colspan="5" style="color:var(--t3)">No materials yet.</td></tr>'}

        <td><button class="btn btn-g" id="mt-add" style="font-size:12px;padding:4px 10px">＋ Add</button></td></tr></tbody></table><div id="mt-msg" style="font-size:12px;color:#b42318;font-weight:700;margin-top:6px"></div>`;
    const msg=t=>{const e=ov.querySelector('#mt-msg');if(e)e.textContent=t;};
    const fresh=async()=>{try{await lsMatFresh(pid);return true;}catch(e){msg('Could not check the materials list — '+e.message);return false;}}; // check against the database, not this screen's copy
    ov.querySelectorAll('[data-mts]').forEach(b=>b.onclick=async()=>{const id=b.dataset.mts;if(!LST.m.get(id)||!lsEditOk())return;
      const name=ov.querySelector('[data-mtn="'+id+'"]').value.trim();if(!name)return msg('A material needs a name.');
      const aliases=ov.querySelector('[data-mta="'+id+'"]').value.split(',').map(s=>s.trim()).filter(Boolean);
      const kind=ov.querySelector('[data-mtk="'+id+'"]').value,active=ov.querySelector('[data-mtv="'+id+'"]').checked;
      const m=LST.m.get(id); // the version this screen showed: if another screen changed it since, the save is refused (not overwritten)
      if(!await fresh())return;
      if(lsMatClash(pid,name,id))return msg('"'+name+'" is already used on this project.');
      const clash=aliases.find(a=>lsMatClash(pid,a,id));if(clash)return msg('"'+clash+'" is already the name or another spelling of a different material on this project.');
      if(matKey(m.name)!==matKey(name)&&!aliases.some(a=>matKey(a)===matKey(m.name)))aliases.push(String(m.name).trim()); // renamed: the old name still matches
      lsWrite('project_materials',m,{name,kind,aliases,active})
        .then(()=>{toast('Material saved');draw();}).catch(e=>{draw();msg('Not saved — '+e.message);});});
    ov.querySelector('#mt-add').onclick=async()=>{if(!lsEditOk())return;const name=ov.querySelector('#mt-new-n').value.trim();if(!name)return msg('Type the material name first.');

      lsWrite('project_materials',{id:uid('M'),project_id:pid,name,kind,sort:lsMats(pid,'',true).length}).then(()=>{toast(name+' added');draw();}).catch(e=>msg('Not added — '+e.message));};
  };
  draw();
}

const LH={q:'',proj:'',type:'',kind:'live',rev:'',state:''};
function lsState(l){if(l.archived)return'archived';if(listFinished(l))return'done';return lsLocked(l)?'live':'draft';}
const LS_STATE={draft:['Draft','#5b6b82'],live:['Live','#1a56db'],done:['Done','#0d6e46'],archived:['Archived','#8e99ab']};
function lsHomeLists(){
  const q=LH.q.trim().toLowerCase();
  return lsCache().all.filter(l=>{
    if(LH.kind==='live'&&l.tpl)return false;if(LH.kind==='tpl'&&!l.tpl)return false;
    if(LH.proj&&l.pid!==LH.proj)return false;
    if(LH.type&&l.ltype!==LH.type)return false;
    if(LH.rev==='revised'&&!((+l.rev||1)>1))return false;
    const st=lsState(l);if(LH.state?st!==LH.state:st==='archived')return false; // archived only when asked for
    if(q){const hay=[l.name,l.project,LS_KINDS[l.ltype]||l.ltype,l.typeName,listCust(l),...(l.wos||[]).map(w=>{const o=DB.orders.find(x=>x.wo===w);return w+' '+(o?[o.floor,o.unit,o.title,o.customer].join(' '):'');})].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}

function lsHomeBind(){
  const re=id=>{render();const n=document.getElementById(id);if(n&&n.focus){n.focus();if(n.setSelectionRange)n.setSelectionRange(n.value.length,n.value.length);}};
  const q=document.getElementById('lh-q');if(q)q.oninput=()=>{LH.q=q.value;re('lh-q');};
  [['lh-proj','proj'],['lh-type','type'],['lh-kind','kind'],['lh-rev','rev'],['lh-state','state']].forEach(([id,k])=>{const e=document.getElementById(id);if(e)e.onchange=()=>{LH[k]=e.value;render();};});
  const x=document.getElementById('lh-x');if(x)x.onclick=()=>{Object.assign(LH,{q:'',proj:'',type:'',kind:'live',rev:'',state:''});render();};
  const pj=document.getElementById('lh-projs');if(pj)pj.onclick=()=>lsProjectsDlg();
  const nw=document.getElementById('lh-new');if(nw)nw.onclick=()=>openListEditor(null,'',LH.proj||'');
  const nt=document.getElementById('lh-newtpl');if(nt)nt.onclick=()=>openListEditor(null,'',LH.proj,{tpl:true});

  document.querySelectorAll('[data-lhmat]').forEach(b=>b.onclick=()=>lsMaterialsDlg(b.dataset.lhmat));
  document.querySelectorAll('[data-lhnew]').forEach(b=>b.onclick=()=>openListEditor(null,'',b.dataset.lhnew));
  const fi=document.getElementById('lh-file');
  document.querySelectorAll('[data-lhimp]').forEach(b=>b.onclick=()=>{lhImpPid=b.dataset.lhimp;if(fi)fi.click();});

    lsDlg(`<div style="font-weight:700;color:#14335c;margin-bottom:8px">${escA(l.project||'')} — ${escA(l.name)} · Rev ${+l.rev||1}</div>${listTableHTML(l,'all')}`);});
  document.querySelectorAll('[data-lhsend]').forEach(b=>b.onclick=()=>{const l=lsList(b.dataset.lhsend);if(!l)return;lqList({t:'done',list:l.id,mode:'send',on:true,by:whoNow()});render();toast('"'+l.name+'" sent to the saw — later changes make a new revision');});
  document.querySelectorAll('[data-lharc]').forEach(b=>b.onclick=()=>{const l=lsList(b.dataset.lharc);if(!l)return;

/* Customer = project (Garry, 3 Nov): the project title is always part of the Cienapps WO customer heading.
   projForCust: 1) the heading IS a project's name, customer or one of its Cienapps spellings (cien_names) — case,
   spaces and punctuation don't matter; 2) otherwise the heading CONTAINS a project name / Cienapps spelling (whole words,
   4+ letters) — the longest wins. Two different projects equally good = none (never guessed). Inactive projects skipped. */

  const ex=ps.filter(p=>[p.name,p.customer,...(p.cien_names||[])].some(n=>n&&sgNorm(n)===h));
  if(ex.length)return one(ex);

  ps.forEach(p=>[p.name,...(p.cien_names||[])].forEach(n=>{const k=sgNorm(n);if(k.length<4||!(' '+h+' ').includes(' '+k+' '))return;

  });

async function lsRetireOld(f,by){ // the new list is saved: archive the old one — unless another screen already did, or changed it since
  const nm='"'+(f.name||'the old list')+'"';
  try{await lsReloadList(f.id);}catch(e){return' ⚠ The old list '+nm+' could not be checked ('+e.message+') — it is still with the saw: archive it from Lists.';}
  const o=lsList(f.id);
  if(!o)return' The old list '+nm+' is no longer there — nothing archived.';
  if(o.archived)return' The old list '+nm+' was already archived on another screen — left as it is.';
  if(lsOldSig(f.id)!==f.sig&&!confirm('The old list '+nm+' was changed on another screen after you copied it.\n\nArchive it anyway (take it off the saw)?\n\nOK = archive it. Cancel = leave it with the saw — check it, then archive it from Lists.'))
    return' The old list '+nm+' was changed on another screen meanwhile — left with the saw: check it and archive it from Lists.';
  listArchive(o,by);
  return' The old list '+nm+' is archived (off the saw).';
}

async function lsCreateFromTpl(tid,wos,name,by,opt){
  opt=opt||{};
  if(!LST.full.has(tid))await lsReloadList(tid);
  const t=LST.l.get(tid);if(!t)throw new Error('the template is no longer there');
  // opt.fixedFor = a WO: the list gets the fixed id WO:<wo> (WO:<wo>#2… once an earlier one was archived), so two screens
  // confirming the same WO at once make ONE list — the database refuses the second (same id), and that screen is shown
  // the list the first one made (marked .already). Never a second list, never a revision of the other screen's list.
  let id=uid('L');
  const mine=()=>LST.l.get(id),already=x=>Object.assign({},x,{already:true});
  if(opt.fixedFor){
    for(let n=1;;n++){id='WO:'+opt.fixedFor+(n>1?'#'+n:'');await lsReloadList(id);const ex=mine();if(!ex)break;if(!ex.archived)return already(ex);if(n>=30)throw new Error('too many archived lists for '+opt.fixedFor);}
  }
  const pl={id,name,project_id:t.project_id,list_type:t.list_type==='snag'?'house':t.list_type,type_name:t.type_name||null,template_id:tid,template_rev:+t.rev||1,wos,source:'template'};
  const why='Made from template "'+t.name+'" rev '+(+t.rev||1),lines=await lsCopyLines(tid);
  if(!opt.fixedFor){const res=await lsSaveList(pl,lines,by,why);return res.list;}
  try{
    const out=await lsRpc('save_list_revision',{p_list:pl,p_lines:diffLines([],lines,{listId:id}).lines,p_expect:null,p_by:lqBy(by),p_reason:why});
    LST.full.add(out.list.id);lsPut('lists',[out.list]);lsPut('list_lines',out.lines);return out.list;
  }catch(e){
    if(e.status===409||/stale|duplicate key|23505/i.test(e.message)){await lsReloadList(id);if(mine())return already(mine());} // made on another screen a moment ago
    throw e;
  }
}

function lsMissing(tpl,lines){
  const key=x=>x.kind+'|'+String(x.part||'').trim().toLowerCase(),sum=a=>{const m=new Map();(a||[]).forEach(x=>{if(x.kind==='hdr'||x.status==='na')return;const k=key(x),q=parseFloat(x.qty);const e=m.get(k)||{q:0,n:String(x.part||'').trim()||'(unnamed)'};e.q+=isFinite(q)?q:0;m.set(k,e);});return m;};
  const A=sum(tpl),B=sum(lines),out=[];
  A.forEach((e,k)=>{const b=B.get(k);if(!b)out.push(e.n+' (left out)');else if(b.q<e.q)out.push(e.n+' ('+b.q+' of '+e.q+')');});
  return out;
}

/* ---------- S8 (V2 only): locking and revisions on screen ----------
   A live list locks when it's sent to the saw, when anything is ticked (the database), or when its cut-by date is today or
   the next working day (worked out here — decision 10). Editing a locked list makes revision n+1. The saw only ever sees
   the current lines, with what changed in the latest revision. */

  if(!l||l.tpl)return false;
  if(l.locked||l.sentAt)return true;
