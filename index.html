function renderProd(app){
  const all=delAll();
  const[td,tm]=floorDays();
  const ix=todayDayIx();
  const live=all.filter(o=>o.delDay&&!o.manual&&dStage(o)==='');
  const rdy=o=>woReady(o.wo);
  const atRisk=live.filter(o=>(o.delDay===td||o.delDay===tm)&&rdy(o).lvl!=='green');
  const later=live.filter(o=>o.delDay!==td&&o.delDay!==tm&&DEL_DAYS.indexOf(o.delDay)>ix&&rdy(o).lvl!=='green');
  const perf=weekPerf(liveWeekJobs(),ix);
  const lim=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const unplaced=DB.orders.filter(o=>!o.delDay&&!o.delDone&&!o.delDelivAt&&!isShipped(o)&&!isOnHold(o)&&o.dueDate&&o.dueDate<=lim&&!/assembly complete|pallet/i.test(o.step||'')).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const holds=allHolds(['saw','fit'],'hold');
  const missNo=missedJobs().filter(o=>!o.missWhy);
  const moved=all.filter(o=>(o.delMoves||[]).length);
  const lnRows=V2()?listsNeeded().map(o=>lsNeedInfo(o)).sort((a,b)=>(b.late-a.late)||(b.onDel-a.onDel)||(a.due||'9999').localeCompare(b.due||'9999')):null; // lists switch on
  const lnLate=(lnRows||[]).filter(r=>r.late),lnIssue=(lnRows||[]).filter(r=>!r.late),lnChk=lsWaitCheckLists(); // + lists waiting for their check (Garry, 4 Nov)
  const dot=l=>`<span class="rdy-dot rdy-${l}"></span>`;
  const rRow=o=>{const r=rdy(o);return `<div class="dsh-row">${dot(r.lvl)}<b>${escA(o.wo)}</b>${fuHTML(o,'flr-fu','font-size:12px')}<span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-c">${escA(o.customer||'')}</span><span class="dsh-x">${escA(slotLbl(o.delVeh,o.delDay))} · <b class="rdy-t-${r.lvl}">${escA(r.why.join(' · '))}</b></span></div>`;};
  const panel=(title,color,inner)=>`<div class="dsh-p"><div class="dsh-ph" style="background:${color}">${title}</div>${inner}</div>`;
  const none=t=>`<div class="dsh-row" style="color:var(--t3);font-style:italic">${t}</div>`;
  const tile=(n,lbl,sub,bad)=>`<div class="dsh-tile" style="border-top:4px solid ${bad?'#c0392b':'#5b6b82'}"><div class="dsh-n" style="color:${bad?'#c0392b':'#14335c'}">${n}</div><div class="dsh-l">${lbl}</div>${sub?`<div class="dsh-s">${sub}</div>`:''}</div>`;
  app.innerHTML=`<div class="dsh">
    <h1 style="font-size:26px;color:#14335c;margin:0 0 12px">🧭 Production — what needs you today</h1>
    <div class="dsh-tiles">
      ${tile(atRisk.length,'AT RISK TODAY / TOMORROW','on a van, not ready',atRisk.length>0)}
      ${tile(holds.length,'ROWS WAITING ON MATERIAL','release when it arrives',holds.length>0)}
      ${tile(unplaced.length,'DUE IN 7 DAYS, NOT ON A VAN','',unplaced.length>0)}
      ${tile(missNo.length,'MISSED — REASON NEEDED','',missNo.length>0)}
      ${tile(perf.pct===null?'—':perf.pct+'%','ON TIME THIS WEEK',perf.due?perf.onTime+' of '+perf.due+' due so far':'nothing due yet',perf.pct!==null&&perf.pct<90)}
      ${lnRows?`<div class="dsh-tile" data-pmlists="late" style="cursor:pointer;border-top:4px solid ${lnLate.length?'#c0392b':'#5b6b82'}"><div class="dsh-n" style="color:${lnLate.length?'#c0392b':'#14335c'}">${lnLate.length}</div><div class="dsh-l">LISTS LATE</div><div class="dsh-s">past the list due date</div></div>
      <div class="dsh-tile" data-pmlists="issue" style="cursor:pointer;border-top:4px solid ${lnIssue.length?'#d4880f':'#5b6b82'}"><div class="dsh-n" style="color:${lnIssue.length+lnChk.length?'#8a5a00':'#14335c'}">${lnIssue.length+lnChk.length}</div><div class="dsh-l">LISTS TO ISSUE</div><div class="dsh-s">${lnChk.length?lnChk.length+' waiting for check'+(lnIssue.length?' · '+lnIssue.length+' not made yet':''):'not late yet'}</div></div>`:''}
    </div>
    ${lnRows&&lnRows.length?panel('📋 CUTTING LISTS — late and to issue (tap to issue them)','#8a5a00',lnRows.slice(0,25).map(r=>`<div class="dsh-row" data-pmlists="row" style="cursor:pointer;flex-wrap:wrap${r.late?';background:#fdf3f2':''}"><b>${escA(r.o.wo)}</b><span class="dsh-t">${escA(r.o.title||'')}</span><span class="dsh-c">${escA(r.o.customer||'')}</span><span class="dsh-x" style="white-space:normal">${r.onDel?'🚚 '+escA(slotLbl(r.o.delVeh,r.o.delDay))+' · ':''}${r.late?'<b style="color:#c0392b">LATE</b> · was due ':'due by '}${r.due?fmt(r.due):'—'} · owner ${escA(lsOwnerFor(r.o))}</span></div>`).join('')+(lnRows.length>25?`<div class="dsh-row" style="color:var(--t3)">…and ${lnRows.length-25} more on the Lists tab</div>`:'')):''}
    ${missNo.length?panel('⚠ MISSED — tap to give the reason','#c0392b',missNo.map(o=>`<div class="dsh-row"><b>${escA(o.wo)}</b><span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-c">${escA(o.customer||'')}</span><span class="dsh-x">${escA(slotLbl(o.delVeh,o.delDay))} · ${dStage(o)?dStageLbl[dStage(o)]:'NEVER LOADED'}</span><button class="btn btn-s" data-misswhy="${escA(o.wo)}">Give reason</button></div>`).join('')):''}
    <div class="dsh-cols">
      ${panel('🔴 AT RISK — '+td+' & '+tm+' loads not ready','#c0392b',atRisk.length?atRisk.sort((a,b)=>DEL_DAYS.indexOf(a.delDay)-DEL_DAYS.indexOf(b.delDay)).map(rRow).join(''):none('Every job on '+td+' and '+tm+' is ready ✓'))}
      ${panel('🟠 LATER THIS WEEK — not ready yet','#8a5a00',later.length?later.sort((a,b)=>DEL_DAYS.indexOf(a.delDay)-DEL_DAYS.indexOf(b.delDay)).map(rRow).join(''):none('Nothing else outstanding this week ✓'))}
      ${panel('📅 DUE IN THE NEXT 7 DAYS — not on a van','#14335c',unplaced.length?unplaced.slice(0,25).map(o=>`<div class="dsh-row">${dot(woReady(o.wo).lvl)}<b>${escA(o.wo)}</b><span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-c">${escA(o.customer||'')}</span><span class="dsh-x">due ${fmt(o.dueDate)}${o.delv?' · in the pool':''}</span></div>`).join(''):none('Everything due in the next week is on a van ✓'))}
      ${panel('🔁 MOVED THIS WEEK','#5b6b82',moved.length?moved.map(o=>{const m=o.delMoves[o.delMoves.length-1];return `<div class="dsh-row"><b>${escA(o.wo)}</b><span class="dsh-t">${escA(o.title||'')}</span><span class="dsh-x">${escA(m.why||'')} · ${escA(m.by||'')}${o.delMoves.length>1?' · moved '+o.delMoves.length+'×':''}</span></div>`;}).join(''):none('No deliveries moved this week'))}
    </div>
    <div class="dsh-p" style="margin-top:14px"><div class="dsh-ph" style="background:#8a5a00">⏸ WAITING ON MATERIAL — release when it arrives</div><div style="padding:8px">${holdBookHTML(['saw','fit'])}</div></div>
    <div class="dsh-p" style="margin-top:14px"><div class="dsh-ph" style="background:#14335c">📈 WEEKLY DELIVERY SCORECARD</div><div style="padding:8px">${scorecardHTML(8)}</div></div>
    <div class="flr-ft">Live — refreshes automatically · Last update ${hhmm(nowISO())}</div>
  </div>`;
  bindMissWhy();
  bindHoldBook(['saw','fit'],officeWhoFn);
  document.querySelectorAll('[data-pmlists]').forEach(e=>e.onclick=()=>{prodTab='lists';lsStart();render();});
}

loadDB().then(()=>{render();startAutoRefresh();});
</script>
</body>
</html>
